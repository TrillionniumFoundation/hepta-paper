name: admin-audit-external-execution-capability

on:
  push:
    branches:
      - codex/admin-apply-global-source-closure-20260910
    paths:
      - .github/external-execution-capability-audit-trigger

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Audit external execution capability without reading secret values
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch=codex/admin-apply-global-source-closure-20260910
          assertion_path=.github/admin-status/public-repository-source-fully-closed.json
          assertion="$(gh api "repos/$repo/contents/$assertion_path?ref=$branch" --jq -r '.content' | tr -d '\n' | base64 -d)"
          test "$(jq -r '.repositorySourceFullyClosed' <<<"$assertion")" = true
          head="$(jq -r '.head' <<<"$assertion")"
          tree="$(jq -r '.tree' <<<"$assertion")"
          gh api "repos/$repo/actions/runners?per_page=100" > "$RUNNER_TEMP/repo-runners.json" 2> "$RUNNER_TEMP/repo-runners.err" || printf '{"total_count":0,"runners":[],"access":"unavailable"}\n' > "$RUNNER_TEMP/repo-runners.json"
          gh api "orgs/TrillionniumFoundation/actions/runners?per_page=100" > "$RUNNER_TEMP/org-runners.json" 2> "$RUNNER_TEMP/org-runners.err" || printf '{"total_count":0,"runners":[],"access":"unavailable"}\n' > "$RUNNER_TEMP/org-runners.json"
          gh api "repos/$repo/environments?per_page=100" > "$RUNNER_TEMP/environments.json" 2> "$RUNNER_TEMP/environments.err" || printf '{"total_count":0,"environments":[],"access":"unavailable"}\n' > "$RUNNER_TEMP/environments.json"
          gh api "repos/$repo/actions/secrets?per_page=100" > "$RUNNER_TEMP/secret-names.json" 2> "$RUNNER_TEMP/secret-names.err" || printf '{"total_count":0,"secrets":[],"access":"unavailable"}\n' > "$RUNNER_TEMP/secret-names.json"
          jq -n --arg head "$head" --arg tree "$tree" --slurpfile repoRunners "$RUNNER_TEMP/repo-runners.json" --slurpfile orgRunners "$RUNNER_TEMP/org-runners.json" --slurpfile environments "$RUNNER_TEMP/environments.json" --slurpfile secretNames "$RUNNER_TEMP/secret-names.json" '
            def labels($r): [$r.labels[]?.name | ascii_downcase];
            def ready($required):
              [($repoRunners[0].runners // [])[], ($orgRunners[0].runners // [])[]]
              | map(select(.status == "online" and .busy == false and ((labels(.) - $required) | length) == ((labels(.)) | length - ($required|length))))
              | length > 0;
            {
              schemaVersion:1,
              kind:"ExternalExecutionCapabilityAudit",
              subject:{head:$head,tree:$tree},
              repositoryRunnerMetadataAccessible:(($repoRunners[0].access // "available") == "available"),
              organizationRunnerMetadataAccessible:(($orgRunners[0].access // "available") == "available"),
              repositoryRunners:[($repoRunners[0].runners // [])[] | {id,name,status,busy,labels:[.labels[]?.name]}],
              organizationRunners:[($orgRunners[0].runners // [])[] | {id,name,status,busy,labels:[.labels[]?.name]}],
              environments:[($environments[0].environments // [])[] | {id,name,protected_branches,custom_branch_policies}],
              secretNamesMetadataAccessible:(($secretNames[0].access // "available") == "available"),
              secretNames:[($secretNames[0].secrets // [])[] | .name],
              gates:{
                targetHostRunnerObserved:ready(["self-hosted","linux","x64","hepta-target-host","hepta-production-topology"]),
                destructiveStorageRunnerObserved:ready(["self-hosted","linux","x64","hepta-destructive-storage","disposable"]),
                independentKeyOwnerSecretNameObserved:([($secretNames[0].secrets // [])[] | .name] | any(test("KEY_OWNER|HSM|KMS"))),
                authenticatedCodexSecretNameObserved:([($secretNames[0].secrets // [])[] | .name] | any(test("CODEX.*(AUTHOR|REVIEWER)|OPENAI.*CODEX"))),
                releasePortalSecretNameObserved:([($secretNames[0].secrets // [])[] | .name] | any(test("WORM|PORTAL|SUBMISSION|RELEASE_SIGN")))
              },
              externalExecutionAuthorized:false,
              externalEvidenceProduced:false,
              productionActivated:false,
              writerCutoverAuthorized:false,
              nodeRetirementAuthorized:false
            }
          ' > "$RUNNER_TEMP/audit.json"
          content="$(base64 -w0 "$RUNNER_TEMP/audit.json")"
          out=.github/admin-status/external-execution-capability-audit.json
          old="$(gh api "repos/$repo/contents/$out?ref=$branch" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$old" ]; then gh api -X PUT "repos/$repo/contents/$out" -f message='chore(admin): refresh external execution capability audit' -f content="$content" -f sha="$old" -f branch="$branch" >/dev/null; else gh api -X PUT "repos/$repo/contents/$out" -f message='chore(admin): record external execution capability audit' -f content="$content" -f branch="$branch" >/dev/null; fi
          cat "$RUNNER_TEMP/audit.json"
