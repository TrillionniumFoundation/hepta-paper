name: admin-converge-main-source-closure-v4-20260911

on:
  push:
    branches:
      - codex/source-audit-export-20260911
    paths:
      - .github/workflows/admin-converge-main-source-closure-v4-20260911.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: admin-converge-main-source-closure-v4-20260911
  cancel-in-progress: true

env:
  SOURCE_BRANCH: codex/global-plan-v1.1-internal-source-closure-20260911
  PUBLISHER_BRANCH: codex/source-audit-export-20260911
  NODE_VERSION: 22.23.1
  RUST_VERSION: 1.98.0
  MIN_WORKFLOW_FAMILIES: "16"
  MIN_CHECK_RUNS: "20"
  BLOB_1: 05d3b20d14cf05473ecca8da6a15b3919192fa87
  BLOB_2: bb392f41843b9fc6c60404ca318b8dcc0fc42c27
  BLOB_3: df468481fda2741158ba1279bb18669f40796f9a
  BLOB_4: e95ae33a076d887e7de5b16e98cfdbf2bebb9771

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Resolve exact source branch
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          source_sha="$(git ls-remote "$remote" "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')"
          test -n "$source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact source head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.refs.outputs.source_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Node and Rust
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cd target/rust
          rustup override set "$RUST_VERSION"
          cd ../..
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(rustc +$RUST_VERSION --version | awk '{print $2}')" = "$RUST_VERSION"
          npm --prefix target ci --ignore-scripts --no-audit --no-fund

      - name: Materialize exact first-stage blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          object_root="$RUNNER_TEMP/internal-source-v4"
          rm -rf "$object_root"
          mkdir -p "$object_root"
          for sha in "$BLOB_1" "$BLOB_2" "$BLOB_3" "$BLOB_4"; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq '.content' | tr -d '\n' | base64 --decode > "$object_root/$sha"
            test "$(git hash-object "$object_root/$sha")" = "$sha"
          done
          python3 - "$object_root" target <<'PY'
          import json, pathlib, shutil, sys
          source_root, checkout = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          mapping = {}
          for source in sorted(source_root.iterdir()):
              text = source.read_text(encoding='utf-8')
              destination = None
              try: value = json.loads(text)
              except json.JSONDecodeError: value = None
              if isinstance(value, dict) and value.get('kind') == 'RepositorySourceImplementationEvidenceV1':
                  destination = 'docs/system/evidence/repository-source-implementation-v1.json'
              elif isinstance(value, dict):
                  props = value.get('properties')
                  if isinstance(props, dict) and isinstance(props.get('kind'), dict) and props['kind'].get('const') == 'RepositorySourceImplementationEvidenceV1':
                      destination = 'docs/system/schemas/source-implementation-evidence-v1.schema.json'
              if destination is None and 'node:test' in text:
                  destination = 'paper-core/tests/source-implementation-evidence.test.mjs'
              if destination is None and ('parseStrictJson' in text or 'source implementation evidence' in text.lower()):
                  destination = 'paper-core/bin/verify-source-implementation-evidence.mjs'
              if destination is None or destination in mapping:
                  raise SystemExit(f'closed classification failure: {source.name} -> {destination}')
              mapping[destination] = source
          expected = {'docs/system/evidence/repository-source-implementation-v1.json','docs/system/schemas/source-implementation-evidence-v1.schema.json','paper-core/bin/verify-source-implementation-evidence.mjs','paper-core/tests/source-implementation-evidence.test.mjs'}
          if set(mapping) != expected: raise SystemExit(f'class set mismatch: {sorted(mapping)}')
          for destination, source in mapping.items():
              out = checkout / destination
              out.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, out)
          PY
          chmod 0755 target/paper-core/bin/verify-source-implementation-evidence.mjs
          git -C target diff --check

      - name: Verify first stage and run complete Rust owner-test superset
        shell: bash
        run: |
          set -euo pipefail
          cd target
          node paper-core/bin/verify-source-implementation-evidence.mjs
          node --test paper-core/tests/source-implementation-evidence.test.mjs
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          python3 docs/rust/tools/validate-program-truth.py
          requested="$(jq -c '[.records | to_entries[] | select(.value.promotionRequested == true) | .key] | sort' docs/system/evidence/repository-source-implementation-v1.json)"
          test "$(jq 'length' <<<"$requested")" = 10
          jq -e '[.records | to_entries[] | select(.value.promotionRequested == true) | .value.authorityClaims | to_entries[]? | .value] | all(. == false)' docs/system/evidence/repository-source-implementation-v1.json >/dev/null
          cd rust
          cargo +$RUST_VERSION test --locked --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/rust-first-stage.log"

      - name: CAS-publish first stage
        id: first
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add docs/system/evidence/repository-source-implementation-v1.json docs/system/schemas/source-implementation-evidence-v1.schema.json paper-core/bin/verify-source-implementation-evidence.mjs paper-core/tests/source-implementation-evidence.test.mjs
          if git diff --cached --quiet; then
            head="$(git rev-parse HEAD)"
          else
            git commit -m 'feat(truth): request strict internal source promotions' \
              -m 'Bind ten repository-owned work items to exact source evidence and a full Rust owner-test superset while preserving every external and production authority ceiling.' \
              -m 'Signed-off-by: Qian QI <102159240+ProfHepta@users.noreply.github.com>'
            head="$(git rev-parse HEAD)"
            if ! git push --force-with-lease="refs/heads/$SOURCE_BRANCH:${{ steps.refs.outputs.source_sha }}" origin "HEAD:refs/heads/$SOURCE_BRANCH"; then
              live="$(git ls-remote "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')"
              git fetch --no-tags origin "$live"
              for tuple in \
                "$BLOB_1" \
                "$BLOB_2" \
                "$BLOB_3" \
                "$BLOB_4"; do
                git cat-file -e "$tuple^{blob}" 2>/dev/null || true
              done
              git reset --hard "$live"
              node paper-core/bin/verify-source-implementation-evidence.mjs
              test "$(jq '[.records | to_entries[] | select(.value.promotionRequested == true)] | length' docs/system/evidence/repository-source-implementation-v1.json)" = 10
              head="$live"
            fi
          fi
          tree="$(git rev-parse HEAD^{tree})"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Find or create direct-to-main candidate PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.first.outputs.head }}
          TREE: ${{ steps.first.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=TrillionniumFoundation:$SOURCE_BRANCH&base=main&per_page=20" --jq '.[0].number // empty')"
          ids="$(jq -r '[.records | to_entries[] | select(.value.promotionRequested == true) | .key] | sort | map("`"+.+"`") | join(", ")' target/docs/system/evidence/repository-source-implementation-v1.json)"
          body="$RUNNER_TEMP/main-pr.md"
          cat > "$body" <<EOF
          ## Full exact-head repository source-closure candidate

          \`\`\`text
          base              main
          head branch       $SOURCE_BRANCH
          first-stage head  $HEAD
          first-stage tree  $TREE
          \`\`\`

          Strict promotion requests: $ids

          The candidate contains the complete source stack and executes all `main`-targeted workflows. Before the first-stage CAS push, exact blobs, strict JSON/schema semantics, hostile tests, documentation owners, program truth, and the full Rust $RUST_VERSION workspace with `--all-targets` passed.

          No external authority, target-host qualification, production activation, writer cutover, or Node retirement is granted. Keep Draft until promotion is applied, final exact-head and merge-object workflows are green, and an independent reviewer approves the final head/tree.
          EOF
          if [ -z "$pr" ]; then
            pr="$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" -f title='feat(truth): converge repository source closure' -f head="$SOURCE_BRANCH" -f base=main -F draft=true -F body=@"$body" --jq '.number')"
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" -f title='feat(truth): converge repository source closure' -F body=@"$body" >/dev/null
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$pr/requested_reviewers" --input - >/dev/null <<'JSON'
          {"reviewers":["Franksudoman","Tomasrgbsf"]}
          JSON
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Wait for complete first-stage main-target CI
        id: first_ci
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SUBJECT_HEAD: ${{ steps.first.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            live="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
            test "$live" = "$SUBJECT_HEAD"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SUBJECT_HEAD&per_page=100" > "$RUNNER_TEMP/first-runs-all.json"
            jq --argjson pr "$PR_NUMBER" '[.workflow_runs[] | select(any(.pull_requests[]?; .number == $pr))] | sort_by(.created_at) | group_by(.name) | map(last) | map({name,status,conclusion,id,run_attempt,created_at}) | sort_by(.name)' "$RUNNER_TEMP/first-runs-all.json" > "$RUNNER_TEMP/first-runs.json"
            gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$SUBJECT_HEAD/check-runs?per_page=100" > "$RUNNER_TEMP/first-checks-all.json"
            jq '[.check_runs[] | {name,status,conclusion,id,app:.app.slug}] | sort_by(.name)' "$RUNNER_TEMP/first-checks-all.json" > "$RUNNER_TEMP/first-checks.json"
            wf_count="$(jq 'length' "$RUNNER_TEMP/first-runs.json")"
            wf_pending="$(jq '[.[] | select(.status != "completed")] | length' "$RUNNER_TEMP/first-runs.json")"
            wf_failed="$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' "$RUNNER_TEMP/first-runs.json")"
            check_count="$(jq 'length' "$RUNNER_TEMP/first-checks.json")"
            check_pending="$(jq '[.[] | select(.status != "completed")] | length' "$RUNNER_TEMP/first-checks.json")"
            check_failed="$(jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not))] | length' "$RUNNER_TEMP/first-checks.json")"
            echo "first attempt=$attempt workflows=$wf_count/$MIN_WORKFLOW_FAMILIES pending=$wf_pending failed=$wf_failed checks=$check_count/$MIN_CHECK_RUNS pending=$check_pending failed=$check_failed"
            if [ "$wf_count" -ge "$MIN_WORKFLOW_FAMILIES" ] && [ "$wf_pending" = 0 ] && [ "$check_count" -ge "$MIN_CHECK_RUNS" ] && [ "$check_pending" = 0 ]; then
              test "$wf_failed" = 0
              test "$check_failed" = 0
              echo "workflow_families=$wf_count" >> "$GITHUB_OUTPUT"
              echo "check_runs=$check_count" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$attempt" = 240 ]; then
              cat "$RUNNER_TEMP/first-runs.json" >&2
              cat "$RUNNER_TEMP/first-checks.json" >&2
              exit 1
            fi
            sleep 30
          done

      - name: Apply exact ten-item source promotion
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test "$(git rev-parse HEAD)" = "${{ steps.first.outputs.head }}"
          python3 - "$RUNNER_TEMP/promotion-v4.json" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path.cwd()
          work_path = root / 'docs/system/truth/work-items.v2.json'
          modules_path = root / 'docs/system/truth/modules.v1.json'
          evidence_path = root / 'docs/system/evidence/repository-source-implementation-v1.json'
          work = json.loads(work_path.read_text())
          modules = json.loads(modules_path.read_text())
          evidence = json.loads(evidence_path.read_text())
          records = evidence.get('records')
          if not isinstance(records, dict): raise SystemExit('records must be a map')
          requested = sorted(k for k,v in records.items() if isinstance(v,dict) and v.get('promotionRequested') is True)
          if len(requested) != 10: raise SystemExit(f'promotion set drift: {requested}')
          items = work.get('items')
          if not isinstance(items, dict): raise SystemExit('work items must be a map')
          promoted_modules = set()
          for item_id in requested:
              row, record = items.get(item_id), records[item_id]
              if not isinstance(row, dict) or row.get('state') != 'design_ready': raise SystemExit(f'not design_ready: {item_id}')
              if row.get('type') == 'external_gap' or item_id.startswith(('GAP-','LEGACY-REPLAY-')): raise SystemExit(f'external item: {item_id}')
              if any(record.get('authorityClaims', {}).values()): raise SystemExit(f'authority escalation: {item_id}')
              if row.get('moduleId') != record.get('moduleId'): raise SystemExit(f'module mismatch: {item_id}')
              declared = row.get('capabilityIds')
              if declared is None and row.get('capabilityId') is not None: declared = [row['capabilityId']]
              if sorted(declared or []) != sorted(record.get('capabilityIds', [])): raise SystemExit(f'capability mismatch: {item_id}')
              row['state'] = 'source_implemented'
              records[item_id]['promotionRequested'] = False
              promoted_modules.add(row['moduleId'])

          module_rows = modules.get('modules')
          if isinstance(module_rows, dict):
              for module_id in sorted(promoted_modules):
                  remaining = [r for r in items.values() if isinstance(r,dict) and r.get('moduleId') == module_id and r.get('state') in {'not_started','design_ready'}]
                  row = module_rows.get(module_id)
                  if not remaining and isinstance(row,dict) and row.get('state') == 'design_ready': row['state'] = 'source_implemented'

          changed_manifests = []
          for path in sorted((root / 'docs/modules/manifests').glob('*.json')):
              value = json.loads(path.read_text())
              if not isinstance(value,dict) or value.get('moduleId') not in promoted_modules: continue
              module_id = value['moduleId']
              remaining = [r for r in items.values() if isinstance(r,dict) and r.get('moduleId') == module_id and r.get('state') in {'not_started','design_ready'}]
              if remaining: continue
              changed = False
              for key in ('implementationStatus','implementation_status','sourceStatus'):
                  if value.get(key) == 'design_ready': value[key] = 'source_implemented'; changed = True
              if isinstance(value.get('implementation'),dict) and value['implementation'].get('status') == 'design_ready': value['implementation']['status'] = 'source_implemented'; changed = True
              if changed:
                  path.write_text(json.dumps(value,indent=2,ensure_ascii=False)+'\n')
                  changed_manifests.append(path.relative_to(root).as_posix())

          work_path.write_text(json.dumps(work,separators=(',',':'),ensure_ascii=False)+'\n')
          modules_path.write_text(json.dumps(modules,separators=(',',':'),ensure_ascii=False)+'\n')
          evidence_path.write_text(json.dumps(evidence,indent=2,ensure_ascii=False)+'\n')
          result = {'schemaVersion':1,'kind':'InternalRepositorySourcePromotionV4','promotedItemIds':requested,'promotedModuleIds':sorted(promoted_modules),'changedManifests':changed_manifests,'externalAuthorityGranted':False,'targetHostQualified':False,'productionActivated':False,'writerCutoverAuthorized':False,'nodeRetirementAuthorized':False}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
          git diff --check
          node paper-core/bin/verify-source-implementation-evidence.mjs
          node --test paper-core/tests/source-implementation-evidence.test.mjs
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          python3 docs/rust/tools/validate-program-truth.py
          cd rust
          cargo +$RUST_VERSION test --locked --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/rust-final-stage.log"
          echo "ids=$(jq -c '.promotedItemIds' "$RUNNER_TEMP/promotion-v4.json")" >> "$GITHUB_OUTPUT"

      - name: CAS-push promoted final head
        id: final
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git add docs/system/truth/work-items.v2.json docs/system/truth/modules.v1.json docs/system/evidence/repository-source-implementation-v1.json docs/modules/manifests
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat(truth): promote verified internal source states' \
            -m 'Promote exactly ten repository-owned work items after a green main-target first-stage head and a second full Rust owner-test pass. Preserve all external and production authority ceilings.' \
            -m 'Signed-off-by: Qian QI <102159240+ProfHepta@users.noreply.github.com>'
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          git push --force-with-lease="refs/heads/$SOURCE_BRANCH:${{ steps.first.outputs.head }}" origin "HEAD:refs/heads/$SOURCE_BRANCH"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Refresh final PR and request fresh review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.final.outputs.head }}
          TREE: ${{ steps.final.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          ids="$(jq -r '.promotedItemIds | map("`"+.+"`") | join(", ")' "$RUNNER_TEMP/promotion-v4.json")"
          body="$RUNNER_TEMP/final-main-pr.md"
          cat > "$body" <<EOF
          ## Full exact-head repository source closure

          \`\`\`text
          base              main
          head branch       $SOURCE_BRANCH
          final head        $HEAD
          final tree        $TREE
          \`\`\`

          Promoted work items: $ids

          Promotion was applied only after the first-stage direct-to-main candidate had at least ${{ steps.first_ci.outputs.workflow_families }} terminal-success workflow families and ${{ steps.first_ci.outputs.check_runs }} settled non-failing check runs. Strict evidence, hostile tests, documentation owners, program truth, and the complete Rust $RUST_VERSION workspace with `--all-targets` were then replayed before the final CAS push.

          No external authority, target-host qualification, production activation, writer cutover, or Node retirement is granted. Final CI and a fresh independent exact-head review remain mandatory.
          EOF
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -f title='feat(truth): converge repository source closure' -F body=@"$body" >/dev/null
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" --input - >/dev/null <<'JSON'
          {"reviewers":["Franksudoman","Tomasrgbsf"]}
          JSON

      - name: Wait for complete final main-target CI
        id: final_ci
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SUBJECT_HEAD: ${{ steps.final.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            live="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
            test "$live" = "$SUBJECT_HEAD"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SUBJECT_HEAD&per_page=100" > "$RUNNER_TEMP/final-runs-all.json"
            jq --argjson pr "$PR_NUMBER" '[.workflow_runs[] | select(any(.pull_requests[]?; .number == $pr))] | sort_by(.created_at) | group_by(.name) | map(last) | map({name,status,conclusion,id,run_attempt,created_at}) | sort_by(.name)' "$RUNNER_TEMP/final-runs-all.json" > "$RUNNER_TEMP/final-runs.json"
            gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$SUBJECT_HEAD/check-runs?per_page=100" > "$RUNNER_TEMP/final-checks-all.json"
            jq '[.check_runs[] | {name,status,conclusion,id,app:.app.slug}] | sort_by(.name)' "$RUNNER_TEMP/final-checks-all.json" > "$RUNNER_TEMP/final-checks.json"
            wf_count="$(jq 'length' "$RUNNER_TEMP/final-runs.json")"
            wf_pending="$(jq '[.[] | select(.status != "completed")] | length' "$RUNNER_TEMP/final-runs.json")"
            wf_failed="$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' "$RUNNER_TEMP/final-runs.json")"
            check_count="$(jq 'length' "$RUNNER_TEMP/final-checks.json")"
            check_pending="$(jq '[.[] | select(.status != "completed")] | length' "$RUNNER_TEMP/final-checks.json")"
            check_failed="$(jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not))] | length' "$RUNNER_TEMP/final-checks.json")"
            echo "final attempt=$attempt workflows=$wf_count pending=$wf_pending failed=$wf_failed checks=$check_count pending=$check_pending failed=$check_failed"
            if [ "$wf_count" -ge "$MIN_WORKFLOW_FAMILIES" ] && [ "$wf_pending" = 0 ] && [ "$check_count" -ge "$MIN_CHECK_RUNS" ] && [ "$check_pending" = 0 ]; then
              test "$wf_failed" = 0
              test "$check_failed" = 0
              echo "workflow_families=$wf_count" >> "$GITHUB_OUTPUT"
              echo "check_runs=$check_count" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$attempt" = 240 ]; then
              cat "$RUNNER_TEMP/final-runs.json" >&2
              cat "$RUNNER_TEMP/final-checks.json" >&2
              exit 1
            fi
            sleep 30
          done

      - name: Publish exact closure status and mark ready
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.final.outputs.head }}
          TREE: ${{ steps.final.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          jq -n --argjson pullRequest "$PR_NUMBER" --arg head "$HEAD" --arg tree "$TREE" --argjson promoted '${{ steps.promote.outputs.ids }}' --argjson firstWorkflowFamilies '${{ steps.first_ci.outputs.workflow_families }}' --argjson firstCheckRuns '${{ steps.first_ci.outputs.check_runs }}' --argjson finalWorkflowFamilies '${{ steps.final_ci.outputs.workflow_families }}' --argjson finalCheckRuns '${{ steps.final_ci.outputs.check_runs }}' '{schemaVersion:1,kind:"InternalRepositorySourceClosureStatusV4",pullRequest:$pullRequest,head:$head,tree:$tree,promotedItemIds:$promoted,firstWorkflowFamilies:$firstWorkflowFamilies,firstCheckRuns:$firstCheckRuns,finalWorkflowFamilies:$finalWorkflowFamilies,finalCheckRuns:$finalCheckRuns,allTerminalSuccess:true,independentReviewAccepted:false,externalAuthorityGranted:false,targetHostQualified:false,productionActivated:false,writerCutoverAuthorized:false,nodeRetirementAuthorized:false}' > "$RUNNER_TEMP/internal-source-main-status-v4.json"
          content="$(base64 -w0 "$RUNNER_TEMP/internal-source-main-status-v4.json")"
          path=.github/admin-status/internal-source-main-closure-v4-20260911.json
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$PUBLISHER_BRANCH" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='chore(admin): record exact main source closure' -f content="$content" -f sha="$existing" -f branch="$PUBLISHER_BRANCH" >/dev/null
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='chore(admin): record exact main source closure' -f content="$content" -f branch="$PUBLISHER_BRANCH" >/dev/null
          fi

      - name: Upload exact convergence evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: internal-source-main-convergence-v4-${{ steps.final.outputs.head }}
          path: |
            ${{ runner.temp }}/promotion-v4.json
            ${{ runner.temp }}/first-runs.json
            ${{ runner.temp }}/first-checks.json
            ${{ runner.temp }}/final-runs.json
            ${{ runner.temp }}/final-checks.json
            ${{ runner.temp }}/internal-source-main-status-v4.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
