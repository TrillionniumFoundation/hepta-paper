name: admin-publish-internal-source-closure-v2-20260911

on:
  push:
    branches:
      - codex/source-audit-export-20260911
    paths:
      - .github/workflows/admin-publish-internal-source-closure-v2-20260911.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: admin-publish-internal-source-closure-v2-20260911
  cancel-in-progress: false

env:
  SOURCE_BRANCH: codex/global-plan-v1.1-internal-source-closure-20260911
  STACK_BASE_PR: "119"
  NODE_VERSION: 22.23.1
  RUST_VERSION: 1.98.0
  BLOB_1: 05d3b20d14cf05473ecca8da6a15b3919192fa87
  BLOB_2: bb392f41843b9fc6c60404ca318b8dcc0fc42c27
  BLOB_3: df468481fda2741158ba1279bb18669f40796f9a
  BLOB_4: e95ae33a076d887e7de5b16e98cfdbf2bebb9771

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Resolve exact stack and source refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$STACK_BASE_PR")"
          test "$(jq -r '.state' <<<"$base")" = open
          base_ref="$(jq -r '.head.ref' <<<"$base")"
          base_sha="$(jq -r '.head.sha' <<<"$base")"
          source_sha="$(git ls-remote "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')"
          test -n "$source_sha"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact source branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.refs.outputs.source_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Prove source branch stacks on current PR 119 head
        shell: bash
        run: |
          set -euo pipefail
          git -C target fetch --no-tags origin "${{ steps.refs.outputs.base_sha }}"
          git -C target merge-base --is-ancestor "${{ steps.refs.outputs.base_sha }}" HEAD

      - name: Set up pinned Node and Rust
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup override set "$RUST_VERSION" --path "$GITHUB_WORKSPACE/target/rust"
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(rustc +$RUST_VERSION --version | awk '{print $2}')" = "$RUST_VERSION"
          npm --prefix target ci --ignore-scripts --no-audit --no-fund

      - name: Materialize and classify four pre-audited Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          object_root="$RUNNER_TEMP/internal-source-objects"
          rm -rf "$object_root"
          mkdir -p "$object_root"
          for sha in "$BLOB_1" "$BLOB_2" "$BLOB_3" "$BLOB_4"; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq '.content' | tr -d '\n' | base64 --decode > "$object_root/$sha"
            test "$(git hash-object "$object_root/$sha")" = "$sha"
          done
          python3 - "$object_root" target <<'PY'
          import json, pathlib, shutil, sys
          source_root = pathlib.Path(sys.argv[1])
          checkout = pathlib.Path(sys.argv[2])
          mapping = {}
          for source in sorted(source_root.iterdir()):
              text = source.read_text(encoding='utf-8')
              destination = None
              try:
                  value = json.loads(text)
              except json.JSONDecodeError:
                  value = None
              if isinstance(value, dict) and value.get('kind') == 'RepositorySourceImplementationEvidenceV1':
                  destination = 'docs/system/evidence/repository-source-implementation-v1.json'
              elif isinstance(value, dict):
                  props = value.get('properties')
                  if isinstance(props, dict) and isinstance(props.get('kind'), dict) and props['kind'].get('const') == 'RepositorySourceImplementationEvidenceV1':
                      destination = 'docs/system/schemas/source-implementation-evidence-v1.schema.json'
              if destination is None and ('node:test' in text or "from 'node:test'" in text or 'from "node:test"' in text):
                  destination = 'paper-core/tests/source-implementation-evidence.test.mjs'
              if destination is None and ('parseStrictJson' in text or 'source implementation evidence' in text.lower()):
                  destination = 'paper-core/bin/verify-source-implementation-evidence.mjs'
              if destination is None or destination in mapping:
                  raise SystemExit(f'closed classification failure for {source.name}: {destination}')
              mapping[destination] = source
          expected = {
              'docs/system/evidence/repository-source-implementation-v1.json',
              'docs/system/schemas/source-implementation-evidence-v1.schema.json',
              'paper-core/bin/verify-source-implementation-evidence.mjs',
              'paper-core/tests/source-implementation-evidence.test.mjs',
          }
          if set(mapping) != expected:
              raise SystemExit(f'expected exactly four classes, got {sorted(mapping)}')
          for destination, source in mapping.items():
              out = checkout / destination
              out.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, out)
              print(f'{source.name} -> {destination}')
          PY
          chmod 0755 target/paper-core/bin/verify-source-implementation-evidence.mjs
          git -C target diff --check

      - name: Run strict verifier, hostile tests and documentation owners
        shell: bash
        run: |
          set -euo pipefail
          cd target
          node paper-core/bin/verify-source-implementation-evidence.mjs
          node --test paper-core/tests/source-implementation-evidence.test.mjs
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          python3 docs/rust/tools/validate-program-truth.py

      - name: Execute every typed requested owner command without a shell
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python3 - "$RUNNER_TEMP/internal-owner-tests-v2.json" <<'PY'
          import hashlib, json, pathlib, subprocess, sys, time
          repo = pathlib.Path.cwd().resolve()
          output_path = pathlib.Path(sys.argv[1])
          doc = json.loads((repo / 'docs/system/evidence/repository-source-implementation-v1.json').read_text())

          records_value = doc.get('records')
          if isinstance(records_value, dict):
              records = records_value
          elif isinstance(records_value, list):
              records = {r.get('workItemId') or r.get('id'): r for r in records_value if isinstance(r, dict)}
          else:
              raise SystemExit('records are not a closed collection')
          requested = sorted(k for k,v in records.items() if isinstance(k,str) and isinstance(v,dict) and v.get('promotionRequested') is True)
          if len(requested) != 10:
              raise SystemExit(f'expected ten pre-audited requests, got {requested}')

          bundles_value = doc.get('bundles', {})
          if isinstance(bundles_value, dict):
              bundles = bundles_value
          elif isinstance(bundles_value, list):
              bundles = {b.get('bundleId') or b.get('id'): b for b in bundles_value if isinstance(b, dict)}
          else:
              raise SystemExit('bundles are not a closed collection')

          def commands_in(value):
              if not isinstance(value, dict):
                  return []
              for key in ('verificationCommands','ownerTestCommands','commands'):
                  commands = value.get(key)
                  if isinstance(commands, list):
                      return commands
              return []

          def normalize(command):
              if not isinstance(command, dict):
                  raise SystemExit('shell strings and untyped commands are forbidden')
              vector = None
              if isinstance(command.get('argv'), list):
                  vector = command['argv']
              elif isinstance(command.get('command'), list):
                  vector = command['command']
              elif isinstance(command.get('program'), str) and isinstance(command.get('args', []), list):
                  vector = [command['program'], *command.get('args', [])]
              if not vector or not all(isinstance(x, str) and x for x in vector):
                  raise SystemExit(f'invalid typed command vector: {command}')
              program, args = vector[0], vector[1:]
              if program not in {'cargo','node','python3','bash'}:
                  raise SystemExit(f'program outside closed allowlist: {program}')
              cwd = command.get('workdir', command.get('cwd', command.get('workingDirectory', '.')))
              if not isinstance(cwd, str) or cwd.startswith('/') or '..' in pathlib.PurePosixPath(cwd).parts:
                  raise SystemExit(f'unsafe cwd: {cwd}')
              timeout = command.get('timeoutSeconds', command.get('timeout', 600))
              expected = command.get('expectedExitCode', command.get('expectedExit', 0))
              if not isinstance(timeout, int) or not 1 <= timeout <= 1800 or expected != 0:
                  raise SystemExit(f'unsafe limits: {command}')
              return program, args, cwd, timeout

          runs, seen = [], set()
          for item_id in requested:
              record = records[item_id]
              if item_id.startswith(('GAP-','LEGACY-REPLAY-')) or any(record.get('authorityClaims', {}).values()):
                  raise SystemExit(f'authority-bearing request forbidden: {item_id}')
              candidates = commands_in(record)
              for bundle_id in record.get('bundleIds', record.get('evidenceBundleIds', [])):
                  if bundle_id not in bundles:
                      raise SystemExit(f'unknown bundle {bundle_id}')
                  candidates.extend(commands_in(bundles[bundle_id]))
              if not candidates:
                  raise SystemExit(f'no typed owner command for {item_id}')
              for command in candidates:
                  program, args, cwd_text, timeout = normalize(command)
                  identity = json.dumps([program,args,cwd_text,timeout],separators=(',',':'))
                  if identity in seen:
                      continue
                  seen.add(identity)
                  cwd = (repo / cwd_text).resolve()
                  if repo not in (cwd, *cwd.parents):
                      raise SystemExit(f'cwd escape for {item_id}')
                  start = time.time()
                  result = subprocess.run([program,*args],cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=timeout)
                  raw = result.stdout.encode()
                  runs.append({'itemId':item_id,'program':program,'args':args,'cwd':cwd_text,'exitCode':result.returncode,'durationMilliseconds':round((time.time()-start)*1000),'outputBytes':len(raw),'outputSha256':'sha256:'+hashlib.sha256(raw).hexdigest()})
                  if result.returncode != 0:
                      print(result.stdout)
                      raise SystemExit(f'owner command failed for {item_id}')
          receipt = {'schemaVersion':1,'kind':'InternalRepositorySourceOwnerTestsV2','requestedItemIds':requested,'commandCount':len(runs),'runs':runs,'allPassed':True,'externalAuthorityGranted':False,'targetHostQualified':False,'productionActivated':False,'writerCutoverAuthorized':False,'nodeRetirementAuthorized':False}
          output_path.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'requestedItemIds':requested,'commandCount':len(runs)},sort_keys=True))
          PY

      - name: Commit and force-with-lease publish
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add \
            docs/system/evidence/repository-source-implementation-v1.json \
            docs/system/schemas/source-implementation-evidence-v1.schema.json \
            paper-core/bin/verify-source-implementation-evidence.mjs \
            paper-core/tests/source-implementation-evidence.test.mjs
          if git diff --cached --quiet; then
            head="$(git rev-parse HEAD)"
          else
            git commit -m 'feat(truth): request strict internal source promotions' \
              -m 'Bind ten repository-owned work items to exact Git blobs, typed symbols and owner commands while preserving all external and production authority ceilings.' \
              -m 'Signed-off-by: Qian QI <102159240+ProfHepta@users.noreply.github.com>'
            head="$(git rev-parse HEAD)"
            git push --force-with-lease="refs/heads/$SOURCE_BRANCH:${{ steps.refs.outputs.source_sha }}" origin "HEAD:refs/heads/$SOURCE_BRANCH"
          fi
          tree="$(git rev-parse HEAD^{tree})"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          jq --arg head "$head" --arg tree "$tree" '. + {headCommit:$head,headTree:$tree}' "$RUNNER_TEMP/internal-owner-tests-v2.json" > "$RUNNER_TEMP/internal-owner-tests-v2-bound.json"

      - name: Open or refresh stacked PR and request independent reviewers
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
          HEAD: ${{ steps.commit.outputs.head }}
          TREE: ${{ steps.commit.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=TrillionniumFoundation:$SOURCE_BRANCH&per_page=20" --jq 'map(select(.base.ref == env.BASE_REF))[0].number // empty')"
          ids="$(jq -r '.requestedItemIds | map("`"+.+"`") | join(", ")' "$RUNNER_TEMP/internal-owner-tests-v2.json")"
          body="$RUNNER_TEMP/pr-body.md"
          cat > "$body" <<EOF
          ## Strict internal repository-source closure request

          \`\`\`text
          stacked base PR  #$STACK_BASE_PR
          base branch      $BASE_REF
          head branch      $SOURCE_BRANCH
          head commit      $HEAD
          head tree        $TREE
          \`\`\`

          Requested work items: $ids

          The exact four pre-audited Git blobs were content-classified, hash-verified, validated by the strict evidence verifier and hostile tests, and all typed owner commands completed under Node $NODE_VERSION and Rust $RUST_VERSION before the CAS push.

          This request grants no external authority, target-host qualification, production activation, writer cutover, or Node retirement. Keep Draft until final exact-head CI is terminal green and a fresh independent reviewer approves the exact head/tree.
          EOF
          if [ -z "$pr" ]; then
            pr="$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" -f title='feat(truth): close internal repository-source states' -f head="$SOURCE_BRANCH" -f base="$BASE_REF" -F draft=true -F body=@"$body" --jq '.number')"
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" -f title='feat(truth): close internal repository-source states' -F body=@"$body" >/dev/null
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$pr/requested_reviewers" --input - >/dev/null <<'JSON'
          {"reviewers":["Franksudoman","Tomasrgbsf"]}
          JSON
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Upload bound owner-test receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: internal-source-owner-tests-v2-${{ steps.commit.outputs.head }}
          path: ${{ runner.temp }}/internal-owner-tests-v2-bound.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
