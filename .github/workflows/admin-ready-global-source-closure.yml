name: admin-ready-global-source-closure

on:
  push:
    branches:
      - codex/admin-apply-global-source-closure-20260910
    paths:
      - .github/source-closure-ready-trigger

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mark the exact approved stacked PR ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          admin_branch=codex/admin-apply-global-source-closure-20260910
          source_branch=codex/global-plan-v1.1-repository-source-closure-20260910
          base_branch=codex/rust-plan-v4.1-final3-20260909
          head="$(gh api "repos/$repo/branches/$source_branch" --jq '.commit.sha')"
          tree="$(gh api "repos/$repo/git/commits/$head" --jq '.tree.sha')"
          decode_status() {
            gh api "repos/$repo/contents/$1?ref=$admin_branch" --jq -r '.content' | tr -d '\n' | base64 -d
          }
          ci="$(decode_status .github/admin-status/global-source-closure-qualified.json)"
          review="$(decode_status .github/admin-status/global-source-closure-approved.json)"
          for value in "$ci" "$review"; do
            test "$(jq -r '.head' <<<"$value")" = "$head"
            test "$(jq -r '.tree' <<<"$value")" = "$tree"
            test "$(jq -r '.externalAuthorityGranted' <<<"$value")" = false
            test "$(jq -r '.productionActivated' <<<"$value")" = false
            test "$(jq -r '.writerCutoverAuthorized' <<<"$value")" = false
            test "$(jq -r '.nodeRetirementAuthorized' <<<"$value")" = false
          done
          test "$(jq -r '.allTerminalSuccess' <<<"$ci")" = true
          test "$(jq -r '.independentReviewAccepted' <<<"$review")" = true
          pr="$(jq -r '.pullRequest' <<<"$review")"
          live="$(gh api "repos/$repo/pulls/$pr")"
          test "$(jq -r '.head.sha' <<<"$live")" = "$head"
          test "$(jq -r '.head.ref' <<<"$live")" = "$source_branch"
          test "$(jq -r '.base.ref' <<<"$live")" = "$base_branch"
          test "$(jq -r '.state' <<<"$live")" = open
          node_id="$(jq -r '.node_id' <<<"$live")"
          if [ "$(jq -r '.draft' <<<"$live")" = true ]; then
            gh api graphql -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number,isDraft,headRefOid}}}' -f id="$node_id" \
              --jq '.data.markPullRequestReadyForReview.pullRequest' > "$RUNNER_TEMP/ready.json"
            test "$(jq -r '.isDraft' "$RUNNER_TEMP/ready.json")" = false
            test "$(jq -r '.headRefOid' "$RUNNER_TEMP/ready.json")" = "$head"
          fi
          printf 'pr=%s\nhead=%s\ntree=%s\nready=true\n' "$pr" "$head" "$tree"
