name: apply-internal-source-closure

on:
  push:
    branches:
      - codex/global-plan-v1.1-internal-source-closure-20260911
    paths:
      - .github/workflows/apply-internal-source-closure.yml

permissions:
  contents: write

concurrency:
  group: apply-internal-source-closure-20260911
  cancel-in-progress: false

env:
  BASE_SHA: c9a19ff74fa88eb335df7c2205bd9e2fc096ca40
  FINAL_BRANCH: codex/global-plan-v1.1-internal-source-closure-final-20260911
  PATCH_B64_SHA256: 08fd5dd6fe62ec795789f4beb79d1d4a089587c225a848a9dfd83af005483abb
  PATCH_GZIP_SHA256: 16b09722887474d94c73e0443282618829e895aff7f4a39ed1d62adc382c6acb
  PATCH_SHA256: 8e991ca5141b8a8abd99469ad5f4ac6900e7805e5dd43010ab8fdf82decf27a4
  RUSTUP_TOOLCHAIN: 1.98.0

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out exact bootstrap commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct source increment without publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TrillionniumFoundation/hepta-paper
          test "$GITHUB_REF" = refs/heads/codex/global-plan-v1.1-internal-source-closure-20260911
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          payload="$RUNNER_TEMP/internal-source-closure.patch.gz.b64"
          archive="$RUNNER_TEMP/internal-source-closure.patch.gz"
          patch="$RUNNER_TEMP/internal-source-closure.patch"
          cp .github/admin-data/internal-source-closure.patch.gz.b64 "$payload"
          echo "$PATCH_B64_SHA256  $payload" | sha256sum -c -
          base64 -d "$payload" > "$archive"
          echo "$PATCH_GZIP_SHA256  $archive" | sha256sum -c -
          gzip -dc "$archive" > "$patch"
          echo "$PATCH_SHA256  $patch" | sha256sum -c -

          git reset --hard "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git apply --check "$patch"
          git apply --index "$patch"
          git diff --check --cached
          expected="$RUNNER_TEMP/expected-paths"
          cat > "$expected" <<'PATHS'
          docs/system/evidence/repository-source-implementation-v1.json
          docs/system/schemas/source-implementation-evidence-v1.schema.json
          paper-core/bin/verify-source-implementation-evidence.mjs
          paper-core/tests/source-implementation-evidence.test.mjs
          rust/crates/hepta-cutover/tests/retirement_source.rs
          rust/crates/hepta-scientific-evidence/tests/source_evidence.rs
          PATHS
          git diff --cached --name-only > "$RUNNER_TEMP/actual-paths"
          diff -u "$expected" "$RUNNER_TEMP/actual-paths"

          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git commit -m 'feat(truth): request internal source-evidence promotions' \
            -m 'Bind ten internal design-ready work items to exact implementation blobs and executable owner tests. Extend tracked source modes only to the closed set 100644/100755. Grant no target-host, external, production, writer-cutover, or Node-retirement authority.' \
            -m 'Signed-off-by: Qian QI <102159240+ProfHepta@users.noreply.github.com>'
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install pinned Rust and dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --no-self-update
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = v22.23.1
          test "$(rustc --version | awk '{print $2}')" = 1.98.0

      - name: Format, rebind blobs, and finalize immutable candidate
        id: final
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          evidence_path = pathlib.Path('docs/system/evidence/repository-source-implementation-v1.json')
          targets = {
              'rust/crates/hepta-cutover/tests/retirement_source.rs',
              'rust/crates/hepta-scientific-evidence/tests/source_evidence.rs',
          }
          doc = json.loads(evidence_path.read_text(encoding='utf-8'))
          seen = set()
          changed = []
          for bundle_id, bundle in doc.get('bundles', {}).items():
              for entry in bundle.get('files', []):
                  path = entry.get('path')
                  if path not in targets:
                      continue
                  if path in seen:
                      raise SystemExit(f'duplicate_target_evidence:{path}')
                  if set(entry) != {'path', 'role', 'gitBlob', 'mode', 'language', 'symbols'}:
                      raise SystemExit(f'unexpected_file_entry_shape:{bundle_id}:{path}:{sorted(entry)}')
                  new_blob = subprocess.check_output(['git', 'hash-object', '--', path], text=True).strip()
                  old_blob = entry['gitBlob']
                  if len(new_blob) != 40 or any(c not in '0123456789abcdef' for c in new_blob):
                      raise SystemExit(f'invalid_git_blob:{path}:{new_blob}')
                  if old_blob == new_blob:
                      raise SystemExit(f'expected_rustfmt_blob_change_missing:{path}')
                  entry['gitBlob'] = new_blob
                  seen.add(path)
                  changed.append((path, old_blob, new_blob))
          if seen != targets:
              raise SystemExit(f'missing_target_evidence:{sorted(targets-seen)}')
          evidence_path.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          for path, old_blob, new_blob in sorted(changed):
              print(f'rebound_git_blob:{path}:{old_blob}->{new_blob}')
          PY
          git diff --check
          cat > "$RUNNER_TEMP/expected-format-paths" <<'PATHS'
          docs/system/evidence/repository-source-implementation-v1.json
          rust/crates/hepta-cutover/tests/retirement_source.rs
          rust/crates/hepta-scientific-evidence/tests/source_evidence.rs
          PATHS
          git diff --name-only > "$RUNNER_TEMP/actual-format-paths"
          diff -u "$RUNNER_TEMP/expected-format-paths" "$RUNNER_TEMP/actual-format-paths"
          git add docs/system/evidence/repository-source-implementation-v1.json \
                  rust/crates/hepta-cutover/tests/retirement_source.rs \
                  rust/crates/hepta-scientific-evidence/tests/source_evidence.rs
          git commit --amend --no-edit
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Validate exact evidence and owner tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.final.outputs.head }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ steps.final.outputs.tree }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          python3 docs/rust/tools/validate-program-truth.py
          node --test paper-core/tests/source-implementation-evidence.test.mjs
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          receipt="$RUNNER_TEMP/repository-source-evidence-receipt.json"
          node paper-core/bin/verify-source-implementation-evidence.mjs \
            --execute \
            --expected-head "${{ steps.final.outputs.head }}" \
            --expected-tree "${{ steps.final.outputs.tree }}" \
            --receipt "$receipt" > "$RUNNER_TEMP/repository-source-evidence.stdout.json"
          test "$(jq -r '.promotions | length' "$receipt")" = 10
          test "$(jq -c '.promotions | sort' "$receipt")" = '["CTL-005","CTL-006","MIG-003","MIG-005","MIG-006","MOD-003","MOD-004","MOD-005","MOD-006","SYS-005"]'
          test "$(jq '[.authorityClaims[] | select(. != false)] | length' "$receipt")" = 0
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Publish new immutable final branch without rewriting bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$FINAL_BRANCH" >/dev/null 2>&1; then
            echo "final branch already exists" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$FINAL_BRANCH"
          test "$(git rev-parse HEAD)" = "${{ steps.final.outputs.head }}"
          python3 - <<'PY'
          import json, os, pathlib
          receipt = {
              'schemaVersion': 1,
              'kind': 'InternalSourceClosurePublicationReceipt',
              'bootstrapSha': os.environ['GITHUB_SHA'],
              'baseSha': os.environ['BASE_SHA'],
              'finalBranch': os.environ['FINAL_BRANCH'],
              'headSha': '${{ steps.final.outputs.head }}',
              'headTree': '${{ steps.final.outputs.tree }}',
              'promotionRequestedIds': ['CTL-005','CTL-006','MIG-003','MIG-005','MIG-006','MOD-003','MOD-004','MOD-005','MOD-006','SYS-005'],
              'formattedWithRust': '1.98.0',
              'allOwnerTestsPassed': True,
              'targetHostQualified': False,
              'externalAuthorityGranted': False,
              'productionActivated': False,
              'writerCutoverAuthorized': False,
              'nodeRetirementAuthorized': False,
          }
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'internal-source-closure-publication-receipt.json'
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Upload verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: internal-source-closure-${{ steps.final.outputs.head }}
          path: |
            ${{ runner.temp }}/internal-source-closure-publication-receipt.json
            ${{ runner.temp }}/repository-source-evidence-receipt.json
            ${{ runner.temp }}/repository-source-evidence.stdout.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
