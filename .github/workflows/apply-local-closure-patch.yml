name: apply-local-closure-patch

on:
  push:
    branches:
      - codex/rust-broker-service-20260828
    paths:
      - .automation/closure-patch/hepta-combined-closure.patch
      - .github/workflows/apply-local-closure-patch.yml

permissions:
  contents: write

concurrency:
  group: apply-local-closure-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact branch with pinned external assets
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          submodules: recursive
          ref: codex/rust-broker-service-20260828

      - name: Apply staged source patch
        shell: bash
        run: |
          set -euo pipefail
          patch=.automation/closure-patch/hepta-combined-closure.patch
          test -s "$patch"
          git apply --check "$patch"
          git apply "$patch"
          rm -rf .automation/closure-patch
          rm -f .github/workflows/apply-local-closure-patch.yml
          git diff --check

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          rustc --version
          cargo --version

      - name: Verify Rust workspace
        shell: bash
        working-directory: rust
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --locked --no-deps

      - name: Install exact qualified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Materialize Node and host test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sqlite3 \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended
          if [ ! -e /usr/bin/node ]; then
            sudo ln -s "$(command -v node)" /usr/bin/node
          fi
          test -x /usr/bin/node
          command -v pdflatex
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify all impacted Node shards
        shell: bash
        env:
          GITHUB_BASE_SHA: a9ba785925b08d7aeba1d5ffb92a7a9c86c8815f
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          for shard in 0 1 2 3; do
            npm run test:impacted -- \
              --base-ref "$GITHUB_BASE_SHA" \
              --head-ref "$head" \
              --shard-count 4 \
              --shard-index "$shard"
          done

      - name: Commit verified source changes and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'fix: close Rust broker durability and portable CI blockers'
          git push origin HEAD:codex/rust-broker-service-20260828
