name: apply-pr16-blocker-closure

on:
  push:
    branches:
      - codex/current-source-export-20260829-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pr16-blocker-closure
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 668f250d3ec183861e81222473d103c0eed5491f
          fetch-depth: 0
          submodules: false

      - name: Apply canonical gate observation path fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 668f250d3ec183861e81222473d103c0eed5491f
          python3 - <<'PY'
          from pathlib import Path
          path = Path("rust/crates/hepta-codex-runtime/src/process/gate.rs")
          source = path.read_text()
          marker = "    let stopped = wait_for_stopped_gate(\n"
          old_argument = "        &policy.gate_executable,\n"
          if source.count(marker) != 1 or source.count(old_argument) != 1:
              raise SystemExit("expected exactly one gate observation block")
          source = source.replace(
              marker,
              "    let gate_observation_path = PathBuf::from(&gate_identity.canonical_path);\n" + marker,
              1,
          )
          source = source.replace(old_argument, "        &gate_observation_path,\n", 1)
          path.write_text(source)
          PY
          git diff --check
          git diff -- rust/crates/hepta-codex-runtime/src/process/gate.rs

      - name: Validate focused durable process suite
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo build \
            --manifest-path rust/Cargo.toml \
            -p hepta-codex-runtime \
            --bin hepta-codex-preexec-gate \
            --locked
          cargo test \
            --manifest-path rust/Cargo.toml \
            -p hepta-codex-broker \
            --test durable_process_journal \
            --locked \
            -- --test-threads=1

      - name: Commit and update PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-paper blocker closure"
          git config user.email "actions@users.noreply.github.com"
          git add rust/crates/hepta-codex-runtime/src/process/gate.rs
          git commit -m "fix(rust): observe the canonical pre-exec gate path"
          git push origin HEAD:refs/heads/codex/rust-broker-service-20260828
