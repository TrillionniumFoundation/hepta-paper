name: apply-pr16-blocker-closure

on:
  push:
    branches:
      - codex/current-source-export-20260829-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pr16-blocker-closure
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: e16badd21c1d02334e5046bae12ed9afeb6b0def
          fetch-depth: 0
          submodules: false

      - name: Require read-only identity verification before broker DB mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e16badd21c1d02334e5046bae12ed9afeb6b0def
          python3 - <<'PY'
          from pathlib import Path

          path = Path("rust/crates/hepta-codex-broker/src/journal/path.rs")
          source = path.read_text()
          old = '''    let (path, initialization_marker) = prepare_database_path(requested, policy)?;\n    let flags = OpenFlags::SQLITE_OPEN_READ_WRITE\n        | OpenFlags::SQLITE_OPEN_CREATE\n        | OpenFlags::SQLITE_OPEN_NO_MUTEX\n        | OpenFlags::SQLITE_OPEN_NOFOLLOW;\n    let connection = Connection::open_with_flags(&path, flags)?;\n    connection.busy_timeout(Duration::from_millis(policy.busy_timeout_ms))?;\n    configure_safety_pragmas(&connection)?;\n    if initialization_marker.is_some() {\n        verify_initialization_candidate(&connection)?;\n    } else {\n        verify_database_identity(&connection)?;\n    }\n    connection.execute_batch(SCHEMA_SQL)?;\n'''
          new = '''    let (path, initialization_marker) = prepare_database_path(requested, policy)?;\n    preflight_database_before_writer(&path, initialization_marker.is_some())?;\n\n    let flags = OpenFlags::SQLITE_OPEN_READ_WRITE\n        | OpenFlags::SQLITE_OPEN_CREATE\n        | OpenFlags::SQLITE_OPEN_NO_MUTEX\n        | OpenFlags::SQLITE_OPEN_NOFOLLOW;\n    let connection = Connection::open_with_flags(&path, flags)?;\n    connection.busy_timeout(Duration::from_millis(policy.busy_timeout_ms))?;\n    configure_safety_pragmas(&connection)?;\n    if initialization_marker.is_some() {\n        verify_initialization_candidate(&connection)?;\n        connection.execute_batch(SCHEMA_SQL)?;\n    } else {\n        verify_database_identity(&connection)?;\n    }\n'''
          if source.count(old) != 1:
              raise SystemExit("expected exactly one broker open block")
          source = source.replace(old, new, 1)

          addition = '''\nfn preflight_database_before_writer(\n    path: &Path,\n    initialization_marker_present: bool,\n) -> Result<(), BrokerJournalError> {\n    let metadata = fs::metadata(path)\n        .map_err(|error| BrokerJournalError::Filesystem("journal_database", error.kind()))?;\n    if metadata.len() == 0 {\n        return if initialization_marker_present {\n            Ok(())\n        } else {\n            Err(BrokerJournalError::DatabaseIdentityMismatch {\n                application_id: 0,\n                user_version: 0,\n            })\n        };\n    }\n\n    let flags = OpenFlags::SQLITE_OPEN_READ_ONLY\n        | OpenFlags::SQLITE_OPEN_NO_MUTEX\n        | OpenFlags::SQLITE_OPEN_NOFOLLOW;\n    let connection = Connection::open_with_flags(path, flags)?;\n    connection.busy_timeout(Duration::from_millis(100))?;\n    if initialization_marker_present {\n        verify_initialization_candidate(&connection)?;\n        let application_id: i64 =\n            connection.query_row("PRAGMA application_id", [], |row| row.get(0))?;\n        if application_id == APPLICATION_ID {\n            verify_schema_version(&connection)?;\n            verify_schema_shape(&connection)?;\n        }\n    } else {\n        verify_database_identity(&connection)?;\n        verify_schema_version(&connection)?;\n        verify_schema_shape(&connection)?;\n    }\n    Ok(())\n}\n\n'''
          marker = "fn prepare_database_path(\n"
          if source.count(marker) != 1:
              raise SystemExit("expected prepare_database_path marker")
          source = source.replace(marker, addition + marker, 1)
          path.write_text(source)

          tests = Path("rust/crates/hepta-codex-broker/src/journal/tests.rs")
          source = tests.read_text()
          marker = '''#[test]\nfn foreign_or_unstamped_sqlite_database_is_rejected() {\n'''
          addition = '''#[test]\nfn foreign_empty_database_is_rejected_without_mutation() {\n    let fixture = TempJournal::new();\n    let file = fs::OpenOptions::new()\n        .write(true)\n        .create_new(true)\n        .open(&fixture.path)\n        .expect("create foreign empty database");\n    file.sync_all().expect("sync foreign empty database");\n    drop(file);\n    fs::set_permissions(&fixture.path, fs::Permissions::from_mode(0o600))\n        .expect("private foreign empty database");\n    let before = fs::read(&fixture.path).expect("read foreign empty database before");\n    assert!(matches!(\n        BrokerJournalStoreV1::open(\n            &fixture.path,\n            BrokerJournalPolicyV1::strict(fixture.owner_uid),\n        ),\n        Err(BrokerJournalError::DatabaseIdentityMismatch { .. }),\n    ));\n    assert_eq!(\n        fs::read(&fixture.path).expect("read foreign empty database after"),\n        before,\n    );\n    assert!(!PathBuf::from(format!("{}-wal", fixture.path.display())).exists());\n    assert!(!PathBuf::from(format!("{}-shm", fixture.path.display())).exists());\n}\n\n#[test]\nfn foreign_populated_database_is_rejected_without_mutation() {\n    let fixture = TempJournal::new();\n    let foreign = rusqlite::Connection::open(&fixture.path).expect("create foreign SQLite");\n    foreign\n        .execute_batch("CREATE TABLE foreign_state(value TEXT) STRICT; INSERT INTO foreign_state VALUES ('kept');")\n        .expect("foreign schema and content");\n    drop(foreign);\n    fs::set_permissions(&fixture.path, fs::Permissions::from_mode(0o600))\n        .expect("private foreign database");\n    let before = fs::read(&fixture.path).expect("read foreign database before");\n    assert!(matches!(\n        BrokerJournalStoreV1::open(\n            &fixture.path,\n            BrokerJournalPolicyV1::strict(fixture.owner_uid),\n        ),\n        Err(BrokerJournalError::DatabaseIdentityMismatch { .. }),\n    ));\n    assert_eq!(\n        fs::read(&fixture.path).expect("read foreign database after"),\n        before,\n    );\n    assert!(!PathBuf::from(format!("{}-wal", fixture.path.display())).exists());\n    assert!(!PathBuf::from(format!("{}-shm", fixture.path.display())).exists());\n}\n\n'''
          if source.count(marker) != 1:
              raise SystemExit("expected foreign DB test marker")
          tests.write_text(source.replace(marker, addition + marker, 1))
          PY
          git diff --check
          git diff --stat

      - name: Validate broker database preflight
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo test \
            --manifest-path rust/Cargo.toml \
            -p hepta-codex-broker \
            journal::tests \
            --locked \
            -- --test-threads=1
          cargo clippy \
            --manifest-path rust/Cargo.toml \
            -p hepta-codex-broker \
            --all-targets \
            --all-features \
            --locked \
            -- -D warnings

      - name: Commit and update PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-paper blocker closure"
          git config user.email "actions@users.noreply.github.com"
          git add \
            rust/crates/hepta-codex-broker/src/journal/path.rs \
            rust/crates/hepta-codex-broker/src/journal/tests.rs
          git commit -m "fix(rust): reject foreign broker databases before mutation"
          git push origin HEAD:refs/heads/codex/rust-broker-service-20260828
