name: apply-pr16-development-blocker-closure-v5

on:
  push:
    branches:
      - codex/current-source-export-20260829-v2
    paths:
      - .github/workflows/apply-pr16-development-blocker-closure-v5.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pr16-development-blocker-closure-v5
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact qualified PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: e16badd21c1d02334e5046bae12ed9afeb6b0def
          fetch-depth: 0
          submodules: false

      - name: Close SQLite and trust-bundle file authority gaps
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e16badd21c1d02334e5046bae12ed9afeb6b0def
          python3 - <<'PY'
          from pathlib import Path

          journal = Path("rust/crates/hepta-codex-broker/src/journal/path.rs")
          source = journal.read_text()
