              assert!(!std::path::PathBuf::from(format!("{}-wal", fixture.path.display())).exists());
              assert!(!std::path::PathBuf::from(format!("{}-shm", fixture.path.display())).exists());
          }

          '''
          if source.count(marker) != 1:
              raise SystemExit("expected foreign database test marker")
          tests.write_text(source.replace(marker, addition + marker, 1))

          manifest = Path("rust/crates/hepta-codex-broker/Cargo.toml")
          source = manifest.read_text()
          if "\nlibc = " not in source:
