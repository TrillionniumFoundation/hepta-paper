              source = source.replace(marker, marker + 'libc = "0.2.189"\n', 1)
              manifest.write_text(source)

          lib = Path("rust/crates/hepta-codex-broker/src/lib.rs")
          source = lib.read_text()
          if "mod trust_bundle_file;" not in source and "pub mod trust_bundle_file;" not in source:
