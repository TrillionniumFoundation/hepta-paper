name: apply-pr16-development-closure-v2

on:
  push:
    branches:
      - codex/current-source-export-20260829-v2
    paths:
      - .github/workflows/apply-pr16-development-closure-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pr16-development-closure-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: e16badd21c1d02334e5046bae12ed9afeb6b0def
          fetch-depth: 0
          submodules: false

      - name: Add read-only broker database preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e16badd21c1d02334e5046bae12ed9afeb6b0def
          python3 - <<'PY'
          from pathlib import Path

          path = Path("rust/crates/hepta-codex-broker/src/journal/path.rs")
          source = path.read_text()
          old = '''    let (path, initialization_marker) = prepare_database_path(requested, policy)?;
    let flags = OpenFlags::SQLITE_OPEN_READ_WRITE
        | OpenFlags::SQLITE_OPEN_CREATE
        | OpenFlags::SQLITE_OPEN_NO_MUTEX
        | OpenFlags::SQLITE_OPEN_NOFOLLOW;
    let connection = Connection::open_with_flags(&path, flags)?;
    connection.busy_timeout(Duration::from_millis(policy.busy_timeout_ms))?;
    configure_safety_pragmas(&connection)?;
    if initialization_marker.is_some() {
        verify_initialization_candidate(&connection)?;
    } else {
        verify_database_identity(&connection)?;
    }
    connection.execute_batch(SCHEMA_SQL)?;
'''
          new = '''    let (path, initialization_marker) = prepare_database_path(requested, policy)?;
    preflight_database_before_writer(&path, initialization_marker.is_some())?;

    let flags = OpenFlags::SQLITE_OPEN_READ_WRITE
        | OpenFlags::SQLITE_OPEN_CREATE
        | OpenFlags::SQLITE_OPEN_NO_MUTEX
        | OpenFlags::SQLITE_OPEN_NOFOLLOW;
    let connection = Connection::open_with_flags(&path, flags)?;
    connection.busy_timeout(Duration::from_millis(policy.busy_timeout_ms))?;
    configure_safety_pragmas(&connection)?;
    if initialization_marker.is_some() {
        verify_initialization_candidate(&connection)?;
        connection.execute_batch(SCHEMA_SQL)?;
    } else {
        verify_database_identity(&connection)?;
    }
'''
          if source.count(old) != 1:
              raise SystemExit("expected exactly one broker open block")
          source = source.replace(old, new, 1)

          addition = '''fn preflight_database_before_writer(
    path: &Path,
    initialization_marker_present: bool,
) -> Result<(), BrokerJournalError> {
    let metadata = fs::metadata(path)
        .map_err(|error| BrokerJournalError::Filesystem("journal_database", error.kind()))?;
    if metadata.len() == 0 {
        return if initialization_marker_present {
            Ok(())
        } else {
            Err(BrokerJournalError::DatabaseIdentityMismatch {
                application_id: 0,
                user_version: 0,
            })
        };
    }

    let flags = OpenFlags::SQLITE_OPEN_READ_ONLY
        | OpenFlags::SQLITE_OPEN_NO_MUTEX
        | OpenFlags::SQLITE_OPEN_NOFOLLOW;
    let connection = Connection::open_with_flags(path, flags)?;
    connection.busy_timeout(Duration::from_millis(100))?;
    if initialization_marker_present {
        verify_initialization_candidate(&connection)?;
        let application_id: i64 =
            connection.query_row("PRAGMA application_id", [], |row| row.get(0))?;
        if application_id == APPLICATION_ID {
            verify_schema_version(&connection)?;
            verify_schema_shape(&connection)?;
        }
    } else {
        verify_database_identity(&connection)?;
        verify_schema_version(&connection)?;
        verify_schema_shape(&connection)?;
    }
    Ok(())
}

'''
          marker = "fn prepare_database_path(\n"
          if source.count(marker) != 1:
              raise SystemExit("expected prepare_database_path marker")
          path.write_text(source.replace(marker, addition + marker, 1))

          tests = Path("rust/crates/hepta-codex-broker/src/journal/tests.rs")
          source = tests.read_text()
          marker = '''#[test]
fn foreign_or_unstamped_sqlite_database_is_rejected() {
'''
          addition = '''#[test]
fn foreign_empty_database_is_rejected_without_mutation() {
    let fixture = TempJournal::new();
    let file = fs::OpenOptions::new()
        .write(true)
        .create_new(true)
        .open(&fixture.path)
        .expect("create foreign empty database");
    file.sync_all().expect("sync foreign empty database");
    drop(file);
    fs::set_permissions(&fixture.path, fs::Permissions::from_mode(0o600))
        .expect("private foreign empty database");
    let before = fs::read(&fixture.path).expect("read foreign empty database before");
    assert!(matches!(
        BrokerJournalStoreV1::open(
            &fixture.path,
            BrokerJournalPolicyV1::strict(fixture.owner_uid),
        ),
        Err(BrokerJournalError::DatabaseIdentityMismatch { .. }),
    ));
    assert_eq!(
        fs::read(&fixture.path).expect("read foreign empty database after"),
        before,
    );
    assert!(!PathBuf::from(format!("{}-wal", fixture.path.display())).exists());
    assert!(!PathBuf::from(format!("{}-shm", fixture.path.display())).exists());
}

#[test]
fn foreign_populated_database_is_rejected_without_mutation() {
    let fixture = TempJournal::new();
    let foreign = rusqlite::Connection::open(&fixture.path).expect("create foreign SQLite");
    foreign
        .execute_batch(
            "CREATE TABLE foreign_state(value TEXT) STRICT;\n\
             INSERT INTO foreign_state VALUES ('kept');",
        )
        .expect("foreign schema and content");
    drop(foreign);
    fs::set_permissions(&fixture.path, fs::Permissions::from_mode(0o600))
        .expect("private foreign database");
    let before = fs::read(&fixture.path).expect("read foreign database before");
    assert!(matches!(
        BrokerJournalStoreV1::open(
            &fixture.path,
            BrokerJournalPolicyV1::strict(fixture.owner_uid),
        ),
        Err(BrokerJournalError::DatabaseIdentityMismatch { .. }),
    ));
    assert_eq!(
        fs::read(&fixture.path).expect("read foreign database after"),
        before,
    );
    assert!(!PathBuf::from(format!("{}-wal", fixture.path.display())).exists());
    assert!(!PathBuf::from(format!("{}-shm", fixture.path.display())).exists());
}

'''
          if source.count(marker) != 1:
              raise SystemExit("expected foreign DB test marker")
          tests.write_text(source.replace(marker, addition + marker, 1))
          PY

          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
          git diff --stat

      - name: Validate broker database closure
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo test \
            --manifest-path rust/Cargo.toml \
            -p hepta-codex-broker \
            --all-features \
            --locked \
            -- --test-threads=1
          cargo clippy \
            --manifest-path rust/Cargo.toml \
            -p hepta-codex-broker \
            --all-targets \
            --all-features \
            --locked \
            -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc \
            --manifest-path rust/Cargo.toml \
            -p hepta-codex-broker \
            --all-features \
            --locked \
            --no-deps

      - name: Commit and update PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-paper blocker closure"
          git config user.email "actions@users.noreply.github.com"
          git add \
            rust/crates/hepta-codex-broker/src/journal/path.rs \
            rust/crates/hepta-codex-broker/src/journal/tests.rs
          git commit -m "fix(rust): preflight existing broker databases read-only"
          git push origin HEAD:refs/heads/codex/rust-broker-service-20260828
