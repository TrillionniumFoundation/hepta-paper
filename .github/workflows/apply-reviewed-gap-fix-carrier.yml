name: apply-reviewed-gap-fix-carrier

on:
  push:
    branches:
      - codex/global-plan-final-gap-closure-20260902

permissions:
  contents: write

concurrency:
  group: apply-reviewed-gap-fix-carrier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-reviewed-patch:
    if: "${{ github.event.head_commit.message == 'chore-carrier-apply-reviewed-gap-fix' }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      EXPECTED_BASE_SHA: 1e480b9103491afa49fbd528744d79c0f97d4d63
      PATCH_GZIP_SHA256: a7b8cb85092dd05f83c20cfa6ed6b9c6784334d260b9e71173d02e2e1089b7ab
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Verify exact carrier subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD
          actual_paths="$(git diff --name-only "$EXPECTED_BASE_SHA" HEAD | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            '.ci/hepta-gap-fix.patch.gz.b64' \
            '.github/workflows/apply-reviewed-gap-fix-carrier.yml' \
            | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"

      - name: Decode and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .ci/hepta-gap-fix.patch.gz.b64 > "$RUNNER_TEMP/hepta-gap-fix.patch.gz"
          echo "$PATCH_GZIP_SHA256  $RUNNER_TEMP/hepta-gap-fix.patch.gz" | sha256sum -c -
          gzip --decompress --stdout "$RUNNER_TEMP/hepta-gap-fix.patch.gz" > "$RUNNER_TEMP/hepta-gap-fix.patch"
          test "$(grep -c '^diff --git ' "$RUNNER_TEMP/hepta-gap-fix.patch")" = 15
          git apply --check --whitespace=error-all "$RUNNER_TEMP/hepta-gap-fix.patch"
          git apply --whitespace=error-all "$RUNNER_TEMP/hepta-gap-fix.patch"
          git diff --check

      - name: Provision exact portable runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sqlite3 texlive-latex-base poppler-utils
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v22.23.1"
          strict_node_source="$(command -v node)"
          test -f "$strict_node_source"
          sudo install -o root -g root -m 0555 "$strict_node_source" /usr/bin/node
          sudo test "$(readlink -f /usr/bin/node)" = /usr/bin/node
          test "$(/usr/bin/node --version)" = "v22.23.1"
          command -v pdflatex
          command -v pdfinfo

      - name: Run exact admission gates
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            paper-adapters/automation/repository-asset-externalization.mjs \
            paper-adapters/automation/repository-asset-submodule-binding.mjs \
            paper-adapters/research-verify/pde-poisson-2d-cpu-oracle-sandbox-runner-factory.mjs \
            paper-adapters/research-verify/process-isolated-pde-poisson-2d-independent-cpu-oracle.mjs \
            paper-adapters/runtime/os-sandboxed-worker-runner-engine.mjs \
            paper-core/tests/gpu-scientific-campaign-execution-lease-binding.test.mjs \
            paper-core/tests/r-runtime-source-cas.test.mjs \
            paper-core/tests/support/gpu-scientific-campaign-release-fixture.mjs \
            paper-core/tests/support/os-sandboxed-worker-runner-test-driver.mjs \
            paper-core/tests/support/pde-poisson-2d-cpu-oracle-fixture-runner.mjs \
            paper-core/tests/support/process-isolated-pde-poisson-2d-independent-cpu-oracle-test-seam.mjs \
            paper-core/tests/test-doubles/pde-poisson-2d-cpu-oracle-sandbox-runner-factory.mjs; do
            node --check "$file"
          done
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          python3 docs/rust/tools/validate-program-truth.py
          python3 docs/rust/tools/test-plan-v4-qualification.py
          node --test --test-concurrency=1 \
            paper-core/tests/r-runtime-source-cas.test.mjs \
            paper-core/tests/repository-asset-externalization.test.mjs \
            paper-core/tests/gpu-scientific-campaign-execution-lease-binding.test.mjs \
            paper-core/tests/pde-poisson-2d-gpu-capability.test.mjs \
            paper-core/tests/strict-full-auto-gpu-scientific-release-chain.test.mjs \
            paper-core/tests/automation-readiness-policy.test.mjs \
            paper-core/tests/autonomous-submission-request-verifier-composition.test.mjs

      - name: Commit exact reviewed patch and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            .github/workflows/ci.yml \
            .github/workflows/exact-head-source-validation.yml \
            docs/rust/qualification/source-check-producers.v1.json \
            paper-adapters/automation/repository-asset-externalization.mjs \
            paper-adapters/automation/repository-asset-submodule-binding.mjs \
            paper-adapters/research-verify/pde-poisson-2d-cpu-oracle-sandbox-runner-factory.mjs \
            paper-adapters/research-verify/process-isolated-pde-poisson-2d-independent-cpu-oracle.mjs \
            paper-adapters/runtime/os-sandboxed-worker-runner-engine.mjs \
            paper-core/tests/gpu-scientific-campaign-execution-lease-binding.test.mjs \
            paper-core/tests/r-runtime-source-cas.test.mjs \
            paper-core/tests/support/gpu-scientific-campaign-release-fixture.mjs \
            paper-core/tests/support/os-sandboxed-worker-runner-test-driver.mjs \
            paper-core/tests/support/pde-poisson-2d-cpu-oracle-fixture-runner.mjs \
            paper-core/tests/support/process-isolated-pde-poisson-2d-independent-cpu-oracle-test-seam.mjs \
            paper-core/tests/test-doubles/pde-poisson-2d-cpu-oracle-sandbox-runner-factory.mjs
          git rm -- \
            .ci/hepta-gap-fix.patch.gz.b64 \
            .github/workflows/apply-reviewed-gap-fix-carrier.yml
          actual_paths="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            '.ci/hepta-gap-fix.patch.gz.b64' \
            '.github/workflows/apply-reviewed-gap-fix-carrier.yml' \
            '.github/workflows/ci.yml' \
            '.github/workflows/exact-head-source-validation.yml' \
            'docs/rust/qualification/source-check-producers.v1.json' \
            'paper-adapters/automation/repository-asset-externalization.mjs' \
            'paper-adapters/automation/repository-asset-submodule-binding.mjs' \
            'paper-adapters/research-verify/pde-poisson-2d-cpu-oracle-sandbox-runner-factory.mjs' \
            'paper-adapters/research-verify/process-isolated-pde-poisson-2d-independent-cpu-oracle.mjs' \
            'paper-adapters/runtime/os-sandboxed-worker-runner-engine.mjs' \
            'paper-core/tests/gpu-scientific-campaign-execution-lease-binding.test.mjs' \
            'paper-core/tests/r-runtime-source-cas.test.mjs' \
            'paper-core/tests/support/gpu-scientific-campaign-release-fixture.mjs' \
            'paper-core/tests/support/os-sandboxed-worker-runner-test-driver.mjs' \
            'paper-core/tests/support/pde-poisson-2d-cpu-oracle-fixture-runner.mjs' \
            'paper-core/tests/support/process-isolated-pde-poisson-2d-independent-cpu-oracle-test-seam.mjs' \
            'paper-core/tests/test-doubles/pde-poisson-2d-cpu-oracle-sandbox-runner-factory.mjs' \
            | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): close portable exact-head repository gaps'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
