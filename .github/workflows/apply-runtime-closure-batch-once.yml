name: apply-runtime-closure-batch-once

on:
  push:
    branches:
      - codex/rust-full-replacement-rc-20260908
    paths:
      - .github/workflows/apply-runtime-closure-batch-once.yml

permissions:
  contents: write

concurrency:
  group: apply-runtime-closure-batch-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0

      - name: Materialize source closure batch
        shell: bash
        env:
          SOURCE_ARCHIVE_B64: [... ELLIPSIZATION ...]
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_ARCHIVE_B64" | base64 --decode | tar -xzf -
          python3 - <<'PY'
          from pathlib import Path

          workspace = Path('rust/Cargo.toml')
          text = workspace.read_text(encoding='utf-8')
          member = '  "crates/hepta-performance-qualification",\n'
          if member not in text:
              marker = '  "crates/hepta-module-platform",\n'
              if marker not in text:
                  raise SystemExit('workspace member marker missing')
              text = text.replace(marker, marker + member)
              workspace.write_text(text, encoding='utf-8')

          lib = Path('rust/crates/hepta-control-plane/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          modules = ['mod calibration;', 'mod resource_hierarchy;', 'mod snapshot;', 'mod telemetry;']
          marker = 'mod commit;\n'
          if marker not in text:
              raise SystemExit('control-plane module marker missing')
          insertion = ''.join(f'{module}\n' for module in modules if module not in text)
          if insertion:
              text = text.replace(marker, marker + insertion)
          exports = '''pub use calibration::{\n    CalibrationEntryV1, CalibrationObservationV1, CalibrationPolicyV1, CalibrationTableV1,\n    apply_calibration_v1,\n};\npub use resource_hierarchy::{\n    HierarchicalAdmissionRequestV1, HierarchicalReservationStateV1,\n    HierarchicalReservationV1, HierarchicalResourceAllocatorV1,\n    HierarchicalResourceReportV1, ReservationEffectStateV1, ReservationRecoveryReportV1,\n    ResourceHierarchyV1, ResourceScopeV1,\n};\npub use snapshot::{\n    SnapshotBuildReceiptV1, SnapshotBuildRequestV1, SnapshotComponentV1,\n    build_control_plane_snapshot_v1,\n};\npub use telemetry::{\n    TelemetryAccumulatorV1, TelemetryMetricV1, TelemetryOutcomeV1, TelemetryPolicyV1,\n    TelemetryPrivacyClassV1, TelemetryRetentionClassV1, TelemetrySeriesV1,\n    TelemetrySignalClassV1, TelemetrySignalV1, TelemetrySnapshotV1,\n};\n'''
          export_marker = 'pub use commit::{\n'
          if 'pub use calibration::{' not in text:
              if export_marker not in text:
                  raise SystemExit('control-plane export marker missing')
              text = text.replace(export_marker, exports + export_marker)
          lib.write_text(text, encoding='utf-8')
          PY

      - name: Format and validate complete Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --all-features
          cargo test --manifest-path rust/Cargo.toml -p hepta-control-plane -p hepta-performance-qualification --all-features
          cargo clippy --manifest-path rust/Cargo.toml -p hepta-control-plane -p hepta-performance-qualification --all-targets --all-features -- -D warnings

      - name: Publish validated closure batch
        shell: bash
        env:
          TARGET_BRANCH: codex/rust-full-replacement-rc-20260908
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-runtime-closure-batch-once.yml
          git config user.name hepta-paper-automation
          git config user.email hepta-paper-automation@users.noreply.github.com
          git add rust
          git commit -m 'feat(rust): close snapshot resource calibration telemetry and performance source gaps'
          git push origin "HEAD:${TARGET_BRANCH}"
