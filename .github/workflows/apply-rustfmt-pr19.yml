name: apply-rustfmt-pr19

on:
  push:
    branches:
      - codex/rust-all-gap-closure-20260830
    paths:
      - '.github/rustfmt-pr19/READY'

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-all-gap-closure-20260830
          fetch-depth: 0
          persist-credentials: true
      - name: Download exact rustfmt artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/TrillionniumFoundation/hepta-paper/actions/artifacts/9719719389/zip \
            -o "$RUNNER_TEMP/rustfmt.zip"
          echo 'f7b50b3176712341f305302f4cec2807ca6cecb2a4b25f3c3964e0423847447d  '"$RUNNER_TEMP/rustfmt.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/rustfmt.zip" -d "$RUNNER_TEMP/rustfmt"
          test -s "$RUNNER_TEMP/rustfmt/rustfmt.patch"
      - name: Apply exact patch and commit
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/rustfmt/rustfmt.patch"
          git apply "$RUNNER_TEMP/rustfmt/rustfmt.patch"
          rm -rf .github/rustfmt-pr19
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style(rust): apply exact rustfmt output'
          git push origin HEAD:codex/rust-all-gap-closure-20260830
