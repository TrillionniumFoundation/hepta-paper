name: audit-pr16-zero-development-blockers

on:
  push:
    branches:
      - codex/current-source-export-20260829-v2
    paths:
      - .github/workflows/audit-pr16-zero-development-blockers.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: TrillionniumFoundation/hepta-paper
      PR: '16'
    steps:
      - name: Resolve exact PR head
        id: head
        shell: bash
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          echo "sha=$head" >> "$GITHUB_OUTPUT"

      - name: Check out exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.head.outputs.sha }}
          fetch-depth: 0
          submodules: false

      - name: Reject unresolved development issue taxonomy
        shell: bash
        run: |
          set -euo pipefail
          open=$(gh issue list --repo "$REPO" --state open --limit 200 --json number,title,url)
          unresolved=$(jq -c '[.[] | select(.title | test("^(P0|P1):"))]' <<<"$open")
          if [ "$(jq length <<<"$unresolved")" -ne 0 ]; then
            echo "$unresolved" | jq . >&2
            exit 1
          fi
          qualification=$(jq -c '[.[] | select(.title | startswith("QUALIFICATION:"))]' <<<"$open")
          echo "$qualification" > /tmp/qualification-issues.json

      - name: Reject temporary transport and stale source status
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .automation/closure-patch
          test ! -e .automation/release-transport-probe.txt
          test ! -e .github/workflows/apply-local-closure-patch.yml
          test ! -e .github/workflows/apply-local-closure-patch-v2.yml
          ! grep -Fq '(in progress)' <(gh api "repos/$REPO/pulls/$PR" --jq .body)
          ! grep -RniE 'TODO|FIXME|todo!\(|unimplemented!\(' \
            rust/crates/hepta-codex-broker \
            rust/crates/hepta-codex-runtime \
            docs/codex docs/rust

      - name: Verify closed source-boundary artifacts
        shell: bash
        run: |
          set -euo pipefail
          required=(
            rust/crates/hepta-codex-runtime/src/process/gate.rs
            rust/crates/hepta-codex-runtime/src/bin/hepta-codex-preexec-gate.rs
            rust/crates/hepta-codex-broker/src/journal/path.rs
            rust/crates/hepta-codex-broker/src/trust_bundle.rs
            rust/crates/hepta-codex-broker/src/trust_bundle_source.rs
            rust/crates/hepta-codex-broker/src/listener.rs
            rust/crates/hepta-codex-broker/src/server.rs
            rust/crates/hepta-codex-broker/src/journal/maintenance.rs
            rust/crates/hepta-codex-broker/tests/durable_process_journal.rs
            rust/crates/hepta-codex-broker/tests/service_lifecycle.rs
            deploy/systemd/hepta-codex-broker@.service
            rust/qualification/installed-broker-preflight.sh
            rust/qualification/installed-broker-crash-drill.sh
          )
          for file in "${required[@]}"; do test -f "$file"; done
          grep -Fq 'preflight_database_before_writer' rust/crates/hepta-codex-broker/src/journal/path.rs
          grep -Fq 'SQLITE_OPEN_READ_ONLY' rust/crates/hepta-codex-broker/src/journal/path.rs
          grep -Fq 'foreign_empty_database_is_rejected_without_mutation' rust/crates/hepta-codex-broker/src/journal/tests.rs
          grep -Fq 'foreign_populated_database_is_rejected_without_mutation' rust/crates/hepta-codex-broker/src/journal/tests.rs
          grep -Fq 'load_canonical_authority_json' rust/crates/hepta-codex-broker/src/trust_bundle_source.rs
          grep -Fq 'SeparateAuthorityRequired' rust/crates/hepta-codex-broker/src/trust_bundle_source.rs
          grep -Fq 'O_NOFOLLOW' rust/crates/hepta-codex-broker/src/trust_bundle_source.rs
          grep -Fq 'ProcessExecutableMismatch' rust/crates/hepta-codex-runtime/src/process/gate.rs
          grep -Fq 'content_sha256' rust/crates/hepta-codex-broker/src/trust_bundle_source.rs
          grep -Fq 'IPAddressDeny=any' deploy/systemd/hepta-codex-broker@.service
          grep -Fq 'HEPTA_DESTRUCTIVE_ACK' rust/qualification/installed-broker-crash-drill.sh
          test ! -e deploy/systemd/hepta-codex-broker@.socket
          bash -n rust/qualification/*.sh
          git diff --check "${{ github.event.pull_request.base.sha || 'HEAD^' }}" HEAD || git diff --check

      - name: Verify exact-head protected checks
        id: checks
        shell: bash
        run: |
          set -euo pipefail
          head=${{ steps.head.outputs.sha }}
          for attempt in $(seq 1 180); do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&per_page=100")
            rust=$(jq -c '[.workflow_runs[] | select(.name == "rust-foundation")] | sort_by(.created_at) | last // empty' <<<"$runs")
            node=$(jq -c '[.workflow_runs[] | select(.name == "hepta-paper-ci")] | sort_by(.created_at) | last // empty' <<<"$runs")
            if [ -n "$rust" ] && [ -n "$node" ] \
              && [ "$(jq -r .status <<<"$rust")" = completed ] \
              && [ "$(jq -r .status <<<"$node")" = completed ]; then
              test "$(jq -r .conclusion <<<"$rust")" = success
              test "$(jq -r .conclusion <<<"$node")" = success
              echo "rust_id=$(jq -r .id <<<"$rust")" >> "$GITHUB_OUTPUT"
              echo "node_id=$(jq -r .id <<<"$node")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Record zero-development-blocker audit
        shell: bash
        run: |
          set -euo pipefail
          qualification=$(cat /tmp/qualification-issues.json)
          list=$(jq -r '.[] | "- #\(.number) \(.title)"' <<<"$qualification")
          gh pr comment "$PR" --repo "$REPO" --body-file - <<EOF
          ## Zero-development-blocker audit

          Exact head \`${{ steps.head.outputs.sha }}\` passed:

          - protected Rust workflow \`${{ steps.checks.outputs.rust_id }}\` — success
          - protected repository workflow \`${{ steps.checks.outputs.node_id }}\` — success
          - no open issue titled \`P0:\` or \`P1:\`
          - no temporary closure transport or self-applying workflow on the PR branch
          - no TODO/FIXME/\`todo!\`/\`unimplemented!\` in the Rust broker/runtime and source-status documentation
          - all durable gate, read-only DB preflight, authority-source, listener,
            service, maintenance, systemd and installed-drill artifacts are present
          - qualification fixture scripts pass portable syntax and boundary checks

          Remaining open records are external qualification gates:

          $list

          Result: **zero remaining repository-development blocker in PR #16**.
          The PR remains Draft and grants no live-provider, credential, campaign,
          release or submission authority.
          EOF
