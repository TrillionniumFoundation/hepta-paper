name: authority-set-crypto-hardening-once

on:
  push:
    branches:
      - codex/rust-final-gap-closure-20260830
    paths:
      - '.github/workflows/authority-set-crypto-hardening-once.yml'

permissions:
  contents: write

concurrency:
  group: authority-set-crypto-hardening-once
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/rust-plan-v3-final-product-20260830
  EXPECTED_HEAD: 7d0660be80b119251c2313e59965a4df9625c34b

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out immutable helper source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: helper
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact product head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 7d0660be80b119251c2313e59965a4df9625c34b
          path: product
          fetch-depth: 2
          persist-credentials: true

      - name: Install exact Rust toolchain
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -m py_compile ../helper/.github/one-shot/harden_authority_set_crypto.py
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Apply and validate cryptographic hardening
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          python3 ../helper/.github/one-shot/harden_authority_set_crypto.py
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          mapfile -t expected < <(printf '%s\n' \
            .github/workflows/rust-plan-v3-external-contracts.yml \
            docs/rust/qualification/EXTERNAL_QUALIFICATION_CLOSURE.md \
            docs/rust/qualification/PLAN_V3_EXTERNAL_GAP_EXECUTION.md \
            docs/rust/qualification/external-authority-set-v1.schema.json \
            rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs \
            rust/crates/hepta-qualification-ingest/src/lib.rs \
            rust/crates/hepta-qualification-ingest/src/package_payload.rs \
            | sort)
          printf '%s\n' '--- expected files ---'
          printf '%s\n' "${expected[@]}"
          printf '%s\n' '--- actual files ---'
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")

          python3 - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path(
              'docs/rust/qualification/external-authority-set-v1.schema.json'
          ).read_text(encoding='utf-8'))
          assert schema['$defs']['signature'] == {
              'type': 'string',
              'pattern': '^[A-Za-z0-9_-]{86}$',
          }
          source = Path(
              'rust/crates/hepta-qualification-ingest/src/package_payload.rs'
          ).read_text(encoding='utf-8')
          for required in [
              'HeptaExternalAuthoritySetSubjectV1',
              'HeptaExternalAuthorityReceiptV1',
              'HeptaExternalAuthoritySetReviewV1',
              'verify_authority_signature_v1',
              'current_time_window(',
              'trust_generation',
              'SignatureInvalid',
          ]:
              assert required in source, required
          PY

          cargo test --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --lib --bins --all-features --locked -- \
            -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Commit only validated product files
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/rust-plan-v3-external-contracts.yml \
            docs/rust/qualification/EXTERNAL_QUALIFICATION_CLOSURE.md \
            docs/rust/qualification/PLAN_V3_EXTERNAL_GAP_EXECUTION.md \
            docs/rust/qualification/external-authority-set-v1.schema.json \
            rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs \
            rust/crates/hepta-qualification-ingest/src/lib.rs \
            rust/crates/hepta-qualification-ingest/src/package_payload.rs
          git diff --cached --check
          git commit -m 'fix(qualification): verify nested irreversible-authority signatures'
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_HEAD"
          git push origin "HEAD:$TARGET_BRANCH"
