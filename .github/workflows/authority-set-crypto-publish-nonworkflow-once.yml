name: authority-set-crypto-publish-nonworkflow-once

on:
  push:
    branches:
      - codex/rust-final-gap-closure-20260830
    paths:
      - '.github/workflows/authority-set-crypto-publish-nonworkflow-once.yml'

permissions:
  contents: write

concurrency:
  group: authority-set-crypto-publish-nonworkflow-once
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/rust-plan-v3-final-product-20260830
  EXPECTED_HEAD: 7d0660be80b119251c2313e59965a4df9625c34b

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out immutable helper source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: helper
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact product head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 7d0660be80b119251c2313e59965a4df9625c34b
          path: product
          fetch-depth: 2
          persist-credentials: true

      - name: Install exact Rust toolchain
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -m py_compile ../helper/.github/one-shot/harden_authority_set_crypto.py
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Reproduce and validate the exact hardening set
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          python3 ../helper/.github/one-shot/harden_authority_set_crypto.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/hepta-qualification-ingest/src/package_payload.rs')
          text = path.read_text(encoding='utf-8')
          old = (
              '    QualificationPackageIdV1, QualificationSubjectV1, '
              'QualificationTrustStoreV1,\n};\n'
          )
          new = (
              '    QualificationPackageIdV1, QualificationSubjectV1, '
              'QualificationTrustStoreV1, valid_git_hash,\n};\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'valid_git_hash import anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          mapfile -t expected < <(printf '%s\n' \
            .github/workflows/rust-plan-v3-external-contracts.yml \
            docs/rust/qualification/EXTERNAL_QUALIFICATION_CLOSURE.md \
            docs/rust/qualification/PLAN_V3_EXTERNAL_GAP_EXECUTION.md \
            docs/rust/qualification/external-authority-set-v1.schema.json \
            rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs \
            rust/crates/hepta-qualification-ingest/src/lib.rs \
            rust/crates/hepta-qualification-ingest/src/package_payload.rs \
            | sort)
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")

          cargo test --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --lib --bins --all-features --locked -- \
            -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

          cp .github/workflows/rust-plan-v3-external-contracts.yml \
            "$RUNNER_TEMP/rust-plan-v3-external-contracts.yml"
          sha256sum "$RUNNER_TEMP/rust-plan-v3-external-contracts.yml" \
            | tee "$RUNNER_TEMP/workflow.sha256"

      - name: Commit only validated non-workflow product files
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/rust/qualification/EXTERNAL_QUALIFICATION_CLOSURE.md \
            docs/rust/qualification/PLAN_V3_EXTERNAL_GAP_EXECUTION.md \
            docs/rust/qualification/external-authority-set-v1.schema.json \
            rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs \
            rust/crates/hepta-qualification-ingest/src/lib.rs \
            rust/crates/hepta-qualification-ingest/src/package_payload.rs
          git diff --cached --check
          git commit -m 'fix(qualification): verify nested irreversible-authority signatures'
          test "$(git diff --name-only)" = '.github/workflows/rust-plan-v3-external-contracts.yml'
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_HEAD"
          git push origin "HEAD:$TARGET_BRANCH"
