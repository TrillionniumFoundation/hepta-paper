name: bootstrap-formal-cache-fix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'codex/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Remove invalid Docker tar cache blocks
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          source = path.read_text(encoding='utf-8')
          tar_path = '            .ci-cache/formal-sandbox-alpine.tar\n'
          load_block = '''          if [ -s .ci-cache/formal-sandbox-alpine.tar ]; then
            docker load --input .ci-cache/formal-sandbox-alpine.tar
          fi
'''
          save_block = '''          if [ ! -s .ci-cache/formal-sandbox-alpine.tar ]; then
            docker save alpine:3.20 --output .ci-cache/formal-sandbox-alpine.tar
          fi
'''
          observed = (
              source.count(tar_path),
              source.count(load_block),
              source.count(save_block),
          )
          if observed != (3, 3, 3):
              raise SystemExit(f'unexpected formal cache shape: {observed}')
          source = source.replace(tar_path, '')
          source = source.replace(load_block, '')
          source = source.replace(save_block, '')
          if 'formal-sandbox-alpine.tar' in source or 'docker save alpine:3.20' in source:
              raise SystemExit('formal image tar cache residue remains')
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/ci.yml
          git commit -m 'ci: pull formal sandbox by immutable digest'
          git push origin "HEAD:$HEAD_BRANCH"
