name: branch-ci-target-builder

on:
  push:
    branches:
      - codex/docs-gap-closure-20260902
    paths:
      - .github/workflows/branch-ci-target-builder.yml

permissions:
  contents: write

jobs:
  build-target:
    if: github.repository == 'TrillionniumFoundation/hepta-paper'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/docs-gap-closure-20260902
          fetch-depth: 0
      - name: Build and publish the exact reviewed CI target as a regular blob
        run: |
          set -euo pipefail
          cp .github/workflows/ci.yml ci-target.yml
          cat > "$RUNNER_TEMP/ci-target.patch" <<'PATCH'
          --- a/ci-target.yml
          +++ b/ci-target.yml
          @@ -33,8 +33,27 @@
                    sudo apt-get update
                    sudo apt-get install -y sqlite3
                    npm ci --ignore-scripts --no-audit --no-fund
          +          test "$(node --version)" = "v22.23.1"
          +          test "$(npm --version)" = "10.9.8"
          +          strict_node_source="$(command -v node)"
          +          strict_npm_source="$(npm root -g)/npm"
          +          test -f "$strict_node_source"
          +          test -f "$strict_npm_source/bin/npm-cli.js"
          +          sudo install -o root -g root -m 0555 "$strict_node_source" /usr/bin/node
          +          sudo rm -rf -- /usr/lib/node_modules/npm
          +          sudo install -d -o root -g root -m 0755 /usr/lib/node_modules
          +          sudo cp -a -- "$strict_npm_source" /usr/lib/node_modules/npm
          +          sudo chown -hR root:root /usr/lib/node_modules/npm
          +          sudo find /usr/lib/node_modules/npm -xdev -type f -perm /111 -exec chmod 0555 {} +
          +          sudo find /usr/lib/node_modules/npm -xdev -type f ! -perm /111 -exec chmod 0444 {} +
          +          sudo find /usr/lib/node_modules/npm -xdev -type d -exec chmod 0555 {} +
          +          sudo test "$(readlink -f /usr/bin/node)" = /usr/bin/node
          +          sudo test "$(readlink -f /usr/lib/node_modules/npm/bin/npm-cli.js)" = /usr/lib/node_modules/npm/bin/npm-cli.js
                - name: Run static and architecture gates
          -        run: npm run static:check && npm run security:npm-audit
          +        run: |
          +          npm run static:check
          +          npm_execpath=/usr/lib/node_modules/npm/bin/npm-cli.js \
          +            /usr/bin/node paper-core/bin/strict-npm-audit.mjs
          
            pull-request-impacted-tests:
              if: github.event_name == 'pull_request'
          @@ -169,8 +188,27 @@
                    sudo apt-get update
                    sudo apt-get install -y sqlite3
                    npm ci --ignore-scripts --no-audit --no-fund
          +          test "$(node --version)" = "v22.23.1"
          +          test "$(npm --version)" = "10.9.8"
          +          strict_node_source="$(command -v node)"
          +          strict_npm_source="$(npm root -g)/npm"
          +          test -f "$strict_node_source"
          +          test -f "$strict_npm_source/bin/npm-cli.js"
          +          sudo install -o root -g root -m 0555 "$strict_node_source" /usr/bin/node
          +          sudo rm -rf -- /usr/lib/node_modules/npm
          +          sudo install -d -o root -g root -m 0755 /usr/lib/node_modules
          +          sudo cp -a -- "$strict_npm_source" /usr/lib/node_modules/npm
          +          sudo chown -hR root:root /usr/lib/node_modules/npm
          +          sudo find /usr/lib/node_modules/npm -xdev -type f -perm /111 -exec chmod 0555 {} +
          +          sudo find /usr/lib/node_modules/npm -xdev -type f ! -perm /111 -exec chmod 0444 {} +
          +          sudo find /usr/lib/node_modules/npm -xdev -type d -exec chmod 0555 {} +
          +          sudo test "$(readlink -f /usr/bin/node)" = /usr/bin/node
          +          sudo test "$(readlink -f /usr/lib/node_modules/npm/bin/npm-cli.js)" = /usr/lib/node_modules/npm/bin/npm-cli.js
                - name: Run full portable contract gates
          -        run: npm run security:npm-audit && npm run ci:selftest
          +        run: |
          +          npm_execpath=/usr/lib/node_modules/npm/bin/npm-cli.js \
          +            /usr/bin/node paper-core/bin/strict-npm-audit.mjs
          +          npm run ci:selftest
          
            legacy-differential-policy:
              if: github.event_name == 'pull_request' || github.event_name == 'push'
          @@ -331,10 +369,29 @@
                    sudo apt-get update
                    sudo apt-get install -y sqlite3
                    npm ci --ignore-scripts --no-audit --no-fund
          +          test "$(node --version)" = "v22.23.1"
          +          test "$(npm --version)" = "10.9.8"
          +          strict_node_source="$(command -v node)"
          +          strict_npm_source="$(npm root -g)/npm"
          +          test -f "$strict_node_source"
          +          test -f "$strict_npm_source/bin/npm-cli.js"
          +          sudo install -o root -g root -m 0555 "$strict_node_source" /usr/bin/node
          +          sudo rm -rf -- /usr/lib/node_modules/npm
          +          sudo install -d -o root -g root -m 0755 /usr/lib/node_modules
          +          sudo cp -a -- "$strict_npm_source" /usr/lib/node_modules/npm
          +          sudo chown -hR root:root /usr/lib/node_modules/npm
          +          sudo find /usr/lib/node_modules/npm -xdev -type f -perm /111 -exec chmod 0555 {} +
          +          sudo find /usr/lib/node_modules/npm -xdev -type f ! -perm /111 -exec chmod 0444 {} +
          +          sudo find /usr/lib/node_modules/npm -xdev -type d -exec chmod 0555 {} +
          +          sudo test "$(readlink -f /usr/bin/node)" = /usr/bin/node
          +          sudo test "$(readlink -f /usr/lib/node_modules/npm/bin/npm-cli.js)" = /usr/lib/node_modules/npm/bin/npm-cli.js
                - name: Verify or populate pinned Mathlib cache
                  run: npm run ci:mathlib-cache
                - name: Run full portable qualification
          -        run: npm run security:npm-audit && npm run ci:selftest
          +        run: |
          +          npm_execpath=/usr/lib/node_modules/npm/bin/npm-cli.js \
          +            /usr/bin/node paper-core/bin/strict-npm-audit.mjs
          +          npm run ci:selftest
                - name: Enforce architecture and repository-wide coverage
                  run: npm run coverage:architecture && npm run coverage:repository
                - name: Run real Python and R academic original plus replay
          PATCH
          git apply --check "$RUNNER_TEMP/ci-target.patch"
          git apply "$RUNNER_TEMP/ci-target.patch"
          test "$(git hash-object ci-target.yml)" = d1f7c5c358ab463fd5a459fa6a3ecc09032b6574
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-target.yml
          git commit -m 'chore(ci): publish reviewed workflow target blob'
          git push origin HEAD:refs/heads/codex/docs-gap-closure-20260902
