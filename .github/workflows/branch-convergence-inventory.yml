name: branch-convergence-inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-convergence-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-branch-inventory:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout exact source with full public history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test audit and observation bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 -B docs/tools/test_branch_convergence.py
          python3 -B docs/tools/test_branch_observation.py

      - name: Capture every public branch and exact two-tree changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          evidence="$RUNNER_TEMP/branch-convergence"
          mkdir -p "$evidence"
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$evidence/started-at.txt"
          git remote get-url origin > "$evidence/remote.txt"
          git ls-remote --heads origin | LC_ALL=C sort > "$evidence/heads-before.tsv"
          git fetch --no-tags --no-recurse-submodules --prune origin \
            '+refs/heads/*:refs/remotes/origin/*'
          python3 -B docs/tools/audit-branch-convergence.py \
            --candidate "$EXPECTED_HEAD_SHA" > "$evidence/audit.json"
          git ls-remote --heads origin | LC_ALL=C sort > "$evidence/heads-after.tsv"
          python3 -B docs/tools/bind-branch-observation.py \
            --before "$evidence/heads-before.tsv" --after "$evidence/heads-after.tsv" \
            --audit "$evidence/audit.json" --commit "$EXPECTED_HEAD_SHA" \
            --branch "$EXPECTED_HEAD_REF" > "$evidence/capture-binding.json"
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$evidence/finished-at.txt"
          printf '%s\n' "$EXPECTED_HEAD_SHA" > "$evidence/commit.txt"
          git rev-parse HEAD^{tree} > "$evidence/tree.txt"
          git diff --exit-code
          git diff --cached --exit-code
          (cd "$evidence" && sha256sum -- *.json *.tsv *.txt > SHA256SUMS)

      - name: Retain inventory, never grant branch dispositions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branch-convergence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/branch-convergence
          if-no-files-found: warn
          retention-days: 30
