name: branch-exact-head-assertion-builder

on:
  push:
    branches:
      - codex/docs-gap-closure-20260902
    paths:
      - .github/workflows/branch-exact-head-assertion-builder.yml

permissions:
  contents: write

jobs:
  publish-target:
    if: github.repository == 'TrillionniumFoundation/hepta-paper'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/docs-gap-closure-20260902
          fetch-depth: 0
      - name: Publish corrected exact-head workflow as a regular blob
        shell: bash
        run: |
          set -euo pipefail
          test ! -e exact-head-target.yml
          cp .github/workflows/exact-head-source-validation.yml exact-head-target.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('exact-head-target.yml')
          text = path.read_text(encoding='utf-8')
          old = "if(!p.fullFallback||p.selectedTestCount!==p.totalTestCount)"
          new = "if(p.selectionStatus!=='test_impact_selection_full_fallback'||p.selectedTestCount!==p.totalTestCount)"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'exact_head_assertion_count:{count}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check -- exact-head-target.yml
          test "$(git status --short)" = '?? exact-head-target.yml'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add exact-head-target.yml
          git commit -m 'chore(ci): publish corrected exact-head workflow target'
          git push origin HEAD:refs/heads/codex/docs-gap-closure-20260902
