name: branch-exact-head-diagnostics-builder

on:
  push:
    branches:
      - codex/docs-gap-closure-20260902
    paths:
      - .github/workflows/branch-exact-head-diagnostics-builder.yml

permissions:
  contents: write

jobs:
  publish-target:
    if: github.repository == 'TrillionniumFoundation/hepta-paper'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/docs-gap-closure-20260902
          fetch-depth: 0
      - name: Publish bounded-diagnostics workflow as a regular blob
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/exact-head-source-validation.yml exact-head-diagnostics-target.yml
          python3 - <<'PY'
          from pathlib import Path

          path = Path('exact-head-diagnostics-target.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = '      - name: Run complete exact-head shard\n'
          end_marker = '      - name: Prove exact source identity after shard\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          shard = '${' + '{ matrix.shard }}'
          replacement = '''      - name: Run complete exact-head shard with bounded failure diagnostics
                  shell: bash
                  run: |
                    set -uo pipefail
                    log="$RUNNER_TEMP/exact-head-shard-__SHARD__.tap"
                    set +e
                    npm run test:impacted -- \\
                      --changed-file package.json \\
                      --shard-count 4 \\
                      --shard-index "__SHARD__" >"$log" 2>&1
                    status=$?
                    set -e
                    if [ "$status" -eq 0 ]; then
                      tail -n 40 "$log"
                    else
                      echo "exact_head_shard=__SHARD__ status=$status"
                      grep -E -B 2 -A 25 'not ok|failureType:|location:|error:|code:|expected:|actual:|operator:|MODULE_NOT_FOUND|ENOENT|workspace_layout_|runtime_reproducibility_|worker_runtime_' "$log" \\
                        | head -n 2500 || true
                      echo '--- terminal summary ---'
                      tail -n 120 "$log" \\
                        | grep -E '# (tests|pass|fail|cancelled|skipped|todo|duration_ms)\\b' || true
                    fi
                    exit "$status"
          '''.replace('__SHARD__', shard)
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8', newline='\n')
          PY
          git diff --check -- exact-head-diagnostics-target.yml
          if git diff --quiet -- exact-head-diagnostics-target.yml; then
            echo 'diagnostics target did not change' >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add exact-head-diagnostics-target.yml
          git commit -m 'chore(ci): publish valid bounded exact-head diagnostics target'
          git push origin HEAD:refs/heads/codex/docs-gap-closure-20260902
