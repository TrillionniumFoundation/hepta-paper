name: hepta-paper-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

env:
  ELAN_TOOLCHAIN: leanprover/lean4:v4.30.0
  FORMAL_SANDBOX_IMAGE: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc

jobs:
  pull-request-static-gates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install static-gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate development documentation
        run: node docs/tools/validate-development-docs.mjs
      - name: Run static and architecture gates
        run: npm run static:check && npm run security:npm-audit

  pull-request-impacted-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Plan impacted shard
        id: impact
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node paper-core/bin/run-impacted-tests.mjs \
            --base-ref "$GITHUB_BASE_SHA" \
            --head-ref "$GITHUB_SHA" \
            --shard-count 4 \
            --shard-index "${{ matrix.shard }}" \
            --dry-run --json > "$RUNNER_TEMP/impact-plan.json"
          cat "$RUNNER_TEMP/impact-plan.json"
          node -e "const p=require(process.argv[1]);process.stdout.write('count='+p.shardTestCount+'\n')" \
            "$RUNNER_TEMP/impact-plan.json" >> "$GITHUB_OUTPUT"
      - name: Restore pinned Lean and formal runtime cache
        if: steps.impact.outputs.count != '0'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-formal-runtime-v4.30.0-d9e853e-${{ hashFiles('paper-domain/research/formal-verifier-policy.mjs', 'paper-adapters/research-verify/pinned-formal-sandbox-runtime-configuration.mjs') }}
      - name: Materialize pinned Lean and formal runtime
        if: steps.impact.outputs.count != '0'
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -fsSL https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            echo 'df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  /tmp/elan.tar.gz' | sha256sum -c -
            tar -xzf /tmp/elan.tar.gz -C /tmp elan-init
            /tmp/elan-init -y --default-toolchain "$ELAN_TOOLCHAIN"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ELAN_TOOLCHAIN="$ELAN_TOOLCHAIN" "$HOME/.elan/bin/elan" which lake
          if ! docker image inspect "$FORMAL_SANDBOX_IMAGE" >/dev/null 2>&1; then
            docker pull "$FORMAL_SANDBOX_IMAGE"
          fi
          docker image inspect "$FORMAL_SANDBOX_IMAGE" --format '{{json .RepoDigests}}' \
            | grep -F 'sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
      - name: Install selected test dependencies
        if: steps.impact.outputs.count != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Run impacted shard
        if: steps.impact.outputs.count != '0'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run test:impacted -- \
            --base-ref "$GITHUB_BASE_SHA" \
            --head-ref "$GITHUB_SHA" \
            --shard-count 4 \
            --shard-index "${{ matrix.shard }}"

  main-portable-contract-gates:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-formal-runtime-v4.30.0-d9e853e-${{ hashFiles('paper-domain/research/formal-verifier-policy.mjs', 'paper-adapters/research-verify/pinned-formal-sandbox-runtime-configuration.mjs') }}
      - name: Materialize pinned Lean and formal runtime
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -fsSL https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            echo 'df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  /tmp/elan.tar.gz' | sha256sum -c -
            tar -xzf /tmp/elan.tar.gz -C /tmp elan-init
            /tmp/elan-init -y --default-toolchain "$ELAN_TOOLCHAIN"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ELAN_TOOLCHAIN="$ELAN_TOOLCHAIN" "$HOME/.elan/bin/elan" which lake
          if ! docker image inspect "$FORMAL_SANDBOX_IMAGE" >/dev/null 2>&1; then
            docker pull "$FORMAL_SANDBOX_IMAGE"
          fi
          docker image inspect "$FORMAL_SANDBOX_IMAGE" --format '{{json .RepoDigests}}' \
            | grep -F 'sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
      - name: Install portable-gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate development documentation
        run: node docs/tools/validate-development-docs.mjs
      - name: Run full portable contract gates
        run: npm run security:npm-audit && npm run ci:selftest

  legacy-differential-policy:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
      - name: Verify differential tests remain hash-bound in the migration matrix
        run: |
          node --input-type=module - <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const matrix = JSON.parse(fs.readFileSync('migration/legacy-semantic-migration-matrix.json', 'utf8'));
          const required = new Set([
            'migration/tests/p0-production-core-differential.mjs',
            'migration/tests/p1-referee-revision-differential.mjs',
          ]);
          const bound = new Map();
          for (const row of matrix.entries) {
            for (const test of row.behaviorTests || []) {
              if (required.has(test.path)) bound.set(test.path, test.sha256);
            }
          }
          for (const file of required) {
            if (!bound.has(file)) throw new Error(`Missing matrix binding for ${file}`);
            const actual = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if (actual !== bound.get(file)) throw new Error(`Differential test hash drift: ${file}`);
          }
          NODE
      - name: Replay Python to JavaScript differentials from the immutable minimal fixture
        run: npm run legacy:fixture-verify && npm run test:migration-differential

  nightly-operational-research-loop:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Restore pinned Lean and formal runtime cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-formal-runtime-v4.30.0-d9e853e-${{ hashFiles('paper-domain/research/formal-verifier-policy.mjs', 'paper-adapters/research-verify/pinned-formal-sandbox-runtime-configuration.mjs') }}
      - name: Restore verified Mathlib project cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .ci-cache/mathlib-project
          key: ${{ runner.os }}-mathlib-v4.30.0-c5ea003-${{ hashFiles('paper-domain/research/formal-verifier-policy.mjs', 'paper-core/bin/prepare-ci-mathlib-cache.mjs') }}
      - name: Materialize pinned Lean and formal runtime
        run: |
          cached_toolchain="$HOME/.elan/toolchains/leanprover--lean4---v4.30.0"
          if [ -d "$cached_toolchain" ] && [ ! -L "$cached_toolchain" ]; then
            upstream_toolchain="$cached_toolchain"
          else
            bootstrap_root="$RUNNER_TEMP/hepta-elan-bootstrap"
            upstream_elan_home="$RUNNER_TEMP/hepta-elan-upstream"
            install -d -m 0700 "$bootstrap_root"
            test ! -e "$upstream_elan_home"
            curl -fsSL https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz -o "$bootstrap_root/elan.tar.gz"
            echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $bootstrap_root/elan.tar.gz" | sha256sum -c -
            tar -xzf "$bootstrap_root/elan.tar.gz" -C "$bootstrap_root" elan-init
            ELAN_HOME="$upstream_elan_home" "$bootstrap_root/elan-init" \
              -y --no-modify-path --default-toolchain "$ELAN_TOOLCHAIN"
            upstream_toolchain="$upstream_elan_home/toolchains/leanprover--lean4---v4.30.0"
          fi
          HEPTA_CI_UPSTREAM_TOOLCHAIN="$upstream_toolchain" \
            node --input-type=module - <<'NODE'
          import path from 'node:path';
          import { inspectLeanToolchainRootContent } from './paper-adapters/research-verify/lean-toolchain-identity.mjs';
          import {
            PRODUCTION_LEAN_TOOLCHAIN,
            PRODUCTION_LEAN_UPSTREAM_TOOLCHAIN_ROOT_MERKLE_HASHES,
          } from './paper-domain/research/formal-verifier-policy.mjs';
          const root = path.resolve(process.env.HEPTA_CI_UPSTREAM_TOOLCHAIN || '');
          const expected = PRODUCTION_LEAN_UPSTREAM_TOOLCHAIN_ROOT_MERKLE_HASHES[
            PRODUCTION_LEAN_TOOLCHAIN
          ];
          const identity = inspectLeanToolchainRootContent({
            toolchain: PRODUCTION_LEAN_TOOLCHAIN,
            toolchainRoot: root,
            lakeExecutable: path.join(root, 'bin/lake'),
            leanExecutable: path.join(root, 'bin/lean'),
            expectedToolchainRootMerkleHash: expected,
            forbidGroupOrOtherWrite: true,
            forceContentRehash: true,
          });
          if (identity.status !== 'lean_toolchain_root_content_verified'
            || identity.toolchainRootMerkleHash !== expected) {
            throw new Error(`upstream_ci_lean_toolchain_invalid:${
              identity.blockers?.join(',') || identity.status
            }`);
          }
          NODE
          sealed_elan_home=/opt/hepta-paper/elan
          sealed_toolchain="$sealed_elan_home/toolchains/leanprover--lean4---v4.30.0"
          sudo test ! -e "$sealed_elan_home"
          sudo install -d -o root -g root -m 0755 "$sealed_elan_home/toolchains"
          sudo cp -RP -- "$upstream_toolchain" "$sealed_toolchain"
          sudo chown -hR root:root "$sealed_elan_home"
          sudo /usr/bin/python3 -I - "$sealed_elan_home" <<'PY'
          import os
          import stat
          import sys
          stack = [sys.argv[1]]
          while stack:
              selected = stack.pop()
              for attribute in os.listxattr(selected, follow_symlinks=False):
                  os.removexattr(selected, attribute, follow_symlinks=False)
              if stat.S_ISDIR(os.lstat(selected).st_mode):
                  with os.scandir(selected) as entries:
                      stack.extend(entry.path for entry in entries)
          PY
          sudo find "$sealed_toolchain" -xdev -type f ! -perm /111 -exec chmod 0444 {} +
          sudo find "$sealed_toolchain" -xdev -type f -perm /111 -exec chmod 0555 {} +
          sudo find "$sealed_toolchain" -xdev -type d -exec chmod 0555 {} +
          sudo chmod 0555 "$sealed_elan_home" "$sealed_elan_home/toolchains"
          ELAN_HOME="$sealed_elan_home" node --input-type=module - <<'NODE'
          import { resolvePinnedLakeExecutable } from './paper-adapters/research-verify/pinned-lake-executable-resolver.mjs';
          const result = resolvePinnedLakeExecutable({
            environment: process.env,
            forceContentRehash: true,
          });
          if (result.status !== 'formal_pinned_lake_resolved') {
            throw new Error(`sealed_ci_lean_toolchain_invalid:${result.blockers.join(',')}`);
          }
          process.stdout.write(`${result.toolchainIdentity.toolchainRootMerkleHash}\n`);
          NODE
          echo "ELAN_HOME=$sealed_elan_home" >> "$GITHUB_ENV"
          mkdir -p .ci-cache
          if ! docker image inspect "$FORMAL_SANDBOX_IMAGE" >/dev/null 2>&1; then
            docker pull "$FORMAL_SANDBOX_IMAGE"
          fi
          docker image inspect "$FORMAL_SANDBOX_IMAGE" --format '{{json .RepoDigests}}' \
            | grep -F 'sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
      - name: Install nightly dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify or populate pinned Mathlib cache
        run: npm run ci:mathlib-cache
      - name: Run full portable qualification
        run: npm run security:npm-audit && npm run ci:selftest
      - name: Enforce architecture and repository-wide coverage
        run: npm run coverage:architecture && npm run coverage:repository
      - name: Run real Python and R academic original plus replay
        run: npm run test:academic-docker-operational
      - name: Run process-isolated typed numeric oracle recomputation
        run: npm run test:typed-numeric-process-operational
      - name: Run unified zero-skip formal operational gate
        run: npm run test:dynamic-formal-kernel-operational
      - name: Recheck topology budget closure and architecture capabilities
        run: node --test --test-concurrency=1 paper-core/tests/autonomous-research-resource-budget-closure.test.mjs paper-core/tests/architecture-conformance.test.mjs
