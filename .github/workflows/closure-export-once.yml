name: closure-export-once

on:
  push:
    branches:
      - codex/rust-native-business-workers-20260908
    paths:
      - .github/workflows/closure-export-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v5
        with:
          ref: codex/rust-native-business-workers-20260908
          fetch-depth: 0
      - name: Export the verified closure API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("rust/crates/hepta-qualification-ingest/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          before = "mod package_payload;\n\npub use package_payload::{"
          after = """mod closure;
          mod package_payload;

          pub use closure::{
              ExternalQualificationCandidateV1, ExternalQualificationClosureSubjectV1,
              ExternalQualificationRuntimeFactsV1, QualificationClosureError,
              VerifiedExternalQualificationClosureV1, verify_external_qualification_closure_v1,
          };

          pub use package_payload::{"""
          if "mod closure;" in text:
              raise SystemExit("closure export already present")
          if before not in text:
              raise SystemExit("expected library anchor not found")
          path.write_text(text.replace(before, after, 1), encoding="utf-8")
          PY
          git diff --check
          git diff -- rust/crates/hepta-qualification-ingest/src/lib.rs
      - name: Commit the exact source edit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-paper-automation"
          git config user.email "hepta-paper-automation@users.noreply.github.com"
          git add rust/crates/hepta-qualification-ingest/src/lib.rs
          git commit -m "feat(rust): export verified qualification closure"
          git push origin HEAD:codex/rust-native-business-workers-20260908
