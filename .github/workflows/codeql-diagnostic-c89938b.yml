name: codeql-diagnostic-c89938b

on:
  push:
    branches:
      - codex/codeql-diagnostic-c89938b-20260909

permissions:
  contents: read

concurrency:
  group: codeql-diagnostic-c89938b
  cancel-in-progress: false

jobs:
  javascript:
    name: JavaScript security-extended SARIF
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact PR subject without persistent credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: c89938bf9ce90aac520baba4cfd05d665f6676f7
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize pinned CodeQL security-extended query suite
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze without publishing a security decision
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          output: ${{ runner.temp }}/codeql-results
          post-processed-sarif-path: ${{ runner.temp }}/codeql-post-processed
          upload: never
          upload-database: false

      - name: Print compact SARIF findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("${{ runner.temp }}")
          rows = []
          for path in sorted(root.rglob("*.sarif")):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              for run in data.get("runs", []):
                  rules = {r.get("id"): r for r in (run.get("tool", {}).get("driver", {}).get("rules", []) or [])}
                  for result in run.get("results", []) or []:
                      loc = (result.get("locations") or [{}])[0].get("physicalLocation", {})
                      region = loc.get("region", {})
                      rule = rules.get(result.get("ruleId"), {})
                      props = rule.get("properties", {})
                      rows.append({
                          "rule": result.get("ruleId"),
                          "path": loc.get("artifactLocation", {}).get("uri"),
                          "line": region.get("startLine"),
                          "message": result.get("message", {}).get("text"),
                          "level": result.get("level") or rule.get("defaultConfiguration", {}).get("level"),
                          "securitySeverity": props.get("security-severity"),
                          "fingerprints": result.get("partialFingerprints", {}),
                      })
          seen = set()
          unique = []
          for row in rows:
              key = json.dumps(row, sort_keys=True)
              if key not in seen:
                  seen.add(key)
                  unique.append(row)
          print("CODEQL_FINDINGS_BEGIN")
          print(json.dumps(unique, sort_keys=True, separators=(",", ":")))
          print("CODEQL_FINDINGS_END")
          PY

      - name: Retain security-extended diagnostic SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codeql-security-extended-diagnostic-c89938b-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codeql-results
            ${{ runner.temp }}/codeql-post-processed
          if-no-files-found: error
          retention-days: 14
