name: deployment-proof-once

on:
  push:
    branches:
      - codex/rust-native-business-workers-20260908
    paths:
      - .github/workflows/deployment-proof-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-native-business-workers-20260908
          fetch-depth: 0
      - name: Install pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
      - name: Apply reviewed Node-free deployment patch
        shell: bash
        env:
          PATCH_GZIP_BASE64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZIP_BASE64" | base64 -d | gzip -d | git apply --index
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
      - name: Commit exact deployment proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-paper-automation"
          git config user.email "hepta-paper-automation@users.noreply.github.com"
          git add rust/crates/hepta-paper-service/src/deployment.rs \
            rust/crates/hepta-paper-service/src/lib.rs \
            rust/crates/hepta-paper-service/src/production.rs
          git commit -m "feat(rust): bind production to node-free deployment"
          git push origin HEAD:codex/rust-native-business-workers-20260908
