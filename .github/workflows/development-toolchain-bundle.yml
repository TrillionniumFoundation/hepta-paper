name: development-lint-dependency-bundle
on:
  push:
    branches: [codex/rust-delivery-implementation-20260913]
    paths: [.github/workflows/development-toolchain-bundle.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Export public locked lint dependencies only
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.1"
          npm ci --ignore-scripts --no-audit --no-fund
          root=/tmp/hepta-lint-dependencies
          mkdir -p "$root"
          cp -a node_modules "$root/node_modules"
          sha256sum package.json package-lock.json > "$root/locks.sha256"
          npm --version > "$root/npm-version.txt"
          printf '%s\n' 'Public locked development dependencies only; no source qualification, provider, production, writer transfer or Node retirement claim.' > "$root/SCOPE.txt"
          tar -czf /tmp/hepta-lint-dependencies.tar.gz -C "$root" .
          sha256sum /tmp/hepta-lint-dependencies.tar.gz > /tmp/hepta-lint-dependencies.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-lint-dependencies-${{ github.sha }}
          path: |
            /tmp/hepta-lint-dependencies.tar.gz
            /tmp/hepta-lint-dependencies.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
