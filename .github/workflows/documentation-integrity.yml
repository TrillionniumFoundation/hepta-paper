name: documentation-integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
      - name: Verify documentation structure, coverage, and links
        run: node paper-core/verification/documentation-integrity.mjs
      - name: Run documentation and impact-selection integrity tests
        run: >-
          node --test --test-concurrency=1
          paper-core/tests/documentation-integrity.test.mjs
          paper-core/tests/test-impact-graph.test.mjs
