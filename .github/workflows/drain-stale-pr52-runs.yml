name: drain-stale-pr52-runs

on:
  push:
    branches:
      - ops/ci-queue-drain-pr52-20260904

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: drain-stale-pr52-runs
  cancel-in-progress: true

jobs:
  drain:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      TARGET_PR: '52'
      TARGET_BRANCH: codex/global-plan-final-gap-closure-20260902
      KEEP_SHA: 99ac57e2982afab20e9fa939b842776aefc922eb
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prove immutable cleanup scope
        shell: bash
        run: |
          set -euo pipefail
          actual_pr_head="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}" --jq '.head.sha')"
          actual_branch_head="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')"
          test "$actual_pr_head" = "$KEEP_SHA"
          test "$actual_branch_head" = "$KEEP_SHA"

      - name: Cancel only stale non-terminal runs
        id: cancel
        shell: bash
        run: |
          set -euo pipefail
          runs_file="$RUNNER_TEMP/target-runs.jsons"
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100" \
            > "$runs_file"

          mapfile -t stale_ids < <(
            jq -r --arg keep "$KEEP_SHA" '
              .workflow_runs[]
              | select(.head_sha != $keep and .status != "completed")
              | .id
            ' "$runs_file" | sort -nu
          )

          cancelled=0
          already_terminal=0
          for run_id in "${stale_ids[@]}"; do
            run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            run_head="$(jq -r '.head_sha' <<<"$run_json")"
            run_status="$(jq -r '.status' <<<"$run_json")"
            test "$run_head" != "$KEEP_SHA"
            if [ "$run_status" = completed ]; then
              already_terminal=$((already_terminal + 1))
              continue
            fi
            if gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
              >/dev/null; then
              cancelled=$((cancelled + 1))
            else
              post_status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
              test "$post_status" = completed
              already_terminal=$((already_terminal + 1))
            fi
          done

          {
            echo "cancelled=$cancelled"
            echo "already_terminal=$already_terminal"
            echo "preserved_head=$KEEP_SHA"
          } | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

      - name: Verify current-head runs were preserved
        shell: bash
        run: |
          set -euo pipefail
          current_count="$(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"${KEEP_SHA}\") | .id" \
              | sort -nu | wc -l
          )"
          test "$current_count" -ge 15
          echo "preserved current-head workflow runs: $current_count" | tee -a "$GITHUB_STEP_SUMMARY"
