name: drain-stale-pr52-runs

on:
  push:
    branches:
      - ops/ci-queue-drain-pr52-20260904

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: drain-stale-pr52-runs
  cancel-in-progress: true

jobs:
  drain:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      TARGET_PR: '52'
      TARGET_BRANCH: codex/global-plan-final-gap-closure-20260902
      KEEP_SHA: 99ac57e2982afab20e9fa939b842776aefc922eb
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prove immutable cleanup scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $actualPrHead = gh api "/repos/$env:GITHUB_REPOSITORY/pulls/$env:TARGET_PR" --jq '.head.sha'
          if ($LASTEXITCODE -ne 0) { throw 'failed to read PR head' }
          $actualBranchHead = gh api "/repos/$env:GITHUB_REPOSITORY/git/ref/heads/$env:TARGET_BRANCH" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'failed to read branch head' }
          if ($actualPrHead.Trim() -ne $env:KEEP_SHA) { throw "PR head moved: $actualPrHead" }
          if ($actualBranchHead.Trim() -ne $env:KEEP_SHA) { throw "branch head moved: $actualBranchHead" }

      - name: Cancel only stale non-terminal runs
        id: cancel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Get-Run([long]$RunId) {
            $raw = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$RunId"
            if ($LASTEXITCODE -ne 0) { throw "failed to read run $RunId" }
            return $raw | ConvertFrom-Json
          }

          $allRuns = @()
          $page = 1
          do {
            $raw = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs?branch=$env:TARGET_BRANCH&per_page=100&page=$page"
            if ($LASTEXITCODE -ne 0) { throw "failed to list page $page" }
            $pageData = $raw | ConvertFrom-Json
            $batch = @($pageData.workflow_runs)
            $allRuns += $batch
            $page += 1
          } while ($batch.Count -eq 100)

          $stale = @(
            $allRuns |
              Where-Object { $_.head_sha -ne $env:KEEP_SHA -and $_.status -ne 'completed' } |
              Sort-Object id -Unique
          )

          $cancelled = 0
          $alreadyTerminal = 0
          foreach ($candidate in $stale) {
            $fresh = Get-Run -RunId ([long]$candidate.id)
            if ($fresh.head_sha -eq $env:KEEP_SHA) { throw "refusing to cancel preserved run $($fresh.id)" }
            if ($fresh.status -eq 'completed') {
              $alreadyTerminal += 1
              continue
            }

            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$env:GITHUB_REPOSITORY/actions/runs/$($fresh.id)/cancel" | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $cancelled += 1
            } else {
              $post = Get-Run -RunId ([long]$fresh.id)
              if ($post.status -ne 'completed') { throw "failed to cancel run $($fresh.id)" }
              $alreadyTerminal += 1
            }
          }

          "cancelled=$cancelled" | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          "already_terminal=$alreadyTerminal" | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          "preserved_head=$env:KEEP_SHA" | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          "cancelled=$cancelled`nalready_terminal=$alreadyTerminal`npreserved_head=$env:KEEP_SHA" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Verify current-head runs were preserved
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $currentIds = @()
          $page = 1
          do {
            $raw = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs?branch=$env:TARGET_BRANCH&per_page=100&page=$page"
            if ($LASTEXITCODE -ne 0) { throw "failed to verify page $page" }
            $pageData = $raw | ConvertFrom-Json
            $batch = @($pageData.workflow_runs)
            $currentIds += @($batch | Where-Object { $_.head_sha -eq $env:KEEP_SHA } | ForEach-Object { $_.id })
            $page += 1
          } while ($batch.Count -eq 100)
          $currentCount = @($currentIds | Sort-Object -Unique).Count
          if ($currentCount -lt 15) { throw "only $currentCount current-head runs remain" }
          "preserved current-head workflow runs: $currentCount" |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
