name: export-current-pr16-source-v3

on:
  push:
    branches:
      - codex/current-source-export-20260829-v2
    paths:
      - .github/workflows/export-current-pr16-source-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current PR 16 exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: e16badd21c1d02334e5046bae12ed9afeb6b0def
          fetch-depth: 0
          submodules: false
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e16badd21c1d02334e5046bae12ed9afeb6b0def
          git status --porcelain=v1
          git archive --format=tar.gz --output="$RUNNER_TEMP/hepta-pr16-e16badd.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/hepta-pr16-e16badd.tar.gz"
      - name: Upload exact source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hepta-pr16-e16badd-source
          path: ${{ runner.temp }}/hepta-pr16-e16badd.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
