name: export-pr16-exact-source

on:
  push:
    branches:
      - codex/current-source-export-20260829-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 0c74ce74135b22a64c45b110b0d04a68aff6a0b3
          fetch-depth: 1
          submodules: false

      - name: Verify and archive exact tree
        shell: bash
        run: |
          set -euo pipefail
          expected=0c74ce74135b22a64c45b110b0d04a68aff6a0b3
          actual=$(git rev-parse HEAD)
          test "$actual" = "$expected"
          mkdir -p /tmp/hepta-pr16-source
          git archive --format=tar.gz --prefix=hepta-paper/ \
            --output=/tmp/hepta-pr16-source/hepta-paper-${actual}.tar.gz "$actual"
          sha256sum /tmp/hepta-pr16-source/hepta-paper-${actual}.tar.gz \
            > /tmp/hepta-pr16-source/SHA256SUMS
          printf '%s\n' "$actual" > /tmp/hepta-pr16-source/HEAD

      - name: Upload exact source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hepta-pr16-exact-source-0c74ce
          path: /tmp/hepta-pr16-source
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
