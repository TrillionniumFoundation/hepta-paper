name: external-package-acceptance-debug-once

on:
  push:
    branches:
      - codex/rust-plan-v3-main-integration-20260830
    paths:
      - '.github/workflows/external-package-acceptance-debug-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect failed generator anchor
        shell: bash
        env:
          PATCH_SHA256: ebd5541558d0030ce8277de6da75bff2796983eca9603d671ccb05f9587a27cf
        run: |
          set -euo pipefail
          cat .github/one-shot/external-package-acceptance.patch.part{00,01,02,03,04,05,06,07} > "$RUNNER_TEMP/patch.b64"
          base64 -d "$RUNNER_TEMP/patch.b64" | gzip -d > "$RUNNER_TEMP/harden.py"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/harden.py" | sha256sum -c -
          python3 - "$RUNNER_TEMP/harden.py" <<'PY'
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          needle = 'clock rollback error'
          index = text.index(needle)
          start = max(0, index - 1200)
          end = min(len(text), index + 1200)
          print(text[start:end])
          PY
