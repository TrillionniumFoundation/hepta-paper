name: external-package-acceptance-publish-once

on:
  push:
    branches:
      - codex/rust-plan-v3-main-integration-20260830
    paths:
      - '.github/workflows/external-package-acceptance-publish-once.yml'

permissions:
  contents: write

concurrency:
  group: external-package-acceptance-publish-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Replay, validate, and publish the exact hardening batch
        shell: bash
        env:
          PATCH_SHA256: ebd5541558d0030ce8277de6da75bff2796983eca9603d671ccb05f9587a27cf
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0

          cat .github/one-shot/external-package-acceptance.patch.part{00,01,02,03,04,05,06,07} > "$RUNNER_TEMP/patch.b64"
          base64 -d "$RUNNER_TEMP/patch.b64" | gzip -d > "$RUNNER_TEMP/harden.py"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/harden.py" | sha256sum -c -
          python3 -m py_compile "$RUNNER_TEMP/harden.py"

          python3 - "$RUNNER_TEMP/harden.py" <<'PY'
          import ast
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text)
          parents = {}
          for parent in ast.walk(tree):
              for child in ast.iter_child_nodes(parent):
                  parents[child] = parent
          matches = [
              node for node in ast.walk(tree)
              if isinstance(node, ast.Constant)
              and node.value == 'clock rollback error'
          ]
          if len(matches) != 1:
              raise SystemExit(f'expected one compatibility statement, found {len(matches)}')
          target = matches[0]
          while not isinstance(target, ast.stmt):
              target = parents[target]
          lines = text.splitlines(keepends=True)
          indent = lines[target.lineno - 1][
              :len(lines[target.lineno - 1]) - len(lines[target.lineno - 1].lstrip())
          ]
          lines[target.lineno - 1:target.end_lineno] = [f'{indent}pass\n']
          path.write_text(''.join(lines), encoding='utf-8')
          ast.parse(path.read_text(encoding='utf-8'))
          PY

          python3 "$RUNNER_TEMP/harden.py"
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              'rust/crates/hepta-qualification-ingest/src/bin/'
              'hepta-qualification-closure.rs'
          )
          text = path.read_text(encoding='utf-8')
          anchor = (
              '    #[error("the verifier system clock is invalid")]\n'
              '    ClockInvalid,\n'
          )
          replacement = (
              anchor
              + '    #[error("the verifier wall clock regressed below durable acceptance state")]\n'
              + '    ClockRollback,\n'
          )
          if '    ClockRollback,\n' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('clock rollback anchor is not unique')
              path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY

          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --all-targets --all-features --locked -- -D warnings

          git rm .github/one-shot/external-package-acceptance.patch.part{00,01,02,03,04,05,06,07}
          git diff --check

          python3 - <<'PY'
          import subprocess

          expected = {
              *{f'.github/one-shot/external-package-acceptance.patch.part{i:02d}' for i in range(8)},
              'docs/rust/qualification/EXTERNAL_EVIDENCE_INGESTION_RUNBOOK.md',
              'docs/rust/qualification/EXTERNAL_QUALIFICATION_CLOSURE.md',
              'docs/rust/qualification/PLAN_V3_EXTERNAL_GAP_EXECUTION.md',
              'docs/rust/qualification/PLAN_V3_EXTERNAL_PACKAGE_INDEX.md',
              'docs/rust/qualification/README.md',
              'docs/rust/qualification/authenticated-codex-role-canary-v1.schema.json',
              'docs/rust/qualification/external-authority-set-v1.schema.json',
              'docs/rust/qualification/external-host-storage-package-v1.schema.json',
              'docs/rust/qualification/external-key-owner-drill-v1.schema.json',
              'docs/rust/qualification/external-package-map.v1.json',
              'docs/rust/qualification/external-qualification-closure-receipt-v1.schema.json',
              'docs/rust/qualification/independent-linux-review-v1.schema.json',
              'docs/rust/qualification/production-cutover-soak-v1.schema.json',
              'docs/rust/qualification/protected-main-ruleset-evidence-v1.schema.json',
              'rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs',
              'rust/crates/hepta-qualification-ingest/src/lib.rs',
              'rust/crates/hepta-qualification-ingest/src/package_payload.rs',
          }
          tracked = set(subprocess.check_output(
              ['git', 'diff', 'HEAD', '--name-only'], text=True
          ).splitlines())
          untracked = set(subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard'], text=True
          ).splitlines())
          actual = tracked | untracked
          print('expected:', *sorted(expected), sep='\n')
          print('actual:', *sorted(actual), sep='\n')
          if actual != expected:
              raise SystemExit(
                  f'exact change-set mismatch; missing={sorted(expected-actual)} '
                  f'extra={sorted(actual-expected)}'
              )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(qualification): enforce external package semantics'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
