name: external-qualification-persistence-hardening-once
# one-shot attempt 10: publish validated product files separately from workflows

on:
  push:
    branches:
      - codex/rust-plan-v3-main-integration-20260830
    paths:
      - '.github/workflows/external-qualification-persistence-hardening-once.yml'

permissions:
  contents: write

concurrency:
  group: external-qualification-persistence-hardening-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Install exact toolchain and workflow linter
        shell: bash
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_ARCHIVE_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          chmod 0555 "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint" -version

      - name: Apply and validate the hardening batch
        shell: bash
        run: |
          set -euo pipefail
          cp rust/Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          python3 .github/one-shot/normalize_clock_hardening.py
          python3 .github/one-shot/harden_external_qualification.py
          python3 .github/one-shot/normalize_clock_hardening.py
          cargo fmt --manifest-path rust/Cargo.toml --all

          cargo metadata --manifest-path rust/Cargo.toml \
            --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          python3 - "$RUNNER_TEMP/Cargo.lock.before" rust/Cargo.lock <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          before = tomllib.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          after = tomllib.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          assert {k: v for k, v in before.items() if k != 'package'} == {
              k: v for k, v in after.items() if k != 'package'
          }

          def package_key(package):
              return (
                  package['name'],
                  package['version'],
                  package.get('source'),
              )

          before_packages = {package_key(row): row for row in before['package']}
          after_packages = {package_key(row): row for row in after['package']}
          assert len(before_packages) == len(before['package'])
          assert len(after_packages) == len(after['package'])
          assert before_packages.keys() == after_packages.keys()

          target_key = next(
              key for key in before_packages
              if key[0] == 'hepta-qualification-ingest'
          )
          for key in before_packages:
              old = dict(before_packages[key])
              new = dict(after_packages[key])
              if key != target_key:
                  assert old == new, key
                  continue
              old_dependencies = list(old.pop('dependencies', []))
              new_dependencies = list(new.pop('dependencies', []))
              assert old == new
              assert 'rusqlite' not in old_dependencies
              assert new_dependencies.count('rusqlite') == 1
              assert sorted(new_dependencies) == sorted(old_dependencies + ['rusqlite'])
          PY

          mapfile -t changed < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          mapfile -t expected < <(printf '%s\n' \
            .github/workflows/rust-plan-v3-external-contracts.yml \
            .github/workflows/rust-qualification-artifacts.yml \
            docs/rust/qualification/EXTERNAL_EVIDENCE_INGESTION_RUNBOOK.md \
            docs/rust/qualification/EXTERNAL_QUALIFICATION_CLOSURE.md \
            docs/rust/qualification/README.md \
            docs/rust/qualification/external-qualification-closure-receipt-v1.schema.json \
            docs/rust/qualification/external-qualification-closure-request-v1.schema.json \
            docs/rust/qualification/qualification-trust-store-v1.schema.json \
            rust/Cargo.lock \
            rust/crates/hepta-qualification-ingest/Cargo.toml \
            rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs \
            | sort)
          printf '%s\n' '--- expected generated files ---'
          printf '%s\n' "${expected[@]}"
          printf '%s\n' '--- actual generated files ---'
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")

          cargo metadata --manifest-path rust/Cargo.toml \
            --format-version 1 --locked > /dev/null
          cargo test --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --all-targets --all-features --locked -- -D warnings
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=
          git diff --check

      - name: Commit validated non-workflow product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/rust/qualification/EXTERNAL_EVIDENCE_INGESTION_RUNBOOK.md \
            docs/rust/qualification/EXTERNAL_QUALIFICATION_CLOSURE.md \
            docs/rust/qualification/README.md \
            docs/rust/qualification/external-qualification-closure-receipt-v1.schema.json \
            docs/rust/qualification/external-qualification-closure-request-v1.schema.json \
            docs/rust/qualification/qualification-trust-store-v1.schema.json \
            rust/Cargo.lock \
            rust/crates/hepta-qualification-ingest/Cargo.toml \
            rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs
          git diff --cached --check
          git commit -m 'fix(qualification): persist trust and replay closure state'

          # The exact workflow edits were validated above but are published by
          # the connector that has the dedicated workflows permission.
          git restore --worktree -- \
            .github/workflows/rust-plan-v3-external-contracts.yml \
            .github/workflows/rust-qualification-artifacts.yml
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
