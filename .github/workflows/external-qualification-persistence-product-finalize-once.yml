name: external-qualification-persistence-product-finalize-once

on:
  push:
    branches:
      - codex/rust-plan-v3-persistence-finalize-20260830
    paths:
      - '.github/workflows/external-qualification-persistence-product-finalize-once.yml'

permissions:
  contents: write

concurrency:
  group: external-qualification-persistence-product-finalize-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Reproduce and validate the accepted persistence product
        shell: bash
        run: |
          set -euo pipefail
          cp rust/Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          python3 .github/one-shot/prepare_persistence_hardening.py
          python3 .github/one-shot/harden_external_qualification.py
          python3 .github/one-shot/normalize_clock_hardening.py
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo metadata --manifest-path rust/Cargo.toml --format-version 1 > /dev/null

          python3 - "$RUNNER_TEMP/Cargo.lock.before" rust/Cargo.lock <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          before = tomllib.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          after = tomllib.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          assert {k: v for k, v in before.items() if k != 'package'} == {
              k: v for k, v in after.items() if k != 'package'
          }

          def key(row):
              return (row['name'], row['version'], row.get('source'))

          old = {key(row): row for row in before['package']}
          new = {key(row): row for row in after['package']}
          assert old.keys() == new.keys()
          target = next(item for item in old if item[0] == 'hepta-qualification-ingest')
          for item in old:
              left = dict(old[item])
              right = dict(new[item])
              if item != target:
                  assert left == right, item
                  continue
              left_deps = list(left.pop('dependencies', []))
              right_deps = list(right.pop('dependencies', []))
              assert left == right
              assert 'rusqlite' not in left_deps
              assert right_deps.count('rusqlite') == 1
              assert sorted(right_deps) == sorted(left_deps + ['rusqlite'])
          PY

          cargo metadata --manifest-path rust/Cargo.toml --format-version 1 --locked > /dev/null
          cargo test --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --all-targets --all-features --locked -- -D warnings
          git diff --check

          mapfile -t generated < <({
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u)
          mapfile -t expected < <(printf '%s\n' \
            .github/workflows/rust-plan-v3-external-contracts.yml \
            .github/workflows/rust-qualification-artifacts.yml \
            docs/rust/qualification/EXTERNAL_EVIDENCE_INGESTION_RUNBOOK.md \
            docs/rust/qualification/EXTERNAL_QUALIFICATION_CLOSURE.md \
            docs/rust/qualification/README.md \
            docs/rust/qualification/external-qualification-closure-receipt-v1.schema.json \
            docs/rust/qualification/external-qualification-closure-request-v1.schema.json \
            docs/rust/qualification/qualification-trust-store-v1.schema.json \
            rust/Cargo.lock \
            rust/crates/hepta-qualification-ingest/Cargo.toml \
            rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs \
            | sort)
          test "${#generated[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${generated[@]}")

      - name: Commit only non-workflow product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/rust/qualification/EXTERNAL_EVIDENCE_INGESTION_RUNBOOK.md \
            docs/rust/qualification/EXTERNAL_QUALIFICATION_CLOSURE.md \
            docs/rust/qualification/README.md \
            docs/rust/qualification/external-qualification-closure-receipt-v1.schema.json \
            docs/rust/qualification/external-qualification-closure-request-v1.schema.json \
            docs/rust/qualification/qualification-trust-store-v1.schema.json \
            rust/Cargo.lock \
            rust/crates/hepta-qualification-ingest/Cargo.toml \
            rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs
          git diff --cached --check
          git commit -m 'fix(qualification): persist trust and replay closure state'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
