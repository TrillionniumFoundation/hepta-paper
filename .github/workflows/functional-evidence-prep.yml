name: functional-evidence-prep
on:
  push:
    branches: [codex/rust-functional-evidence-prep-20260912]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'TrillionniumFoundation/hepta-paper' && github.ref == 'refs/heads/codex/rust-functional-evidence-prep-20260912'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      RUSTFLAGS: '-Dunsafe-code'
      CARGO_TARGET_DIR: /tmp/hepta-exact-regression-target
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Install pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Bind explicit owner tests without relaxing the validator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hepta-exact-evidence
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          targets = [
              ('repository-source-implementation-v1.json', 'native-business-binding-and-bundle-source', 'hepta-paper-service'),
              ('rust-functional-source-closure-v1.json', 'scheduler-boundary-regressions-source', 'hepta-control-plane'),
          ]
          for name, identity, crate in targets:
              path = Path('docs/system/evidence') / name
              data = json.loads(path.read_text())
              bundle = data['bundles'][identity]
              commands = []
              for source in bundle['files']:
                  if source['role'] != 'test':
                      continue
                  tests = re.findall(r'#\[test\]\s*fn\s+(\w+)\s*\(', Path(source['path']).read_text())
                  assert tests, source['path']
                  for test in tests:
                      commands.append(dict(program='cargo', args=['test', '--locked', '-p', crate, test, '--', '--exact', '--nocapture'], workdir='rust', expectedExitCode=0, timeoutSeconds=300, expectedTargets=[source['path']]))
              bundle['verificationCommands'] = commands
              path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git rm .github/workflows/functional-evidence-prep.yml
          git add docs/system/evidence
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(evidence): select each Rust regression by exact owner test name'
          test "$(git rev-parse HEAD:rust)" = "$(git rev-parse ce1301db0e0174f0fdeaf695582b209ee80c936b:rust)"
          git rev-parse HEAD > /tmp/hepta-exact-evidence/head.txt
          git rev-parse HEAD^{tree} > /tmp/hepta-exact-evidence/tree.txt
          git archive --format=tar.gz HEAD > /tmp/hepta-exact-evidence/source.tar.gz
          git diff --binary ce1301db0e0174f0fdeaf695582b209ee80c936b HEAD > /tmp/hepta-exact-evidence/evidence.patch
      - name: Demonstrate predecessor failures and repaired regression success
        shell: bash
        run: |
          set -euo pipefail
          baseline=/tmp/hepta-predecessor-red
          git worktree add --detach "$baseline" c615e0979381091e986723b02800b4475389e3c8
          cp rust/crates/hepta-control-plane/tests/source_correctness_regressions.rs "$baseline/rust/crates/hepta-control-plane/tests/"
          set +e
          cargo test --manifest-path "$baseline/rust/Cargo.toml" --locked -p hepta-control-plane --test source_correctness_regressions -- --nocapture > /tmp/hepta-exact-evidence/baseline-red.log 2>&1
          status=$?
          set -e
          cat /tmp/hepta-exact-evidence/baseline-red.log
          test "$status" -eq 101
          grep -F 'test result: FAILED.' /tmp/hepta-exact-evidence/baseline-red.log
          test "$(grep -cE '^test .* \.\.\. FAILED$' /tmp/hepta-exact-evidence/baseline-red.log)" -ge 3
          git worktree remove --force "$baseline"
          cargo test --manifest-path rust/Cargo.toml --locked -p hepta-control-plane --test source_correctness_regressions -- --nocapture 2>&1 | tee /tmp/hepta-exact-evidence/repaired-green.log
      - name: Execute exact source evidence and documentation checks
        shell: bash
        run: |
          set -euo pipefail
          node docs/tools/validate-development-docs.mjs | tee /tmp/hepta-exact-evidence/docs.log
          node docs/tools/validate-module-documentation.mjs | tee /tmp/hepta-exact-evidence/modules.log
          python3 docs/rust/tools/validate-program-truth.py | tee /tmp/hepta-exact-evidence/program.log
          for name in repository-source-implementation-v1 rust-functional-source-closure-v1; do
            node paper-core/bin/verify-source-implementation-evidence.mjs --evidence "docs/system/evidence/$name.json" --expected-head "$(git rev-parse HEAD)" --expected-tree "$(git rev-parse HEAD^{tree})" --execute --receipt "/tmp/hepta-exact-evidence/$name.receipt.json" 2>&1 | tee "/tmp/hepta-exact-evidence/$name.log"
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Publish verified preparation tree only to the temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/rust-functional-evidence-prep-20260912
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin "refs/heads/$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
      - name: Retain all results including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-exact-evidence-${{ github.sha }}
          path: /tmp/hepta-exact-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
