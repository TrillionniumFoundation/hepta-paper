name: global-plan-final-gap-closure-apply

on:
  push:
    branches:
      - codex/global-plan-final-gap-closure-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'TrillionniumFoundation/hepta-paper'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT_SHA: 37fe42472a1818bfd0771b04225e966a5866c21c
      EXPECTED_BASE_SHA: 71261f41e3a529fced862d7007e18a49338f5c40
      EXPECTED_PATCH_SHA256: bd1c84bf38871d09337b8f94a38f1e9e2f2537c88324900c141218bfb2adf2aa
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Verify bootstrap and apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^1)" = "$EXPECTED_PARENT_SHA"
          test "$(git rev-parse --verify HEAD^2)" = "$EXPECTED_BASE_SHA"
          base64 -d .github/patches/global-plan-final-gap-closure.patch.b64 \
            | gzip -d > "$RUNNER_TEMP/global-plan-final-gap-closure.patch"
          echo "$EXPECTED_PATCH_SHA256  $RUNNER_TEMP/global-plan-final-gap-closure.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/global-plan-final-gap-closure.patch"
          git apply "$RUNNER_TEMP/global-plan-final-gap-closure.patch"
          git rm .github/patches/global-plan-final-gap-closure.patch.b64
          git rm .github/workflows/global-plan-final-gap-closure-apply.yml
          git diff --check
      - name: Install exact portable test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sqlite3
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v22.23.1"
          strict_node_source="$(command -v node)"
          test -f "$strict_node_source"
          sudo install -o root -g root -m 0555 "$strict_node_source" /usr/bin/node
          sudo test "$(readlink -f /usr/bin/node)" = /usr/bin/node
      - name: Validate documentation and modified source
        shell: bash
        run: |
          set -euo pipefail
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          node --check paper-adapters/runtime/os-sandboxed-worker-runner-engine.mjs
          node --check paper-adapters/runtime/os-sandboxed-worker-runner.mjs
          node --check paper-adapters/runtime/workspace-layout.mjs
          node --check paper-core/tests/autonomous-submission-dispatcher-challenge.test.mjs
          node --check paper-core/tests/package-script-surface.test.mjs
          node --check paper-core/tests/support/autonomous-research-generalization-closure-fixture.mjs
          node --check paper-core/tests/support/gpu-scientific-campaign-release-fixture.mjs
      - name: Reproduce and close the known portable-suite blockers
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 paper-core/tests/autonomous-research-generalization-venue-submission.test.mjs
          node --test --test-concurrency=1 paper-core/tests/autonomous-submission-dispatcher-challenge.test.mjs
          node --test --test-concurrency=1 paper-core/tests/composition-context-profiles.test.mjs
          node --test --test-concurrency=1 paper-core/tests/gpu-worker-device-isolation.test.mjs paper-core/tests/strict-full-auto-gpu-scientific-release-chain.test.mjs
          node --test --test-concurrency=1 paper-core/tests/package-script-surface.test.mjs
          node --test --test-concurrency=1 paper-core/tests/release-environment-entrypoint.test.mjs
      - name: Run repository static gates
        shell: bash
        run: |
          set -euo pipefail
          npm run static:check
      - name: Commit the exact tested closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Global Plan Closure'
          git config user.email 'noreply@openai.com'
          git add -A
          test -n "$(git status --porcelain=v1)"
          git commit -m 'fix: close repository-owned Global Plan blockers'
          git push origin HEAD:codex/global-plan-final-gap-closure-20260902
