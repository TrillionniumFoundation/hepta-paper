name: hepta-paper-convergence-helper

on:
  push:
    branches:
      - codex/hepta-paper-convergence-runner-20260831

permissions:
  contents: write

concurrency:
  group: hepta-paper-convergence-helper
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_BRANCH: codex/rust-plan-v3-p0-authority-closure-20260831
      EXPECTED_TARGET_HEAD: bf4dc97c537d6c8b803b71f2436fd4ce60232576
      WRITER_HEAD: 30c7f89264b1e76367f5f0c3d3a028c3486c431a
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      RUSTFLAGS: -Dunsafe-code
    steps:
      - name: Check out exact target branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact inputs and import writer hardening
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          git fetch --no-tags origin "$WRITER_HEAD"
          test "$(git rev-parse FETCH_HEAD)" = "$WRITER_HEAD"
          git checkout "$WRITER_HEAD" -- \
            rust/Cargo.lock \
            rust/crates/hepta-campaign-writer/Cargo.toml \
            rust/crates/hepta-campaign-writer/src/cutover.rs \
            rust/crates/hepta-campaign-writer/src/lib.rs \
            rust/crates/hepta-campaign-writer/tests/writer_turnover.rs \
            rust/crates/hepta-local-vertical/Cargo.toml \
            rust/crates/hepta-local-vertical/tests/local_slice.rs

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Format and validate complete Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked
          cargo test --manifest-path rust/Cargo.toml --workspace --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --manifest-path rust/Cargo.toml --workspace --all-features --no-deps --locked
          git diff --check

      - name: Commit only the product-source convergence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            rust/Cargo.lock \
            rust/crates/hepta-campaign-writer/Cargo.toml \
            rust/crates/hepta-campaign-writer/src/cutover.rs \
            rust/crates/hepta-campaign-writer/src/lib.rs \
            rust/crates/hepta-campaign-writer/tests/writer_turnover.rs \
            rust/crates/hepta-local-vertical/Cargo.toml \
            rust/crates/hepta-local-vertical/tests/local_slice.rs \
            rust/crates/hepta-workspace-authority/src/bound.rs \
            rust/crates/hepta-workspace-authority/src/lib.rs
          git diff --cached --quiet && {
            echo 'No product-source changes were produced.' >&2
            exit 1
          }
          git commit -m 'fix(rust): converge workspace and writer authority hardening'
          git push origin "HEAD:$TARGET_BRANCH"
