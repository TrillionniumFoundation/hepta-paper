name: materialize-external-contract-workflow-once

on:
  push:
    branches:
      - codex/rust-final-gap-closure-20260830
    paths:
      - '.github/workflows/materialize-external-contract-workflow-once.yml'

permissions:
  contents: write

concurrency:
  group: materialize-external-contract-workflow-once
  cancel-in-progress: false

env:
  PRODUCT_HEAD: aae54d768b0bc944be0fba3794ff72dd8a221234
  HELPER_BRANCH: codex/rust-final-gap-closure-20260830
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_ARCHIVE_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out writable helper branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: helper
          fetch-depth: 2
          persist-credentials: true

      - name: Check out exact product head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: aae54d768b0bc944be0fba3794ff72dd8a221234
          path: product
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize and lint the exact workflow bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_HEAD"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('product/.github/workflows/rust-plan-v3-external-contracts.yml')
          text = path.read_text(encoding='utf-8')

          old_tokens = (
              "              'reviewer_matches(',\n"
              "          ]:\n"
          )
          new_tokens = (
              "              'reviewer_matches(',\n"
              "              'authority_set_subject_hash_v1',\n"
              "              'HeptaExternalAuthorityReceiptV1',\n"
              "              'HeptaExternalAuthoritySetReviewV1',\n"
              "              'verify_authority_signature_v1',\n"
              "              'current_time_window(',\n"
              "              'SignatureInvalid',\n"
              "          ]:\n"
          )
          if text.count(old_tokens) != 1:
              raise SystemExit(f'token anchor count: {text.count(old_tokens)}')
          text = text.replace(old_tokens, new_tokens, 1)

          old_schema = (
              "          request = schemas['external-qualification-closure-request-v1.schema.json']\n"
          )
          new_schema = (
              "          authority_set_schema = schemas['external-authority-set-v1.schema.json']\n"
              "          assert authority_set_schema['$defs']['signature'] == {\n"
              "              'type': 'string',\n"
              "              'pattern': '^[A-Za-z0-9_-]{86}$',\n"
              "          }\n\n"
              "          request = schemas['external-qualification-closure-request-v1.schema.json']\n"
          )
          if text.count(old_schema) != 1:
              raise SystemExit(f'schema anchor count: {text.count(old_schema)}')
          text = text.replace(old_schema, new_schema, 1)

          output = Path('helper/.github/generated/rust-plan-v3-external-contracts.yml')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(text, encoding='utf-8')
          PY

          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          chmod 0555 "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes= \
            helper/.github/generated/rust-plan-v3-external-contracts.yml
          grep -Fq 'HeptaExternalAuthorityReceiptV1' \
            helper/.github/generated/rust-plan-v3-external-contracts.yml
          grep -Fq "'pattern': '^[A-Za-z0-9_-]{86}$'" \
            helper/.github/generated/rust-plan-v3-external-contracts.yml
          sha256sum helper/.github/generated/rust-plan-v3-external-contracts.yml

      - name: Publish the materialized blob outside the workflow directory
        shell: bash
        working-directory: helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/generated/rust-plan-v3-external-contracts.yml
          git diff --cached --check
          git commit -m 'chore(ci): materialize validated external contract workflow blob'
          git fetch origin "$HELPER_BRANCH"
          git rebase "origin/$HELPER_BRANCH"
          git push origin "HEAD:$HELPER_BRANCH"
