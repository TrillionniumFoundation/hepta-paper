name: one-shot-plan-v4-source-closure-publisher

on:
  push:
    branches:
      - ops/plan-v4-source-closure-publisher-20260909
    paths:
      - ops/plan-v4-source-closure-trigger

permissions:
  contents: write

concurrency:
  group: one-shot-plan-v4-source-closure-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: codex/rust-plan-v4.1-final3-20260909
      EXPECTED_TARGET_HEAD: 3ad568f523e5ae0d99f8e3ba3339cbf480f32327
      PAYLOAD_SHA256: 9978bfff5a1a14518e1816711da309ab22a71a41b6ceb09c23001870848b3535
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout publisher bytes without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 1
          path: publisher

      - name: Reconstruct and verify the fixed payload
        shell: bash
        run: |
          set -euo pipefail
          cat publisher/ops/plan-v4-source-closure-payload/payload.part.* > "$RUNNER_TEMP/payload.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/payload.tar.gz.b64" > "$RUNNER_TEMP/payload.tar.gz"
          printf '%s  %s\n' "$PAYLOAD_SHA256" "$RUNNER_TEMP/payload.tar.gz" | sha256sum --check --strict
          tar -tzf "$RUNNER_TEMP/payload.tar.gz" | LC_ALL=C sort > "$RUNNER_TEMP/payload-paths.txt"
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'EOF'
          docs/migration/NODE_RUST_MIGRATION.md
          docs/modules/MODULE_DOCUMENTATION_MATRIX.md
          docs/modules/manifests/node-legacy-adapter.v1.json
          docs/modules/manifests/performance-qualification.v1.json
          docs/modules/specs/node-legacy-adapter.md
          docs/modules/specs/performance-qualification.md
          docs/performance/PERFORMANCE_AND_SLO.md
          docs/performance/schemas/performance-qualification-report-v1.schema.json
          docs/performance/schemas/performance-qualification-request-v1.schema.json
          docs/system/truth/capabilities.v1.json
          docs/system/truth/modules.v1.json
          docs/system/truth/work-items.v2.json
          paper-adapters/migration/node-legacy-module-adapter.mjs
          paper-application/orchestration/performance-qualification.mjs
          paper-core/tests/node-legacy-module-adapter.test.mjs
          paper-core/tests/performance-qualification-schema.test.mjs
          paper-core/tests/performance-qualification.test.mjs
          EOF
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/expected-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/payload-paths.txt"

      - name: Checkout the exact candidate with push credential
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: true
          path: target

      - name: Use the repository Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1

      - name: Apply and validate the exact source closure
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          tar --extract --gzip --file "$RUNNER_TEMP/payload.tar.gz" --directory . --no-same-owner --no-same-permissions
          git diff --check
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/changed-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/changed-paths.txt"
          node --check paper-adapters/migration/node-legacy-module-adapter.mjs
          node --check paper-application/orchestration/performance-qualification.mjs
          node --check paper-core/tests/node-legacy-module-adapter.test.mjs
          node --check paper-core/tests/performance-qualification.test.mjs
          node --check paper-core/tests/performance-qualification-schema.test.mjs
          node --test --test-concurrency=1 \
            paper-core/tests/node-legacy-module-adapter.test.mjs \
            paper-core/tests/performance-qualification.test.mjs \
            paper-core/tests/performance-qualification-schema.test.mjs
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          python3 docs/rust/tools/validate-program-truth.py
          python3 docs/rust/tools/test-plan-v4-qualification.py
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -vE '^( M|M |A |\?\?) ' || true)"

      - name: Commit and fast-forward the candidate once
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          git config user.name "hepta-plan-v4-source-closure"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add --pathspec-from-file="$RUNNER_TEMP/expected-paths.txt"
          git diff --cached --check
          git commit -m "feat(plan): implement legacy adapter and performance qualification" \
            -m "Add bounded prepared-result-only Node legacy adaptation and deterministic source-tier performance qualification. Preserve disabled activation and all target-host, external-authority, cutover, and Node-retirement gates."
          NEW_HEAD="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'new_head=%s\n' "$NEW_HEAD" >> "$GITHUB_STEP_SUMMARY"
          printf 'payload_sha256=%s\n' "$PAYLOAD_SHA256" >> "$GITHUB_STEP_SUMMARY"
