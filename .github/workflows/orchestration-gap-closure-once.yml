name: orchestration-gap-closure-once

on:
  push:
    branches:
      - codex/rust-full-replacement-rc-20260908
    paths:
      - .github/workflows/orchestration-gap-closure-once.yml

permissions:
  contents: write

concurrency:
  group: orchestration-gap-closure-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'hepta-paper-automation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact RC head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0

      - name: Integrate canonical orchestration facade
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workspace = Path('rust/Cargo.toml')
          text = workspace.read_text(encoding='utf-8')
          member = '  "crates/hepta-orchestration-kernel",\n'
          if member not in text:
              marker = ']\n\n[workspace.package]'
              if marker not in text:
                  raise SystemExit('workspace member boundary missing')
              text = text.replace(marker, member + marker, 1)
              workspace.write_text(text, encoding='utf-8')

          control_manifest = Path('rust/crates/hepta-control-plane/Cargo.toml')
          text = control_manifest.read_text(encoding='utf-8')
          dependency = 'hepta-orchestration-kernel = { path = "../hepta-orchestration-kernel", version = "=0.1.0" }\n'
          if dependency not in text:
              marker = '[dependencies]\n'
              if marker not in text:
                  raise SystemExit('control-plane dependency boundary missing')
              text = text.replace(marker, marker + dependency, 1)
              control_manifest.write_text(text, encoding='utf-8')

          control_lib = Path('rust/crates/hepta-control-plane/src/lib.rs')
          text = control_lib.read_text(encoding='utf-8')
          export = '\n/// Canonical deterministic orchestration facade.\npub use hepta_orchestration_kernel as orchestration_kernel;\n'
          if 'pub use hepta_orchestration_kernel as orchestration_kernel;' not in text:
              control_lib.write_text(text.rstrip() + export, encoding='utf-8')

          snapshot = Path('rust/crates/hepta-orchestration-kernel/src/snapshot.rs')
          text = snapshot.read_text(encoding='utf-8')
          old = "payload_hash: digest(if index == 0 { 'a' } else { 'b' }),"
          new = "payload_hash: digest(if *name == \"alpha\" { 'a' } else { 'b' }),"
          if old in text:
              text = text.replace(old, new)
              text = text.replace('.enumerate()\n                .map(|(index, name)|', '.map(|name|')
              snapshot.write_text(text, encoding='utf-8')
          PY

          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml -p hepta-orchestration-kernel
          cargo test --manifest-path rust/Cargo.toml -p hepta-control-plane --locked
          cargo clippy --manifest-path rust/Cargo.toml -p hepta-orchestration-kernel -p hepta-control-plane --all-targets --all-features --locked -- -D warnings

          rm -f .github/workflows/orchestration-gap-closure-once.yml
          rm -f .github/workflows/apply-production-freeze-integration-once.yml
          git config user.name hepta-paper-automation
          git config user.email hepta-paper-automation@users.noreply.github.com
          git add rust .github/workflows
          git commit -m 'feat(rust): integrate deterministic orchestration kernel'
          git push origin HEAD:codex/rust-full-replacement-rc-20260908
