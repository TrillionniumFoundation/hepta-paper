name: orchestration-gap-fix-once

on:
  push:
    branches:
      - codex/rust-full-replacement-rc-20260908
    paths:
      - .github/workflows/orchestration-gap-fix-once.yml

permissions:
  contents: write

concurrency:
  group: orchestration-gap-fix-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-validate:
    if: github.actor != 'hepta-paper-automation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact RC head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0

      - name: Apply deterministic fixes and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workspace = Path('rust/Cargo.toml')
          text = workspace.read_text(encoding='utf-8')
          member = '  "crates/hepta-orchestration-kernel",\n'
          if member not in text:
              marker = ']\n\n[workspace.package]'
              if marker not in text:
                  raise SystemExit('workspace member boundary missing')
              workspace.write_text(text.replace(marker, member + marker, 1), encoding='utf-8')

          manifest = Path('rust/crates/hepta-control-plane/Cargo.toml')
          text = manifest.read_text(encoding='utf-8')
          dependency = 'hepta-orchestration-kernel = { path = "../hepta-orchestration-kernel", version = "=0.1.0" }\n'
          if dependency not in text:
              marker = '[dependencies]\n'
              if marker not in text:
                  raise SystemExit('control-plane dependency boundary missing')
              manifest.write_text(text.replace(marker, marker + dependency, 1), encoding='utf-8')

          control = Path('rust/crates/hepta-control-plane/src/lib.rs')
          text = control.read_text(encoding='utf-8')
          export = 'pub use hepta_orchestration_kernel as orchestration_kernel;'
          if export not in text:
              control.write_text(text.rstrip() + '\n\n/// Canonical deterministic orchestration facade.\n' + export + '\n', encoding='utf-8')

          snapshot = Path('rust/crates/hepta-orchestration-kernel/src/snapshot.rs')
          text = snapshot.read_text(encoding='utf-8')
          text = text.replace('.iter()\n                .enumerate()\n                .map(|(index, name)|', '.iter()\n                .map(|name|')
          text = text.replace("payload_hash: digest(if index == 0 { 'a' } else { 'b' }),", "payload_hash: digest(if *name == \"alpha\" { 'a' } else { 'b' }),")
          snapshot.write_text(text, encoding='utf-8')

          router = Path('rust/crates/hepta-orchestration-kernel/src/router.rs')
          text = router.read_text(encoding='utf-8').replace('selected = candidate;', 'selected = *candidate;')
          router.write_text(text, encoding='utf-8')

          telemetry = Path('rust/crates/hepta-orchestration-kernel/src/telemetry.rs')
          text = telemetry.read_text(encoding='utf-8')
          old = '''        self.first_observed_at_unix_ms
            .get_or_insert(observation.observed_at_unix_ms);
'''
          new = '''        if self.first_observed_at_unix_ms.is_none() {
            self.first_observed_at_unix_ms = Some(observation.observed_at_unix_ms);
        }
'''
          text = text.replace(old, new)
          telemetry.write_text(text, encoding='utf-8')

          for path in Path('rust/crates/hepta-orchestration-kernel/src').glob('*.rs'):
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  '#[cfg(test)]\nmod tests {',
                  '#[cfg(test)]\n#[allow(clippy::assertions_on_constants, clippy::panic, clippy::unreachable)]\nmod tests {',
              )
              path.write_text(text, encoding='utf-8')
          PY

          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml -p hepta-orchestration-kernel
          cargo test --manifest-path rust/Cargo.toml -p hepta-control-plane --locked
          cargo clippy --manifest-path rust/Cargo.toml -p hepta-orchestration-kernel -p hepta-control-plane --all-targets --all-features --locked -- -D warnings
          cargo doc --manifest-path rust/Cargo.toml -p hepta-orchestration-kernel --no-deps --locked

          rm -f .github/workflows/orchestration-gap-closure-once.yml
          rm -f .github/workflows/orchestration-gap-fix-once.yml
          rm -f .github/workflows/apply-production-freeze-integration-once.yml
          git config user.name hepta-paper-automation
          git config user.email hepta-paper-automation@users.noreply.github.com
          git add rust .github/workflows
          git commit -m 'feat(rust): close deterministic orchestration source gaps'
          git push origin HEAD:codex/rust-full-replacement-rc-20260908
