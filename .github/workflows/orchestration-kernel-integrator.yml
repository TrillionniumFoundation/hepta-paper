name: orchestration-kernel-integrator

on:
  push:
    branches:
      - codex/tmp-orchestration-kernel-integration-20260908

permissions:
  contents: write

concurrency:
  group: orchestration-kernel-integrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-test-and-self-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact staging head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply the documented orchestration-kernel integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workspace = Path('rust/Cargo.toml')
          text = workspace.read_text()
          member = '  "crates/hepta-orchestration-kernel",\n'
          if member not in text:
              anchor = '  "crates/hepta-control-plane",\n'
              if text.count(anchor) != 1:
                  raise SystemExit('workspace_member_anchor_invalid')
              text = text.replace(anchor, anchor + member, 1)
          workspace.write_text(text)

          control_manifest = Path('rust/crates/hepta-control-plane/Cargo.toml')
          text = control_manifest.read_text()
          dependency = 'hepta-orchestration-kernel = { path = "../hepta-orchestration-kernel", version = "=0.1.0" }\n'
          if dependency not in text:
              anchor = 'hepta-module-platform = { version = "=0.1.0", path = "../hepta-module-platform" }\n'
              if text.count(anchor) != 1:
                  raise SystemExit('control_plane_dependency_anchor_invalid')
              text = text.replace(anchor, anchor + dependency, 1)
          control_manifest.write_text(text)

          facade = Path('rust/crates/hepta-control-plane/src/lib.rs')
          text = facade.read_text()
          export = 'pub use hepta_orchestration_kernel as orchestration_kernel;\n'
          if export not in text:
              anchor = 'pub use model::{ControlPlaneSnapshotV1, HardPolicyV1, PlanningFrontierV1, canonical_hash_v1};\n'
              if text.count(anchor) != 1:
                  raise SystemExit('control_plane_facade_anchor_invalid')
              text = text.replace(anchor, anchor + export, 1)
          facade.write_text(text)

          lockfile = Path('rust/Cargo.lock')
          text = lockfile.read_text()
          control_start = text.index('name = "hepta-control-plane"')
          control_end = text.index('[[package]]', control_start)
          control_block = text[control_start:control_end]
          dependency_line = ' "hepta-orchestration-kernel",\n'
          if dependency_line not in control_block:
              anchor = ' "hepta-module-platform",\n'
              if control_block.count(anchor) != 1:
                  raise SystemExit('control_plane_lock_dependency_anchor_invalid')
              control_block = control_block.replace(anchor, anchor + dependency_line, 1)
              text = text[:control_start] + control_block + text[control_end:]
          if 'name = "hepta-orchestration-kernel"' not in text:
              module_start = text.index('name = "hepta-module-platform"')
              module_end = text.index('[[package]]', module_start)
              package = '''[[package]]
          name = "hepta-orchestration-kernel"
          version = "0.1.0"
          dependencies = [
           "hex",
           "serde",
           "serde_json",
           "sha2 0.10.8",
           "thiserror",
          ]

          '''
              text = text[:module_end] + package + text[module_end:]
          lockfile.write_text(text)

          required = [
              Path('rust/crates/hepta-orchestration-kernel/Cargo.toml'),
              Path('rust/crates/hepta-orchestration-kernel/src/snapshot.rs'),
              Path('rust/crates/hepta-orchestration-kernel/src/router.rs'),
              Path('rust/crates/hepta-orchestration-kernel/src/resource.rs'),
              Path('rust/crates/hepta-orchestration-kernel/src/telemetry.rs'),
              Path('rust/crates/hepta-orchestration-kernel/src/performance.rs'),
          ]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit(f'orchestration_kernel_source_missing:{missing}')

          kernel_root = Path('rust/crates/hepta-orchestration-kernel/src')
          for source in sorted(kernel_root.glob('*.rs')):
              source_text = source.read_text()
              source.write_text(source_text.replace('assert!(false, ', 'panic!('))

          performance = kernel_root / 'performance.rs'
          performance_text = performance.read_text()
          old_zero_check = '''observation
                          .sample_durations_ns
                          .iter()
                          .any(|duration| *duration == 0)'''
          if old_zero_check not in performance_text:
              raise SystemExit('performance_zero_sample_check_anchor_invalid')
          performance.write_text(
              performance_text.replace(
                  old_zero_check,
                  'observation.sample_durations_ns.contains(&0)',
                  1,
              )
          )
          PY

      - name: Format and validate with pinned Rust and repository governance
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          cargo metadata --manifest-path rust/Cargo.toml --locked --format-version 1 >/tmp/cargo-metadata.json
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo test --manifest-path rust/Cargo.toml -p hepta-orchestration-kernel -p hepta-control-plane --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml -p hepta-orchestration-kernel -p hepta-control-plane --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --manifest-path rust/Cargo.toml -p hepta-orchestration-kernel -p hepta-control-plane --all-features --no-deps --locked
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          git diff --check

      - name: Publish a clean self-contained integration commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/orchestration-kernel-integrator.yml
          git add -A
          cat >/tmp/allowed-files <<'EOF'
          .github/workflows/orchestration-kernel-integrator.yml
          rust/Cargo.lock
          rust/Cargo.toml
          rust/crates/hepta-control-plane/Cargo.toml
          rust/crates/hepta-control-plane/src/lib.rs
          rust/crates/hepta-orchestration-kernel/src/lib.rs
          rust/crates/hepta-orchestration-kernel/src/performance.rs
          rust/crates/hepta-orchestration-kernel/src/resource.rs
          rust/crates/hepta-orchestration-kernel/src/router.rs
          rust/crates/hepta-orchestration-kernel/src/snapshot.rs
          rust/crates/hepta-orchestration-kernel/src/telemetry.rs
          EOF
          cat >/tmp/required-files <<'EOF'
          .github/workflows/orchestration-kernel-integrator.yml
          rust/Cargo.lock
          rust/Cargo.toml
          rust/crates/hepta-control-plane/Cargo.toml
          rust/crates/hepta-control-plane/src/lib.rs
          EOF
          git diff --cached --name-only | LC_ALL=C sort >/tmp/actual-files
          while IFS= read -r changed; do
            grep -Fqx "$changed" /tmp/allowed-files || {
              echo "unexpected integration change: $changed" >&2
              exit 1
            }
          done </tmp/actual-files
          while IFS= read -r required; do
            grep -Fqx "$required" /tmp/actual-files || {
              echo "required integration change missing: $required" >&2
              exit 1
            }
          done </tmp/required-files
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(rust): integrate the canonical orchestration kernel'
          git push origin HEAD:refs/heads/codex/tmp-orchestration-kernel-integration-20260908
