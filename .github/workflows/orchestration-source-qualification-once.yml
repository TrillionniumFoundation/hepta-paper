name: orchestration-source-qualification-once

on:
  push:
    branches:
      - codex/rust-full-replacement-rc-20260908
    paths:
      - .github/workflows/orchestration-source-qualification-once.yml

permissions:
  contents: write

concurrency:
  group: orchestration-source-qualification-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.actor != 'hepta-paper-automation'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact RC head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned runtimes
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          test "$(node --version)" = "v22.23.1"

      - name: Normalize the canonical facade and known deterministic fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workspace = Path('rust/Cargo.toml')
          text = workspace.read_text(encoding='utf-8')
          member = '  "crates/hepta-orchestration-kernel",\n'
          if member not in text:
              marker = ']\n\n[workspace.package]'
              if marker not in text:
                  raise SystemExit('workspace member boundary missing')
              workspace.write_text(text.replace(marker, member + marker, 1), encoding='utf-8')

          manifest = Path('rust/crates/hepta-control-plane/Cargo.toml')
          text = manifest.read_text(encoding='utf-8')
          dependency = 'hepta-orchestration-kernel = { path = "../hepta-orchestration-kernel", version = "=0.1.0" }\n'
          if dependency not in text:
              marker = '[dependencies]\n'
              if marker not in text:
                  raise SystemExit('control-plane dependency boundary missing')
              manifest.write_text(text.replace(marker, marker + dependency, 1), encoding='utf-8')

          control = Path('rust/crates/hepta-control-plane/src/lib.rs')
          text = control.read_text(encoding='utf-8')
          export = 'pub use hepta_orchestration_kernel as orchestration_kernel;'
          if export not in text:
              control.write_text(text.rstrip() + '\n\n/// Canonical deterministic orchestration facade.\n' + export + '\n', encoding='utf-8')

          replacements = {
              Path('rust/crates/hepta-orchestration-kernel/src/snapshot.rs'): [
                  ('.iter()\n                .enumerate()\n                .map(|(index, name)|', '.iter()\n                .map(|name|'),
                  ("payload_hash: digest(if index == 0 { 'a' } else { 'b' }),", "payload_hash: digest(if *name == \"alpha\" { 'a' } else { 'b' }),"),
              ],
              Path('rust/crates/hepta-orchestration-kernel/src/router.rs'): [
                  ('selected = candidate;', 'selected = *candidate;'),
                  ('assert_eq!(receipt.pareto_frontier_ids, ["candidate:strong"]);', 'assert_eq!(receipt.pareto_frontier_ids, vec!["candidate:strong".to_owned()]);'),
              ],
              Path('rust/crates/hepta-orchestration-kernel/src/resource.rs'): [
                  ('assert_eq!(disposition.ambiguous_committed, ["reservation:ambiguous"]);', 'assert_eq!(disposition.ambiguous_committed, vec!["reservation:ambiguous".to_owned()]);'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          resource = Path('rust/crates/hepta-orchestration-kernel/src/resource.rs')
          text = resource.read_text(encoding='utf-8')
          old = '''        self.reservations
            .insert(reservation_id, reservation.clone());
        receipt(&reservation)
'''
          new = '''        if self
            .reservations
            .insert(reservation_id, reservation.clone())
            .is_some()
        {
            return Err(ResourceLedgerError::Invariant);
        }
        receipt(&reservation)
'''
          text = text.replace(old, new)
          resource.write_text(text, encoding='utf-8')

          telemetry = Path('rust/crates/hepta-orchestration-kernel/src/telemetry.rs')
          text = telemetry.read_text(encoding='utf-8')
          text = text.replace(
              '''        self.first_observed_at_unix_ms
            .get_or_insert(observation.observed_at_unix_ms);
''',
              '''        if self.first_observed_at_unix_ms.is_none() {
            self.first_observed_at_unix_ms = Some(observation.observed_at_unix_ms);
        }
''',
          )
          telemetry.write_text(text, encoding='utf-8')

          for path in Path('rust/crates/hepta-orchestration-kernel/src').glob('*.rs'):
              text = path.read_text(encoding='utf-8')
              if '#[cfg(test)]\nmod tests {' in text:
                  text = text.replace(
                      '#[cfg(test)]\nmod tests {',
                      '#[cfg(test)]\n#[allow(clippy::assertions_on_constants, clippy::panic, clippy::unreachable)]\nmod tests {',
                  )
              path.write_text(text, encoding='utf-8')
          PY

      - name: Run complete Rust source qualification
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo test --manifest-path rust/Cargo.toml --workspace --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --manifest-path rust/Cargo.toml --workspace --all-features --no-deps --locked

      - name: Validate documentation and machine truth
        shell: bash
        run: |
          set -euo pipefail
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          python3 docs/rust/tools/validate-program-truth.py

      - name: Publish non-activating exact-source receipt and remove one-shot automation
        shell: bash
        run: |
          set -euo pipefail
          tested_commit="$(git rev-parse HEAD)"
          tested_tree="$(git rev-parse HEAD^{tree})"
          mkdir -p docs/rust/qualification
          cat > docs/rust/qualification/ORCHESTRATION_SOURCE_CLOSURE.md <<EOF
          # Orchestration source closure

          This non-activating receipt records a successful pinned Rust 1.98 full-workspace source validation.

          - repository: \`TrillionniumFoundation/hepta-paper\`
          - tested branch: \`codex/rust-full-replacement-rc-20260908\`
          - tested commit: \`${tested_commit}\`
          - tested tree: \`${tested_tree}\`
          - Rust format: passed
          - Rust workspace tests, all features: passed
          - Rust workspace Clippy, all targets and features, warnings denied: passed
          - Rust workspace rustdoc, warnings denied: passed
          - development-document validation: passed
          - module-document validation: passed
          - machine program-truth validation: passed
          - production authority granted: false

          The receipt covers the repository-local orchestration source and does not substitute for target-host, credential, key-custody, private-replay, release, submission, or independent-governance evidence.
          EOF
          rm -f \
            .github/workflows/orchestration-gap-closure-once.yml \
            .github/workflows/orchestration-gap-fix-once.yml \
            .github/workflows/orchestration-gap-finalize-once.yml \
            .github/workflows/orchestration-source-qualification-once.yml \
            .github/workflows/apply-production-freeze-integration-once.yml
          git config user.name hepta-paper-automation
          git config user.email hepta-paper-automation@users.noreply.github.com
          git add rust docs/rust/qualification .github/workflows
          git commit -m 'test(rust): retain full orchestration source closure'
          git push origin HEAD:codex/rust-full-replacement-rc-20260908
