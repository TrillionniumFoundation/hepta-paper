name: plan-v3-expect-regression-fix-once

on:
  push:
    branches:
      - codex/rust-plan-v3-deep-audit-20260830
    paths:
      - '.github/workflows/plan-v3-expect-regression-fix-once.yml'

permissions:
  contents: write

concurrency:
  group: plan-v3-expect-regression-fix-once
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/rust-plan-v3-final-product-20260830
  EXPECTED_HEAD: 87609386794f54373eeb3c38be97663a32c53a6a
  RUSTFLAGS: -Dunsafe-code

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact product branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-plan-v3-final-product-20260830
          fetch-depth: 2
          persist-credentials: true

      - name: Prove expected head and install toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Replace production expect with explicit error propagation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    let packages = QualificationPackageIdV1::ALL
              .into_iter()
              .map(|package| {
                  let record = by_package
                      .get(&package)
                      .expect("complete package set checked above");
                  ClosurePackageReceiptV1 {
                      package_id: package.as_str().to_owned(),
                      payload_hash: record.payload_hash.clone(),
                      authority_domain_id: record.authority_domain_id.clone(),
                      signer_key_id: record.signer_key_id.clone(),
                      nonce: record.nonce.clone(),
                      signing_message_hash: record.signing_message_hash.clone(),
                  }
              })
              .collect::<Vec<_>>();
          '''
          new = '''    let packages = QualificationPackageIdV1::ALL
              .into_iter()
              .map(|package| -> Result<ClosurePackageReceiptV1, ClosureError> {
                  let record = by_package
                      .get(&package)
                      .ok_or(ClosureError::PackageSetIncomplete)?;
                  Ok(ClosurePackageReceiptV1 {
                      package_id: package.as_str().to_owned(),
                      payload_hash: record.payload_hash.clone(),
                      authority_domain_id: record.authority_domain_id.clone(),
                      signer_key_id: record.signer_key_id.clone(),
                      nonce: record.nonce.clone(),
                      signing_message_hash: record.signing_message_hash.clone(),
                  })
              })
              .collect::<Result<Vec<_>, _>>()?;
          '''
          if text.count(old) != 1:
              raise SystemExit('expected qualification receipt block not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml \
            --workspace --lib --bins --all-features --locked -- \
            -D warnings -D unsafe-code \
            -D clippy::todo -D clippy::unimplemented \
            -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Commit validated fix with expected-head guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs
          git commit -m 'fix(qualification): preserve panic-free receipt assembly'
          git push origin "HEAD:$TARGET_BRANCH"
