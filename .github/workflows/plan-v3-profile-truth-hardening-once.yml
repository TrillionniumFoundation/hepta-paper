name: plan-v3-profile-truth-hardening-once

on:
  push:
    branches:
      - codex/rust-plan-v3-deep-audit-20260830
    paths:
      - '.github/workflows/plan-v3-profile-truth-hardening-once.yml'

permissions:
  contents: write

concurrency:
  group: plan-v3-profile-truth-hardening-once
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/rust-plan-v3-final-product-20260830
  EXPECTED_HEAD: 1992dffd7f520a11813cffc34691e94ff0dfd7c8
  PATCH_SHA256: b925c72c2d8e58a8d3b2ae8e724852991b46dbcef14882628e70c3859853a918
  RUSTFLAGS: -Dunsafe-code
  CARGO_TERM_COLOR: always

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact product branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2
          persist-credentials: true

      - name: Prove expected parent and install Rust
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

