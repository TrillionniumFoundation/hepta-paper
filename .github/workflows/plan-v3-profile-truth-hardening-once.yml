          cargo fmt --manifest-path rust/Cargo.toml --all
          python3 -m json.tool docs/rust/current-status.v1.json >/dev/null
          python3 -m py_compile docs/rust/tools/validate-program-truth.py
          python3 docs/rust/tools/validate-program-truth.py
          node paper-core/bin/check-mjs-syntax.mjs
          node paper-core/bin/source-supply-chain-security.mjs
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              '.github/workflows/rust-foundation.yml',
              'docs/rust/RUST_RISK_REGISTER.md',
              'docs/rust/current-status.v1.json',
              'docs/rust/tools/validate-program-truth.py',
              'rust/crates/hepta-codex-broker/tests/durable_process_journal.rs',
              'rust/crates/hepta-codex-runtime/src/bin/hepta-codex-preexec-gate.rs',
          }
          observed = set(
              subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          )
          if observed != expected:
              raise SystemExit(f'unexpected patch surface: {sorted(observed ^ expected)}')
          if Path('.github/workflows/plan-v3-profile-truth-hardening-once.yml').exists():
              pass
          print('exact hardening surface verified')
          PY
          git diff --stat

      - name: Validate Rust debug and release profiles
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features --locked -- \
            -D warnings -D unsafe-code -D clippy::todo -D clippy::unimplemented
          cargo clippy --manifest-path rust/Cargo.toml \
            --workspace --lib --bins --all-features --locked -- \
            -D warnings -D unsafe-code \
            -D clippy::todo -D clippy::unimplemented \
            -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          cargo test --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features --locked
          cargo test --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features --locked --release -- \
            --test-threads=1
          RUSTDOCFLAGS='-D warnings' cargo doc --manifest-path rust/Cargo.toml \
            --workspace --all-features --locked --no-deps
          git diff --check

      - name: Commit exact validated hardening
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -n "$(git status --porcelain)"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/rust-foundation.yml \
            docs/rust/RUST_RISK_REGISTER.md \
            docs/rust/current-status.v1.json \
            docs/rust/tools/validate-program-truth.py \
            rust/crates/hepta-codex-broker/tests/durable_process_journal.rs \
            rust/crates/hepta-codex-runtime/src/bin/hepta-codex-preexec-gate.rs
          git commit -m 'fix(rust): close profile and gate-read evidence gaps'
          git push origin "HEAD:$TARGET_BRANCH"
