name: plan-v3-schema-runtime-alignment-fix-once

on:
  push:
    branches:
      - codex/rust-plan-v3-deep-audit-20260830
    paths:
      - '.github/workflows/plan-v3-schema-runtime-alignment-fix-once.yml'

permissions:
  contents: write

concurrency:
  group: plan-v3-schema-runtime-alignment-fix-once
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/rust-plan-v3-final-product-20260830
  EXPECTED_HEAD: 7d0660be80b119251c2313e59965a4df9625c34b
  RUSTFLAGS: -Dunsafe-code -C overflow-checks=yes

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact product branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-plan-v3-final-product-20260830
          fetch-depth: 2
          persist-credentials: true

      - name: Prove expected head and install toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Align payload semantics and profile-aware installed tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          payload = Path('rust/crates/hepta-qualification-ingest/src/package_payload.rs')
          text = payload.read_text(encoding='utf-8')

          old = '''const REQUIRED_GOVERNANCE_DENIALS: [&str; 7] = [
              "direct_push",
              "stale_approval",
              "missing_check",
              "failed_check",
              "force_push",
              "branch_deletion",
              "administrator_bypass",
          ];
          const REQUIRED_HOST_CGROUP_DRILLS: [&str; 9] = [
          '''
          new = '''const REQUIRED_GOVERNANCE_DENIALS: [&str; 7] = [
              "direct_push",
              "stale_approval",
              "missing_check",
              "failed_check",
              "force_push",
              "branch_deletion",
              "administrator_bypass",
          ];
          const REQUIRED_GOVERNANCE_CHECK_FAMILIES: [&str; 10] = [
              "hepta-paper-ci",
              "exact-head-source-validation",
              "rust-foundation",
              "workflow-lint",
              "rust-program-truth",
              "rust-plan-v3-external-contracts",
              "rust-supply-chain",
              "rust-qualification-artifacts",
              "rust-broker-installed-qualification",
              "rust-broker-installed-qualification-v2",
          ];
          const REQUIRED_HOST_CGROUP_DRILLS: [&str; 9] = [
          '''
          if text.count(old) != 1:
              raise SystemExit('governance constant insertion point not found exactly once')
          text = text.replace(old, new)

          old = '''    let checks = array(root, "requiredChecks")?;
              if checks.len() < 10 {
                  return Err(QualificationPayloadError::SemanticInvalid);
              }
              unique_strings(checks, valid_check_name)?;
          '''
          new = '''    let checks = array(root, "requiredChecks")?;
              if checks.len() < REQUIRED_GOVERNANCE_CHECK_FAMILIES.len() {
                  return Err(QualificationPayloadError::SemanticInvalid);
              }
              unique_strings(checks, valid_check_name)?;
              if REQUIRED_GOVERNANCE_CHECK_FAMILIES
                  .iter()
                  .any(|required| !checks.iter().any(|value| value.as_str() == Some(required)))
              {
                  return Err(QualificationPayloadError::SemanticInvalid);
              }
          '''
          if text.count(old) != 1:
              raise SystemExit('governance checks block not found exactly once')
          text = text.replace(old, new)

          old = '''fn time_window(root: &Map<String, Value>) -> Result<(), QualificationPayloadError> {
              let issued = timestamp(root, "issuedAt")?;
              let expires = timestamp(root, "expiresAt")?;
              if issued >= expires {
                  return Err(QualificationPayloadError::SemanticInvalid);
              }
              Ok(())
          }
          '''
          new = '''fn time_window(root: &Map<String, Value>) -> Result<(), QualificationPayloadError> {
              let issued = timestamp(root, "issuedAt")?;
              let expires = timestamp(root, "expiresAt")?;
              if !timestamp_is_strictly_before(issued, expires) {
                  return Err(QualificationPayloadError::SemanticInvalid);
              }
              Ok(())
          }

          fn timestamp_is_strictly_before(left: &str, right: &str) -> bool {
              let left_bytes = left.as_bytes();
              let right_bytes = right.as_bytes();
              match left_bytes[..19].cmp(&right_bytes[..19]) {
                  std::cmp::Ordering::Less => return true,
                  std::cmp::Ordering::Greater => return false,
                  std::cmp::Ordering::Equal => {}
              }
              let left_fraction = timestamp_fraction(left_bytes);
              let right_fraction = timestamp_fraction(right_bytes);
              let width = left_fraction.len().max(right_fraction.len());
              for index in 0..width {
                  let left_digit = left_fraction.get(index).copied().unwrap_or(b'0');
                  let right_digit = right_fraction.get(index).copied().unwrap_or(b'0');
                  match left_digit.cmp(&right_digit) {
                      std::cmp::Ordering::Less => return true,
                      std::cmp::Ordering::Greater => return false,
                      std::cmp::Ordering::Equal => {}
                  }
              }
              false
          }

          fn timestamp_fraction(bytes: &[u8]) -> &[u8] {
              if bytes.get(19) == Some(&b'.') {
                  &bytes[20..bytes.len() - 1]
              } else {
                  &[]
              }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('time window block not found exactly once')
          text = text.replace(old, new)

          old = '''fn valid_identifier(value: &str) -> bool {
              !value.is_empty()
                  && value.len() <= 128
                  && value
                      .bytes()
                      .all(|byte| byte.is_ascii_alphanumeric() || matches!(byte, b'-' | b'_' | b'.' | b':'))
          }
          '''
          new = '''fn valid_identifier(value: &str) -> bool {
              let mut bytes = value.bytes();
              matches!(bytes.next(), Some(first) if first.is_ascii_alphanumeric())
                  && value.len() <= 128
                  && bytes.all(|byte| {
                      byte.is_ascii_alphanumeric() || matches!(byte, b'-' | b'_' | b'.' | b':')
                  })
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('identifier validator not found exactly once')
          text = text.replace(old, new)

          old = '''fn valid_check_name(value: &str) -> bool {
              !value.is_empty()
                  && value.len() <= 256
                  && value
                      .bytes()
                      .all(|byte| byte.is_ascii_alphanumeric() || b" ._()/-".contains(&byte))
          }
          '''
          new = '''fn valid_check_name(value: &str) -> bool {
              let mut bytes = value.bytes();
              matches!(bytes.next(), Some(first) if first.is_ascii_alphanumeric())
                  && value.len() <= 256
                  && bytes.all(|byte| {
                      byte.is_ascii_alphanumeric() || b" ._()/-".contains(&byte)
                  })
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('check-name validator not found exactly once')
          text = text.replace(old, new)

          old = '''fn valid_utc_timestamp(value: &str) -> bool {
              let bytes = value.as_bytes();
              (20..=40).contains(&bytes.len())
                  && bytes.get(4) == Some(&b'-')
                  && bytes.get(7) == Some(&b'-')
                  && bytes.get(10) == Some(&b'T')
                  && bytes.get(13) == Some(&b':')
                  && bytes.get(16) == Some(&b':')
                  && bytes.last() == Some(&b'Z')
                  && [0, 1, 2, 3, 5, 6, 8, 9, 11, 12, 14, 15, 17, 18]
                      .into_iter()
                      .all(|index| bytes.get(index).is_some_and(u8::is_ascii_digit))
          }
          '''
          new = '''fn valid_utc_timestamp(value: &str) -> bool {
              let bytes = value.as_bytes();
              if bytes.len() < 20
                  || bytes.get(4) != Some(&b'-')
                  || bytes.get(7) != Some(&b'-')
                  || bytes.get(10) != Some(&b'T')
                  || bytes.get(13) != Some(&b':')
                  || bytes.get(16) != Some(&b':')
                  || bytes.last() != Some(&b'Z')
                  || ![0, 1, 2, 3, 5, 6, 8, 9, 11, 12, 14, 15, 17, 18]
                      .into_iter()
                      .all(|index| bytes.get(index).is_some_and(u8::is_ascii_digit))
              {
                  return false;
              }
              match bytes.get(19) {
                  Some(b'Z') => bytes.len() == 20,
                  Some(b'.') => {
                      bytes.len() > 21
                          && bytes[20..bytes.len() - 1]
                              .iter()
                              .all(u8::is_ascii_digit)
                  }
                  _ => false,
              }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('timestamp validator not found exactly once')
          text = text.replace(old, new)

          old = '''            "requiredChecks": [
                          "check-1", "check-2", "check-3", "check-4", "check-5",
                          "check-6", "check-7", "check-8", "check-9", "check-10"
                      ],
          '''
          new = '''            "requiredChecks": REQUIRED_GOVERNANCE_CHECK_FAMILIES,
          '''
          if text.count(old) != 1:
              raise SystemExit('governance test check fixture not found exactly once')
          text = text.replace(old, new)

          marker = '''    #[test]
              fn canonical_compact_json_is_required() {
          '''
          tests = '''    #[test]
              fn schema_aligned_identifiers_checks_and_timestamps_are_enforced() {
                  for value in ["a", "A0", "review:key-1", "authority_domain.v1"] {
                      assert!(valid_identifier(value), "valid identifier rejected: {value}");
                  }
                  for value in ["", "-leading", "_leading", ".leading", ":leading", "é"] {
                      assert!(!valid_identifier(value), "invalid identifier accepted: {value}");
                  }
                  assert!(!valid_identifier(&"a".repeat(129)));

                  assert!(valid_check_name("hepta-paper-ci"));
                  assert!(valid_check_name("format, lint, test, docs"));
                  assert!(!valid_check_name("-leading-check"));
                  assert!(!valid_check_name(" check"));

                  assert!(valid_utc_timestamp("2026-08-30T00:00:00Z"));
                  assert!(valid_utc_timestamp("2026-08-30T00:00:00.123456789Z"));
                  assert!(!valid_utc_timestamp("2026-08-30T00:00:00.Z"));
                  assert!(!valid_utc_timestamp("2026-08-30T00:00:00x123Z"));
                  assert!(!valid_utc_timestamp("2026-08-30T00:00:00.12xZ"));
              }

              #[test]
              fn governance_requires_every_named_workflow_family() {
                  let mut value = governance();
                  value["requiredChecks"][0] = json!("unrelated-check");
                  assert!(matches!(
                      validate_external_package_payload_v1(
                          &encoded(value),
                          &subject(QualificationPackageIdV1::ExtGovMain001),
                          REVIEWER,
                          REVIEWER_KEY,
                      ),
                      Err(QualificationPayloadError::SemanticInvalid)
                  ));
              }

              #[test]
              fn payload_authority_identifiers_reject_leading_punctuation() {
                  let mut value = governance();
                  value["reviewerAuthorityDomain"] = json!("-reviewer");
                  assert!(matches!(
                      validate_external_package_payload_v1(
                          &encoded(value),
                          &subject(QualificationPackageIdV1::ExtGovMain001),
                          REVIEWER,
                          REVIEWER_KEY,
                      ),
                      Err(QualificationPayloadError::SchemaInvalid)
                  ));
              }

              #[test]
              fn fractional_timestamp_order_is_numeric_and_strict() {
                  let mut reversed = governance();
                  reversed["issuedAt"] = json!("2026-08-30T00:00:00.9Z");
                  reversed["expiresAt"] = json!("2026-08-30T00:00:00.10Z");
                  assert!(matches!(
                      time_window(object(&reversed).expect("governance object")),
                      Err(QualificationPayloadError::SemanticInvalid)
                  ));

                  let mut equal = governance();
                  equal["issuedAt"] = json!("2026-08-30T00:00:00.1Z");
                  equal["expiresAt"] = json!("2026-08-30T00:00:00.100Z");
                  assert!(matches!(
                      time_window(object(&equal).expect("governance object")),
                      Err(QualificationPayloadError::SemanticInvalid)
                  ));

                  let mut ordered = governance();
                  ordered["issuedAt"] = json!("2026-08-30T00:00:00Z");
                  ordered["expiresAt"] = json!("2026-08-30T00:00:00.0001Z");
                  assert!(time_window(object(&ordered).expect("governance object")).is_ok());
              }

          ''' + marker
          if text.count(marker) != 1:
              raise SystemExit('test insertion marker not found exactly once')
          text = text.replace(marker, tests)
          payload.write_text(text, encoding='utf-8')

          broker_test = Path('rust/crates/hepta-codex-broker/tests/durable_process_journal.rs')
          text = broker_test.read_text(encoding='utf-8')
          old = '''        let target_dir = std::env::var_os("CARGO_TARGET_DIR")
                      .map(PathBuf::from)
                      .unwrap_or_else(|| PathBuf::from(env!("CARGO_MANIFEST_DIR")).join("../../target"));
                  let built = if target_dir.is_absolute() {
                      target_dir.join("debug/hepta-codex-preexec-gate")
                  } else {
                      PathBuf::from(env!("CARGO_MANIFEST_DIR"))
                          .join("../..")
                          .join(target_dir)
                          .join("debug/hepta-codex-preexec-gate")
                  };
          '''
          new = '''        let current_test = std::env::current_exe().expect("current test executable");
                  let deps_dir = current_test.parent().expect("test executable parent");
                  let profile_dir = deps_dir.parent().expect("target profile directory");
                  let built = profile_dir.join("hepta-codex-preexec-gate");
          '''
          if text.count(old) != 1:
              raise SystemExit('debug-only gate path block not found exactly once')
          broker_test.write_text(text.replace(old, new), encoding='utf-8')

          schema_path = Path('docs/rust/qualification/protected-main-ruleset-evidence-v1.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          families = [
              'hepta-paper-ci',
              'exact-head-source-validation',
              'rust-foundation',
              'workflow-lint',
              'rust-program-truth',
              'rust-plan-v3-external-contracts',
              'rust-supply-chain',
              'rust-qualification-artifacts',
              'rust-broker-installed-qualification',
              'rust-broker-installed-qualification-v2',
          ]
          checks = schema['properties']['requiredChecks']
          checks['allOf'] = [
              {
                  'contains': {'const': family},
                  'minContains': 1,
                  'maxContains': 1,
              }
              for family in families
          ]
          schema_path.write_text(json.dumps(schema, indent=2) + '\n', encoding='utf-8')
          PY

          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --all-features --locked
          cargo build --manifest-path rust/Cargo.toml \
            -p hepta-codex-runtime --bin hepta-codex-preexec-gate --release --locked
          cargo test --manifest-path rust/Cargo.toml \
            -p hepta-codex-broker --test durable_process_journal \
            --release --locked -- --test-threads=1
          cargo clippy --manifest-path rust/Cargo.toml \
            --workspace --lib --bins --all-features --locked -- \
            -D warnings -D unsafe-code \
            -D clippy::todo -D clippy::unimplemented \
            -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          python3 -m json.tool \
            docs/rust/qualification/protected-main-ruleset-evidence-v1.schema.json \
            >/dev/null
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Commit validated hardening with expected-head guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            rust/crates/hepta-qualification-ingest/src/package_payload.rs \
            rust/crates/hepta-codex-broker/tests/durable_process_journal.rs \
            docs/rust/qualification/protected-main-ruleset-evidence-v1.schema.json
          git commit -m 'fix(qualification): align payload schemas and release tests'
          git push origin "HEAD:$TARGET_BRANCH"
