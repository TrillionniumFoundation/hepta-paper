name: pr53-wave3-continuation-source-assembly
on:
  push:
    branches: [ops/pr53-wave3-continuation-assembly-20260905]
permissions:
  contents: read
jobs:
  assemble-source-blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: operation
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: c5316ef0b30deec3f1783aaee86792d9ccfe2a37
          path: candidate
          persist-credentials: false
      - name: Apply only the frozen patch and upload verified source blobs without executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_OPTIONAL_LOCKS: '0'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          repo = 'TrillionniumFoundation/hepta-paper'
          base = 'c5316ef0b30deec3f1783aaee86792d9ccfe2a37'
          base_tree = '858feb5e8f3560222b717fb6f9b6dfbe359762d7'
          expected_tree = 'b7271d877dcf126c2ba01f252b030099729d07ce'
          expected_patch = 'ee3b72ebb7ef4fcbe2cc88ae6dabe4da5f4039560ee0cfaf039404f1aa63b529'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_EVENT_NAME'] == 'push'
          assert os.environ['GITHUB_REF'] == 'refs/heads/ops/pr53-wave3-continuation-assembly-20260905'
          cwd = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'candidate'
          def git(*args):
              return subprocess.check_output(['/usr/bin/git', '-c', 'core.hooksPath=/dev/null',
                  '-c', 'core.fsmonitor=false', '-c', 'core.attributesFile=/dev/null', *args], cwd=cwd)
          assert git('rev-parse', 'HEAD').decode().strip() == base
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == base_tree
          assert not git('status', '--porcelain=v1', '--untracked-files=all')
          encoded = b''.join((cwd.parent / f'operation/.github/ops/pr53-continuation.part-{i}').read_bytes() for i in range(3))
          assert len(encoded) == 12332
          decoder = zlib.decompressobj(16 + zlib.MAX_WBITS)
          patch = decoder.decompress(base64.b64decode(encoded, validate=True), 40227)
          assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
          assert len(patch) == 40226 and hashlib.sha256(patch).hexdigest() == expected_patch
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-assembly-evidence'
          evidence.mkdir(mode=0o700)
          patch_file = evidence / 'source.patch'
          patch_file.write_bytes(patch)
          git('apply', '--index', '--check', str(patch_file))
          git('apply', '--index', str(patch_file))
          assert git('write-tree').decode().strip() == expected_tree
          paths = git('diff', '--cached', '--name-only', '-z', base).decode().split('\0')[:-1]
          assert len(paths) == len(set(paths)) == 9
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError('github_api_redirect_forbidden')
          opener = urllib.request.build_opener(NoRedirect())
          records = []
          for selected in paths:
              raw = git('show', ':' + selected)
              digest = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              mode = git('ls-files', '-s', '--', selected).decode().split(' ', 1)[0]
              assert mode in ('100644', '100755')
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/blobs',
                  data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(raw).decode()}).encode(),
                  method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                    'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                    'X-GitHub-Api-Version': '2022-11-28'})
              with opener.open(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == digest
              records.append({'path': selected, 'mode': mode, 'type': 'blob', 'sha': digest,
                  'sha256': hashlib.sha256(raw).hexdigest()})
          record = {'kind': 'NonAuthorizingSourceBlobAssembly', 'baseCommit': base,
              'baseTree': base_tree, 'sourceTree': expected_tree, 'patchSha256': expected_patch,
              'runId': os.environ['GITHUB_RUN_ID'], 'producerCommit': os.environ['GITHUB_SHA'],
              'files': records, 'refsChanged': False, 'candidateCodeExecuted': False,
              'treePublished': False, 'productionAuthorized': False, 'qualificationClaimed': False}
          (evidence / 'assembly.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps({'sourceTree': expected_tree, 'blobs': len(records), 'refsChanged': False}))
          PY
      - name: Retain the source transport record, not a test or qualification result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr53-wave3-continuation-source-assembly
          path: ${{ runner.temp }}/source-assembly-evidence
          retention-days: 7
          if-no-files-found: error
