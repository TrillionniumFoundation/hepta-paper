name: production-wiring-once

on:
  push:
    branches:
      - codex/rust-native-business-workers-20260908
    paths:
      - .github/workflows/production-wiring-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-native-business-workers-20260908
          fetch-depth: 0
      - name: Install pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
      - name: Wire production authority and closure freshness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('rust/crates/hepta-qualification-ingest/src/closure.rs')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('''    receipt_hash: String,
              trust_store_generation: u64,
              packages:''', '''    receipt_hash: String,
              trust_store_generation: u64,
              verified_at_unix_ms: u64,
              expires_at_unix_ms: u64,
              packages:'''),
              ('''    pub const fn trust_store_generation(&self) -> u64 {
                  self.trust_store_generation
              }

              /// Cross-package host, database, service and runtime facts.''', '''    pub const fn trust_store_generation(&self) -> u64 {
                  self.trust_store_generation
              }

              /// Rechecks that the complete package set is still within the verified window.
              pub fn assert_current(&self, now_unix_ms: u64) -> Result<(), QualificationClosureError> {
                  if now_unix_ms < self.verified_at_unix_ms || now_unix_ms >= self.expires_at_unix_ms {
                      return Err(QualificationClosureError::ClosureExpired);
                  }
                  Ok(())
              }

              /// Earliest expiry among the seven independently signed packages.
              #[must_use]
              pub const fn expires_at_unix_ms(&self) -> u64 {
                  self.expires_at_unix_ms
              }

              /// Cross-package host, database, service and runtime facts.'''),
              ('''    let mut total_payload_bytes = 0usize;
              let mut records = Vec::with_capacity(candidates.len());''', '''    let expires_at_unix_ms = candidates
                  .iter()
                  .map(|candidate| candidate.envelope.expires_at_unix_ms)
                  .min()
                  .ok_or(QualificationClosureError::PackageSetIncomplete)?;
              let mut total_payload_bytes = 0usize;
              let mut records = Vec::with_capacity(candidates.len());'''),
              ('''    assemble_verified_closure(subject, trust_store_generation, records)
          }

          fn assemble_verified_closure(
              subject: &ExternalQualificationClosureSubjectV1,
              trust_store_generation: u64,
              records:''', '''    assemble_verified_closure(
                  subject,
                  trust_store_generation,
                  now_unix_ms,
                  expires_at_unix_ms,
                  records,
              )
          }

          fn assemble_verified_closure(
              subject: &ExternalQualificationClosureSubjectV1,
              trust_store_generation: u64,
              verified_at_unix_ms: u64,
              expires_at_unix_ms: u64,
              records:'''),
              ('''    let mut by_package = BTreeMap::new();''', '''    if verified_at_unix_ms == 0 || expires_at_unix_ms <= verified_at_unix_ms {
                  return Err(QualificationClosureError::ClosureExpired);
              }
              let mut by_package = BTreeMap::new();'''),
              ('''        trust_store_generation,
                  packages: ordered_packages,''', '''        trust_store_generation,
                  verified_at_unix_ms,
                  expires_at_unix_ms,
                  packages: ordered_packages,'''),
              ('''        trust_store_generation,
                  packages: by_package,''', '''        trust_store_generation,
                  verified_at_unix_ms,
                  expires_at_unix_ms,
                  packages: by_package,'''),
              ('''    trust_store_generation: u64,
              packages: Vec<ClosurePackageBodyV1''', '''    trust_store_generation: u64,
              verified_at_unix_ms: u64,
              expires_at_unix_ms: u64,
              packages: Vec<ClosurePackageBodyV1'''),
              ('''    /// Package-specific canonical semantics or nested signatures failed.
              #[error(transparent)]
              Payload(#[from] QualificationPayloadError),''', '''    /// The closure is used outside the common verified package lifetime.
              #[error("external qualification closure is expired or not yet current")]
              ClosureExpired,
              /// Package-specific canonical semantics or nested signatures failed.
              #[error(transparent)]
              Payload(#[from] QualificationPayloadError),'''),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'closure anchor not found: {old[:80]!r}')
              s = s.replace(old, new, 1)
          s = s.replace('assemble_verified_closure(&subject(), 7, complete_records())',
                        'assemble_verified_closure(&subject(), 7, 1_000, 2_000, complete_records())')
          s = s.replace('assemble_verified_closure(&subject(), 1, incomplete)',
                        'assemble_verified_closure(&subject(), 1, 1_000, 2_000, incomplete)')
          s = s.replace('assemble_verified_closure(&subject(), 1, duplicate)',
                        'assemble_verified_closure(&subject(), 1, 1_000, 2_000, duplicate)')
          s = s.replace('assemble_verified_closure(&subject(), 1, collapsed)',
                        'assemble_verified_closure(&subject(), 1, 1_000, 2_000, collapsed)')
          s = s.replace('assemble_verified_closure(&subject(), 1, records)',
                        'assemble_verified_closure(&subject(), 1, 1_000, 2_000, records)')
          marker = '        assert!(valid_sha256(verified.receipt_hash()));'
          if marker not in s:
              raise SystemExit('closure test marker missing')
          s = s.replace(marker, marker + '''
                  assert_eq!(verified.expires_at_unix_ms(), 2_000);
                  assert!(verified.assert_current(1_500).is_ok());
                  assert!(matches!(
                      verified.assert_current(2_000),
                      Err(QualificationClosureError::ClosureExpired)
                  ));''', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('rust/crates/hepta-campaign-writer/src/cutover.rs')
          s = p.read_text(encoding='utf-8')
          old = '''    pub(crate) fn database_preimage_hash(&self) -> &Sha256Digest {
                  &self.database_preimage_hash
              }'''
          new = '''    /// Exact database preimage hash bound by the independent authorization.
              #[must_use]
              pub fn database_preimage_hash(&self) -> &Sha256Digest {
                  &self.database_preimage_hash
              }'''
          if old not in s:
              raise SystemExit('cutover accessor anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('rust/crates/hepta-paper-service/Cargo.toml')
          s = p.read_text(encoding='utf-8')
          anchor = 'hepta-readonly-store = { path = "../hepta-readonly-store", version = "=0.1.0" }\n'
          if anchor not in s or 'hepta-qualification-ingest' in s:
              raise SystemExit('service dependency anchor missing')
          p.write_text(s.replace(anchor, anchor + 'hepta-qualification-ingest = { path = "../hepta-qualification-ingest", version = "=0.1.0" }\n', 1), encoding='utf-8')

          p = Path('rust/crates/hepta-paper-service/src/lib.rs')
          s = p.read_text(encoding='utf-8')
          if 'mod production;' in s:
              raise SystemExit('production module already wired')
          s = s.replace('mod objects;\nmod worker;', 'mod objects;\nmod production;\nmod worker;', 1)
          s = s.replace('pub use objects::ObjectStoreV1;', '''pub use objects::ObjectStoreV1;
          pub use production::{
              ProductionActivationStageV1, ProductionServiceReceiptV1, ProductionServiceRunV1,
              run_production_service_v1,
          };''', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('rust/Cargo.lock')
          s = p.read_text(encoding='utf-8')
          anchor = ' "hepta-module-platform",\n "hepta-readonly-store",'
          if anchor not in s:
              raise SystemExit('lock dependency anchor missing')
          p.write_text(s.replace(anchor, ' "hepta-module-platform",\n "hepta-qualification-ingest",\n "hepta-readonly-store",', 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
      - name: Commit exact production wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-paper-automation"
          git config user.email "hepta-paper-automation@users.noreply.github.com"
          git add rust/Cargo.lock \
            rust/crates/hepta-campaign-writer/src/cutover.rs \
            rust/crates/hepta-paper-service/Cargo.toml \
            rust/crates/hepta-paper-service/src/lib.rs \
            rust/crates/hepta-paper-service/src/production.rs \
            rust/crates/hepta-qualification-ingest/src/closure.rs
          git commit -m "feat(rust): wire verified production authority"
          git push origin HEAD:codex/rust-native-business-workers-20260908
