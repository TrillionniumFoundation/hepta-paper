name: promote-orchestration-source-status-once

on:
  push:
    branches:
      - codex/rust-full-replacement-rc-20260908
    paths:
      - .github/workflows/promote-orchestration-source-status-once.yml

permissions:
  contents: write

concurrency:
  group: promote-orchestration-source-status-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.actor != 'hepta-paper-automation'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact RC head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require successful orchestration source closure
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/rust/qualification/ORCHESTRATION_SOURCE_CLOSURE.md
          grep -F -- '- all-feature workspace tests: passed' docs/rust/qualification/ORCHESTRATION_SOURCE_CLOSURE.md
          grep -F -- '- all-target/all-feature Clippy with warnings denied: passed' docs/rust/qualification/ORCHESTRATION_SOURCE_CLOSURE.md
          grep -F -- '- all-feature rustdoc with warnings denied: passed' docs/rust/qualification/ORCHESTRATION_SOURCE_CLOSURE.md
          grep -F -- '- production authority granted: false' docs/rust/qualification/ORCHESTRATION_SOURCE_CLOSURE.md

      - name: Promote exact repository-local module source status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          targets = {
              'candidate-router': 'rust/crates/hepta-orchestration-kernel/src/router.rs',
              'snapshot-builder': 'rust/crates/hepta-orchestration-kernel/src/snapshot.rs',
              'performance-qualification': 'rust/crates/hepta-orchestration-kernel/src/performance.rs',
          }
          identity_keys = ('moduleId', 'module_id', 'id', 'name', 'componentId', 'component_id')
          status_keys = ('status', 'implementationStatus', 'implementation_status', 'sourceStatus', 'source_status')
          path_keys = ('implementationPaths', 'implementation_paths', 'sourcePaths', 'source_paths')
          changed_targets = {target: 0 for target in targets}

          def visit(value):
              if isinstance(value, dict):
                  identities = {str(value.get(key)) for key in identity_keys if key in value}
                  for target, source_path in targets.items():
                      if target in identities:
                          touched = False
                          for key in status_keys:
                              if value.get(key) == 'design_ready':
                                  value[key] = 'source_implemented'
                                  touched = True
                              elif value.get(key) in ('source_implemented', 'source_qualified'):
                                  touched = True
                          for key in path_keys:
                              paths = value.get(key)
                              if isinstance(paths, list) and source_path not in paths:
                                  paths.append(source_path)
                                  touched = True
                          implementation = value.get('implementation')
                          if isinstance(implementation, dict):
                              for key in ('paths', 'sourcePaths', 'source_paths'):
                                  paths = implementation.get(key)
                                  if isinstance(paths, list) and source_path not in paths:
                                      paths.append(source_path)
                                      touched = True
                          if touched:
                              changed_targets[target] += 1
                  for item in value.values():
                      visit(item)
              elif isinstance(value, list):
                  for item in value:
                      visit(item)

          json_paths = [
              Path('docs/system/truth/modules.v1.json'),
              Path('docs/system/truth/program.v2.json'),
              Path('docs/rust/current-status.v1.json'),
              Path('docs/modules/module-documentation.v1.json'),
          ]
          json_paths.extend(Path('docs/modules/manifests').glob('*.json'))
          for path in json_paths:
              if not path.exists():
                  continue
              original = path.read_text(encoding='utf-8')
              try:
                  value = json.loads(original)
              except json.JSONDecodeError:
                  continue
              before = json.dumps(value, sort_keys=True, separators=(',', ':'))
              visit(value)
              after = json.dumps(value, sort_keys=True, separators=(',', ':'))
              if after != before:
                  if original.count('\n') <= 2:
                      rendered = json.dumps(value, sort_keys=False, separators=(',', ':')) + '\n'
                  else:
                      rendered = json.dumps(value, ensure_ascii=False, indent=2) + '\n'
                  path.write_text(rendered, encoding='utf-8')

          for target, count in changed_targets.items():
              if count == 0:
                  raise SystemExit(f'no machine record found for {target}')

          spec_paths = {
              'candidate-router': Path('docs/modules/specs/candidate-router.md'),
              'snapshot-builder': Path('docs/modules/specs/snapshot-builder.md'),
              'performance-qualification': Path('docs/modules/specs/performance-qualification.md'),
          }
          for target, path in spec_paths.items():
              text = path.read_text(encoding='utf-8')
              source_path = targets[target]
              marker = '## Rust source implementation'
              if marker not in text:
                  text = text.rstrip() + f'''\n\n{marker}\n\nStatic source status: `source_implemented`; production activation remains disabled until the applicable external evidence is accepted.\n\nCanonical implementation: `{source_path}` through the `hepta-control-plane` orchestration facade.\n\nThe implementation is covered by the pinned Rust 1.98 full-workspace source closure and does not grant target-host, credential, release, submission, or retirement authority.\n'''
                  path.write_text(text, encoding='utf-8')

          matrix = Path('docs/modules/MODULE_DOCUMENTATION_MATRIX.md')
          if matrix.exists():
              lines = []
              for line in matrix.read_text(encoding='utf-8').splitlines():
                  if any(target in line for target in targets):
                      line = line.replace('design_ready', 'source_implemented')
                  lines.append(line)
              matrix.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          status_doc = Path('docs/rust/CURRENT_STATUS.md')
          if status_doc.exists():
              text = status_doc.read_text(encoding='utf-8')
              for label in ('Candidate router', 'Snapshot builder', 'Performance qualification'):
                  for token in ('`design_ready`', 'design_ready'):
                      lines = text.splitlines()
                      for index, line in enumerate(lines):
                          if label.lower() in line.lower() and token in line:
                              lines[index] = line.replace(token, '`source_implemented`' if token.startswith('`') else 'source_implemented')
                      text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
              status_doc.write_text(text, encoding='utf-8')
          PY

      - name: Revalidate source, documentation and machine truth
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo test --manifest-path rust/Cargo.toml -p hepta-orchestration-kernel -p hepta-control-plane --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml -p hepta-orchestration-kernel -p hepta-control-plane --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --manifest-path rust/Cargo.toml -p hepta-orchestration-kernel -p hepta-control-plane --all-features --no-deps --locked
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          python3 docs/rust/tools/validate-program-truth.py

      - name: Commit source-status promotion and delete one-shot automation
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \( -name '*-once.yml' -o -name '*-once.yaml' \) -print -delete
          git config user.name hepta-paper-automation
          git config user.email hepta-paper-automation@users.noreply.github.com
          git add docs rust .github/workflows
          git commit -m 'docs(rust): promote validated orchestration modules to source implemented'
          git push origin HEAD:codex/rust-full-replacement-rc-20260908
