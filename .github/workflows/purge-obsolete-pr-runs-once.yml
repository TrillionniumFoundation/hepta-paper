name: purge-obsolete-pr-runs-once

on:
  push:
    branches:
      - codex/rust-final-gap-closure-20260830
    paths:
      - '.github/workflows/purge-obsolete-pr-runs-once.yml'

permissions:
  contents: read

concurrency:
  group: purge-obsolete-pr-runs-once
  cancel-in-progress: true

jobs:
  disarmed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preserve all current exact-head runs
        run: |
          set -euo pipefail
          echo 'Obsolete-run purge disarmed because the canonical exact-head and CI jobs acquired runners.'
          echo 'No Actions cancellation endpoint was invoked by this revision.' >> "$GITHUB_STEP_SUMMARY"
