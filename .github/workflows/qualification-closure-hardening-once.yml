          o7hIJbZmGutp5NPtVSd72AEBTapxYaYS4begiXTEYp17Cw2yxw1pfitA2Q1RNVGbfVxZWKysldzb
          xz0h9GiG+8qWq5Z1k7DZ1HL9ttw9UKLo5VtgL+nxcYjtrF4wvkDsyhmVKvQ4HColVRT5MK/BnIsV
          ptuv6shFJv8fvP9Q8LafQO8V6CI1HsQdUm2+xfSrCqh3OS2Vclbk7qyq8X/lnFpRetMZleNlCakS
          bypIhwnJlUwKZveG/3fO/aGoceXvA3lLbl4UAAA=
          B64
          python3 "$RUNNER_TEMP/remove_expect.py"
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml \
            -p hepta-codex-runtime -p hepta-qualification-ingest \
            --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml \
            --workspace --lib --bins --all-features --locked -- \
            -D warnings -D unsafe-code \
            -D clippy::todo -D clippy::unimplemented \
            -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          git diff --check

      - name: Commit validated source hardening
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code --quiet && { echo 'no product changes'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            rust/crates/hepta-codex-runtime/src/environment.rs \
            rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs
          git diff --cached --check
          git commit -m 'fix(rust): remove remaining production expect paths'
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_HEAD"
          git push origin "HEAD:$TARGET_BRANCH"
