name: final-product-security-audit-once

on:
  push:
    branches:
      - codex/rust-plan-v3-qualification-hardening-20260830
    paths:
      - '.github/workflows/qualification-closure-hardening-once.yml'

permissions:
  contents: read

concurrency:
  group: final-product-security-audit-once
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 3313964f2a21ee3e7b6c56b3c2e3cae1a3c7e966
          fetch-depth: 1
          persist-credentials: false

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Reject semantic unsafe, TODO and unimplemented code
        shell: bash
        env:
          RUSTFLAGS: '-Dunsafe-code'
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features --locked -- \
            -D warnings -D unsafe-code -D clippy::todo -D clippy::unimplemented

      - name: Inventory production panic and authority-sensitive surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          import re

          patterns = {
              'panic_macro': re.compile(r'\bpanic!\s*\('),
              'unwrap_call': re.compile(r'\.unwrap\s*\('),
              'expect_call': re.compile(r'\.expect\s*\('),
              'process_command': re.compile(r'(?:std::process::|process::)?Command::new\s*\('),
              'process_exit': re.compile(r'(?:std::process::|process::)exit\s*\('),
              'environment_read': re.compile(r'(?:std::env::|env::)(?:var|var_os)\s*\('),
              'lint_allow': re.compile(r'#\s*!?\s*\[\s*allow\s*\('),
              'todo_comment': re.compile(r'\b(?:TODO|FIXME|XXX|HACK)\b', re.IGNORECASE),
          }
          counts = Counter()
          hits = []
          rust_files = sorted(Path('rust').rglob('*.rs'))
          production_files = []
          for path in rust_files:
              if 'tests' in path.parts or path.name == 'tests.rs':
                  continue
              production_files.append(path)
              text = path.read_text(encoding='utf-8')
              production = text.split('#[cfg(test)]', 1)[0]
              for number, line in enumerate(production.splitlines(), 1):
                  for name, pattern in patterns.items():
                      if pattern.search(line):
                          counts[name] += 1
                          hits.append({
                              'kind': name,
                              'path': str(path),
                              'line': number,
                              'source': line.strip(),
                          })
          report = {
              'rustFiles': len(rust_files),
              'productionFiles': len(production_files),
              'productionHitCounts': dict(sorted(counts.items())),
              'productionHits': hits,
          }
          print(json.dumps(report, indent=2, ensure_ascii=True))
          PY

      - name: Check locked dependency graph and clean source
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path rust/Cargo.toml \
            --format-version 1 --locked > "$RUNNER_TEMP/metadata.json"
          python3 - "$RUNNER_TEMP/metadata.json" <<'PY'
          from pathlib import Path
          import json
          import sys

          metadata = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          workspace = set(metadata['workspace_members'])
          packages = []
          for package in sorted(metadata['packages'], key=lambda item: item['name']):
              if package['id'] not in workspace:
                  continue
              packages.append({
                  'name': package['name'],
                  'targets': sorted(target['name'] for target in package['targets']),
                  'dependencyCount': len(package['dependencies']),
              })
          print(json.dumps({'workspacePackages': packages}, indent=2))
          PY
          git diff --check
          test -z "$(git status --porcelain)"
