name: remove-production-expect-once

on:
  push:
    branches:
      - codex/rust-plan-v3-qualification-hardening-20260830
    paths:
      - '.github/workflows/qualification-closure-hardening-once.yml'

permissions:
  contents: write

concurrency:
  group: remove-production-expect-once
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_BRANCH: codex/rust-plan-v3-final-product-20260830
      EXPECTED_HEAD: 3313964f2a21ee3e7b6c56b3c2e3cae1a3c7e966
      RUSTFLAGS: '-Dunsafe-code'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-plan-v3-final-product-20260830
          fetch-depth: 2
          persist-credentials: true

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Remove production expect paths and validate
        shell: bash
        run: |
          set -euo pipefail
          base64 -d <<'B64' | gzip -d > "$RUNNER_TEMP/remove_expect.py"
          H4sIACnhk2oC/+1YXW/bNhR9969gNWCRMduB3watSRE43hIgbbwkK7YVAyFT1zFhiVRJyomR+r/v
          kqJtyVYar1u6dZteTPHyfh8eUp4omZE8NtOUjwnPcqkMGeFrq5XAhCjI05gBlYJBaODeREQb1SEy
          TfxIwJ0fpfEYUjduk+6x/Y1aBB8mC2HIEbHqPfcSonrbyfjEi18ckX653D4q5hrI9UIbyIb33IST
          4MGZX0YE7nNgBhIiBZAsNmzaIRO0kZAHZ2oZlKYVmEKJ0qtPw/p1EXdIv91qKSltXDbbMOihWgvE
          nCspMhCG2pqg1C06JIEqtDlkKjagD6eQm7jLZAL3XYUueQaHWrHDinpP6aBqDi1tG8eo4oTa+EIQ
          aIyL26OgMJPut1uh2CiqfXDpVeQdN3FwcJAXYzIRxAWGLpT1VPMqU84WdN4PXYeGG9HISd72yYOz
          1SCJIqxbuO5QUGZfOunO+0FnLXq3HrmFo5Obs4rUzZ1dvh5uz12cvPlhZ25ATy4uGmYHN7+Mdizc
          /Loz83p0en61PXt9fUEHw6sb+v35xfBRYYPi4PJ0+DPdCv63SuY+2VWCmwBqul6jhGmvxHMYaBMb
          zsjA1pWUda02mZTNIxnikIyBzOOUJwiUZQsb/1kQ4CX2mYPSXIqI9DfJe9MciWEHHD0jqbwTkITt
          jUKcpvIOEjqDhY7+c6hZj3pcYHW4ARW2N5NZnIfXRiEnRNEEKboiYjJNLWIqpVTwvuBqU8s9cViL
          szGOJ2JpimdZhWTggezBXWIEy/DnCC5DeKWUTXmaPDO/OU9d5+lLI7nLn64GQ3p6cjOkw9Hl4Oyv
          wPM+XLcHu7mqElfVT6a458DAH2a4LXj8K2juWXDzt7Dd5+C3KpQbSM5DBi+NluRQzSp99c6+l9Eh
          kku1ErgcNFWQxVxQh34E8QaTsdag8Dx//yLc54DvOQt4YcXIyeUsDNvt9ndNxvbYSo/bWrZsNT6J
