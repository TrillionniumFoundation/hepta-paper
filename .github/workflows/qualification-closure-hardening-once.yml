name: remove-production-panic-paths-once

on:
  push:
    branches:
      - codex/rust-plan-v3-qualification-hardening-20260830
    paths:
      - '.github/workflows/qualification-closure-hardening-once.yml'

permissions:
  contents: write

concurrency:
  group: remove-production-panic-paths-once
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_BRANCH: codex/rust-plan-v3-final-product-20260830
      EXPECTED_HEAD: 3313964f2a21ee3e7b6c56b3c2e3cae1a3c7e966
      RUSTFLAGS: '-Dunsafe-code'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-plan-v3-final-product-20260830
          fetch-depth: 2
          persist-credentials: true

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Remove production panic paths and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_region(text: str, start: str, end: str, replacement: str, label: str) -> str:
              begin = text.find(start)
              if begin < 0:
                  raise SystemExit(f"{label}: start marker missing")
              finish = text.find(end, begin)
              if finish < 0:
                  raise SystemExit(f"{label}: end marker missing")
              return text[:begin] + replacement + text[finish:]

          environment_path = Path('rust/crates/hepta-codex-runtime/src/environment.rs')
          environment = environment_path.read_text(encoding='utf-8')
          policies = '''/// Production-shaped parent environment for the qualified Codex CLI process.
          pub fn codex_parent_environment_policy_v1() -> EnvironmentPolicyV1 {
              EnvironmentPolicyV1 {
                  version: 1,
                  policy_id: "codex-parent-v1".to_owned(),
                  allowed_keys: [
                      "PATH",
                      "HOME",
                      "LANG",
                      "LC_ALL",
                      "LC_CTYPE",
                      "TZ",
                      "TMPDIR",
                      "SSL_CERT_FILE",
                      "SSL_CERT_DIR",
                      "CODEX_HOME",
                  ]
                  .into_iter()
                  .map(str::to_owned)
                  .collect(),
                  required_keys: ["PATH", "HOME", "TMPDIR", "CODEX_HOME"]
                      .into_iter()
                      .map(str::to_owned)
                      .collect(),
              }
          }

          /// Environment visible to commands launched by the model inside the workspace.
          pub fn model_child_environment_policy_v1() -> EnvironmentPolicyV1 {
              EnvironmentPolicyV1 {
                  version: 1,
                  policy_id: "codex-model-child-v1".to_owned(),
                  allowed_keys: [
                      "PATH",
                      "HOME",
                      "LANG",
                      "LC_ALL",
                      "LC_CTYPE",
                      "TZ",
                      "TMPDIR",
                      "SOURCE_DATE_EPOCH",
                      "SSL_CERT_FILE",
                      "SSL_CERT_DIR",
                  ]
                  .into_iter()
                  .map(str::to_owned)
                  .collect(),
                  required_keys: ["PATH", "HOME", "TMPDIR"]
                      .into_iter()
                      .map(str::to_owned)
                      .collect(),
              }
          }

          '''
          environment = replace_region(
              environment,
              '/// Production-shaped parent environment for the qualified Codex CLI process.\n',
              'fn valid_policy_id(value: &str) -> bool {\n',
              policies,
              'static environment policies',
          )
          static_test = '''    #[test]
              fn static_policies_remain_valid() {
                  codex_parent_environment_policy_v1()
                      .validate()
                      .expect("parent policy");
                  model_child_environment_policy_v1()
                      .validate()
                      .expect("model child policy");
              }

          '''
          environment = replace_once(
              environment,
              '    #[test]\n    fn parent_policy_selects_only_explicit_nonsecret_keys() {\n',
              static_test + '    #[test]\n    fn parent_policy_selects_only_explicit_nonsecret_keys() {\n',
              'static policy regression test',
          )
          environment_path.write_text(environment, encoding='utf-8')

          closure_path = Path(
              'rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs'
          )
          closure = closure_path.read_text(encoding='utf-8')
          package_collection = '''    let packages = QualificationPackageIdV1::ALL
              .into_iter()
              .map(|package| -> Result<ClosurePackageReceiptV1, ClosureError> {
                  let record = by_package
                      .get(&package)
                      .ok_or(ClosureError::PackageSetIncomplete)?;
                  Ok(ClosurePackageReceiptV1 {
                      package_id: package.as_str().to_owned(),
                      payload_hash: record.payload_hash.clone(),
                      authority_domain_id: record.authority_domain_id.clone(),
                      signer_key_id: record.signer_key_id.clone(),
                      nonce: record.nonce.clone(),
                      signing_message_hash: record.signing_message_hash.clone(),
                  })
              })
              .collect::<Result<Vec<_>, _>>()?;
          '''
          closure = replace_region(
              closure,
              '    let packages = QualificationPackageIdV1::ALL\n',
              '    let authority_groups = authority_groups\n',
              package_collection,
              'qualification receipt package collection',
          )
          closure_path.write_text(closure, encoding='utf-8')

          listener_path = Path('rust/crates/hepta-codex-broker/src/listener.rs')
          listener = listener_path.read_text(encoding='utf-8')
          listener = replace_once(
              listener,
              '''            &marker_for(&policy, ListenerPhaseV1::Binding, None, None),
          ''',
              '''            &marker_for(&policy, ListenerPhaseV1::Binding, None, None)?,
          ''',
              'binding marker propagation',
          )
          listener = replace_once(
              listener,
              '''            &marker_for(
                          &policy,
                          ListenerPhaseV1::Bound,
                          Some(socket_identity.clone()),
                          None,
                      ),
          ''',
              '''            &marker_for(
                          &policy,
                          ListenerPhaseV1::Bound,
                          Some(socket_identity.clone()),
                          None,
                      )?,
          ''',
              'bound marker propagation',
          )
          listener = replace_once(
              listener,
              '''            &marker_for(
                          &self.policy,
                          ListenerPhaseV1::Ready,
                          Some(observed.clone()),
                          Some(qualification_hash.clone()),
                      ),
          ''',
              '''            &marker_for(
                          &self.policy,
                          ListenerPhaseV1::Ready,
                          Some(observed.clone()),
                          Some(qualification_hash.clone()),
                      )?,
          ''',
              'ready marker propagation',
          )
          listener = replace_once(
              listener,
              '''            &marker_for(
                          &self.policy,
                          ListenerPhaseV1::Stopped,
                          Some(self.socket_identity.clone()),
                          None,
                      ),
          ''',
              '''            &marker_for(
                          &self.policy,
                          ListenerPhaseV1::Stopped,
                          Some(self.socket_identity.clone()),
                          None,
                      )?,
          ''',
              'stopped marker propagation',
          )
          marker = '''fn marker_for(
              policy: &BrokerListenerPolicyV1,
              phase: ListenerPhaseV1,
              socket_identity: Option<BrokerSocketIdentityV1>,
              qualification_hash: Option<Sha256Digest>,
          ) -> Result<ListenerMarkerV1, BrokerListenerError> {
              Ok(ListenerMarkerV1 {
                  version: 1,
                  generation: policy.instance_generation,
                  phase,
                  role: policy.role,
                  access_mode: policy.access_mode,
                  socket_path_hash: hash_path(&policy.socket_path)?,
                  runtime_identity_hash: policy.runtime_identity_hash.clone(),
                  trust_bundle_hash: policy.trust_bundle_hash.clone(),
                  journal_path_hash: policy.journal_path_hash.clone(),
                  peer_policy_hash: policy.peer_policy_hash.clone(),
                  socket_identity,
                  qualification_hash,
              })
          }

          '''
          listener = replace_region(
              listener,
              'fn marker_for(\n',
              'fn recover_predecessor(\n',
              marker,
              'listener marker construction',
          )
          listener_path.write_text(listener, encoding='utf-8')
          PY

          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml \
            -p hepta-codex-runtime -p hepta-codex-broker -p hepta-qualification-ingest \
            --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml \
            --workspace --lib --bins --all-features --locked -- \
            -D warnings -D unsafe-code \
            -D clippy::todo -D clippy::unimplemented \
            -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          git diff --check

      - name: Commit validated source hardening
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code --quiet && { echo 'no product changes'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            rust/crates/hepta-codex-runtime/src/environment.rs \
            rust/crates/hepta-codex-broker/src/listener.rs \
            rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs
          git diff --cached --check
          git commit -m 'fix(rust): remove production panic paths'
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_HEAD"
          git push origin "HEAD:$TARGET_BRANCH"
