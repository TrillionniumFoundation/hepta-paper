name: qualification-closure-hardening-once

on:
  push:
    branches:
      - codex/rust-plan-v3-qualification-hardening-20260830
    paths:
      - '.github/workflows/qualification-closure-hardening-once.yml'

permissions:
  contents: write

concurrency:
  group: qualification-closure-hardening-once
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: codex/rust-plan-v3-final-product-20260830
      EXPECTED_HEAD: aa985a9a0ceed5fb35d4174cb499e4b337e785e3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-plan-v3-final-product-20260830
          fetch-depth: 2
          persist-credentials: true

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

