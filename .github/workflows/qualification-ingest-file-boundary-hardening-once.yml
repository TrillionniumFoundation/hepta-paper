name: qualification-ingest-file-boundary-hardening-once

on:
  push:
    branches:
      - codex/rust-plan-v3-main-integration-20260830
    paths:
      - '.github/workflows/qualification-ingest-file-boundary-hardening-once.yml'

permissions:
  contents: write

concurrency:
  group: qualification-ingest-file-boundary-hardening-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Apply fail-closed qualification boundary hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib_path = Path('rust/crates/hepta-qualification-ingest/src/lib.rs')
          lib = lib_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f'{label}: expected exactly one old form, found {count}')

          lib = replace_once(
              lib,
              '        let mut keys = BTreeMap::new();\n        for (domain, key_id, key) in entries {',
              '        let mut keys = BTreeMap::new();\n        let mut key_material = BTreeSet::new();\n        for (domain, key_id, key) in entries {',
              'key material set',
          )
          lib = replace_once(
              lib,
              '            if !valid_identifier(&domain) || !valid_identifier(&key_id) || key.is_weak() {',
              '            if !valid_identifier(&domain)\n                || !valid_identifier(&key_id)\n                || key.is_weak()\n                || !key_material.insert(key.to_bytes())\n            {',
              'duplicate public key rejection',
          )
          lib = replace_once(
              lib,
              '    let mut bytes = Vec::with_capacity(capacity);\n    file.read_to_end(&mut bytes)?;\n    let after_path = fs::symlink_metadata(path)?;',
              '    let mut bytes = Vec::with_capacity(capacity);\n    (&mut file)\n        .take(MAXIMUM_EVIDENCE_BYTES.saturating_add(1))\n        .read_to_end(&mut bytes)?;\n    if u64::try_from(bytes.len()).map_err(|_| QualificationIngestError::EvidenceTooLarge)?\n        != opened.size()\n    {\n        return Err(QualificationIngestError::FileChanged);\n    }\n    let after_path = fs::symlink_metadata(path)?;',
              'bounded evidence read',
          )
          lib = replace_once(
              lib,
              '            || mode & 0o002 != 0\n',
              '            || mode & 0o022 != 0\n',
              'group-writable ancestor rejection',
          )
          lib = replace_once(
              lib,
              '        && left.nlink() == right.nlink()\n        && left.size() == right.size()\n}',
              '        && left.nlink() == right.nlink()\n        && left.size() == right.size()\n        && left.mtime() == right.mtime()\n        && left.mtime_nsec() == right.mtime_nsec()\n        && left.ctime() == right.ctime()\n        && left.ctime_nsec() == right.ctime_nsec()\n}',
              'metadata rewrite detection',
          )

          test_marker = '    fn one_public_key_cannot_alias_multiple_authority_domains()'
          if test_marker not in lib:
              insertion = '''
    #[test]
    fn one_public_key_cannot_alias_multiple_authority_domains() {
        let signing = SigningKey::from_bytes(&[23_u8; 32]);
        let verifying = signing.verifying_key();
        let result = QualificationTrustStoreV1::new(
            [
                (
                    "governance-review".to_owned(),
                    "governance-key".to_owned(),
                    verifying,
                ),
                (
                    "linux-review".to_owned(),
                    "linux-key".to_owned(),
                    verifying,
                ),
            ],
            std::iter::empty::<String>(),
        );
        assert!(matches!(
            result,
            Err(QualificationIngestError::TrustStoreInvalid)
        ));
    }

'''
              anchor = '    #[test]\n    fn closed_package_vocabulary_round_trips_canonical_external_ids() {'
              if lib.count(anchor) != 1:
                  raise SystemExit('duplicate-public-key test anchor missing or ambiguous')
              lib = lib.replace(anchor, insertion + anchor, 1)

          lib_path.write_text(lib, encoding='utf-8')

          closure_path = Path(
              'rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs'
          )
          closure = closure_path.read_text(encoding='utf-8')
          closure = replace_once(
              closure,
              '        && left.nlink() == right.nlink()\n        && left.size() == right.size()\n}',
              '        && left.nlink() == right.nlink()\n        && left.size() == right.size()\n        && left.mtime() == right.mtime()\n        && left.mtime_nsec() == right.mtime_nsec()\n        && left.ctime() == right.ctime()\n        && left.ctime_nsec() == right.ctime_nsec()\n}',
              'closure metadata rewrite detection',
          )
          closure_path.write_text(closure, encoding='utf-8')
          PY

          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml --locked -p hepta-qualification-ingest --all-features
          cargo clippy --manifest-path rust/Cargo.toml --locked -p hepta-qualification-ingest --all-targets --all-features -- -D warnings

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort -u | diff -u - <(printf '%s\n' \
            rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs \
            rust/crates/hepta-qualification-ingest/src/lib.rs | sort -u)
          git diff --check

      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            rust/crates/hepta-qualification-ingest/src/lib.rs \
            rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs
          git commit -m 'fix(qualification): harden evidence file and trust boundaries'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
