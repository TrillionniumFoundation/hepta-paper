name: reconcile-final-product-once

on:
  push:
    branches:
      - codex/rust-final-gap-closure-20260830
    paths:
      - '.github/workflows/reconcile-final-product-once.yml'

permissions:
  contents: write

concurrency:
  group: reconcile-final-product-once
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/rust-plan-v3-final-product-20260830
  EXPECTED_HEAD: 87609386794f54373eeb3c38be97663a32c53a6a

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 87609386794f54373eeb3c38be97663a32c53a6a
          fetch-depth: 2
          persist-credentials: true

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Preserve both hardening lines and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          lib_path = Path("rust/crates/hepta-qualification-ingest/src/lib.rs")
          lib = lib_path.read_text(encoding="utf-8")
          if "mod package_payload;" not in lib or "validate_external_package_payload_v1" not in lib:
              raise SystemExit("strict package payload module is not wired")

          old_forbidden = '''        let forbidden_authority_domains = forbidden_domains.into_iter().collect::<BTreeSet<_>>();
          if forbidden_authority_domains
              .iter()
              .any(|value| !valid_identifier(value))
          {
              return Err(QualificationIngestError::TrustStoreInvalid);
          }
          '''
          new_forbidden = '''        let mut forbidden_authority_domains = BTreeSet::new();
          for domain in forbidden_domains {
              if !valid_identifier(&domain)
                  || forbidden_authority_domains.len() == 128
                  || !forbidden_authority_domains.insert(domain)
              {
                  return Err(QualificationIngestError::TrustStoreInvalid);
              }
          }
          '''
          lib = replace_once(lib, old_forbidden, new_forbidden, "forbidden-domain set")

          test_anchor = '''    #[test]
              fn closed_package_vocabulary_round_trips_canonical_external_ids() {
          '''
          inserted_test = '''    #[test]
              fn identifiers_match_schema_and_forbidden_domains_are_unique_and_bounded() {
                  for valid in ["a", "A0", "review:key-1", "authority_domain.v1"] {
                      assert!(valid_identifier(valid), "{valid}");
                  }
                  for invalid in ["", "-leading", "_leading", ".leading", ":leading", "é"] {
                      assert!(!valid_identifier(invalid), "{invalid}");
                  }
                  assert!(!valid_identifier(&"a".repeat(129)));

                  let signing = SigningKey::from_bytes(&[24_u8; 32]);
                  let entry = || {
                      [(
                          "independent-review".to_owned(),
                          "review-key".to_owned(),
                          signing.verifying_key(),
                      )]
                  };
                  let duplicate_forbidden = QualificationTrustStoreV1::new(
                      entry(),
                      ["repository-admin".to_owned(), "repository-admin".to_owned()],
                  );
                  assert!(matches!(
                      duplicate_forbidden,
                      Err(QualificationIngestError::TrustStoreInvalid)
                  ));

                  let oversized_forbidden = (0..129)
                      .map(|index| format!("authority-domain-{index}"))
                      .collect::<Vec<_>>();
                  assert!(matches!(
                      QualificationTrustStoreV1::new(entry(), oversized_forbidden),
                      Err(QualificationIngestError::TrustStoreInvalid)
                  ));
              }

          '''
          if "identifiers_match_schema_and_forbidden_domains_are_unique_and_bounded" in lib:
              raise SystemExit("bounded forbidden-domain regression test already present")
          lib = replace_once(lib, test_anchor, inserted_test + test_anchor, "lib test anchor")
          lib_path.write_text(lib, encoding="utf-8")

          closure_path = Path(
              "rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs"
          )
          closure = closure_path.read_text(encoding="utf-8")
          old_receipts = '''    let packages = QualificationPackageIdV1::ALL
              .into_iter()
              .map(|package| {
                  let record = by_package
                      .get(&package)
                      .expect("complete package set checked above");
                  ClosurePackageReceiptV1 {
                      package_id: package.as_str().to_owned(),
                      payload_hash: record.payload_hash.clone(),
                      authority_domain_id: record.authority_domain_id.clone(),
                      signer_key_id: record.signer_key_id.clone(),
                      nonce: record.nonce.clone(),
                      signing_message_hash: record.signing_message_hash.clone(),
                  }
              })
              .collect::<Vec<_>>();
          '''
          new_receipts = '''    let packages = QualificationPackageIdV1::ALL
              .into_iter()
              .map(|package| -> Result<ClosurePackageReceiptV1, ClosureError> {
                  let record = by_package
                      .get(&package)
                      .ok_or(ClosureError::PackageSetIncomplete)?;
                  Ok(ClosurePackageReceiptV1 {
                      package_id: package.as_str().to_owned(),
                      payload_hash: record.payload_hash.clone(),
                      authority_domain_id: record.authority_domain_id.clone(),
                      signer_key_id: record.signer_key_id.clone(),
                      nonce: record.nonce.clone(),
                      signing_message_hash: record.signing_message_hash.clone(),
                  })
              })
              .collect::<Result<Vec<_>, _>>()?;
          '''
          closure = replace_once(closure, old_receipts, new_receipts, "receipt assembly")
          closure_path.write_text(closure, encoding="utf-8")
          PY

          cargo fmt --manifest-path rust/Cargo.toml --all
          mapfile -t changed < <(git diff --name-only | sort)
          mapfile -t expected < <(printf '%s\n' \
            rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs \
            rust/crates/hepta-qualification-ingest/src/lib.rs \
            | sort)
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")
          git diff --check

          cargo test --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest --lib --bins --all-features --locked -- \
            -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Commit validated reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            rust/crates/hepta-qualification-ingest/src/lib.rs \
            rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs
          git diff --cached --check
          git commit -m 'fix(qualification): preserve bounded trust inputs and panic-free receipts'
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_HEAD"
          git push origin "HEAD:$TARGET_BRANCH"
