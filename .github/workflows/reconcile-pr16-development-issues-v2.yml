name: reconcile-pr16-development-issues-v2

on:
  push:
    branches:
      - codex/current-source-export-20260829-v2
    paths:
      - .github/workflows/reconcile-pr16-development-issues-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: reconcile-pr16-development-issues-v2
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: TrillionniumFoundation/hepta-paper
      PR_BRANCH: codex/rust-broker-service-20260828
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-broker-service-20260828
          fetch-depth: 0

      - name: Bind exact source evidence
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          echo "qualified_head=$head" >> "$GITHUB_ENV"
          test -f docs/rust/PR16_DEVELOPMENT_CLOSURE_TRIGGER_20260829.md
          grep -Fq 'fn preflight_database_before_writer' \
            rust/crates/hepta-codex-broker/src/journal/path.rs
          grep -Fq 'foreign_empty_database_is_rejected_without_mutation' \
            rust/crates/hepta-codex-broker/src/journal/tests.rs
          grep -Fq 'foreign_populated_database_is_rejected_without_mutation' \
            rust/crates/hepta-codex-broker/src/journal/tests.rs
          test -s rust/crates/hepta-codex-broker/src/trust_bundle_file.rs
          grep -Fq 'load_authority_owned_trust_bundle' \
            rust/crates/hepta-codex-broker/src/trust_bundle_file.rs
          grep -Fq 'production_policy_requires_a_distinct_authority_uid' \
            rust/crates/hepta-codex-broker/src/trust_bundle_file.rs
          grep -Fq 'exact_duplicate_returns_existing_without_second_nonce' \
            rust/crates/hepta-codex-broker/src/journal/tests.rs
          test -f rust/crates/hepta-codex-broker/tests/service_lifecycle.rs
          test -f rust/crates/hepta-codex-broker/tests/durable_process_journal.rs
          remote=$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)
          test "$remote" = "$head"

      - name: Require both protected workflows on the same head
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            payload=$(gh api "/repos/$REPOSITORY/actions/runs?head_sha=$qualified_head&event=pull_request&per_page=100")
            rust=$(jq -r '[.workflow_runs[] | select(.name == "rust-foundation")] | sort_by(.created_at) | reverse | .[0] | (.status // "missing") + ":" + (.conclusion // "")' <<<"$payload")
            node=$(jq -r '[.workflow_runs[] | select(.name == "hepta-paper-ci")] | sort_by(.created_at) | reverse | .[0] | (.status // "missing") + ":" + (.conclusion // "")' <<<"$payload")
            echo "head=$qualified_head rust=$rust node=$node"
            if [[ "$rust" == completed:success && "$node" == completed:success ]]; then
              break
            fi
            if [[ "$rust" == completed:* && "$rust" != completed:success ]]; then exit 1; fi
            if [[ "$node" == completed:* && "$node" != completed:success ]]; then exit 1; fi
            if [[ $attempt -eq 120 ]]; then exit 1; fi
            sleep 10
          done
          remote=$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)
          test "$remote" = "$qualified_head"

      - name: Close development-only issues and preserve external gates
        shell: bash
        run: |
          set -euo pipefail
          source_marker='<!-- hepta-pr16-development-closure-v2 -->'
          source_body="$source_marker

          Repository-development acceptance is complete at exact head \`$qualified_head\`. The protected Rust and repository workflows both completed successfully on that SHA, and the branch SHA was rechecked before this mutation.

          This evidence grants no installed-host, live-provider, credential, KMS/HSM, WORM, release or submission authority."
          external_marker='<!-- hepta-pr16-external-qualification-v2 -->'
          external_body="$external_marker

          Source development is complete and both protected workflows are green at exact head \`$qualified_head\`. This issue remains open because its remaining acceptance requires independently controlled installed-host or external-authority evidence that repository code and GitHub permissions cannot create.

          Real Codex credentials and provider execution remain disabled."

          post_once() {
            local issue=$1 marker=$2 body=$3
            if ! gh api "/repos/$REPOSITORY/issues/$issue/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$marker"; then
              gh issue comment "$issue" --repo "$REPOSITORY" --body "$body"
            fi
          }
          close_source() {
            local issue=$1
            post_once "$issue" "$source_marker" "$source_body"
            if [[ $(gh issue view "$issue" --repo "$REPOSITORY" --json state --jq .state) == OPEN ]]; then
              gh issue close "$issue" --repo "$REPOSITORY" --reason completed
            fi
          }

          for issue in 4 7 8 9 11; do close_source "$issue"; done
          for issue in 5 12 14 15 17; do
            post_once "$issue" "$external_marker" "$external_body"
          done

      - name: Update the draft PR contract
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/body.md <<EOF
          ## Merge status

          > **DO NOT MERGE.** Repository-development blockers are source-complete at exact head \`$qualified_head\`; the PR remains a credential-free draft pending installed-host and external-authority qualification.

          ## Source-complete scope

          - private role-specific Unix listeners, bounded admission and recorded stale-socket recovery;
          - signed Ed25519 capability bundles with generation chaining, rotation, revocation and rollback rejection;
          - append-only SQLite journal, recovery, backup/restore and prepared-result acknowledgement;
          - durable stopped pre-exec gate with object/process identity, atomic journal linkage, release authorization and startup reconciliation;
          - stable Codex-home identity and separate schema-authority production mode;
          - read-only/no-follow validation of existing broker databases before any writer mutation;
          - bounded, canonical, authority-owned trust-bundle file loading;
          - exact duplicate admission independent of later arrival time;
          - protected Rust and repository workflows successful on this exact head.

          ## Still prohibited

          This branch does not load real Codex credentials, call a provider, write the campaign database, sign a release, access KMS/HSM/WORM, hold portal credentials or submit a paper.

          ## Remaining external qualification

          Issues #5, #12, #14, #15 and #17 retain the evidence that requires distinct installed principals/owners, host crash and storage drills, independent low-level review, or external authorities. Those are not silently converted into source claims.
          EOF
          gh pr edit 16 --repo "$REPOSITORY" --body-file /tmp/body.md
