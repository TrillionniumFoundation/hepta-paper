name: reconcile-pr16-final-qualified-head-v6

on:
  push:
    branches:
      - codex/current-source-export-20260829-v2
    paths:
      - .github/workflows/reconcile-pr16-final-qualified-head-v6.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: TrillionniumFoundation/hepta-paper
      PR_BRANCH: codex/rust-broker-service-20260828
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-broker-service-20260828
          fetch-depth: 0

      - name: Bind final exact head and contracts
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          echo "qualified_head=$head" >> "$GITHUB_ENV"
          test -f docs/rust/qualification/PR16_QUALIFICATION_CLI_TRIGGER_20260829.md
          test -f .github/workflows/rust-broker-installed-qualification-v2.yml
          test -f .github/workflows/rust-qualification-artifacts.yml
          test -f rust/crates/hepta-codex-broker/src/bin/hepta-broker-journal-preflight.rs
          test -f rust/crates/hepta-codex-broker/src/bin/hepta-trust-bundle-preflight.rs
          bash -n docs/rust/qualification/hepta-broker-host-qualification-v2.sh
          grep -Fq 'fn preflight_database_before_writer' rust/crates/hepta-codex-broker/src/journal/path.rs
          grep -Fq 'sigkill_before_commit_preserves_qualified_journal' rust/crates/hepta-codex-broker/src/journal/tests.rs
          grep -Fq 'load_authority_owned_trust_bundle' rust/crates/hepta-codex-broker/src/trust_bundle_file.rs
          test "$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)" = "$head"

      - name: Require all final exact-head workflows
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 210); do
            payload=$(gh api "/repos/$REPOSITORY/actions/runs?head_sha=$qualified_head&event=pull_request&per_page=100")
            status_for() {
              jq -r --arg name "$1" \
                '[.workflow_runs[] | select(.name == $name)] | sort_by(.created_at) | reverse | .[0] | (.status // "missing") + ":" + (.conclusion // "")' \
                <<<"$payload"
            }
            rust=$(status_for rust-foundation)
            node=$(status_for hepta-paper-ci)
            installed=$(status_for rust-broker-installed-qualification-v2)
            artifacts=$(status_for rust-qualification-artifacts)
            echo "head=$qualified_head rust=$rust node=$node installed=$installed artifacts=$artifacts"
            if [[ "$rust" == completed:success \
               && "$node" == completed:success \
               && "$installed" == completed:success \
               && "$artifacts" == completed:success ]]; then
              break
            fi
            for value in "$rust" "$node" "$installed" "$artifacts"; do
              if [[ "$value" == completed:* && "$value" != completed:success ]]; then exit 1; fi
            done
            if [[ $attempt -eq 210 ]]; then exit 1; fi
            sleep 10
          done
          test "$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)" = "$qualified_head"

      - name: Close completed development and portable installed issues
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- hepta-pr16-final-qualified-v6 -->'
          body="$marker

          Exact-head acceptance is complete at \`$qualified_head\`. Protected Rust and repository CI, installed-v2 multi-principal authority tests, and qualification-artifact validation all succeeded on this SHA. The branch was rechecked immediately before this mutation.

          This closes repository-development and portable installed-negative-test scope. It grants no live-provider, external release/submission or independent-review authority."
          for issue in 4 5 7 8 9 11 14 15; do
            if ! gh api "/repos/$REPOSITORY/issues/$issue/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$marker"; then
              gh issue comment "$issue" --repo "$REPOSITORY" --body "$body"
            fi
            if [[ $(gh issue view "$issue" --repo "$REPOSITORY" --json state --jq .state) == OPEN ]]; then
              gh issue close "$issue" --repo "$REPOSITORY" --reason completed
            fi
          done

      - name: Keep only non-portable gates open
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- hepta-pr16-nonportable-v6 -->'
          body="$marker

          Source and portable installed qualification are green at exact head \`$qualified_head\`. The repository now includes syntax-checked target-host drill tooling and immutable evidence schema. This issue remains open only for evidence that must be produced on the controlling host or by an independent reviewer; the harness deliberately records that review as pending rather than self-approving it."
          for issue in 12 17; do
            if ! gh api "/repos/$REPOSITORY/issues/$issue/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$marker"; then
              gh issue comment "$issue" --repo "$REPOSITORY" --body "$body"
            fi
          done

      - name: Publish final draft contract
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<EOF
          ## Merge status

          > **DO NOT MERGE.** All repository-development and portable installed-negative-test blockers are complete at exact head \`$qualified_head\`. Only target-host storage drills, independent review and live/external authority qualification remain.

          ## Exact-head completion

          - private role-specific listener lifecycle, bounded service and stale-socket recovery;
          - signed Ed25519 trust-bundle lifecycle and authority-owned canonical loading;
          - stable Codex-home and separately owned schema controls;
          - read-only/no-follow existing-database preflight before writer mutation;
          - append-only journal, exact duplicate semantics, recovery, backup/restore and acknowledgement;
          - stopped durable pre-exec gate, atomic journal linkage, release and startup reconciliation;
          - real process SIGKILL WAL recovery and committed-corruption rejection;
          - distinct root/deployment, broker, author and reviewer UID/GID negative tests;
          - root-owned gate, schema/trust controls and broker-private Unix socket checks;
          - reusable installed trust and journal preflight CLIs;
          - syntax-checked target-host drill harness and immutable evidence schema;
          - four exact-head workflows green: Rust, repository, installed-v2 and qualification artifacts.

          ## Remaining non-portable evidence

          Issue #12 requires the target-host reboot, disk-full, remount and filesystem-corruption execution records. Issue #17 requires independent low-level review and live installed-provider qualification. The repository contains the tooling but cannot truthfully manufacture those approvals.

          ## Authority boundary

          No real Codex credentials, provider calls, campaign writes, release signing, KMS/HSM/WORM, portal or submission authority is present.
          EOF
          gh pr edit 16 --repo "$REPOSITORY" --body-file /tmp/pr-body.md
