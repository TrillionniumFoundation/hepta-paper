name: reconcile-pr16-installed-evidence-v4

on:
  push:
    branches:
      - codex/current-source-export-20260829-v2
    paths:
      - .github/workflows/reconcile-pr16-installed-evidence-v4.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: reconcile-pr16-installed-evidence-v4
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: TrillionniumFoundation/hepta-paper
      PR_BRANCH: codex/rust-broker-service-20260828
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-broker-service-20260828
          fetch-depth: 0

      - name: Bind exact installed-qualification head
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          echo "qualified_head=$head" >> "$GITHUB_ENV"
          test -f .github/workflows/rust-broker-installed-qualification.yml
          test -f rust/crates/hepta-codex-broker/src/bin/hepta-trust-bundle-preflight.rs
          test -f rust/crates/hepta-codex-broker/src/trust_bundle_file.rs
          grep -Fq 'sigkill_before_commit_preserves_qualified_journal' \
            rust/crates/hepta-codex-broker/src/journal/tests.rs
          test "$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)" = "$head"

      - name: Require source and installed workflows on one SHA
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            payload=$(gh api "/repos/$REPOSITORY/actions/runs?head_sha=$qualified_head&event=pull_request&per_page=100")
            status_for() {
              local name=$1
              jq -r --arg name "$name" \
                '[.workflow_runs[] | select(.name == $name)] | sort_by(.created_at) | reverse | .[0] | (.status // "missing") + ":" + (.conclusion // "")' \
                <<<"$payload"
            }
            rust=$(status_for rust-foundation)
            node=$(status_for hepta-paper-ci)
            installed=$(status_for rust-broker-installed-qualification)
            echo "head=$qualified_head rust=$rust node=$node installed=$installed"
            if [[ "$rust" == completed:success \
               && "$node" == completed:success \
               && "$installed" == completed:success ]]; then
              break
            fi
            for value in "$rust" "$node" "$installed"; do
              if [[ "$value" == completed:* && "$value" != completed:success ]]; then
                exit 1
              fi
            done
            if [[ $attempt -eq 180 ]]; then exit 1; fi
            sleep 10
          done
          test "$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)" = "$qualified_head"

      - name: Close completed development and installed-negative-test issues
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- hepta-pr16-installed-closure-v4 -->'
          body="$marker

          Acceptance is verified at exact head \`$qualified_head\`. The protected Rust and repository workflows succeeded on this SHA, and the installed-principal workflow independently created root/deployment, broker, author and reviewer identities; exercised owner/group/mode/link/path mutation negatives; ran the trust-bundle preflight as the broker UID; and reran listener lifecycle tests as that installed UID.

          This closes the implemented source and portable installed-negative-test scope. It grants no live-provider, KMS/HSM, WORM, release or submission authority."
          for issue in 4 5 7 8 9 11 14 15; do
            if ! gh api "/repos/$REPOSITORY/issues/$issue/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$marker"; then
              gh issue comment "$issue" --repo "$REPOSITORY" --body "$body"
            fi
            if [[ $(gh issue view "$issue" --repo "$REPOSITORY" --json state --jq .state) == OPEN ]]; then
              gh issue close "$issue" --repo "$REPOSITORY" --reason completed
            fi
          done

      - name: Preserve non-portable qualification gates
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- hepta-pr16-nonportable-gate-v4 -->'
          body="$marker

          Portable source and installed-principal checks are green at exact head \`$qualified_head\`, including real process \`SIGKILL\` recovery. This issue remains open for non-portable acceptance that must be produced by its controlling environment: host reboot, disk-full/remount/filesystem-corruption drills or independent low-level primitive review and live-provider qualification.

          GitHub-hosted tests do not fabricate those records."
          for issue in 12 17; do
            if ! gh api "/repos/$REPOSITORY/issues/$issue/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$marker"; then
              gh issue comment "$issue" --repo "$REPOSITORY" --body "$body"
            fi
          done

      - name: Update final draft contract
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<EOF
          ## Merge status

          > **DO NOT MERGE.** Repository-development and portable installed-negative-test blockers are complete at exact head \`$qualified_head\`. Non-portable host/storage review and live/external authority qualification remains.

          ## Completed on the exact head

          - private role-specific listeners, bounded service lifecycle and stale-socket recovery;
          - signed Ed25519 trust bundles, rotation/revocation/rollback and separately owned canonical file loading;
          - stable Codex-home identity and separately owned output-schema controls;
          - read-only/no-follow foreign SQLite preflight before writer mutation;
          - append-only journal, backup/restore, prepared acknowledgement and exact duplicate semantics;
          - stopped durable pre-exec gate with atomic journal linkage and startup reconciliation;
          - real writer-process SIGKILL recovery and committed-corruption rejection;
          - root/deployment, broker, author and reviewer UID/GID negative tests for read/write/chmod/replace/link/role boundaries;
          - listener lifecycle rerun as the installed broker UID;
          - Rust, repository and installed-qualification workflows successful on the same SHA.

          ## Still prohibited

          No real Codex credentials, provider calls, campaign writes, release signing, KMS/HSM/WORM access, portal credentials or submission authority are present.

          ## Remaining non-portable qualification

          Issue #12 retains target-host reboot, disk-full, remount and filesystem-corruption drills. Issue #17 retains independent review of the low-level Linux primitive and live installed-provider qualification. These are not repository-development gaps.
          EOF
          gh pr edit 16 --repo "$REPOSITORY" --body-file /tmp/pr-body.md
