name: reconcile-pr16-source-publication-v6

on:
  push:
    branches:
      - codex/current-source-export-20260829-v2
    paths:
      - .github/workflows/reconcile-pr16-source-publication-v6.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-pr16-source-publication-v6
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out current PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-broker-service-20260828
          fetch-depth: 0
          submodules: false

      - name: Idempotently materialize development closure
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/codex/current-source-export-20260829-v2:refs/remotes/origin/pr16-transfer

          if [[ ! -f rust/crates/hepta-codex-broker/src/trust_bundle_file.rs ]]; then
            git show origin/pr16-transfer:.github/workflows/apply-pr16-development-blocker-closure-v5.yml \
              > /tmp/source-workflow.yml
            awk '
              /cat > rust\/crates\/hepta-codex-broker\/src\/trust_bundle_file.rs <<'\''RS'\''/ {
                capture=1; next
              }
              capture && /^          RS$/ { exit }
              capture { sub(/^          /, ""); print }
            ' /tmp/source-workflow.yml \
              > rust/crates/hepta-codex-broker/src/trust_bundle_file.rs
            test -s rust/crates/hepta-codex-broker/src/trust_bundle_file.rs
          fi

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("rust/crates/hepta-codex-broker/Cargo.toml")
          source = manifest.read_text()
          if "\nlibc = " not in source:
              marker = "[dependencies]\n"
              if source.count(marker) != 1:
                  raise SystemExit("expected broker dependency table")
              manifest.write_text(source.replace(marker, marker + 'libc = "0.2.189"\n', 1))

          lib = Path("rust/crates/hepta-codex-broker/src/lib.rs")
          source = lib.read_text()
          if "mod trust_bundle_file;" not in source and "pub mod trust_bundle_file;" not in source:
              lib.write_text(source + "\npub mod trust_bundle_file;\n")

          journal = Path("rust/crates/hepta-codex-broker/src/journal/path.rs")
          source = journal.read_text()
          if "fn preflight_database_before_writer" not in source:
              old = '''    let (path, initialization_marker) = prepare_database_path(requested, policy)?;
              let flags = OpenFlags::SQLITE_OPEN_READ_WRITE
                  | OpenFlags::SQLITE_OPEN_CREATE
                  | OpenFlags::SQLITE_OPEN_NO_MUTEX
                  | OpenFlags::SQLITE_OPEN_NOFOLLOW;
              let connection = Connection::open_with_flags(&path, flags)?;
              connection.busy_timeout(Duration::from_millis(policy.busy_timeout_ms))?;
              configure_safety_pragmas(&connection)?;
              if initialization_marker.is_some() {
                  verify_initialization_candidate(&connection)?;
              } else {
                  verify_database_identity(&connection)?;
              }
              connection.execute_batch(SCHEMA_SQL)?;
              '''
              new = '''    let (path, initialization_marker) = prepare_database_path(requested, policy)?;
              preflight_database_before_writer(&path, initialization_marker.is_some())?;

              let flags = OpenFlags::SQLITE_OPEN_READ_WRITE
                  | OpenFlags::SQLITE_OPEN_CREATE
                  | OpenFlags::SQLITE_OPEN_NO_MUTEX
                  | OpenFlags::SQLITE_OPEN_NOFOLLOW;
              let connection = Connection::open_with_flags(&path, flags)?;
              connection.busy_timeout(Duration::from_millis(policy.busy_timeout_ms))?;
              configure_safety_pragmas(&connection)?;
              if initialization_marker.is_some() {
                  verify_initialization_candidate(&connection)?;
                  connection.execute_batch(SCHEMA_SQL)?;
              } else {
                  verify_database_identity(&connection)?;
              }
              '''
              if source.count(old) != 1:
                  raise SystemExit("expected broker database open block")
              source = source.replace(old, new, 1)
              addition = '''
              fn preflight_database_before_writer(
                  path: &Path,
                  initialization_marker_present: bool,
              ) -> Result<(), BrokerJournalError> {
                  let metadata = fs::metadata(path).map_err(|error| {
                      BrokerJournalError::Filesystem("journal_database", error.kind())
                  })?;
                  if metadata.len() == 0 {
                      return if initialization_marker_present {
                          Ok(())
                      } else {
                          Err(BrokerJournalError::DatabaseIdentityMismatch {
                              application_id: 0,
                              user_version: 0,
                          })
                      };
                  }

                  let flags = OpenFlags::SQLITE_OPEN_READ_ONLY
                      | OpenFlags::SQLITE_OPEN_NO_MUTEX
                      | OpenFlags::SQLITE_OPEN_NOFOLLOW;
                  let connection = Connection::open_with_flags(path, flags)?;
                  connection.busy_timeout(Duration::from_millis(100))?;
                  if initialization_marker_present {
                      verify_initialization_candidate(&connection)?;
                      let application_id: i64 = connection
                          .query_row("PRAGMA application_id", [], |row| row.get(0))?;
                      if application_id == APPLICATION_ID {
                          verify_schema_version(&connection)?;
                          verify_schema_shape(&connection)?;
                      }
                  } else {
                      verify_database_identity(&connection)?;
                      verify_schema_version(&connection)?;
                      verify_schema_shape(&connection)?;
                  }
                  Ok(())
              }

              '''
              marker = "fn prepare_database_path(\n"
              if source.count(marker) != 1:
                  raise SystemExit("expected prepare_database_path marker")
              journal.write_text(source.replace(marker, addition + marker, 1))

          tests = Path("rust/crates/hepta-codex-broker/src/journal/tests.rs")
          source = tests.read_text()
          if "foreign_empty_database_is_rejected_without_mutation" not in source:
              marker = '''#[test]
              fn foreign_or_unstamped_sqlite_database_is_rejected() {
              '''
              addition = '''#[test]
              fn foreign_empty_database_is_rejected_without_mutation() {
                  let fixture = TempJournal::new();
                  let file = fs::OpenOptions::new()
                      .write(true)
                      .create_new(true)
                      .open(&fixture.path)
                      .expect("create foreign empty database");
                  file.sync_all().expect("sync foreign empty database");
                  drop(file);
                  fs::set_permissions(&fixture.path, fs::Permissions::from_mode(0o600))
                      .expect("private foreign empty database");
                  let before = fs::read(&fixture.path).expect("read foreign empty database before");
                  assert!(matches!(
                      BrokerJournalStoreV1::open(
                          &fixture.path,
                          BrokerJournalPolicyV1::strict(fixture.owner_uid),
                      ),
                      Err(BrokerJournalError::DatabaseIdentityMismatch { .. }),
                  ));
                  assert_eq!(
                      fs::read(&fixture.path).expect("read foreign empty database after"),
                      before,
                  );
                  assert!(!std::path::PathBuf::from(format!("{}-wal", fixture.path.display())).exists());
                  assert!(!std::path::PathBuf::from(format!("{}-shm", fixture.path.display())).exists());
              }

              #[test]
              fn foreign_populated_database_is_rejected_without_mutation() {
                  let fixture = TempJournal::new();
                  let foreign = rusqlite::Connection::open(&fixture.path)
                      .expect("create foreign SQLite database");
                  foreign
                      .execute_batch(
                          "CREATE TABLE foreign_state(value TEXT) STRICT;\n\
                           INSERT INTO foreign_state VALUES ('kept');",
                      )
                      .expect("create foreign schema and content");
                  drop(foreign);
                  fs::set_permissions(&fixture.path, fs::Permissions::from_mode(0o600))
                      .expect("private foreign database");
                  let before = fs::read(&fixture.path).expect("read foreign database before");
                  assert!(matches!(
                      BrokerJournalStoreV1::open(
                          &fixture.path,
                          BrokerJournalPolicyV1::strict(fixture.owner_uid),
                      ),
                      Err(BrokerJournalError::DatabaseIdentityMismatch { .. }),
                  ));
                  assert_eq!(
                      fs::read(&fixture.path).expect("read foreign database after"),
                      before,
                  );
                  assert!(!std::path::PathBuf::from(format!("{}-wal", fixture.path.display())).exists());
                  assert!(!std::path::PathBuf::from(format!("{}-shm", fixture.path.display())).exists());
              }

              '''
              if source.count(marker) != 1:
                  raise SystemExit("expected foreign database test marker")
              tests.write_text(source.replace(marker, addition + marker, 1))
          PY

          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check

      - name: Run complete Rust source qualification
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
          cargo metadata --manifest-path rust/Cargo.toml --locked --format-version 1 >/dev/null
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path rust/Cargo.toml \
            --workspace --all-features --locked -- --test-threads=1
          RUSTDOCFLAGS='-D warnings' cargo doc --manifest-path rust/Cargo.toml \
            --workspace --all-features --locked --no-deps

      - name: Publish only verified changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo 'source publication already reconciled'
            exit 0
          fi
          git config user.name "hepta-paper source reconciler"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(rust): reconcile development blocker closure"
          git push origin HEAD:refs/heads/codex/rust-broker-service-20260828
