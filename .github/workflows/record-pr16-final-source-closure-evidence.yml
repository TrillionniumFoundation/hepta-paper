name: record-pr16-final-source-closure-evidence

on:
  push:
    branches:
      - codex/current-source-export-20260829-v2
    paths:
      - .github/workflows/record-pr16-final-source-closure-evidence.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: TrillionniumFoundation/hepta-paper
      PR: '16'
    steps:
      - name: Resolve final exact-head evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          for attempt in $(seq 1 180); do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&per_page=100")
            rust=$(jq -c '[.workflow_runs[] | select(.name == "rust-foundation")] | sort_by(.created_at) | last // empty' <<<"$runs")
            node=$(jq -c '[.workflow_runs[] | select(.name == "hepta-paper-ci")] | sort_by(.created_at) | last // empty' <<<"$runs")
            if [ -n "$rust" ] && [ -n "$node" ] \
              && [ "$(jq -r .status <<<"$rust")" = completed ] \
              && [ "$(jq -r .status <<<"$node")" = completed ]; then
              test "$(jq -r .conclusion <<<"$rust")" = success
              test "$(jq -r .conclusion <<<"$node")" = success
              {
                echo "head=$head"
                echo "rust_id=$(jq -r .id <<<"$rust")"
                echo "node_id=$(jq -r .id <<<"$node")"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Comment final source closure record
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$PR" --repo "$REPO" --body-file - <<EOF
          ## Final repository-development closure record

          Exact source head: \`${{ steps.evidence.outputs.head }}\`

          - \`rust-foundation\` run \`${{ steps.evidence.outputs.rust_id }}\`: **success**
          - \`hepta-paper-ci\` run \`${{ steps.evidence.outputs.node_id }}\`: **success**

          This head includes the durable pre-exec boundary, read-only existing-DB
          preflight, authority-owned trust-bundle source, stable invocation identity,
          duplicate admission semantics, bounded service/listener lifecycle,
          recovery/backup/restore, systemd reference profile and installed-host
          preflight/SIGKILL evidence harnesses.

          No open repository-development blocker remains in this slice. Open
          \`QUALIFICATION:\` issues require real host principals, root/deployment
          ownership, destructive storage drills, independent review, authenticated
          live Codex, or external release/submission authority. They cannot be
          satisfied or waived by this Draft PR and grant no live authority.
          EOF
