name: repository-blocker-remediation-once

on:
  push:
    branches:
      - codex/rust-full-replacement-rc-20260908
    paths:
      - .github/workflows/repository-blocker-remediation-once.yml

permissions:
  contents: write

concurrency:
  group: repository-blocker-remediation-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'TrillionniumFoundation/hepta-paper'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact remediation head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 3

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm

      - name: Materialize committed remediation candidate
        env:
          EXPECTED_WORKFLOW_PARENT_SHA: f8a1727dc8000528a710a99e9183e1c59900745c
          EXPECTED_SOURCE_SHA: ba803579238e63dc668f92a4c69d469def72a7ad
          PATCH_GZIP_BASE64: >-
            
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_WORKFLOW_PARENT_SHA"
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_SOURCE_SHA"
          printf '%s' "$PATCH_GZIP_BASE64" | base64 -d | gzip -d | git apply --index --whitespace=error

          cat > docs/rust/qualification/ORCHESTRATION_SOURCE_CLOSURE.md <<'DOC'
          # Orchestration source closure

          Status: **exact-head qualification pending**

          This file is the permanent, non-activating source-closure anchor for the Rust
          orchestration kernel. It is committed before current-head qualification so that
          the permanent admission workflow can evaluate the actual repository tree after
          temporary one-shot automation has been removed.

          - repository: `TrillionniumFoundation/hepta-paper`
          - candidate branch: `codex/rust-full-replacement-rc-20260908`
          - evidence state: pending current-head repository qualification
          - production authority granted: false

          No passing check, artifact, review, target-host result, credential canary,
          private replay, key-custody result, release permission, submission permission,
          or Node-retirement fact is asserted by this pending anchor. Repository-local
          source closure is established only by the complete exact-head producer set and
          its effective qualification artifact; any head, tree, workflow, policy, base,
          review, or producer-run change invalidates that result and requires fresh
          derivation.

          The governing rules remain in
          [`../RUST_REWRITE_MASTER_PLAN.md`](../RUST_REWRITE_MASTER_PLAN.md) and
          [`../QUALIFICATION_STATE_MACHINE.md`](../QUALIFICATION_STATE_MACHINE.md).
          DOC
          sed -i 's/^          //' docs/rust/qualification/ORCHESTRATION_SOURCE_CLOSURE.md
          git add docs/rust/qualification/ORCHESTRATION_SOURCE_CLOSURE.md

          find .github/workflows -maxdepth 1 -type f \
            \( -name '*-once.yml' -o -name '*-once.yaml' \) -print0 \
            | xargs -0 -r git rm -f --
          test -z "$(find .github/workflows -maxdepth 1 -type f \
            \( -name '*-once.yml' -o -name '*-once.yaml' \) -print -quit)"
          git diff --cached --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test -n "$(git status --porcelain)"
          git commit -m 'fix(ci): close deterministic RC blockers'
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate committed candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          node --check paper-adapters/automation/externally-fenced-sqlite-mutation-plan.mjs
          node --check paper-adapters/automation/autonomous-research-online-writer-operation-manifest.mjs
          node --check paper-adapters/automation/autonomous-research-online-writer-static-config.mjs
          node --test \
            paper-core/tests/development-documentation-hostile.test.mjs \
            paper-core/tests/autonomous-research-online-writer-static-inspection.test.mjs \
            paper-core/tests/autonomous-research-online-mutation-active-refresh.test.mjs \
            paper-core/tests/externally-fenced-sqlite-mutation-coordinator.test.mjs \
            paper-core/tests/autonomous-research-machine-intake-online-mutation.test.mjs \
            paper-core/tests/native-store-online-mutation.test.mjs \
            paper-core/tests/native-store-ledger-online-mutation.test.mjs \
            paper-core/tests/native-store-submission-delivery-online-mutation.test.mjs
          git diff --exit-code
          git diff --cached --exit-code

      - name: Publish exact validated candidate
        env:
          BRANCH: codex/rust-full-replacement-rc-20260908
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
