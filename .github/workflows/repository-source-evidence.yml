name: repository-source-evidence

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-source-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  RUSTFLAGS: '-Dunsafe-code'

jobs:
  exact-head:
    name: source-evidence-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install qualified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'

      - name: Install qualified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          test "$(node --version)" = v22.23.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Run hostile evidence-verifier tests
        shell: bash
        run: |
          set -euo pipefail
          node --check paper-core/bin/verify-source-implementation-evidence.mjs
          node --check paper-core/tests/source-implementation-evidence-hardening.mjs
          node --test --test-concurrency=1 paper-core/tests/source-implementation-evidence.test.mjs
          node paper-core/tests/source-implementation-evidence-hardening.mjs --self-test

      - name: Verify exact source evidence and execute typed owner tests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          base="${{ github.event.pull_request.base.sha }}"
          node_bin="$(realpath "$(command -v node)")"
          cargo_bin="$(rustup which cargo)"
          git_bin="$(realpath "$(command -v git)")"
          export PATH="$(dirname "$node_bin"):$(dirname "$cargo_bin"):$(dirname "$git_bin"):/bin"
          export CARGO_TARGET_DIR=/tmp/repository-source-evidence-target-head
          rm -rf "$CARGO_TARGET_DIR"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          node paper-core/tests/source-implementation-evidence-hardening.mjs \
            --base "$base" \
            --target "$head" \
            --receipt /tmp/repository-source-evidence-hardening-head.json
          node paper-core/bin/verify-source-implementation-evidence.mjs \
            --expected-head "$head" \
            --expected-tree "$tree" \
            --execute \
            --receipt /tmp/repository-source-evidence-head.json
          test -s /tmp/repository-source-evidence-hardening-head.json
          test -s /tmp/repository-source-evidence-head.json
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          sha256sum /tmp/repository-source-evidence-hardening-head.json
          sha256sum /tmp/repository-source-evidence-head.json

      - name: Verify push or dispatch source evidence without promotion claim
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          export CARGO_TARGET_DIR=/tmp/repository-source-evidence-target-push
          rm -rf "$CARGO_TARGET_DIR"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          node paper-core/bin/verify-source-implementation-evidence.mjs \
            --expected-head "$head" \
            --expected-tree "$tree" \
            --execute \
            --receipt /tmp/repository-source-evidence-head.json
          test -s /tmp/repository-source-evidence-head.json
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          sha256sum /tmp/repository-source-evidence-head.json

      - name: Retain exact-head source receipts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-source-evidence-head-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/repository-source-evidence-head.json
            /tmp/repository-source-evidence-hardening-head.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Retain push source receipt
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-source-evidence-head-${{ github.sha }}
          path: /tmp/repository-source-evidence-head.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  prospective-merge:
    if: github.event_name == 'pull_request'
    name: source-evidence-prospective-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out generated prospective merge
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Install qualified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'

      - name: Install qualified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          test "$(node --version)" = v22.23.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Verify generated merge evidence and execute typed owner tests
        shell: bash
        run: |
          set -euo pipefail
          merge="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          base="${{ github.event.pull_request.base.sha }}"
          target="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^1)" = "$base"
          test "$(git rev-parse HEAD^2)" = "$target"
          node_bin="$(realpath "$(command -v node)")"
          cargo_bin="$(rustup which cargo)"
          git_bin="$(realpath "$(command -v git)")"
          export PATH="$(dirname "$node_bin"):$(dirname "$cargo_bin"):$(dirname "$git_bin"):/bin"
          export CARGO_TARGET_DIR=/tmp/repository-source-evidence-target-merge
          rm -rf "$CARGO_TARGET_DIR"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          node paper-core/tests/source-implementation-evidence-hardening.mjs \
            --base "$base" \
            --target "$target" \
            --receipt /tmp/repository-source-evidence-hardening-merge.json
          node paper-core/bin/verify-source-implementation-evidence.mjs \
            --expected-head "$merge" \
            --expected-tree "$tree" \
            --execute \
            --receipt /tmp/repository-source-evidence-merge.json
          test -s /tmp/repository-source-evidence-hardening-merge.json
          test -s /tmp/repository-source-evidence-merge.json
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          sha256sum /tmp/repository-source-evidence-hardening-merge.json
          sha256sum /tmp/repository-source-evidence-merge.json

      - name: Retain prospective-merge source receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-source-evidence-merge-${{ github.sha }}
          path: |
            /tmp/repository-source-evidence-merge.json
            /tmp/repository-source-evidence-hardening-merge.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
