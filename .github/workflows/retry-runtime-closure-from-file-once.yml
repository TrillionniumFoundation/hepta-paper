name: retry-runtime-closure-from-file-once

on:
  push:
    branches:
      - codex/rust-full-replacement-rc-20260908
    paths:
      - .github/workflows/retry-runtime-closure-from-file-once.yml

permissions:
  contents: write

concurrency:
  group: retry-runtime-closure-from-file-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0

      - name: Recover and materialize the committed source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import io
          import tarfile
          from pathlib import Path

          carrier = Path('.github/workflows/apply-runtime-closure-batch-once.yml')
          prefix = '          SOURCE_ARCHIVE_B64: '
          encoded = None
          for line in carrier.read_text(encoding='utf-8').splitlines():
              if line.startswith(prefix):
                  encoded = line[len(prefix):].strip()
                  break
          if not encoded:
              raise SystemExit('committed source archive is missing')
          try:
              payload = base64.b64decode(encoded, validate=True)
          except Exception as error:
              raise SystemExit(f'committed source archive is invalid: {error}') from error
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              for member in archive.getmembers():
                  destination = Path(member.name)
                  if destination.is_absolute() or '..' in destination.parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
              archive.extractall('.', filter='data')

          workspace = Path('rust/Cargo.toml')
          text = workspace.read_text(encoding='utf-8')
          member = '  "crates/hepta-performance-qualification",\n'
          if member not in text:
              marker = '  "crates/hepta-module-platform",\n'
              if marker not in text:
                  raise SystemExit('workspace member marker missing')
              text = text.replace(marker, marker + member)
              workspace.write_text(text, encoding='utf-8')

          lib = Path('rust/crates/hepta-control-plane/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          modules = ['mod calibration;', 'mod resource_hierarchy;', 'mod snapshot;', 'mod telemetry;']
          marker = 'mod commit;\n'
          if marker not in text:
              raise SystemExit('control-plane module marker missing')
          insertion = ''.join(f'{module}\n' for module in modules if module not in text)
          if insertion:
              text = text.replace(marker, marker + insertion)
          exports = '''pub use calibration::{
              CalibrationEntryV1, CalibrationObservationV1, CalibrationPolicyV1, CalibrationTableV1,
              apply_calibration_v1,
          };
          pub use resource_hierarchy::{
              HierarchicalAdmissionRequestV1, HierarchicalReservationStateV1,
              HierarchicalReservationV1, HierarchicalResourceAllocatorV1,
              HierarchicalResourceReportV1, ReservationEffectStateV1, ReservationRecoveryReportV1,
              ResourceHierarchyV1, ResourceScopeV1,
          };
          pub use snapshot::{
              SnapshotBuildReceiptV1, SnapshotBuildRequestV1, SnapshotComponentV1,
              build_control_plane_snapshot_v1,
          };
          pub use telemetry::{
              TelemetryAccumulatorV1, TelemetryMetricV1, TelemetryOutcomeV1, TelemetryPolicyV1,
              TelemetryPrivacyClassV1, TelemetryRetentionClassV1, TelemetrySeriesV1,
              TelemetrySignalClassV1, TelemetrySignalV1, TelemetrySnapshotV1,
          };
          '''
          export_marker = 'pub use commit::{\n'
          if 'pub use calibration::{' not in text:
              if export_marker not in text:
                  raise SystemExit('control-plane export marker missing')
              text = text.replace(export_marker, exports + export_marker)
          lib.write_text(text, encoding='utf-8')
          PY

      - name: Format and validate complete Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --all-features
          cargo test --manifest-path rust/Cargo.toml -p hepta-control-plane -p hepta-performance-qualification --all-features
          cargo clippy --manifest-path rust/Cargo.toml -p hepta-control-plane -p hepta-performance-qualification --all-targets --all-features -- -D warnings

      - name: Publish validated closure batch
        shell: bash
        env:
          TARGET_BRANCH: codex/rust-full-replacement-rc-20260908
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-runtime-closure-batch-once.yml
          git rm .github/workflows/retry-runtime-closure-from-file-once.yml
          git config user.name hepta-paper-automation
          git config user.email hepta-paper-automation@users.noreply.github.com
          git add rust
          git commit -m 'feat(rust): close snapshot resource calibration telemetry and performance source gaps'
          git push origin "HEAD:${TARGET_BRANCH}"
