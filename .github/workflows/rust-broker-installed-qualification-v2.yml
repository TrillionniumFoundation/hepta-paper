name: rust-broker-installed-qualification-v2

on:
  pull_request:
    paths:
      - rust/**
      - .github/workflows/rust-broker-installed-qualification-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-authority-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build the qualified preflight binary
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          cargo build --manifest-path rust/Cargo.toml \
            -p hepta-codex-broker \
            --bin hepta-trust-bundle-preflight \
            --release --locked
          cargo build --manifest-path rust/Cargo.toml \
            -p hepta-codex-runtime \
            --bin hepta-codex-preexec-gate \
            --release --locked

      - name: Install distinct principals and authority-owned objects
        shell: bash
        run: |
          set -euo pipefail
          sudo groupadd --system hepta-trust-read
          sudo groupadd --system hepta-schema-author-read
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin \
            --groups hepta-trust-read hepta-broker
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin \
            --groups hepta-schema-author-read hepta-author
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin \
            hepta-reviewer

          sudo install -d -o root -g root -m 0755 /usr/local/libexec/hepta
          sudo install -o root -g root -m 0555 \
            rust/target/release/hepta-trust-bundle-preflight \
            /usr/local/libexec/hepta/hepta-trust-bundle-preflight
          sudo install -o root -g root -m 0555 \
            rust/target/release/hepta-codex-preexec-gate \
            /usr/local/libexec/hepta/hepta-codex-preexec-gate

          sudo install -d -o root -g hepta-trust-read -m 0750 /etc/hepta/trust
          printf '%s' '{"generation":1,"issuer":"qualification","version":1}' \
            | sudo tee /etc/hepta/trust/bundle.json >/dev/null
          sudo chown root:hepta-trust-read /etc/hepta/trust/bundle.json
          sudo chmod 0440 /etc/hepta/trust/bundle.json

          sudo install -d -o root -g hepta-schema-author-read -m 0750 \
            /etc/hepta/schema-author
          printf '%s' '{"additionalProperties":false,"type":"object"}' \
            | sudo tee /etc/hepta/schema-author/output.schema.json >/dev/null
          sudo chown root:hepta-schema-author-read \
            /etc/hepta/schema-author/output.schema.json
          sudo chmod 0440 /etc/hepta/schema-author/output.schema.json

          sudo install -d -o hepta-broker -g hepta-broker -m 0700 \
            /var/lib/hepta-broker /var/lib/hepta-broker/socket-root

      - name: Prove trust-bundle and schema authority separation
        shell: bash
        run: |
          set -euo pipefail
          trust_gid=$(getent group hepta-trust-read | cut -d: -f3)
          broker_uid=$(id -u hepta-broker)
          sudo -u hepta-broker -- \
            /usr/local/libexec/hepta/hepta-trust-bundle-preflight \
            /etc/hepta/trust/bundle.json 0 "$trust_gid" "$broker_uid" \
            | tee /tmp/trust-positive.txt

          if sudo -u hepta-author -- cat /etc/hepta/trust/bundle.json; then exit 1; fi
          if sudo -u hepta-reviewer -- cat /etc/hepta/trust/bundle.json; then exit 1; fi
          if sudo -u hepta-broker -- chmod 0600 /etc/hepta/trust/bundle.json; then exit 1; fi
          if sudo -u hepta-broker -- sh -c 'printf x > /etc/hepta/trust/bundle.json'; then exit 1; fi
          if sudo -u hepta-broker -- mv /etc/hepta/trust/bundle.json /etc/hepta/trust/replaced.json; then exit 1; fi
          if sudo -u hepta-broker -- ln /etc/hepta/trust/bundle.json /etc/hepta/trust/second.json; then exit 1; fi

          sudo ln /etc/hepta/trust/bundle.json /etc/hepta/trust/root-second.json
          if sudo -u hepta-broker -- \
            /usr/local/libexec/hepta/hepta-trust-bundle-preflight \
            /etc/hepta/trust/bundle.json 0 "$trust_gid" "$broker_uid"; then exit 1; fi
          sudo rm /etc/hepta/trust/root-second.json

          sudo ln -s /etc/hepta/trust/bundle.json /tmp/hepta-bundle-alias.json
          if sudo -u hepta-broker -- \
            /usr/local/libexec/hepta/hepta-trust-bundle-preflight \
            /tmp/hepta-bundle-alias.json 0 "$trust_gid" "$broker_uid"; then exit 1; fi
          sudo rm /tmp/hepta-bundle-alias.json

          sudo chmod 0640 /etc/hepta/trust/bundle.json
          if sudo -u hepta-broker -- \
            /usr/local/libexec/hepta/hepta-trust-bundle-preflight \
            /etc/hepta/trust/bundle.json 0 "$trust_gid" "$broker_uid"; then exit 1; fi
          sudo chmod 0440 /etc/hepta/trust/bundle.json

          sudo chmod 0770 /etc/hepta/trust
          if sudo -u hepta-broker -- \
            /usr/local/libexec/hepta/hepta-trust-bundle-preflight \
            /etc/hepta/trust/bundle.json 0 "$trust_gid" "$broker_uid"; then exit 1; fi
          sudo chmod 0750 /etc/hepta/trust

          sudo install -d -o hepta-broker -g hepta-broker -m 0700 \
            /var/lib/hepta-broker/same-owner
          printf '%s' '{"a":1}' \
            | sudo tee /var/lib/hepta-broker/same-owner/bundle.json >/dev/null
          sudo chown hepta-broker:hepta-broker \
            /var/lib/hepta-broker/same-owner/bundle.json
          sudo chmod 0400 /var/lib/hepta-broker/same-owner/bundle.json
          if sudo -u hepta-broker -- \
            /usr/local/libexec/hepta/hepta-trust-bundle-preflight \
            /var/lib/hepta-broker/same-owner/bundle.json \
            "$broker_uid" - "$broker_uid"; then exit 1; fi

          sudo -u hepta-author -- \
            cat /etc/hepta/schema-author/output.schema.json >/dev/null
          if sudo -u hepta-reviewer -- \
            cat /etc/hepta/schema-author/output.schema.json; then exit 1; fi
          if sudo -u hepta-author -- chmod 0600 \
            /etc/hepta/schema-author/output.schema.json; then exit 1; fi
          if sudo -u hepta-author -- sh -c \
            'printf x > /etc/hepta/schema-author/output.schema.json'; then exit 1; fi
          if sudo -u hepta-author -- mv \
            /etc/hepta/schema-author/output.schema.json \
            /etc/hepta/schema-author/replaced.json; then exit 1; fi

      - name: Prove root-owned gate and role-private listener path
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c %u /usr/local/libexec/hepta/hepta-codex-preexec-gate)" = 0
          test "$(stat -c %a /usr/local/libexec/hepta/hepta-codex-preexec-gate)" = 555
          if sudo -u hepta-broker -- chmod 0755 \
            /usr/local/libexec/hepta/hepta-codex-preexec-gate; then exit 1; fi
          if sudo -u hepta-broker -- sh -c \
            'printf x >> /usr/local/libexec/hepta/hepta-codex-preexec-gate'; then exit 1; fi

          sudo -u hepta-broker -- python3 - <<'PY'
          import os
          import socket
          import stat
          path = "/var/lib/hepta-broker/socket-root/author.sock"
          listener = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          listener.bind(path)
          os.chmod(path, 0o600)
          observed = os.lstat(path)
          assert stat.S_ISSOCK(observed.st_mode)
          assert stat.S_IMODE(observed.st_mode) == 0o600
          print(
              f"listener={path} dev={observed.st_dev} inode={observed.st_ino} "
              f"uid={observed.st_uid} gid={observed.st_gid} mode={stat.S_IMODE(observed.st_mode):04o}"
          )
          listener.close()
          PY
          sudo -u hepta-broker -- stat \
            -c 'socket=%n dev=%d inode=%i uid=%u gid=%g mode=%a' \
            /var/lib/hepta-broker/socket-root/author.sock \
            | tee /tmp/listener-identity.txt
          if sudo -u hepta-author -- python3 - <<'PY'
          import socket
          client = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          client.connect('/var/lib/hepta-broker/socket-root/author.sock')
          PY
          then
            exit 1
          fi
          sudo -u hepta-broker -- rm \
            /var/lib/hepta-broker/socket-root/author.sock

          {
            id hepta-broker
            id hepta-author
            id hepta-reviewer
            sudo stat -c 'trust=%n dev=%d inode=%i uid=%u gid=%g mode=%a links=%h bytes=%s' \
              /etc/hepta/trust/bundle.json
            sudo stat -c 'schema=%n dev=%d inode=%i uid=%u gid=%g mode=%a links=%h bytes=%s' \
              /etc/hepta/schema-author/output.schema.json
            sudo stat -c 'gate=%n dev=%d inode=%i uid=%u gid=%g mode=%a links=%h bytes=%s' \
              /usr/local/libexec/hepta/hepta-codex-preexec-gate
            sudo sha256sum /etc/hepta/trust/bundle.json \
              /etc/hepta/schema-author/output.schema.json \
              /usr/local/libexec/hepta/hepta-codex-preexec-gate
          } | tee /tmp/installed-v2-identity.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-broker-installed-v2-${{ github.sha }}
          path: |
            /tmp/trust-positive.txt
            /tmp/listener-identity.txt
            /tmp/installed-v2-identity.txt
          if-no-files-found: warn
          retention-days: 7
