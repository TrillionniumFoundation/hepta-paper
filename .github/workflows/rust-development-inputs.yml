name: rust-development-inputs

# Temporary remote development worktree for the network-isolated editor.
# It never updates refs, merges, reviews, required checks or runtime authority.
on:
  pull_request:
    paths:
      - '.github/workflows/rust-development-inputs.yml'
      - '.github/hepta-local-entrypoint-patch.py'
      - 'rust/crates/hepta-paper-service/src/autonomous_research/**'
      - 'rust/crates/hepta-paper-service/tests/local_workflow/autonomous_entrypoint.rs'

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.number == 135 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/rust-convergence-recovery-fix-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.export.outputs.digest }}
      tree: ${{ steps.export.outputs.tree }}
      base_tree: ${{ steps.export.outputs.base_tree }}
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      CARGO_TARGET_DIR: /tmp/hepta-local-entrypoint-target
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Prepare exact candidate and pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          npm ci --ignore-scripts --no-audit --no-fund
          cp .github/hepta-local-entrypoint-patch.py "$RUNNER_TEMP/patch.py"
          python3 -I "$RUNNER_TEMP/patch.py" prepare
          cargo fmt --manifest-path rust/Cargo.toml --all
          python3 -I "$RUNNER_TEMP/patch.py" finalize
          git diff --check
          git add -A
          git -c user.name='Development worktree' -c user.email='development-worktree@invalid' commit -m 'Temporary tested local workflow tree; no qualification or ref publication'
      - name: Validate existing documentation and exact source bindings
        shell: bash
        run: |
          set -euo pipefail
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          python3 docs/rust/tools/validate-program-truth.py
          node docs/tools/generate-node-rust-gap-report.mjs --check
          for evidence in docs/system/evidence/repository-source-implementation-v1.json docs/system/evidence/rust-functional-source-closure-v1.json; do
            node paper-core/bin/verify-source-implementation-evidence.mjs --evidence "$evidence" --expected-head "$(git rev-parse HEAD)" --expected-tree "$(git rev-parse HEAD^{tree})"
          done
      - name: Execute existing workflow, real autonomous CLI and restart fence regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml --locked -p hepta-paper-service --test local_workflow --test durable_service --test autonomous_research_route 2>&1 | tee "$RUNNER_TEMP/local-entrypoint-tests.log"
          python3 -I - <<'PY'
          import os
          from pathlib import Path
          import runpy
          data = runpy.run_path(os.environ['RUNNER_TEMP'] + '/patch.py')
          log = Path(os.environ['RUNNER_TEMP'], 'local-entrypoint-tests.log').read_text()
          for name in data['TESTS']:
              assert 'autonomous_entrypoint::' + name + ' ... ok' in log, name
          PY
      - name: Strict Clippy and unchanged candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path rust/Cargo.toml --locked -p hepta-paper-service --all-targets -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml --locked -p hepta-paper-service --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Export tested tree, without promoting a branch
        id: export
        shell: bash
        run: python3 -I "$RUNNER_TEMP/patch.py" export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tested-local-entrypoint-candidate
          path: ${{ runner.temp }}/local-entrypoint-candidate
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: local-entrypoint-test-log
          path: ${{ runner.temp }}/local-entrypoint-tests.log
          if-no-files-found: warn
          retention-days: 7
  stage-unreferenced-tree:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No checkout or candidate code runs in this credential-bearing job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-local-entrypoint-candidate
          path: ${{ runner.temp }}/candidate
      - name: Store only unreferenced Git tree objects for explicit reviewer publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
          EXPECTED_TREE: ${{ needs.build.outputs.tree }}
          EXPECTED_BASE: ${{ needs.build.outputs.base_tree }}
        run: |
          python3 -I - <<'PY'
          import hashlib, json, os, re, urllib.request
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'], 'candidate')
          source = root.joinpath('candidate.json')
          assert source.is_file() and not source.is_symlink() and source.stat().st_size <= 2 * 1024 * 1024
          raw = source.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == os.environ['EXPECTED_DIGEST']
          data = json.loads(raw)
          assert data['repository'] == 'TrillionniumFoundation/hepta-paper'
          assert data['parent'] == os.environ['SOURCE_HEAD']
          assert data['base_tree'] == os.environ['EXPECTED_BASE']
          assert data['expected_tree'] == os.environ['EXPECTED_TREE']
          for key in ('parent', 'base_tree', 'expected_tree'):
              assert re.fullmatch('[0-9a-f]{40}', data[key])
          s = 'rust/crates/hepta-paper-service/'
          deletions = {'.github/hepta-local-entrypoint-patch.py', '.github/workflows/rust-development-inputs.yml'}
          allowed = {s+'src/autonomous_research.rs', s+'src/autonomous_research/local.rs', s+'tests/local_workflow.rs', s+'tests/local_workflow/autonomous_entrypoint.rs', s+'tests/durable_service.rs', s+'README.md', 'docs/modules/LOCAL_WORKFLOW_HANDOFF.md', 'docs/migration/node-rust-command-map.v1.json', 'docs/migration/NODE_RUST_GAP_CLOSURE.md', 'docs/system/evidence/repository-source-implementation-v1.json', 'docs/system/evidence/rust-functional-source-closure-v1.json'}
          seen = set()
          assert 1 <= len(data['tree']) <= 13
          for entry in data['tree']:
              name = entry['path']
              assert name not in seen and entry['mode'] == '100644' and entry['type'] == 'blob'
              seen.add(name)
              if name in deletions:
                  assert set(entry) == {'path','mode','type','sha'} and entry['sha'] is None
              else:
                  assert name in allowed and set(entry) == {'path','mode','type','content'} and isinstance(entry['content'], str)
          assert deletions <= seen
          request = urllib.request.Request('https://api.github.com/repos/TrillionniumFoundation/hepta-paper/git/trees', data=json.dumps({'base_tree':data['base_tree'], 'tree':data['tree']}).encode(), method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          assert result['sha'] == data['expected_tree']
          print(json.dumps({'staged_tree':result['sha'], 'parent':data['parent'], 'candidate_digest':os.environ['EXPECTED_DIGEST'], 'ref_updated':False, 'qualification_granted':False}))
          PY
