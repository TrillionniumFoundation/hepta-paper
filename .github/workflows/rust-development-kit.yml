name: rust-development-kit

on:
  push:
    branches: [codex/rust-delivery-development-20260913]
    paths: [.github/workflows/rust-development-kit.yml]

permissions:
  contents: read

jobs:
  export-public-development-inputs:
    if: github.repository == 'TrillionniumFoundation/hepta-paper' && github.ref == 'refs/heads/codex/rust-delivery-development-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Install exact development compiler
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          test "$(node --version)" = 'v22.23.1'
      - name: Export only public compiler binaries and locked dependency source
        shell: bash
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/hepta-development-kit"
          mkdir -p "$kit/toolchain" "$kit/node/bin"
          toolchain="$(dirname "$(dirname "$(rustup which --toolchain 1.98.0 rustc)")")"
          cp -a "$toolchain/." "$kit/toolchain/"
          cp --dereference "$(command -v node)" "$kit/node/bin/node"
          cargo +1.98.0 vendor --manifest-path rust/Cargo.toml --locked "$kit/vendor" > "$kit/vendor-config.toml"
          git rev-parse HEAD > "$kit/source-head.txt"
          git rev-parse 'HEAD^{tree}' > "$kit/source-tree.txt"
          sha256sum rust/Cargo.lock rust/rust-toolchain.toml > "$kit/source-inputs.sha256"
          rustc --version --verbose > "$kit/rustc-version.txt"
          cargo --version --verbose > "$kit/cargo-version.txt"
          node --input-type=module -e 'console.log(JSON.stringify({node:process.version,versions:process.versions,collator:new Intl.Collator().resolvedOptions()}))' > "$kit/node-version.json"
          printf '%s\n' 'Development inputs only. No test, parity, review, deployment or production authority is granted.' > "$kit/SCOPE.txt"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          # No HOME, Cargo configuration, credentials, repository checkout or build outputs are copied.
          (cd "$kit" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/hepta-development-kit.tar.gz" hepta-development-kit
          sha256sum "$RUNNER_TEMP/hepta-development-kit.tar.gz" > "$RUNNER_TEMP/hepta-development-kit.tar.gz.sha256"
      - name: Retain public development inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-development-kit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-development-kit.tar.gz
            ${{ runner.temp }}/hepta-development-kit.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
