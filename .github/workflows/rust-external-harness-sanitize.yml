name: rust-external-harness-sanitize

on:
  push:
    branches:
      - codex/rust-all-gap-closure-20260830
    paths:
      - '.github/workflows/rust-external-harness-sanitize.yml'
      - 'docs/rust/qualification/hepta-cgroup-v2-target-host-qualification.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Make post-kill reaping explicit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/rust/qualification/hepta-cgroup-v2-target-host-qualification.sh')
          text = path.read_text(encoding='utf-8')
          old = '''populated=$(awk '$1=="populated"{print $2}' "$operation/cgroup.events")
[[ $populated == 0 ]] || fail cgroup_remained_populated
for pid in "$leader" "$escaped"; do
  [[ ! -d /proc/$pid ]] || fail process_survived_cgroup_kill
done
'''
          new = '''populated=$(awk '$1=="populated"{print $2}' "$operation/cgroup.events")
[[ $populated == 0 ]] || fail cgroup_remained_populated
wait "$leader" 2>/dev/null || true
for _ in $(seq 1 100); do
  [[ ! -d /proc/$leader && ! -d /proc/$escaped ]] && break
  sleep 0.01
done
for pid in "$leader" "$escaped"; do
  [[ ! -d /proc/$pid ]] || fail process_survived_cgroup_kill
done
[[ ! -s $operation/cgroup.procs ]] || fail cgroup_members_remained_after_kill
'''
          if old not in text:
              raise SystemExit('expected post-kill block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          bash -n docs/rust/qualification/hepta-cgroup-v2-target-host-qualification.sh
          rm .github/workflows/rust-external-harness-sanitize.yml

      - name: Commit the deterministic harness correction and self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/rust/qualification/hepta-cgroup-v2-target-host-qualification.sh \
            .github/workflows/rust-external-harness-sanitize.yml
          git commit -m 'fix(rust): reap cgroup qualification children after kill'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
