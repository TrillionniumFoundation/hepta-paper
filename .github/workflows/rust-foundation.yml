name: rust-foundation

on:
  pull_request:
    paths:
      - '.github/workflows/rust-foundation.yml'
      - '.gitignore'
      - 'rust/**'
      - 'docs/rust/**'
      - 'docs/codex/**'
      - 'docs/adr/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rust-foundation.yml'
      - '.gitignore'
      - 'rust/**'
      - 'docs/rust/**'
      - 'docs/codex/**'
      - 'docs/adr/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  validate:
    name: format, lint, test, docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install qualified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Reject Rust OpenClaw dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'openclaw' \
            --include='*.rs' \
            --include='Cargo.toml' \
            --include='*.toml' \
            rust/crates rust/Cargo.toml rust/rust-toolchain.toml; then
            echo 'OpenClaw is forbidden in the Rust source and manifest graph.' >&2
            exit 1
          fi

      - name: Prepare dependency lock
        id: dependency_lock
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f rust/Cargo.lock ]]; then
            cargo generate-lockfile --manifest-path rust/Cargo.toml
            echo 'generated=true' >> "$GITHUB_OUTPUT"
          else
            echo 'generated=false' >> "$GITHUB_OUTPUT"
          fi
          sha256sum rust/Cargo.lock

      - name: Upload generated dependency lock
        if: steps.dependency_lock.outputs.generated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-cargo-lock
          path: rust/Cargo.lock
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Require committed dependency lock
        if: steps.dependency_lock.outputs.generated == 'true'
        shell: bash
        run: |
          echo '::error::rust/Cargo.lock is missing; commit the generated rust-cargo-lock artifact.'
          exit 1

      - name: Validate locked dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata \
            --manifest-path rust/Cargo.toml \
            --format-version 1 \
            --locked \
            --no-deps \
            > /tmp/hepta-rust-metadata.json
          sha256sum rust/Cargo.lock /tmp/hepta-rust-metadata.json

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path rust/Cargo.toml --workspace --all-features --locked --no-deps
