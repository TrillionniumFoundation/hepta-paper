name: rust-functional-repair

on:
  push:
    branches: [codex/rust-functional-hardening-20260912]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-functional-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: github.repository == 'TrillionniumFoundation/hepta-paper' && github.ref == 'refs/heads/codex/rust-functional-hardening-20260912'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
      RUSTFLAGS: '-Dunsafe-code'
      CARGO_TARGET_DIR: /tmp/hepta-functional-target
    steps:
      - name: Check out immutable repair input
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact patch and logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hepta-functional-hardening
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor c615e0979381091e986723b02800b4475389e3c8 HEAD
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''.join(Path(f'.github/rust-functional-repair.part{i}').read_text() for i in range(4))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '611a24cb155dc3c2c6de7eaf547e917b24123af7e0ae5a776fb805fcd6bf5a77'
          Path('/tmp/hepta-functional-hardening/input.patch').write_bytes(patch)
          PY
          git apply --check /tmp/hepta-functional-hardening/input.patch
          git apply /tmp/hepta-functional-hardening/input.patch
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          rustc --version --verbose | tee /tmp/hepta-functional-hardening/rustc.txt
          test "$(node --version)" = v22.23.1
      - name: Format source and bind actual source bytes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          root = Path.cwd().resolve()
          for name in ['repository-source-implementation-v1.json', 'rust-functional-source-closure-v1.json']:
              path = root / 'docs/system/evidence' / name
              data = json.loads(path.read_text())
              for bundle in data['bundles'].values():
                  for item in bundle['files']:
                      source = root / item['path']
                      assert source.is_file() and not source.is_symlink() and source.resolve().is_relative_to(root)
                      content = source.read_bytes()
                      item['gitBlob'] = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git rm .github/rust-functional-repair.part0 .github/rust-functional-repair.part1 .github/rust-functional-repair.part2 .github/rust-functional-repair.part3 .github/workflows/rust-functional-repair.yml
          git add rust docs/system/evidence
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --signoff -m 'fix(rust): enforce exact scheduler bounds and native capability contracts'
          git rev-parse HEAD > /tmp/hepta-functional-hardening/tested-head.txt
          git rev-parse HEAD^{tree} > /tmp/hepta-functional-hardening/tested-tree.txt
          git diff --binary c615e0979381091e986723b02800b4475389e3c8 HEAD > /tmp/hepta-functional-hardening/final.patch
          git archive --format=tar.gz HEAD > /tmp/hepta-functional-hardening/source.tar.gz
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Publish candidate source without changing admission or activation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/rust-functional-hardening-20260912
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin "refs/heads/$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
      - name: Check formatting and strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings -D unsafe-code -D clippy::todo -D clippy::unimplemented 2>&1 | tee /tmp/hepta-functional-hardening/clippy-all.log
          cargo clippy --manifest-path rust/Cargo.toml --workspace --lib --bins --all-features --locked -- -D warnings -D unsafe-code -D clippy::todo -D clippy::unimplemented -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic 2>&1 | tee /tmp/hepta-functional-hardening/clippy-production.log
      - name: Execute complete Rust workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml --workspace --all-features --locked 2>&1 | tee /tmp/hepta-functional-hardening/test.log
      - name: Build Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        shell: bash
        run: |
          set -euo pipefail
          cargo doc --manifest-path rust/Cargo.toml --workspace --all-features --locked --no-deps 2>&1 | tee /tmp/hepta-functional-hardening/rustdoc.log
      - name: Verify source manifests and documentation
        shell: bash
        run: |
          set -euo pipefail
          node docs/tools/validate-development-docs.mjs 2>&1 | tee /tmp/hepta-functional-hardening/docs.log
          node docs/tools/validate-module-documentation.mjs 2>&1 | tee /tmp/hepta-functional-hardening/modules.log
          python3 docs/rust/tools/validate-program-truth.py 2>&1 | tee /tmp/hepta-functional-hardening/program.log
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          for name in repository-source-implementation-v1 rust-functional-source-closure-v1; do
            node paper-core/bin/verify-source-implementation-evidence.mjs --evidence "docs/system/evidence/$name.json" --expected-head "$head" --expected-tree "$tree" --execute --receipt "/tmp/hepta-functional-hardening/$name.receipt.json" 2>&1 | tee "/tmp/hepta-functional-hardening/$name.log"
          done
      - name: Prove regression tests fail on the unchanged predecessor
        shell: bash
        run: |
          set -euo pipefail
          baseline=/tmp/hepta-pre-fix
          git worktree add --detach "$baseline" c615e0979381091e986723b02800b4475389e3c8
          cp rust/crates/hepta-control-plane/tests/source_correctness_regressions.rs "$baseline/rust/crates/hepta-control-plane/tests/"
          set +e
          cargo test --manifest-path "$baseline/rust/Cargo.toml" --locked -p hepta-control-plane --test source_correctness_regressions -- --nocapture > /tmp/hepta-functional-hardening/baseline-red.log 2>&1
          status=$?
          set -e
          cat /tmp/hepta-functional-hardening/baseline-red.log
          test "$status" -eq 101
          grep -F 'test result: FAILED.' /tmp/hepta-functional-hardening/baseline-red.log
          test "$(grep -cE '^test .* \.\.\. FAILED$' /tmp/hepta-functional-hardening/baseline-red.log)" -ge 3
          git worktree remove --force "$baseline"
      - name: Recheck tested source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat /tmp/hepta-functional-hardening/tested-head.txt)"
          test "$(git rev-parse HEAD^{tree})" = "$(cat /tmp/hepta-functional-hardening/tested-tree.txt)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' 'Source tests only; no production activation, independent acceptance or Node retirement is asserted.' > /tmp/hepta-functional-hardening/scope.txt
          sha256sum /tmp/hepta-functional-hardening/* > /tmp/hepta-functional-hardening/SHA256SUMS
      - name: Retain source, repair and executed test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-functional-hardening-${{ github.sha }}
          path: /tmp/hepta-functional-hardening
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
