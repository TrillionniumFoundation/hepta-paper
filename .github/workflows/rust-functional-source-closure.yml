name: rust-functional-source-closure

on:
  pull_request:
  push:
    branches:
      - main
      - codex/full-rust-replacement-progress-20260916

permissions:
  contents: read

concurrency:
  group: rust-functional-source-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  RUSTFLAGS: '-Dunsafe-code'

jobs:
  exact-head:
    name: rust-functional-source-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact source head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install qualified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'

      - name: Prepare and verify scientific test host
        shell: bash
        run: bash .github/scripts/prepare-scientific-test-host.sh

      - name: Install qualified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          functional_source_cargo="$(rustup which --toolchain 1.98.0 cargo)"
          test -x "$functional_source_cargo"
          test "$("$functional_source_cargo" --version | cut -d ' ' -f 2)" = 1.98.0
          dirname "$functional_source_cargo" >> "$GITHUB_PATH"
          test "$(node --version)" = v22.23.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Verify exact functional source evidence
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          export CARGO_TARGET_DIR=/tmp/rust-functional-source-target-head
          rm -rf "$CARGO_TARGET_DIR"
          git diff --exit-code -- package.json package-lock.json
          python3 -B docs/rust/tools/materialize-public-r-source-cas.py
          cargo build --manifest-path rust/Cargo.toml --locked -p hepta-codex-runtime --bin hepta-codex-preexec-gate
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          export HEPTA_EVIDENCE_HEAD="$head" HEPTA_EVIDENCE_TREE="$tree"
          node paper-core/bin/with-locked-parent-node-oracle.mjs --receipt /tmp/functional-node-oracle-head.json --job-timeout-minutes 90 -- /bin/bash -euc '
            node paper-core/bin/verify-source-implementation-evidence.mjs \
              --evidence docs/system/evidence/rust-functional-source-closure-v1.json \
              --expected-head "$HEPTA_EVIDENCE_HEAD" \
              --expected-tree "$HEPTA_EVIDENCE_TREE" \
              --execute \
              --progress \
              --receipt /tmp/rust-functional-source-head.json
          '
          test -s /tmp/rust-functional-source-head.json
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          sha256sum /tmp/rust-functional-source-head.json

      - name: Retain exact-head functional source receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-functional-source-head-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/rust-functional-source-head.json
            /tmp/functional-node-oracle-head.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  prospective-merge:
    if: github.event_name == 'pull_request'
    name: rust-functional-source-prospective-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out immutable source head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install qualified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'

      - name: Prepare and verify scientific test host
        shell: bash
        run: bash .github/scripts/prepare-scientific-test-host.sh

      - name: Install qualified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          functional_source_cargo="$(rustup which --toolchain 1.98.0 cargo)"
          test -x "$functional_source_cargo"
          test "$("$functional_source_cargo" --version | cut -d ' ' -f 2)" = 1.98.0
          dirname "$functional_source_cargo" >> "$GITHUB_PATH"

      - name: Build immutable prospective merge and verify functional source evidence
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          target="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$target"
          merge="$(node docs/tools/prepare-prospective-merge.mjs --base "$base" --target "$target")"
          merge_tree="$(git rev-parse "$merge^{tree}")"
          git checkout --detach "$merge"
          tree="$(git rev-parse HEAD^{tree})"
          test "$tree" = "$merge_tree"
          export CARGO_TARGET_DIR=/tmp/rust-functional-source-target-merge
          rm -rf "$CARGO_TARGET_DIR"
          git diff --exit-code -- package.json package-lock.json
          python3 -B docs/rust/tools/materialize-public-r-source-cas.py
          cargo build --manifest-path rust/Cargo.toml --locked -p hepta-codex-runtime --bin hepta-codex-preexec-gate
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          export HEPTA_EVIDENCE_HEAD="$merge" HEPTA_EVIDENCE_TREE="$tree"
          node paper-core/bin/with-locked-parent-node-oracle.mjs --receipt /tmp/functional-node-oracle-merge.json --job-timeout-minutes 90 -- /bin/bash -euc '
            node paper-core/bin/verify-source-implementation-evidence.mjs \
              --evidence docs/system/evidence/rust-functional-source-closure-v1.json \
              --expected-head "$HEPTA_EVIDENCE_HEAD" \
              --expected-tree "$HEPTA_EVIDENCE_TREE" \
              --execute \
              --progress \
              --receipt /tmp/rust-functional-source-merge.json
          '
          test -s /tmp/rust-functional-source-merge.json
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          sha256sum /tmp/rust-functional-source-merge.json

      - name: Retain prospective-merge functional source receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-functional-source-merge-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/rust-functional-source-merge.json
            /tmp/functional-node-oracle-merge.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
