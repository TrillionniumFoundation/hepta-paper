name: rust-gap-autofix

on:
  push:
    branches:
      - codex/rust-all-gap-closure-20260830
    paths:
      - '.github/workflows/rust-gap-autofix.yml'
      - 'rust/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-gap-autofix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install qualified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0

      - name: Apply deterministic integration fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workspace = Path('rust/Cargo.toml')
          text = workspace.read_text(encoding='utf-8')
          members = [
              'crates/hepta-cgroup-containment',
              'crates/hepta-legacy-compatibility',
              'crates/hepta-readonly-control',
              'crates/hepta-workspace-authority',
              'crates/hepta-campaign-writer',
              'crates/hepta-local-vertical',
          ]
          lines = text.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip().startswith('members = ['))
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == ']')
          existing = {line.strip().strip(',').strip('"') for line in lines[start + 1:end]}
          lines[end:end] = [f'  "{member}",' for member in members if member not in existing]
          workspace.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          runtime_manifest = Path('rust/crates/hepta-codex-runtime/Cargo.toml')
          text = runtime_manifest.read_text(encoding='utf-8')
          dependency = 'hepta-cgroup-containment = { path = "../hepta-cgroup-containment" }'
          if dependency not in text:
              marker = '[dependencies]\n'
              text = text.replace(marker, marker + dependency + '\n', 1)
              runtime_manifest.write_text(text, encoding='utf-8')

          runtime_lib = Path('rust/crates/hepta-codex-runtime/src/lib.rs')
          text = runtime_lib.read_text(encoding='utf-8')
          export = '''pub use hepta_cgroup_containment::{
    CgroupAuthorityModeV1, CgroupV2Error, CgroupV2OperationV1, CgroupV2PolicyV1,
    ProcessContainmentModeV1,
};
'''
          if 'ProcessContainmentModeV1' not in text:
              text = export + text
              runtime_lib.write_text(text, encoding='utf-8')

          workspace_lib = Path('rust/crates/hepta-workspace-authority/src/lib.rs')
          text = workspace_lib.read_text(encoding='utf-8')
          text = text.replace(
              'Some(previous) if **previous != *entry => {',
              'Some(previous) if *previous != entry => {',
          )
          text = text.replace(
              'validate_relative(Path::new(&name))?;',
              'validate_relative(Path::new(name.as_os_str()))?;',
          )
          old = '''            .any(|prefix| path == prefix || path.starts_with(&format!("{prefix}/")))'''
          new = '''            .any(|prefix| {
                path == prefix
                    || path
                        .strip_prefix(prefix)
                        .is_some_and(|suffix| suffix.starts_with('/'))
            })'''
          text = text.replace(old, new)
          workspace_lib.write_text(text, encoding='utf-8')

          oracle_test = Path('rust/crates/hepta-legacy-compatibility/tests/node_oracle.rs')
          text = oracle_test.read_text(encoding='utf-8')
          text = text.replace(
              '''        let output = Command::new("node").arg(&oracle).arg(fixture).output();
        let Ok(output) = output else {
            return;
        };''',
              '''        let output = Command::new("node")
            .arg(&oracle)
            .arg(fixture)
            .output()
            .expect("Node runtime required for the compatibility differential");''',
          )
          oracle_test.write_text(text, encoding='utf-8')
          PY

      - name: Normalize source and lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fix --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features \
            --allow-dirty --allow-staged || true
          cargo clippy --fix --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features \
            --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --manifest-path rust/Cargo.toml --all

      - name: Commit only deterministic changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- rust/Cargo.toml rust/Cargo.lock rust/crates; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/Cargo.toml rust/Cargo.lock rust/crates
          git commit -m 'fix(rust): integrate and normalize Plan v3 gap crates'
          git push origin "HEAD:${GITHUB_REF_NAME}"
