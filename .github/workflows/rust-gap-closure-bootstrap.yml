name: rust-gap-closure-bootstrap

on:
  push:
    branches:
      - codex/rust-all-gap-closure-v2-20260830
    paths:
      - rust/**
      - docs/rust/**
      - .github/workflows/rust-gap-closure-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

concurrency:
  group: rust-gap-closure-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-lock-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Normalize exact source shapes
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/rust/tools/normalize-gap-closure-source.py
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check

      - name: Generate and bind dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo metadata --manifest-path rust/Cargo.toml --format-version 1 --locked > /tmp/rust-metadata.json
          sha256sum rust/Cargo.lock /tmp/rust-metadata.json

      - name: Compile every target
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features --locked

      - name: Run all feature tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml \
            --workspace --all-features --locked -- --test-threads=1

      - name: Deny Clippy warnings
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features --locked -- -D warnings

      - name: Deny rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        shell: bash
        run: |
          set -euo pipefail
          cargo doc --manifest-path rust/Cargo.toml \
            --workspace --all-features --locked --no-deps

      - name: Verify independent Node-to-Rust compatibility
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/Cargo.toml \
            -p hepta-legacy-compat --bin hepta-legacy-json-v1 --locked
          HEPTA_LEGACY_ORACLE="$PWD/rust/target/debug/hepta-legacy-json-v1" \
            node rust/compat/check-node-rust-parity.mjs

      - name: Validate canonical Plan v3 truth
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/rust/tools/validate-program-truth.py

      - name: Commit only the validated normalized tree
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          parent_sha=$(git rev-parse HEAD)
          tested_tree=$(git write-tree)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/Cargo.toml rust/Cargo.lock rust/crates rust/compat
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "result_sha=$parent_sha" >> "$GITHUB_OUTPUT"
            echo "tested_tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tested_tree=$(git write-tree)
          git commit -m 'build(rust): normalize and lock Plan v3 gap closure'
          result_sha=$(git rev-parse HEAD)
          result_tree=$(git rev-parse HEAD^{tree})
          test "$tested_tree" = "$result_tree"
          git push origin HEAD:codex/rust-all-gap-closure-v2-20260830
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "result_sha=$result_sha" >> "$GITHUB_OUTPUT"
          echo "tested_tree=$tested_tree" >> "$GITHUB_OUTPUT"

      - name: Emit exact-tree bootstrap evidence
        if: always()
        env:
          RESULT_SHA: ${{ steps.commit.outputs.result_sha }}
          TESTED_TREE: ${{ steps.commit.outputs.tested_tree }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hepta-gap-closure-evidence
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          record = {
              "schemaVersion": 1,
              "kind": "rust_gap_closure_bootstrap",
              "sourceEventSha": os.environ["GITHUB_SHA"],
              "resultSha": os.environ.get("RESULT_SHA") or None,
              "testedTree": os.environ.get("TESTED_TREE") or None,
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runnerOs": os.environ["RUNNER_OS"],
              "cargoLockSha256": hashlib.sha256((root / "rust/Cargo.lock").read_bytes()).hexdigest(),
              "programTruthSha256": hashlib.sha256((root / "docs/rust/current-status.v1.json").read_bytes()).hexdigest(),
              "authority": "source_only_non_production",
          }
          path = pathlib.Path("/tmp/hepta-gap-closure-evidence/bootstrap.json")
          path.write_text(json.dumps(record, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          sha256sum /tmp/hepta-gap-closure-evidence/bootstrap.json \
            > /tmp/hepta-gap-closure-evidence/SHA256SUMS

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-gap-closure-bootstrap-${{ github.sha }}
          path: /tmp/hepta-gap-closure-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
