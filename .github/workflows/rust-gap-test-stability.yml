name: rust-gap-test-stability

on:
  push:
    branches:
      - codex/rust-all-gap-closure-20260830
    paths:
      - '.github/workflows/rust-gap-test-stability.yml'
      - 'rust/crates/hepta-cgroup-containment/**'
      - 'rust/crates/hepta-workspace-authority/**'
      - 'rust/crates/hepta-campaign-writer/**'
      - 'rust/crates/hepta-local-vertical/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-gap-test-stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install qualified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0

      - name: Apply deterministic test-stability fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cgroup = Path('rust/crates/hepta-cgroup-containment/src/lib.rs')
          text = cgroup.read_text(encoding='utf-8')
          old = '''            writeln!(file, "{pid}")
                .map_err(|error| CgroupV2Error::Filesystem("fixture_attach", error.kind()))
'''
          new = '''            let existing = fs::read_to_string(self.path.join("cgroup.procs"))
                .map_err(|error| CgroupV2Error::Filesystem("fixture_attach", error.kind()))?;
            let value = if existing.is_empty() {
                pid.to_string()
            } else {
                format!("\\n{pid}")
            };
            file.write_all(value.as_bytes())
                .map_err(|error| CgroupV2Error::Filesystem("fixture_attach", error.kind()))
'''
          text = text.replace(old, new)
          cgroup.write_text(text, encoding='utf-8')

          workspace = Path('rust/crates/hepta-workspace-authority/src/lib.rs')
          text = workspace.read_text(encoding='utf-8')
          text = text.replace('.strip_prefix(prefix)', '.strip_prefix(prefix.as_str())')
          workspace.write_text(text, encoding='utf-8')

          writer = Path('rust/crates/hepta-campaign-writer/src/lib.rs')
          text = writer.read_text(encoding='utf-8')
          marker = '''    /// Runs full SQLite and event-chain integrity checks.
    pub fn validate_integrity(&self) -> Result<(), CampaignWriterError> {
'''
          method = '''    /// Checkpoints and truncates WAL state before an immutable read-only handoff.
    pub fn checkpoint_for_read_only(&self) -> Result<(), CampaignWriterError> {
        self.connection.execute_batch("PRAGMA wal_checkpoint(TRUNCATE);")?;
        validate_integrity(&self.connection)
    }

'''
          if 'pub fn checkpoint_for_read_only' not in text:
              text = text.replace(marker, method + marker)
              writer.write_text(text, encoding='utf-8')

          vertical = Path('rust/crates/hepta-local-vertical/tests/local_slice.rs')
          text = vertical.read_text(encoding='utf-8')
          old = '''    writer.validate_integrity().expect("writer integrity");
    drop(writer);
'''
          new = '''    writer.validate_integrity().expect("writer integrity");
    writer
        .checkpoint_for_read_only()
        .expect("checkpoint for immutable reader");
    drop(writer);
'''
          text = text.replace(old, new)
          vertical.write_text(text, encoding='utf-8')
          PY

      - name: Format and commit deterministic stability fixes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          if git diff --quiet -- rust/crates; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates
          git commit -m 'fix(rust): stabilize process-set and immutable-reader tests'
          git push origin "HEAD:${GITHUB_REF_NAME}"
