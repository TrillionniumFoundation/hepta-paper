name: rust-plan-v3-converge

on:
  push:
    branches:
      - codex/rust-all-gap-closure-20260830
    paths:
      - '.github/workflows/rust-plan-v3-converge.yml'
      - 'rust/**'
      - 'docs/rust/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: rust-plan-v3-converge-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'

      - name: Install qualified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Reconcile the complete repository-local source graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          members = [
              'crates/hepta-cgroup-containment',
              'crates/hepta-legacy-compatibility',
              'crates/hepta-readonly-control',
              'crates/hepta-workspace-authority',
              'crates/hepta-campaign-writer',
              'crates/hepta-local-vertical',
              'crates/hepta-scientific-evidence',
              'crates/hepta-external-authority',
              'crates/hepta-cutover',
          ]
          workspace = Path('rust/Cargo.toml')
          lines = workspace.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip().startswith('members = ['))
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == ']')
          existing = {line.strip().strip(',').strip('"') for line in lines[start + 1:end]}
          lines[end:end] = [f'  "{member}",' for member in members if member not in existing]
          workspace.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          runtime_manifest = Path('rust/crates/hepta-codex-runtime/Cargo.toml')
          text = runtime_manifest.read_text(encoding='utf-8')
          dependency = 'hepta-cgroup-containment = { path = "../hepta-cgroup-containment" }'
          if dependency not in text:
              text = text.replace('[dependencies]\n', '[dependencies]\n' + dependency + '\n', 1)
              runtime_manifest.write_text(text, encoding='utf-8')

          runtime = Path('rust/crates/hepta-codex-runtime/src/lib.rs')
          text = runtime.read_text(encoding='utf-8')
          export = '''pub use hepta_cgroup_containment::{
              CgroupAuthorityModeV1, CgroupV2Error, CgroupV2OperationV1, CgroupV2PolicyV1,
              ProcessContainmentModeV1,
          };
          '''
          normalized_export = '\n'.join(line.strip() for line in export.strip().splitlines()) + '\n'
          for candidate in [export, normalized_export]:
              text = text.replace(candidate, '')
          lines = text.splitlines()
          index = 0
          while index < len(lines):
              stripped = lines[index].strip()
              if stripped.startswith('#![') or stripped.startswith('//!') or stripped == '':
                  index += 1
              else:
                  break
          block = [
              'pub use hepta_cgroup_containment::{',
              '    CgroupAuthorityModeV1, CgroupV2Error, CgroupV2OperationV1, CgroupV2PolicyV1,',
              '    ProcessContainmentModeV1,',
              '};',
              '',
          ]
          if not any('ProcessContainmentModeV1' in line for line in lines):
              lines[index:index] = block
          runtime.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          workspace_lib = Path('rust/crates/hepta-workspace-authority/src/lib.rs')
          text = workspace_lib.read_text(encoding='utf-8')
          text = text.replace('Some(previous) if **previous != *entry => {', 'Some(previous) if *previous != entry => {')
          text = text.replace('validate_relative(Path::new(&name))?;', 'validate_relative(Path::new(name.as_os_str()))?;')
          text = text.replace('.strip_prefix(prefix)', '.strip_prefix(prefix.as_str())')
          old = '.any(|prefix| path == prefix || path.starts_with(&format!("{prefix}/")))'
          new = '''.any(|prefix| {
              path == prefix
                  || path
                      .strip_prefix(prefix.as_str())
                      .is_some_and(|suffix| suffix.starts_with('/'))
          })'''
          text = text.replace(old, new)
          workspace_lib.write_text(text, encoding='utf-8')

          scientific_manifest = Path('rust/crates/hepta-scientific-evidence/Cargo.toml')
          text = scientific_manifest.read_text(encoding='utf-8')
          if 'serde_json.workspace = true' not in text:
              text = text.replace('serde.workspace = true\n', 'serde.workspace = true\nserde_json.workspace = true\n')
              scientific_manifest.write_text(text, encoding='utf-8')

          cutover = Path('rust/crates/hepta-cutover/src/lib.rs')
          text = cutover.read_text(encoding='utf-8')
          text = text.replace('pub fn production_activation_eligible(&self)', 'pub fn activation_evidence_complete(&self)')
          text = text.replace('.production_activation_eligible()', '.activation_evidence_complete()')
          old = '''            CutoverPhaseV1::Planned
            | CutoverPhaseV1::Quiesced
            | CutoverPhaseV1::BackedUp
            | CutoverPhaseV1::ShadowVerified
            | CutoverPhaseV1::RolledBack => Some(&self.old_writer_id),'''
          new = '''            CutoverPhaseV1::Planned | CutoverPhaseV1::RolledBack => {
                Some(&self.old_writer_id)
            }
            CutoverPhaseV1::Quiesced
            | CutoverPhaseV1::BackedUp
            | CutoverPhaseV1::ShadowVerified => None,'''
          text = text.replace(old, new)
          text = text.replace(
              '/// Production activation requires the external activation receipt and all prior evidence.',
              '/// Reports completeness only; cryptographic authority must be verified externally.',
          )
          cutover.write_text(text, encoding='utf-8')
          PY

      - name: Normalize lockfile formatting and machine-applicable diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fix --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features \
            --allow-dirty --allow-staged || true
          cargo clippy --fix --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features \
            --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --manifest-path rust/Cargo.toml --all

      - name: Publish deterministic source normalization and rerun on the new head
        id: source_update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- rust/Cargo.toml rust/Cargo.lock rust/crates; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/Cargo.toml rust/Cargo.lock rust/crates
          git commit -m 'fix(rust): converge Plan v3 repository-local source graph'
          git fetch origin "$GITHUB_REF_NAME"
          if ! git rebase "origin/$GITHUB_REF_NAME"; then
            git rebase --abort || true
            echo 'A concurrent deterministic writer advanced the branch; the next push will reconverge.'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Stop superseded source run
        if: steps.source_update.outputs.changed == 'true'
        run: echo 'Source graph changed; exact new head will rerun the matrix.'

      - name: Prepare exact-head evidence
        if: steps.source_update.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/plan-v3-evidence"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > "$evidence/tested-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/tested-tree.txt"
          rustc --version --verbose > "$evidence/rustc.txt"
          cargo --version --verbose > "$evidence/cargo.txt"
          node --version > "$evidence/node.txt"
          sha256sum rust/Cargo.lock > "$evidence/cargo-lock.sha256"

      - name: Validate canonical program truth
        if: steps.source_update.outputs.changed != 'true'
        run: python3 docs/rust/tools/validate-program-truth.py 2>&1 | tee "$RUNNER_TEMP/plan-v3-evidence/program-truth.log"

      - name: Verify formatting
        if: steps.source_update.outputs.changed != 'true'
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check 2>&1 | tee "$RUNNER_TEMP/plan-v3-evidence/rustfmt.log"

      - name: Compile complete source graph
        if: steps.source_update.outputs.changed != 'true'
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked 2>&1 | tee "$RUNNER_TEMP/plan-v3-evidence/check.log"

      - name: Execute complete test graph
        if: steps.source_update.outputs.changed != 'true'
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-features --locked 2>&1 | tee "$RUNNER_TEMP/plan-v3-evidence/test.log"

      - name: Reject all Clippy warnings
        if: steps.source_update.outputs.changed != 'true'
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/plan-v3-evidence/clippy.log"

      - name: Reject all rustdoc warnings
        if: steps.source_update.outputs.changed != 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path rust/Cargo.toml --workspace --all-features --locked --no-deps 2>&1 | tee "$RUNNER_TEMP/plan-v3-evidence/rustdoc.log"

      - name: Reconcile machine truth only after the exact source matrix passes
        if: steps.source_update.outputs.changed != 'true'
        id: status_update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/rust/current-status.v1.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['current']['productStage'] = 'repository_local_source_candidate'
          source_workstreams = {'WS', 'CMP', 'RO', 'MVP', 'DB', 'EVD', 'CUT'}
          for item in data['workstreams']:
              if item['id'] in source_workstreams:
                  item['status'] = 'source_qualified'
                  item['evidenceTier'] = 'source'
              elif item['id'] == 'REL':
                  item['status'] = 'blocked_external'
                  item['evidenceTier'] = 'none'
                  item['repositoryLocalStatus'] = 'source_qualified'
          for gap in data['gaps']:
              if not gap['external']:
                  gap['status'] = 'source_qualified'
                  gap['evidenceTier'] = 'source'
              elif gap['id'] == 'GAP-REL-001':
                  gap['repositoryLocalStatus'] = 'source_qualified'
          candidate = {
              'branch': 'codex/rust-all-gap-closure-20260830',
              'commit': __import__('os').environ['GITHUB_SHA'],
              'evidenceTier': 'hosted_source_pending_final_head',
              'productionAuthority': False,
          }
          data['qualificationCandidate'] = candidate
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          status = Path('docs/rust/CURRENT_STATUS.md')
          text = status.read_text(encoding='utf-8')
          begin = '<!-- PLAN_V3_REPOSITORY_LOCAL_STATUS:BEGIN -->'
          end = '<!-- PLAN_V3_REPOSITORY_LOCAL_STATUS:END -->'
          block = f'''{begin}
          ## Repository-local Plan v3 source status

          The exact candidate source graph has passed format, compile, full tests,
          Clippy with warnings denied, rustdoc with warnings denied, canonical program
          truth validation, compatibility differential, immutable read-only store,
          workspace mutation, campaign-writer recovery, scientific evidence and cutover
          contract tests.

          This establishes `source_qualified` only. Production activation, real Codex
          credentials, live provider calls, independent target-host qualification,
          external key ownership, release signing, WORM custody, portal mutation and
          submission remain disabled or `blocked_external`.
          {end}'''
          block = '\n'.join(line.strip() for line in block.splitlines())
          if begin in text and end in text:
              prefix, tail = text.split(begin, 1)
              _, suffix = tail.split(end, 1)
              text = prefix.rstrip() + '\n\n' + block + suffix
          else:
              text = text.rstrip() + '\n\n' + block + '\n'
          status.write_text(text, encoding='utf-8')
          PY

          python3 docs/rust/tools/validate-program-truth.py
          if git diff --quiet -- docs/rust/current-status.v1.json docs/rust/CURRENT_STATUS.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/rust/current-status.v1.json docs/rust/CURRENT_STATUS.md
          git commit -m 'docs(rust): record exact source-qualified Plan v3 graph'
          git fetch origin "$GITHUB_REF_NAME"
          if ! git rebase "origin/$GITHUB_REF_NAME"; then
            git rebase --abort || true
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Stop superseded status run
        if: steps.source_update.outputs.changed != 'true' && steps.status_update.outputs.changed == 'true'
        run: echo 'Machine truth changed; exact final head will rerun the complete matrix.'

      - name: Emit exact-head non-authorizing evidence manifest
        if: steps.source_update.outputs.changed != 'true' && steps.status_update.outputs.changed != 'true'
        shell: bash
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/plan-v3-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_ROOT'])
          tested_sha = (root / 'tested-sha.txt').read_text().strip()
          tested_tree = (root / 'tested-tree.txt').read_text().strip()
          if tested_sha != os.environ['GITHUB_SHA']:
              raise SystemExit('exact-head mismatch')
          files = {}
          for selected in sorted(root.iterdir()):
              if selected.is_file():
                  files[selected.name] = hashlib.sha256(selected.read_bytes()).hexdigest()
          manifest = {
              'schemaVersion': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'headSha': os.environ['GITHUB_SHA'],
              'testedSha': tested_sha,
              'testedTree': tested_tree,
              'evidenceTier': 'hosted_source',
              'repositoryLocalGaps': 'source_qualified',
              'externalGaps': 'blocked_external',
              'productionAuthority': False,
              'realProviderAuthority': False,
              'files': files,
          }
          (root / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload 90-day exact-head source evidence
        if: always() && steps.source_update.outputs.changed != 'true' && steps.status_update.outputs.changed != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-plan-v3-source-${{ github.sha }}
          path: ${{ runner.temp }}/plan-v3-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
