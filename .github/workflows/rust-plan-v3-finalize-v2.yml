name: rust-plan-v3-finalize-v2

on:
  push:
    branches:
      - codex/rust-all-gap-closure-20260830
    paths:
      - '.github/workflows/rust-plan-v3-finalize-v2.yml'
      - 'rust/**'
      - 'docs/rust/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: rust-plan-v3-finalize-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  qualify-final-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install qualified Rust toolchain and repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          sudo apt-get update
          sudo apt-get install -y sqlite3
          npm ci --ignore-scripts --no-audit --no-fund
          rustc --version --verbose
          cargo --version --verbose
          node --version

      - name: Reconcile source graph and known deterministic migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          members = [
              'crates/hepta-cgroup-containment',
              'crates/hepta-legacy-compatibility',
              'crates/hepta-readonly-control',
              'crates/hepta-workspace-authority',
              'crates/hepta-campaign-writer',
              'crates/hepta-local-vertical',
              'crates/hepta-scientific-evidence',
              'crates/hepta-external-authority',
              'crates/hepta-cutover',
          ]
          workspace = Path('rust/Cargo.toml')
          lines = workspace.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip().startswith('members = ['))
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == ']')
          existing = {line.strip().strip(',').strip('"') for line in lines[start + 1:end]}
          lines[end:end] = [f'  "{member}",' for member in members if member not in existing]
          workspace.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          dependencies = [
              (
                  Path('rust/crates/hepta-workspace-authority/Cargo.toml'),
                  'nix.workspace = true',
                  '[dependencies]\n',
              ),
              (
                  Path('rust/crates/hepta-scientific-evidence/Cargo.toml'),
                  'serde_json.workspace = true',
                  'serde.workspace = true\n',
              ),
              (
                  Path('rust/crates/hepta-codex-runtime/Cargo.toml'),
                  'hepta-cgroup-containment = { path = "../hepta-cgroup-containment" }',
                  '[dependencies]\n',
              ),
          ]
          for path, dependency, marker in dependencies:
              text = path.read_text(encoding='utf-8')
              if dependency not in text:
                  text = text.replace(marker, marker + dependency + '\n', 1)
                  path.write_text(text, encoding='utf-8')

          runtime = Path('rust/crates/hepta-codex-runtime/src/lib.rs')
          text = runtime.read_text(encoding='utf-8')
          text = re.sub(
              r'pub use hepta_cgroup_containment::\{.*?ProcessContainmentModeV1,?\n?\};\n?',
              '',
              text,
              flags=re.S,
          )
          lines = text.splitlines()
          index = 0
          while index < len(lines):
              selected = lines[index].strip()
              if selected.startswith('#![') or selected.startswith('//!') or selected == '':
                  index += 1
              else:
                  break
          lines[index:index] = [
              'pub use hepta_cgroup_containment::{',
              '    CgroupAuthorityModeV1, CgroupV2Error, CgroupV2OperationV1, CgroupV2PolicyV1,',
              '    ProcessContainmentModeV1,',
              '};',
              '',
          ]
          runtime.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          cgroup = Path('rust/crates/hepta-cgroup-containment/src/lib.rs')
          text = cgroup.read_text(encoding='utf-8')
          text = text.replace(
              'fs::{MetadataExt, OpenOptionsExt, PermissionsExt}',
              'fs::{MetadataExt, OpenOptionsExt}',
          )
          text = text.replace('(\"cgroup.procs\", \"0\"),', '("cgroup.procs", ""),')
          old = '''        write_control(&self.path.join("cgroup.procs"), &pid.to_string())
'''
          new = '''        if self.policy.authority_mode == CgroupAuthorityModeV1::LocalFixture {
            let path = self.path.join("cgroup.procs");
            let existing = fs::read_to_string(&path)
                .map_err(|error| CgroupV2Error::Filesystem("fixture_attach", error.kind()))?;
            let mut file = OpenOptions::new()
                .append(true)
                .open(path)
                .map_err(|error| CgroupV2Error::Filesystem("fixture_attach", error.kind()))?;
            let value = if existing.is_empty() {
                pid.to_string()
            } else {
                format!("\\n{pid}")
            };
            file.write_all(value.as_bytes())
                .map_err(|error| CgroupV2Error::Filesystem("fixture_attach", error.kind()))
        } else {
            write_control(&self.path.join("cgroup.procs"), &pid.to_string())
        }
'''
          text = text.replace(old, new)
          cgroup.write_text(text, encoding='utf-8')

          workspace_lib = Path('rust/crates/hepta-workspace-authority/src/lib.rs')
          text = workspace_lib.read_text(encoding='utf-8')
          for selected in [
              'Some(previous) if **previous != *entry => {',
              'Some(previous) if *previous != entry => {',
          ]:
              text = text.replace(selected, 'Some(previous) if **previous != **entry => {')
          text = text.replace(
              'validate_relative(Path::new(&name))?;',
              'validate_relative(Path::new(name.as_os_str()))?;',
          )
          text = text.replace('.strip_prefix(prefix)', '.strip_prefix(prefix.as_str())')
          text = re.sub(
              r'\n    /// Resolves a validated relative path through `/proc/self/fd/<root-fd>`\.\n'
              r'    pub fn anchored_path\(&self, relative: &Path\) -> Result<PathBuf, WorkspaceError> \{.*?\n    \}\n',
              '\n',
              text,
              flags=re.S,
          )
          workspace_lib.write_text(text, encoding='utf-8')

          writer = Path('rust/crates/hepta-campaign-writer/src/lib.rs')
          text = writer.read_text(encoding='utf-8')
          if 'pub fn checkpoint_for_read_only' not in text:
              marker = '''    /// Runs full SQLite and event-chain integrity checks.
    pub fn validate_integrity(&self) -> Result<(), CampaignWriterError> {
'''
              method = '''    /// Checkpoints and truncates WAL state before an immutable read-only handoff.
    pub fn checkpoint_for_read_only(&self) -> Result<(), CampaignWriterError> {
        self.connection.execute_batch("PRAGMA wal_checkpoint(TRUNCATE);")?;
        validate_integrity(&self.connection)
    }

'''
              text = text.replace(marker, method + marker)
          start = text.index('    pub fn integrate_prepared_result(')
          end = text.index('    /// Cancels a pre-provider claim', start)
          segment = text[start:end]
          segment = segment.replace(
              '''             WHERE campaign_id = ?1 AND node_id = ?2 AND attempt_id = ?3
               AND writer_generation = ?4 AND node_generation = ?5''',
              '''             WHERE campaign_id = ?1 AND node_id = ?2 AND attempt_id = ?3
               AND node_generation = ?4''',
          )
          segment = segment.replace(
              '''                attempt_id,
                to_i64(lease.generation)?,
                to_i64(node_generation)?,''',
              '''                attempt_id,
                to_i64(node_generation)?,''',
          )
          writer.write_text(text[:start] + segment + text[end:], encoding='utf-8')

          vertical = Path('rust/crates/hepta-local-vertical/tests/local_slice.rs')
          text = vertical.read_text(encoding='utf-8')
          text = text.replace(
              '''    writer.validate_integrity().expect("writer integrity");
    drop(writer);
''',
              '''    writer.validate_integrity().expect("writer integrity");
    writer
        .checkpoint_for_read_only()
        .expect("checkpoint for immutable reader");
    drop(writer);
''',
          )
          vertical.write_text(text, encoding='utf-8')

          oracle = Path('rust/crates/hepta-legacy-compatibility/tests/node_oracle.rs')
          text = oracle.read_text(encoding='utf-8')
          text = text.replace(
              '''        let output = Command::new("node").arg(&oracle).arg(fixture).output();
        let Ok(output) = output else {
            return;
        };''',
              '''        let output = Command::new("node")
            .arg(&oracle)
            .arg(fixture)
            .output()
            .expect("Node runtime required for the compatibility differential");''',
          )
          oracle.write_text(text, encoding='utf-8')

          cutover = Path('rust/crates/hepta-cutover/src/lib.rs')
          text = cutover.read_text(encoding='utf-8')
          text = text.replace(
              'pub fn production_activation_eligible(&self)',
              'pub fn activation_evidence_complete(&self)',
          )
          text = text.replace(
              '.production_activation_eligible()',
              '.activation_evidence_complete()',
          )
          old = '''            CutoverPhaseV1::Planned
            | CutoverPhaseV1::Quiesced
            | CutoverPhaseV1::BackedUp
            | CutoverPhaseV1::ShadowVerified
            | CutoverPhaseV1::RolledBack => Some(&self.old_writer_id),'''
          new = '''            CutoverPhaseV1::Planned | CutoverPhaseV1::RolledBack => {
                Some(&self.old_writer_id)
            }
            CutoverPhaseV1::Quiesced
            | CutoverPhaseV1::BackedUp
            | CutoverPhaseV1::ShadowVerified => None,'''
          text = text.replace(old, new)
          text = text.replace(
              '/// Production activation requires the external activation receipt and all prior evidence.',
              '/// Reports completeness only; cryptographic authority must be verified externally.',
          )
          cutover.write_text(text, encoding='utf-8')
          PY

      - name: Normalize source, lockfile, and machine-applicable diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fix --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features \
            --allow-dirty --allow-staged || true
          cargo clippy --fix --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features \
            --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --manifest-path rust/Cargo.toml --all

      - name: Run complete source and repository integration matrix
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/plan-v3-v2-evidence"
          mkdir -p "$evidence"
          python3 docs/rust/tools/validate-program-truth.py 2>&1 | tee "$evidence/program-truth-before.log"
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check 2>&1 | tee "$evidence/rustfmt-before.log"
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked 2>&1 | tee "$evidence/check-before.log"
          cargo test --manifest-path rust/Cargo.toml --workspace --all-features --locked 2>&1 | tee "$evidence/test-before.log"
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee "$evidence/clippy-before.log"
          RUSTDOCFLAGS='-D warnings' cargo doc --manifest-path rust/Cargo.toml --workspace --all-features --locked --no-deps 2>&1 | tee "$evidence/rustdoc-before.log"
          npm run static:check 2>&1 | tee "$evidence/static-check.log"
          npm run legacy:fixture-verify 2>&1 | tee "$evidence/legacy-fixture.log"
          npm run test:migration-differential 2>&1 | tee "$evidence/migration-differential.log"
          bash -n docs/rust/qualification/hepta-broker-host-qualification-v2.sh

      - name: Update canonical status after the complete matrix passes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/rust/current-status.v1.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['current']['productStage'] = 'repository_local_source_candidate'
          for item in data['workstreams']:
              if item['id'] in {'WS', 'CMP', 'RO', 'MVP', 'DB', 'EVD', 'CUT'}:
                  item['status'] = 'source_qualified'
                  item['evidenceTier'] = 'source'
              elif item['id'] == 'REL':
                  item['status'] = 'blocked_external'
                  item['evidenceTier'] = 'none'
                  item['repositoryLocalStatus'] = 'source_qualified'
          for gap in data['gaps']:
              if not gap['external']:
                  gap['status'] = 'source_qualified'
                  gap['evidenceTier'] = 'source'
              elif gap['id'] == 'GAP-REL-001':
                  gap['repositoryLocalStatus'] = 'source_qualified'
          data['qualificationCandidate'] = {
              'branch': 'codex/rust-all-gap-closure-20260830',
              'evidenceTier': 'hosted_source',
              'productionAuthority': False,
              'externalGaps': 'blocked_external',
          }
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          python3 docs/rust/tools/validate-program-truth.py

      - name: Retire temporary convergence workflows
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .github/workflows/rust-repository-gap-closure.yml \
            .github/workflows/rust-gap-diagnostics.yml \
            .github/workflows/rust-gap-autofix.yml \
            .github/workflows/rust-gap-runtime-hardening.yml \
            .github/workflows/rust-gap-test-stability.yml \
            .github/workflows/rust-plan-v3-converge.yml \
            .github/workflows/rust-plan-v3-finalize.yml \
            .github/workflows/rust-workspace-object-hardening.yml \
            .github/workflows/rust-workspace-cleanup.yml \
            .github/workflows/rust-gap-dependency-reconcile.yml; do
            rm -f "$file"
          done

      - name: Commit the tested tree
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust docs/rust .github/workflows
          if git diff --cached --quiet; then
            echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "final_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'feat(rust): close Plan v3 repository-local source gaps'
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "final_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Rebase and re-run the complete matrix on the final tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          evidence="$RUNNER_TEMP/plan-v3-v2-evidence"
          python3 docs/rust/tools/validate-program-truth.py 2>&1 | tee "$evidence/program-truth-final.log"
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check 2>&1 | tee "$evidence/rustfmt-final.log"
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked 2>&1 | tee "$evidence/check-final.log"
          cargo test --manifest-path rust/Cargo.toml --workspace --all-features --locked 2>&1 | tee "$evidence/test-final.log"
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee "$evidence/clippy-final.log"
          RUSTDOCFLAGS='-D warnings' cargo doc --manifest-path rust/Cargo.toml --workspace --all-features --locked --no-deps 2>&1 | tee "$evidence/rustdoc-final.log"
          npm run static:check 2>&1 | tee "$evidence/static-check-final.log"
          npm run legacy:fixture-verify 2>&1 | tee "$evidence/legacy-fixture-final.log"
          npm run test:migration-differential 2>&1 | tee "$evidence/migration-differential-final.log"

      - name: Push and bind the exact final SHA and tree
        id: push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
          final_sha=$(git rev-parse HEAD)
          final_tree=$(git rev-parse 'HEAD^{tree}')
          remote_sha=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$final_sha" = "$remote_sha"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "final_tree=$final_tree" >> "$GITHUB_OUTPUT"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${final_sha}" \
            -f state='success' \
            -f context='rust-plan-v3-finalize-v2' \
            -f description='Exact final tree passed Plan v3 source and differential matrix' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Emit exact final-tree non-authorizing evidence
        shell: bash
        env:
          FINAL_SHA: ${{ steps.push.outputs.final_sha }}
          FINAL_TREE: ${{ steps.push.outputs.final_tree }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/plan-v3-v2-evidence"
          printf '%s\n' "$FINAL_SHA" > "$evidence/tested-sha.txt"
          printf '%s\n' "$FINAL_TREE" > "$evidence/tested-tree.txt"
          rustc --version --verbose > "$evidence/rustc.txt"
          cargo --version --verbose > "$evidence/cargo.txt"
          node --version > "$evidence/node.txt"
          sha256sum rust/Cargo.lock > "$evidence/cargo-lock.sha256"
          EVIDENCE_ROOT="$evidence" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_ROOT'])
          files = {
              selected.name: hashlib.sha256(selected.read_bytes()).hexdigest()
              for selected in sorted(root.iterdir())
              if selected.is_file()
          }
          manifest = {
              'schemaVersion': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'branch': os.environ['GITHUB_REF_NAME'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'testedSha': os.environ['FINAL_SHA'],
              'testedTree': os.environ['FINAL_TREE'],
              'evidenceTier': 'hosted_source',
              'repositoryLocalGaps': 'source_qualified',
              'externalGaps': 'blocked_external',
              'productionAuthority': False,
              'realCodexCredentials': False,
              'liveProviderCalls': False,
              'releaseAuthority': False,
              'submissionAuthority': False,
              'files': files,
          }
          (root / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload 90-day exact-final-tree evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-plan-v3-final-${{ steps.push.outputs.final_sha }}
          path: ${{ runner.temp }}/plan-v3-v2-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish exact-final-tree PR record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.push.outputs.final_sha }}
          FINAL_TREE: ${{ steps.push.outputs.final_tree }}
        run: |
          set -euo pipefail
          pr=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=TrillionniumFoundation:${GITHUB_REF_NAME}" --jq '.[0].number // empty')
          test -n "$pr" || exit 0
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" \
            -f body="## Exact-final-tree Plan v3 source qualification\n\n- tested SHA: \`$FINAL_SHA\`\n- tested tree: \`$FINAL_TREE\`\n- commit status: \`rust-plan-v3-finalize-v2\`\n- artifact: \`rust-plan-v3-final-$FINAL_SHA\`\n- repository-local source gaps: \`source_qualified\`\n- independently controlled/production gaps: \`blocked_external\`\n\nThe PR remains Draft. This evidence does not authorize real Codex credentials, live provider calls, production writer cutover, release signing, WORM custody, portal mutation, or submission." >/dev/null
