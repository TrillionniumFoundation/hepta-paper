name: rust-plan-v3-preflight-cleanup

on:
  push:
    branches:
      - codex/rust-all-gap-closure-20260830
    paths:
      - '.github/workflows/rust-plan-v3-preflight-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Retain only durable qualification workflows
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .github/workflows/rust-repository-gap-closure.yml \
            .github/workflows/rust-gap-diagnostics.yml \
            .github/workflows/rust-gap-autofix.yml \
            .github/workflows/rust-gap-runtime-hardening.yml \
            .github/workflows/rust-gap-test-stability.yml \
            .github/workflows/rust-plan-v3-converge.yml \
            .github/workflows/rust-plan-v3-finalize.yml \
            .github/workflows/rust-workspace-object-hardening.yml \
            .github/workflows/rust-workspace-cleanup.yml \
            .github/workflows/rust-gap-dependency-reconcile.yml \
            .github/workflows/rust-cgroup-fixture-zero-fix.yml \
            .github/workflows/rust-cgroup-attach-normalize.yml \
            .github/workflows/rust-external-harness-sanitize.yml \
            .github/workflows/rust-qualification-ingest-register.yml \
            .github/workflows/rust-qualification-ingest-sanitize.yml \
            .github/workflows/rust-plan-v3-preflight-cleanup.yml; do
            rm -f "$file"
          done

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(ci): retire temporary Plan v3 convergence workflows'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
