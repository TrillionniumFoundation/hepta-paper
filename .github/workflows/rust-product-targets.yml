name: rust-product-targets

on:
  pull_request:
  push:
    branches:
      - codex/full-rust-replacement-progress-20260916

permissions:
  contents: read

concurrency:
  group: rust-product-targets-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-Dunsafe-code'

jobs:
  compile:
    name: product-targets (${{ matrix.subject }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        subject: [exact-head, prospective-merge]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
      SUBJECT: ${{ matrix.subject }}
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact source subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if [ "$SUBJECT" = prospective-merge ]; then
            tree="$(git merge-tree --write-tree "$EXPECTED_BASE" "$EXPECTED_HEAD")"
            printf '%s' "$tree" | grep -Eq '^[0-9a-f]{40}$'
            commit_date="$(git show -s --format=%cI "$EXPECTED_HEAD")"
            merge="$(
              printf 'Product target validation\n\nbase %s\nhead %s\n' "$EXPECTED_BASE" "$EXPECTED_HEAD" |
                GIT_AUTHOR_NAME=hepta-product-validation \
                GIT_AUTHOR_EMAIL=product-validation@invalid.example \
                GIT_AUTHOR_DATE="$commit_date" \
                GIT_COMMITTER_NAME=hepta-product-validation \
                GIT_COMMITTER_EMAIL=product-validation@invalid.example \
                GIT_COMMITTER_DATE="$commit_date" \
                git commit-tree "$tree" -p "$EXPECTED_BASE" -p "$EXPECTED_HEAD"
            )"
            git checkout --detach "$merge"
            test "$(git rev-parse HEAD^{tree})" = "$tree"
          fi
          mkdir -p "$RUNNER_TEMP/product-target-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/product-target-evidence/source.txt"
          printf 'base %s\nhead %s\n' "$EXPECTED_BASE" "$EXPECTED_HEAD" >> "$RUNNER_TEMP/product-target-evidence/source.txt"
          sha256sum rust/Cargo.lock > "$RUNNER_TEMP/product-target-evidence/lock.sha256"
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustc +1.98.0 --version --verbose > "$RUNNER_TEMP/product-target-evidence/compiler.txt"
      - name: Compile all workspace libraries binaries examples and tests
        shell: bash
        run: |
          set -euo pipefail
          # This lane is independent of formatting and migration-test selection.
          # In particular, standalone product brokers must compile even when no
          # service migration target depends on them. This is not a test receipt.
          export CARGO_TARGET_DIR="$RUNNER_TEMP/product-target-build"
          cargo +1.98.0 check --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features --locked \
            2>&1 | tee "$RUNNER_TEMP/product-target-evidence/check.log"
          sha256sum --check "$RUNNER_TEMP/product-target-evidence/lock.sha256"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Retain actual build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: product-targets-${{ matrix.subject }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/product-target-evidence
          if-no-files-found: error
          retention-days: 30
