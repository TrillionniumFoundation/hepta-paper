name: rust-program-truth

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'docs/rust/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/rust-*.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'docs/rust/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/rust-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-program-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate canonical program truth
        run: python3 docs/rust/tools/validate-program-truth.py
      - name: Emit exact-head and exact-tree evidence
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVIDENCE_OUTPUT: /tmp/hepta-exact-head-evidence.json
        run: python3 docs/rust/tools/write-exact-head-evidence.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-program-truth-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/hepta-exact-head-evidence.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
