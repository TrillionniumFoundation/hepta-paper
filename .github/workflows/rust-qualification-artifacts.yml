name: rust-qualification-artifacts

on:
  pull_request:
    paths:
      - rust/**
      - docs/rust/qualification/**
      - .github/workflows/rust-qualification-artifacts.yml
  push:
    branches: [main]
    paths:
      - rust/**
      - docs/rust/qualification/**
      - .github/workflows/rust-qualification-artifacts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-qualification-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate scripts and evidence schema
        shell: bash
        run: |
          set -euo pipefail
          bash -n docs/rust/qualification/hepta-broker-host-qualification-v2.sh
          python3 - <<'PY'
          import json
          from pathlib import Path

          schemas = [
              "hepta-broker-qualification-evidence-v1.schema.json",
              "external-qualification-closure-request-v1.schema.json",
              "external-qualification-closure-receipt-v1.schema.json",
              "qualification-trust-store-v1.schema.json",
          ]
          for name in schemas:
              decoded = json.loads(
                  (Path("docs/rust/qualification") / name).read_text()
              )
              assert decoded["$schema"] == "https://json-schema.org/draft/2020-12/schema"
              assert decoded["type"] == "object"
              assert decoded["additionalProperties"] is False
              version = decoded["properties"].get("schemaVersion")
              if version is None:
                  version = decoded["properties"].get("version")
              assert version is not None and version.get("const") == 1, name
          PY

      - name: Build and smoke-test qualification CLIs
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
          cargo build --manifest-path rust/Cargo.toml \
            -p hepta-codex-broker \
            --bin hepta-broker-journal-preflight \
            --bin hepta-trust-bundle-preflight \
            --locked
          cargo build --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest \
            --bin hepta-qualification-closure \
            --locked
          cargo clippy --manifest-path rust/Cargo.toml \
            -p hepta-codex-broker \
            --bin hepta-broker-journal-preflight \
            --bin hepta-trust-bundle-preflight \
            --locked -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest \
            --bin hepta-qualification-closure \
            --locked -- -D warnings
          cargo test --manifest-path rust/Cargo.toml \
            -p hepta-qualification-ingest \
            --all-features --locked

          if rust/target/debug/hepta-broker-journal-preflight; then exit 1; fi
          if rust/target/debug/hepta-trust-bundle-preflight; then exit 1; fi
          if rust/target/debug/hepta-qualification-closure; then exit 1; fi
          rust/target/debug/hepta-qualification-closure --help

          fixture=$(mktemp -d)
          chmod 0700 "$fixture"
          owner_uid=$(stat -c %u "$fixture")
          rust/target/debug/hepta-broker-journal-preflight \
            "$fixture/broker.sqlite" "$owner_uid"
          rust/target/debug/hepta-broker-journal-preflight \
            "$fixture/broker.sqlite" "$owner_uid"
          test "$(stat -c %a "$fixture/broker.sqlite")" = 600
          rm -rf "$fixture"
