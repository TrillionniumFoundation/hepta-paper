name: rust-qualification-ingest-sanitize

on:
  push:
    branches:
      - codex/rust-all-gap-closure-20260830
    paths:
      - '.github/workflows/rust-qualification-ingest-sanitize.yml'
      - 'rust/crates/hepta-qualification-ingest/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Replace temporary-borrow signing construction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/hepta-qualification-ingest/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('fs::{self, File, OpenOptions}', 'fs::{self, OpenOptions}')
          text = text.replace('path::{Path, PathBuf}', 'path::Path')
          start = text.index('pub fn qualification_signing_bytes_v1(')
          end = text.index('\nfn validate_envelope(', start)
          replacement = '''pub fn qualification_signing_bytes_v1(
    envelope: &ExternalQualificationEnvelopeV1,
) -> Result<Vec<u8>, QualificationIngestError> {
    validate_envelope(envelope)?;
    let mut output = Vec::new();
    append_signing_field(&mut output, b"HeptaExternalQualificationEnvelopeV1")?;
    append_signing_field(&mut output, &envelope.version.to_be_bytes())?;
    append_signing_field(&mut output, package_name(envelope.package_id).as_bytes())?;
    append_signing_field(&mut output, envelope.repository.as_bytes())?;
    append_signing_field(&mut output, envelope.commit.as_bytes())?;
    append_signing_field(&mut output, envelope.tree.as_bytes())?;
    append_signing_field(&mut output, envelope.payload_hash.as_bytes())?;
    append_signing_field(&mut output, envelope.authority_domain_id.as_bytes())?;
    append_signing_field(&mut output, envelope.signer_key_id.as_bytes())?;
    append_signing_field(&mut output, envelope.nonce.as_bytes())?;
    append_signing_field(&mut output, &envelope.issued_at_unix_ms.to_be_bytes())?;
    append_signing_field(&mut output, &envelope.expires_at_unix_ms.to_be_bytes())?;
    Ok(output)
}

fn append_signing_field(
    output: &mut Vec<u8>,
    value: &[u8],
) -> Result<(), QualificationIngestError> {
    let length =
        u64::try_from(value.len()).map_err(|_| QualificationIngestError::EncodingInvalid)?;
    output.extend_from_slice(&length.to_be_bytes());
    output.extend_from_slice(value);
    Ok(())
}
'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          rm .github/workflows/rust-qualification-ingest-sanitize.yml

      - name: Commit deterministic correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/hepta-qualification-ingest/src/lib.rs \
            .github/workflows/rust-qualification-ingest-sanitize.yml
          git commit -m 'fix(rust): stabilize qualification signing bytes'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
