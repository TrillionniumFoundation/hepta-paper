name: rust-service-fix-temporary

on:
  push:
    branches:
      - codex/rust-broker-service-20260828
    paths:
      - '.github/workflows/rust-service-fix-temporary.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-broker-service-20260828
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/hepta-codex-broker/src/fake_execution.rs')
          text = path.read_text()
          old = '''        Some(process.stdout_hash.clone()),
        None,
        fault_for(&plan, OperationState::EventStreamStarted),
'''
          new = '''        None,
        None,
        fault_for(&plan, OperationState::EventStreamStarted),
'''
          if old not in text:
              raise SystemExit('event_stream_started evidence callsite not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          git config user.name 'hepta-rust-fix-bot'
          git config user.email 'hepta-rust-fix-bot@users.noreply.github.com'
          git add rust
          git commit -m 'fix(rust): align event-stream-started evidence [service-fix]'
          git push origin HEAD:codex/rust-broker-service-20260828
