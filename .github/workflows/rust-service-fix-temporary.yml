name: rust-service-fix-temporary

on:
  push:
    branches:
      - codex/rust-broker-service-20260828
    paths:
      - '.github/workflows/rust-service-fix-temporary.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-broker-service-20260828
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('rust/crates/hepta-codex-broker/src/fake_execution.rs')
          text = path.read_text()
          pattern = re.compile(
              r'(OperationState::EventStreamStarted,\n'
              r'\s*timeline\.event_stream_started_unix_ms,\n)'
              r'\s*Some\(process\.stdout_hash\.clone\(\)\),\n'
              r'(\s*None,\n\s*fault_for\(&plan, OperationState::EventStreamStarted\),)'
          )
          updated, count = pattern.subn(r'\1        None,\n\2', text, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one event-stream evidence callsite, found {count}')
          path.write_text(updated)
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          git config user.name 'hepta-rust-fix-bot'
          git config user.email 'hepta-rust-fix-bot@users.noreply.github.com'
          git add rust
          git commit -m 'fix(rust): align event-stream-started evidence [service-fix]'
          git push origin HEAD:codex/rust-broker-service-20260828
