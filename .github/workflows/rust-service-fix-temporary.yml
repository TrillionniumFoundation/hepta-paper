name: rust-service-fix-temporary

on:
  push:
    branches:
      - codex/rust-broker-service-20260828
    paths:
      - '.github/workflows/rust-service-fix-temporary.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out service branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-broker-service-20260828
          fetch-depth: 0

      - name: Install pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0

      - name: Apply exact Clippy fixes and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('rust/crates/hepta-codex-broker/src/listener.rs'): [
                  ('    os::fd::AsFd,\n', ''),
              ],
              Path('rust/crates/hepta-codex-broker/src/server.rs'): [
                  ('mpsc::{Receiver, RecvTimeoutError, SyncSender, TrySendError, sync_channel}',
                   'mpsc::{Receiver, RecvTimeoutError, TrySendError, sync_channel}'),
                  ('pub fn run(mut self)', 'pub fn run(self)'),
                  ('let (trust_store, _, bundle_hash) = match trust_manager.snapshot(now)',
                   'let (trust_store, _, _) = match trust_manager.snapshot(now)'),
              ],
              Path('rust/crates/hepta-codex-broker/src/fake_execution.rs'): [
                  ('Err(error) if spawn_journal_error.is_some()',
                   'Err(_error) if spawn_journal_error.is_some()'),
              ],
          }
          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          git config user.name 'hepta-rust-fix-bot'
          git config user.email 'hepta-rust-fix-bot@users.noreply.github.com'
          git add rust
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'fix(rust): address service Clippy failures [service-fix]'
          git push origin HEAD:codex/rust-broker-service-20260828
