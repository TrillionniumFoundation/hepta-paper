name: rust-service-fix-temporary

on:
  push:
    branches:
      - codex/rust-broker-service-20260828
    paths:
      - '.github/workflows/rust-service-fix-temporary.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-broker-service-20260828
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          python3 - <<'PY'
          from pathlib import Path

          edits = {
              Path('rust/crates/hepta-codex-broker/src/fake_execution.rs'): [
                  (
                      'TerminalProcessFailure(BoundedProcessResultV1),',
                      'TerminalProcessFailure(Box<BoundedProcessResultV1>),',
                  ),
                  (
                      'return Err(FakeBrokerExecutionError::TerminalProcessFailure(process));',
                      'return Err(FakeBrokerExecutionError::TerminalProcessFailure(Box::new(process)));',
                  ),
              ],
              Path('rust/crates/hepta-codex-broker/src/journal/maintenance.rs'): [
                  (
                      'journal_mode.to_ascii_lowercase() != "wal"',
                      '!journal_mode.eq_ignore_ascii_case("wal")',
                  ),
              ],
              Path('rust/crates/hepta-codex-broker/src/server.rs'): [
                  (
                      'let mut policy = BrokerServerPolicyV1::default();\n        policy.worker_threads = HARD_MAXIMUM_WORKERS + 1;',
                      'let policy = BrokerServerPolicyV1 {\n            worker_threads: HARD_MAXIMUM_WORKERS + 1,\n            ..BrokerServerPolicyV1::default()\n        };',
                  ),
                  (
                      'let mut policy = BrokerServerPolicyV1::default();\n        policy.queue_capacity = HARD_MAXIMUM_QUEUE_CAPACITY + 1;',
                      'let policy = BrokerServerPolicyV1 {\n            queue_capacity: HARD_MAXIMUM_QUEUE_CAPACITY + 1,\n            ..BrokerServerPolicyV1::default()\n        };',
                  ),
              ],
          }
          for path, replacements in edits.items():
              text = path.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected source in {path}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          git config user.name 'hepta-rust-fix-bot'
          git config user.email 'hepta-rust-fix-bot@users.noreply.github.com'
          git add rust
          git commit -m 'fix(rust): clear remaining service Clippy failures [service-fix]'
          git push origin HEAD:codex/rust-broker-service-20260828
