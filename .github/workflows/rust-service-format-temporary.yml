name: rust-service-format-temporary

on:
  push:
    branches:
      - codex/rust-broker-service-20260828
    paths:
      - '.github/workflows/rust-service-format-temporary.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-broker-service-20260828
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          cargo fmt --manifest-path rust/Cargo.toml --all
          git config user.name 'hepta-rust-format-bot'
          git config user.email 'hepta-rust-format-bot@users.noreply.github.com'
          git add rust
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(rust): format service lifecycle tests [service-format]'
          git push origin HEAD:codex/rust-broker-service-20260828
