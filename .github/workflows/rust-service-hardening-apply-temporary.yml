name: rust-service-hardening-apply-temporary

on:
  push:
    branches:
      - codex/rust-broker-service-20260828
    paths:
      - '.github/workflows/rust-service-hardening-apply-temporary.yml'
      - '.github/scripts/apply_service_hardening.py'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-broker-service-20260828
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          python3 .github/scripts/apply_service_hardening.py
          cargo fmt --manifest-path rust/Cargo.toml --all
          git config user.name 'hepta-rust-hardening-bot'
          git config user.email 'hepta-rust-hardening-bot@users.noreply.github.com'
          git add rust
          git commit -m 'fix(rust): harden service rotation and persisted acknowledgement [service-hardening]'
          git push origin HEAD:codex/rust-broker-service-20260828
