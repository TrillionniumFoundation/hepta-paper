name: rust-source-closure-borrow-fix

on:
  push:
    branches:
      - codex/rust-source-gap-full-closure-20260911

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-source-gap-full-closure-20260911
          fetch-depth: 1
      - name: Apply ownership fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust/crates/hepta-control-plane/src/hierarchical_resource.rs')
          s = p.read_text()
          old = '''        let body = PreparedBodyV1 {
              request: &request,
              fence_generation: self.next_fence_generation,
          };
          let prepared_hash =
              canonical_hash_v1(&body).map_err(|_| HierarchicalResourceError::Encoding)?;
          let prepared = PreparedHierarchicalReservationV1 {
              request,
              fence_generation: body.fence_generation,
              prepared_hash,
          };
          '''
          new = '''        let fence_generation = self.next_fence_generation;
          let body = PreparedBodyV1 {
              request: &request,
              fence_generation,
          };
          let prepared_hash =
              canonical_hash_v1(&body).map_err(|_| HierarchicalResourceError::Encoding)?;
          let prepared = PreparedHierarchicalReservationV1 {
              request,
              fence_generation,
              prepared_hash,
          };
          '''
          if old not in s:
              raise SystemExit('expected ownership-fix subject not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format and commit fix
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          cargo fmt --manifest-path rust/Cargo.toml --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/hepta-control-plane/src/hierarchical_resource.rs
          git commit -m 'fix(rust): end prepared-request borrow before ownership transfer'
          git push origin HEAD:codex/rust-source-gap-full-closure-20260911
