name: rust-source-closure-borrow-fix

on:
  push:
    branches:
      - codex/rust-source-gap-full-closure-20260911

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-source-gap-full-closure-20260911
          fetch-depth: 1
      - name: Apply ownership fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust/crates/hepta-control-plane/src/hierarchical_resource.rs')
          s = p.read_text()
          marker = '        let body = PreparedBodyV1 {\n'
          if marker not in s:
              raise SystemExit('prepared body marker not found')
          s = s.replace(marker, '        let fence_generation = self.next_fence_generation;\n' + marker, 1)
          old = '            fence_generation: self.next_fence_generation,\n'
          if old not in s:
              raise SystemExit('source fence generation marker not found')
          s = s.replace(old, '            fence_generation,\n', 1)
          old = '            fence_generation: body.fence_generation,\n'
          if old not in s:
              raise SystemExit('prepared fence generation marker not found')
          s = s.replace(old, '            fence_generation,\n', 1)
          p.write_text(s)
          PY
      - name: Format and commit fix
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          cargo fmt --manifest-path rust/Cargo.toml --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/hepta-control-plane/src/hierarchical_resource.rs
          git commit -m 'fix(rust): end prepared-request borrow before ownership transfer'
          git push origin HEAD:codex/rust-source-gap-full-closure-20260911
