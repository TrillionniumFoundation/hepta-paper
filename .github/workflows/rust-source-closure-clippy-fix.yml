name: rust-source-closure-clippy-fix

on:
  push:
    branches:
      - codex/rust-source-gap-full-closure-20260911

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-source-gap-full-closure-20260911
          fetch-depth: 1
      - name: Apply Clippy-preserving substitutions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'rust/crates/hepta-control-plane/src/calibration.rs': (
                  '    let minimum_observed_at = now_unix_ms\n        .checked_sub(policy.maximum_sample_age_ms)\n        .unwrap_or_default();',
                  '    let minimum_observed_at = now_unix_ms.saturating_sub(policy.maximum_sample_age_ms);'
              ),
              'rust/crates/hepta-control-plane/src/performance.rs': (
                  '    let minimum_observed_at = now_unix_ms\n        .checked_sub(budget.maximum_observation_age_ms)\n        .unwrap_or_default();',
                  '    let minimum_observed_at = now_unix_ms.saturating_sub(budget.maximum_observation_age_ms);'
              ),
          }
          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'expected exact Clippy subject once in {name}')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          cargo fmt --manifest-path rust/Cargo.toml --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/hepta-control-plane/src/calibration.rs rust/crates/hepta-control-plane/src/performance.rs
          git commit -m 'fix(rust): satisfy strict calibration Clippy gates'
          git push origin HEAD:codex/rust-source-gap-full-closure-20260911
