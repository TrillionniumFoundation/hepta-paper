name: rust-source-closure-final-code-format

on:
  push:
    branches:
      - codex/rust-source-gap-full-closure-20260911

permissions:
  contents: write

jobs:
  rustfmt:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-source-gap-full-closure-20260911
          fetch-depth: 1
      - name: Install exact formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          if git diff --quiet -- rust; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust
          git commit -m 'style(rust): format source-closure control-plane code'
          git push origin HEAD:codex/rust-source-gap-full-closure-20260911
