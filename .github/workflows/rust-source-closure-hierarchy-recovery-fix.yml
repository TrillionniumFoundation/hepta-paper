name: rust-source-closure-hierarchy-recovery-fix

on:
  push:
    branches:
      - codex/rust-source-gap-full-closure-20260911

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/rust-source-gap-full-closure-20260911
          fetch-depth: 1
      - name: Add explicit prepared-reservation cancellation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust/crates/hepta-control-plane/src/hierarchical_resource.rs')
          s = p.read_text()
          marker = "    /// Advances externally observed capacity/accounting generations. Existing\n    /// finalized leases remain charged but cannot renew; stale prepared entries\n    /// are removed by `reap_stale_prepared` before their capacity is reused.\n"
          method = "    /// Cancels one exact prepared reservation before dispatch authorization.\n    /// This is the only non-expiry recovery path for a prepare/finalize failure.\n    pub fn cancel_prepared(\n        &mut self,\n        reservation_id: &str,\n    ) -> Result<PreparedHierarchicalReservationV1, HierarchicalResourceError> {\n        let prepared = self\n            .prepared\n            .remove(reservation_id)\n            .ok_or(HierarchicalResourceError::ReservationMissing)?;\n        self.release_vector(&prepared.request.leaf_scope_id, prepared.request.resources)?;\n        Ok(prepared)\n    }\n\n"
          if s.count(marker) != 1:
              raise SystemExit('hierarchy insertion marker not found exactly once')
          p.write_text(s.replace(marker, method + marker, 1))
          PY
      - name: Format and commit recovery source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          cargo fmt --manifest-path rust/Cargo.toml --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust
          git commit -m 'fix(rust): recover prepared hierarchical reservations'
          git push origin HEAD:codex/rust-source-gap-full-closure-20260911
