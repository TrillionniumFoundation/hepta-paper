name: rust-source-qualification-revalidation

on:
  workflow_run:
    workflows:
      - exact-head-source-validation
      - hepta-paper-ci
      - rust-broker-installed-qualification
      - rust-broker-installed-qualification-v2
      - rust-foundation
      - rust-plan-v3-external-contracts
      - rust-program-truth
      - rust-qualification-artifacts
      - rust-source-snapshot
      - rust-supply-chain
      - workflow-lint
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit
        required: true
        type: string
      candidate_tree:
        description: Optional expected candidate tree
        required: false
        type: string
      pull_request_number:
        description: Pull request containing the candidate
        required: true
        type: number
      head_branch:
        description: Exact pull-request head branch
        required: true
        type: string
      base_ref:
        description: Exact pull-request base ref
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: rust-source-qualification-current-${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
  cancel-in-progress: true

jobs:
  source-qualification-current:
    name: source-qualification-current
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0].number > 0)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
      EXPECTED_TREE_SHA: ${{ inputs.candidate_tree || '' }}
      EXPECTED_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pull_request_number }}
      EXPECTED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.head_branch }}
      EXPECTED_BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref || inputs.base_ref }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Establish exact immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/rust-source-qualification-current"
          install -d -m 0700 "$evidence_root/raw"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          observed_tree="$(git rev-parse HEAD^{tree})"
          if [ -n "$EXPECTED_TREE_SHA" ]; then
            test "$observed_tree" = "$EXPECTED_TREE_SHA"
          fi
          printf '%s\n' "$observed_tree" > "$evidence_root/tree.txt"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          EVIDENCE_OUTPUT="$evidence_root/preflight.json" \
            python3 docs/rust/tools/write-exact-head-evidence.py

      - name: Recompute producer-authenticated current source status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/rust-source-qualification-current"
          python3 docs/rust/tools/validate-program-truth.py \
            | tee "$evidence_root/static-validation.json"
          python3 docs/rust/tools/collect-required-checks.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$EXPECTED_HEAD_SHA" \
            --tree "$(cat "$evidence_root/tree.txt")" \
            --head-branch "$EXPECTED_HEAD_BRANCH" \
            --base-ref "$EXPECTED_BASE_REF" \
            --pull-request "$EXPECTED_PR_NUMBER" \
            --token "$GH_TOKEN" \
            --api-url "$GITHUB_API_URL" \
            --raw-output-dir "$evidence_root/raw" \
            --output "$evidence_root/check-evidence.v2.json"
          python3 docs/rust/tools/derive-effective-status.py \
            --check-runs "$evidence_root/check-evidence.v2.json" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$EXPECTED_HEAD_SHA" \
            --tree "$(cat "$evidence_root/tree.txt")" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$evidence_root/effective-status.v1.json" \
            | tee "$evidence_root/derivation.json"
          python3 docs/rust/tools/verify-effective-status-current.py \
            --artifact "$evidence_root/effective-status.v1.json" \
            --current-check-runs "$evidence_root/check-evidence.v2.json" \
            | tee "$evidence_root/live-revalidation.json"
          sha256sum "$evidence_root/effective-status.v1.json" \
            > "$evidence_root/effective-status.v1.json.sha256"

      - name: Prove exact source identity after live revalidation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/rust-source-qualification-current"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$(cat "$evidence_root/tree.txt")"
          EVIDENCE_OUTPUT="$evidence_root/postflight.json" \
            python3 docs/rust/tools/write-exact-head-evidence.py
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rust-source-qualification-current-${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rust-source-qualification-current
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
