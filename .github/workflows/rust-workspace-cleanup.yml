name: rust-workspace-cleanup

on:
  push:
    branches:
      - codex/rust-all-gap-closure-20260830
    paths:
      - '.github/workflows/rust-workspace-cleanup.yml'
      - 'rust/crates/hepta-workspace-authority/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-workspace-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install rustfmt
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0

      - name: Remove retired path hashing and revalidate source identity after copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/hepta-workspace-authority/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '''    copy_tree(&source.descriptor, &destination)?;
    File::open(&destination)?.sync_all()?;''',
              '''    copy_tree(&source.descriptor, &destination)?;
    source.verify_identity()?;
    File::open(&destination)?.sync_all()?;''',
          )
          marker = '\nfn hash_file(path: &Path) -> Result<String, WorkspaceError> {'
          if marker in text:
              start = text.index(marker)
              end = text.index('\nfn validate_relative(', start)
              text = text[:start] + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all

      - name: Commit deterministic cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- rust/crates/hepta-workspace-authority; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/hepta-workspace-authority
          git commit -m 'refactor(rust): retire path-based workspace hashing'
          git fetch origin "$GITHUB_REF_NAME"
          if ! git rebase "origin/$GITHUB_REF_NAME"; then
            git rebase --abort || true
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
