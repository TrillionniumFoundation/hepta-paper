name: rustfmt-cutover-once

on:
  push:
    branches:
      - codex/rust-full-replacement-rc-20260908
    paths:
      - .github/workflows/rustfmt-cutover-once.yml
      - rust/crates/hepta-cutover/**

permissions:
  contents: write

concurrency:
  group: rustfmt-cutover-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'hepta-paper-automation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0

      - name: Apply and publish exact rustfmt output
        shell: bash
        env:
          TARGET_BRANCH: codex/rust-full-replacement-rc-20260908
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          if git diff --quiet -- rust; then
            exit 0
          fi
          git config user.name hepta-paper-automation
          git config user.email hepta-paper-automation@users.noreply.github.com
          git add rust
          git commit -m 'style(rust): apply formatter to legacy freeze gate'
          git push origin "HEAD:${TARGET_BRANCH}"
