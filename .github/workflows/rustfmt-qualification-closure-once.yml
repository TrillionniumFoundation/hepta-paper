name: rustfmt-qualification-closure-once

on:
  push:
    branches:
      - codex/rust-plan-v3-main-integration-20260830
    paths:
      - '.github/workflows/rustfmt-qualification-closure-once.yml'
      - 'rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs'

permissions:
  contents: write

concurrency:
  group: rustfmt-qualification-closure-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Install exact Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          rustfmt --version

      - name: Format and publish only the qualification closure source
        shell: bash
        run: |
          set -euo pipefail
          target='rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs'
          cargo fmt --manifest-path rust/Cargo.toml --all
          if git diff --quiet -- "$target"; then
            echo 'qualification closure source is already formatted'
            exit 0
          fi
          test -z "$(git diff --name-only -- . ':!rust/crates/hepta-qualification-ingest/src/bin/hepta-qualification-closure.rs')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git commit -m 'style(rust): apply rustfmt to qualification closure'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
