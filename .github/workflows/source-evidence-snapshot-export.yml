name: source-evidence-snapshot-export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Retain tracked source evidence snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-evidence-snapshot-${{ github.event.pull_request.head.sha }}
          path: |
            docs/system/evidence/repository-source-implementation-v1.json
            docs/system/truth/work-items.v2.json
            docs/system/truth/modules.v1.json
            docs/system/truth/capabilities.v1.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
