name: source-promotion-sync

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  generate:
    name: source-promotion-generated-truth
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install qualified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'

      - name: Apply and verify source promotions in isolated checkout
        id: promotion
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          node docs/tools/apply-source-promotions.mjs --write | tee /tmp/source-promotion-sync.json
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          python3 docs/rust/tools/validate-program-truth.py
          git diff --check
          git diff -- docs/system/truth/work-items.v2.json docs/system/truth/modules.v1.json \
            docs/system/evidence/repository-source-implementation-v1.json \
            docs/system/evidence/rust-functional-source-closure-v1.json \
            docs/modules/MODULE_DOCUMENTATION_MATRIX.md docs/modules/specs \
            > /tmp/source-promotion.patch

          if test -z "$(git status --porcelain=v1 --untracked-files=no)"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "generated_head=$source_head" >> "$GITHUB_OUTPUT"
            echo "generated_tree=$source_tree" >> "$GITHUB_OUTPUT"
            node paper-core/bin/verify-source-implementation-evidence.mjs \
              --evidence docs/system/evidence/repository-source-implementation-v1.json \
              --expected-head "$source_head" \
              --expected-tree "$source_tree"
            node paper-core/bin/verify-source-implementation-evidence.mjs \
              --evidence docs/system/evidence/rust-functional-source-closure-v1.json \
              --expected-head "$source_head" \
              --expected-tree "$source_tree"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            exit 0
          fi

          test -s /tmp/source-promotion.patch
          git config user.name hepta-source-promotion
          git config user.email source-promotion@invalid.example
          git add docs/system/truth/work-items.v2.json docs/system/truth/modules.v1.json \
            docs/system/evidence/repository-source-implementation-v1.json \
            docs/system/evidence/rust-functional-source-closure-v1.json \
            docs/modules/MODULE_DOCUMENTATION_MATRIX.md docs/modules/specs
          GIT_AUTHOR_DATE="$(git show -s --format=%cI "$source_head")" \
          GIT_COMMITTER_DATE="$(git show -s --format=%cI "$source_head")" \
            git commit -m 'chore: apply verified source promotion truth'
          generated_head="$(git rev-parse HEAD)"
          generated_tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$source_head"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          node paper-core/bin/verify-source-implementation-evidence.mjs \
            --evidence docs/system/evidence/repository-source-implementation-v1.json \
            --expected-head "$generated_head" \
            --expected-tree "$generated_tree"
          node paper-core/bin/verify-source-implementation-evidence.mjs \
            --evidence docs/system/evidence/rust-functional-source-closure-v1.json \
            --expected-head "$generated_head" \
            --expected-tree "$generated_tree"
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          python3 docs/rust/tools/validate-program-truth.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "generated_head=$generated_head" >> "$GITHUB_OUTPUT"
          echo "generated_tree=$generated_tree" >> "$GITHUB_OUTPUT"

      - name: Retain generated truth and patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-promotion-generated-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/source-promotion-sync.json
            /tmp/source-promotion.patch
            docs/system/truth/work-items.v2.json
            docs/system/truth/modules.v1.json
            docs/system/evidence/repository-source-implementation-v1.json
            docs/system/evidence/rust-functional-source-closure-v1.json
            docs/modules/MODULE_DOCUMENTATION_MATRIX.md
            docs/modules/specs/*.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Fast-forward verified generated truth to same-repository PR head
        if: steps.promotion.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE_HEAD"
          git fetch --no-tags origin "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$EXPECTED_SOURCE_HEAD"
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
