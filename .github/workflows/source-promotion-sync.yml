name: source-promotion-sync
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    name: source-promotion-generated-truth
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out immutable source without write credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Reject uncommitted promotion drift without changing the candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-promotion-audit
          git rev-parse HEAD > /tmp/source-promotion-audit/head.txt
          git rev-parse HEAD^{tree} > /tmp/source-promotion-audit/tree.txt
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          node docs/tools/apply-source-promotions.mjs > /tmp/source-promotion-audit/preview.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/source-promotion-audit/preview.json').read_text())
          assert report['write'] is False, 'read-only preview required'
          assert report['promotionCount'] == 0, 'commit reviewed promotions before qualification'
          assert report['promotedModules'] == [], 'module promotion drift'
          assert report['changedSpecs'] == [], 'specification drift'
          PY
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          python3 docs/rust/tools/validate-program-truth.py
          for name in repository-source-implementation-v1 rust-functional-source-closure-v1; do
            node paper-core/bin/verify-source-implementation-evidence.mjs \
              --evidence "docs/system/evidence/$name.json" \
              --expected-head "$(cat /tmp/source-promotion-audit/head.txt)" \
              --expected-tree "$(cat /tmp/source-promotion-audit/tree.txt)"
          done
          test "$(git rev-parse HEAD)" = "$(cat /tmp/source-promotion-audit/head.txt)"
          test "$(git rev-parse HEAD^{tree})" = "$(cat /tmp/source-promotion-audit/tree.txt)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
      - name: Retain read-only audit including failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-promotion-audit-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: /tmp/source-promotion-audit
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
