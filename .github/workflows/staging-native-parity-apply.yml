name: staging-native-parity-apply

on:
  push:
    branches:
      - codex/native-parity-staging-20260915

permissions:
  contents: write

jobs:
  apply-existing-files:
    if: github.repository == 'TrillionniumFoundation/hepta-paper' && github.ref == 'refs/heads/codex/native-parity-staging-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact staging head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/native-parity-staging-20260915
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact existing-file patch and remove staging machinery
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .github/native-parity-existing.patch | awk '{print $1}')" = 'c9b642f0b241c9d009663fc25d88ae400f8184925c5f4228c637995218fae9cf'
          git merge-base --is-ancestor 21d4045183ea815e665952f1569caaf525a566f1 HEAD
          git apply --check .github/native-parity-existing.patch
          git apply .github/native-parity-existing.patch
          rm .github/native-parity-existing.patch .github/workflows/staging-native-parity-apply.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(staging): apply native parity existing-file patch'
          git push origin HEAD:codex/native-parity-staging-20260915
