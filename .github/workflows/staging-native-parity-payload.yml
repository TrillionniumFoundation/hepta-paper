name: staging-native-parity-payload

on:
  push:
    branches:
      - codex/native-parity-staging-20260915

permissions:
  contents: write

jobs:
  materialize-new-files:
    if: github.repository == 'TrillionniumFoundation/hepta-paper' && github.ref == 'refs/heads/codex/native-parity-staging-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact staging head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/native-parity-staging-20260915
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and materialize exact native source payload
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/native-parity-newfiles.tar.gz"
          cat .github/native-parity-payload/part00 .github/native-parity-payload/part01 \
              .github/native-parity-payload/part02 .github/native-parity-payload/part03 \
            | base64 -d > "$payload"
          test "$(sha256sum "$payload" | awk '{print $1}')" = '27755bcf98949b73dbbeb94d069f9cd878a8ed7b717af1bb034020d55db74113'
          printf '%s\n' \
            'paper-core/tests/native-function-ports.test.mjs' \
            'rust/crates/hepta-paper-service/src/campaign_policy.rs' \
            'rust/crates/hepta-paper-service/src/campaign_slo.rs' \
            'rust/crates/hepta-paper-service/src/native_business/inference.rs' \
            'rust/crates/hepta-paper-service/tests/analysis_inference_parity.rs' \
            'rust/crates/hepta-paper-service/tests/campaign_policy_parity.rs' \
            'rust/crates/hepta-paper-service/tests/campaign_slo_parity.rs' \
            'rust/crates/hepta-paper-service/tests/common/native_oracle.rs' \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-files"
          tar -tzf "$payload" | LC_ALL=C sort > "$RUNNER_TEMP/actual-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          while IFS= read -r file; do test ! -e "$file"; done < "$RUNNER_TEMP/expected-files"
          tar -xzf "$payload"
          rm -rf .github/native-parity-payload .github/workflows/staging-native-parity-payload.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(staging): materialize exact native parity source payload'
          git push origin HEAD:codex/native-parity-staging-20260915
