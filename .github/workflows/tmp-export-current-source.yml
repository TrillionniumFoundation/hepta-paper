name: tmp-export-current-source

on:
  push:
    branches:
      - codex/push-files-schema-probe-20260909

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: TrillionniumFoundation/hepta-paper
          ref: 3ad568f523e5ae0d99f8e3ba3339cbf480f32327
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Export tracked source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3ad568f523e5ae0d99f8e3ba3339cbf480f32327"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/hepta-paper-3ad568f-source.tar.gz"
          sha256sum "$RUNNER_TEMP/hepta-paper-3ad568f-source.tar.gz" > "$RUNNER_TEMP/hepta-paper-3ad568f-source.tar.gz.sha256"
      - name: Upload source export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tmp-hepta-paper-source-3ad568f
          path: |
            ${{ runner.temp }}/hepta-paper-3ad568f-source.tar.gz
            ${{ runner.temp }}/hepta-paper-3ad568f-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
