name: transient-renewal-selector-publication

on:
  push:
    branches: [codex/clock-validation-8f8be6d5]
    paths: [.github/workflows/transient-clock-validation.yml]

permissions:
  contents: read

concurrency:
  group: transient-renewal-validation
  cancel-in-progress: true

env:
  SOURCE_COMMIT: 4b558fcac5c00f5a33dabce06a36bcc0375b2074
  SOURCE_TREE: 0f72e2044640f40747ab502ffee57304c480e9fc
  CANDIDATE_COMMIT: 8a4c484b34d0fb80e3d68d7a3aa9cd5ee001e3fe
  CANDIDATE_TREE: 7a95c2069a99e7528ddbd3b9e2d0d0aba8083239
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  publish-exact-selector-fix:
    if: github.repository == 'TrillionniumFoundation/hepta-paper' && github.ref == 'refs/heads/codex/clock-validation-8f8be6d5'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Reproduce the exact local correction without weakening verification
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/renewal-selector-publication"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('docs/system/evidence/rust-functional-source-closure-v1.json')
          d=json.loads(p.read_text()); cs=d['bundles']['production-composition-source']['verificationCommands']
          edited=[]
          for c in cs:
            if '--test' in c['args']:
              at=c['args'].index('--test')
              assert c['args'][at+1]=='local_workflow'
              edited.append(c['args'][at+2])
              del c['args'][at:at+2]
          assert edited==[
            'clock::workflow_amendment_revalidates_old_lease_and_preserves_history_on_late_failure',
            'clock::workflow_live_amendment_replays_without_clock_and_continues_after_old_expiry',
            'clock::local_cli_uses_live_time_for_explicit_renewal_and_lifecycle',
          ]
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
          git diff --check
          git add -- docs/system/evidence/rust-functional-source-closure-v1.json
          test "$(git write-tree)" = "$CANDIDATE_TREE"
          export GIT_AUTHOR_DATE='1790087848 +0000' GIT_COMMITTER_DATE='1790087848 +0000'
          git -c user.name=ChatGPT -c user.email=chatgpt@users.noreply.github.com commit -m 'fix(evidence): use supported exact owner-test selectors for renewal' -m 'Preserve the unchanged strict command allowlist, exact test selectors, expected target source files and execution requirements. Match existing Cargo owner-test invocations rather than relaxing verification.'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD^)" = "$SOURCE_COMMIT"
          test ! -e .github/workflows/transient-clock-validation.yml
          node docs/tools/generate-node-rust-gap-report.mjs --check
          node docs/tools/validate-development-docs.mjs
          node docs/tools/validate-module-documentation.mjs
          python3 -B docs/rust/tools/validate-program-truth.py
          node paper-core/bin/verify-source-implementation-evidence.mjs --evidence docs/system/evidence/rust-functional-source-closure-v1.json --expected-head "$CANDIDATE_COMMIT" --expected-tree "$CANDIDATE_TREE" --receipt "$out/static-evidence.json"
          node --test --test-concurrency=1 paper-core/tests/source-implementation-evidence.test.mjs
          node paper-core/tests/source-implementation-evidence-hardening.mjs --self-test
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD HEAD^{tree} > "$out/candidate.txt"
          git diff "$SOURCE_COMMIT" HEAD --binary > "$out/candidate.patch"
      - name: Fast-forward only the existing temporary candidate
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_ASKPASS="$RUNNER_TEMP/renewal-selector-askpass"
          trap 'rm -f "$GIT_ASKPASS"' EXIT
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" x-access-token;; *) printf "%s\n" "$PUSH_TOKEN";; esac' > "$GIT_ASKPASS"
          chmod 700 "$GIT_ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          ref=codex/renewal-candidate-35741395233
          test "$(git ls-remote origin "refs/heads/$ref" | cut -f1)" = "$SOURCE_COMMIT"
          git push origin "HEAD:refs/heads/$ref"
          printf '%s\n' "$ref" > "$RUNNER_TEMP/renewal-selector-publication/result-ref.txt"
          printf 'Source transfer and strict static checks only. This does not assert full hosted test execution, independent review, merge or production authority. The implementation PR must run its unchanged canonical producers.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: renewal-selector-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/renewal-selector-publication
          if-no-files-found: error
          retention-days: 14
