name: transient-development-environment

on:
  push:
    branches: [codex/clock-validation-8f8be6d5]
    paths: [.github/workflows/transient-clock-validation.yml]

permissions:
  contents: read

concurrency:
  group: transient-development-environment
  cancel-in-progress: true

env:
  SOURCE_COMMIT: b4ae09fbbbf2bec9e6b0f86538bd26f097f1bd9e
  SOURCE_TREE: d435f2345c33aa41f22094812e6d551e92587aab

jobs:
  public-build-inputs:
    if: github.repository == 'TrillionniumFoundation/hepta-paper' && github.ref == 'refs/heads/codex/clock-validation-8f8be6d5'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Fetch the exact public build inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(node --version)" = v22.23.1
          npm ci --ignore-scripts --no-audit --no-fund
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          cargo fetch --manifest-path rust/Cargo.toml --locked
          cargo metadata --manifest-path rust/Cargo.toml --locked --offline --format-version 1 --no-deps > "$RUNNER_TEMP/cargo-metadata.json"
      - name: Export only compiler files and public dependency caches
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/public-development-inputs"
          mkdir -p "$out"
          toolchain="$(dirname "$(dirname "$(rustup which rustc)")")"
          # No home directory, Git metadata, authentication config, environment
          # dump, key, credential, production state or runtime authority is exported.
          tar -czf "$out/rust-toolchain.tar.gz" -C "$toolchain" bin lib libexec
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          tar --exclude=registry/index/github.com-* -czf "$out/cargo-registry.tar.gz" -C "$cargo_home" registry
          tar -czf "$out/node-modules.tar.gz" node_modules
          gzip -c "$(command -v node)" > "$out/node.gz"
          cp "$RUNNER_TEMP/cargo-metadata.json" "$out/cargo-metadata.json"
          git rev-parse HEAD HEAD^{tree} > "$out/source.txt"
          sha256sum rust/Cargo.lock package-lock.json > "$out/source-locks.sha256"
          rustc --version --verbose > "$out/rustc.txt"
          cargo --version --verbose > "$out/cargo.txt"
          node --version > "$out/node.txt"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          (cd "$out" && sha256sum ./* > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-development-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/public-development-inputs
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
