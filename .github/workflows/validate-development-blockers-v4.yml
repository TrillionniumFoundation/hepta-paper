name: validate-development-blockers-v4

on:
  push:
    branches:
      - codex/current-source-export-20260829-v2
    paths:
      - .automation/development-blockers-v4/**
      - .github/workflows/validate-development-blockers-v4.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-development-blockers-v4
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: e16badd21c1d02334e5046bae12ed9afeb6b0def
          fetch-depth: 0
          submodules: false

      - name: Reconstruct and apply blocker patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e16badd21c1d02334e5046bae12ed9afeb6b0def
          transfer_branch=codex/current-source-export-20260829-v2
          git fetch --no-tags origin \
            "refs/heads/${transfer_branch}:refs/remotes/origin/development-blockers-v4"
          : > "$RUNNER_TEMP/blockers.patch.gz.b64"
          for item in 00a:3000 00b0:1000 00b1:1000 00b2:1000 00c:3000 01:5332; do
            index=${item%%:*}
            size=${item##*:}
            git show "origin/development-blockers-v4:.automation/development-blockers-v4/chunk-${index}" \
              | head -c "$size" >> "$RUNNER_TEMP/blockers.patch.gz.b64"
          done
          printf '%s  %s\n' \
            47f69353860de022b8025b06a10c3900210e12d6032a61b7971d4d33a699b8a3 \
            "$RUNNER_TEMP/blockers.patch.gz.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/blockers.patch.gz.b64" > "$RUNNER_TEMP/blockers.patch.gz"
          printf '%s  %s\n' \
            9127354f15019850e21d59ed214ef0b34b82456e8d4ebdb464c51f7fa3853239 \
            "$RUNNER_TEMP/blockers.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/blockers.patch.gz" > "$RUNNER_TEMP/blockers.patch"
          printf '%s  %s\n' \
            2047516fbda0ab0dd645cc3e91334a68b06f80af8b6081523363e745cbfb34a7 \
            "$RUNNER_TEMP/blockers.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/blockers.patch"
          git apply --index "$RUNNER_TEMP/blockers.patch"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("rust/crates/hepta-codex-broker/src/journal/path.rs")
          source = path.read_text()
          start_marker = "\nfn verify_initialization_candidate("
          end_marker = "\nfn verify_database_identity("
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("expected one obsolete initialization helper")
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          path.write_text(source[:start] + source[end:])
          PY
          git add rust/crates/hepta-codex-broker/src/journal/path.rs
          git diff --cached --check

      - name: Install qualified Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Format and validate complete Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
          cargo metadata --manifest-path rust/Cargo.toml --locked --format-version 1 >/dev/null
          cargo clippy \
            --manifest-path rust/Cargo.toml \
            --workspace --all-targets --all-features --locked -- -D warnings
          cargo test \
            --manifest-path rust/Cargo.toml \
            --workspace --all-features --locked -- --test-threads=1
          RUSTDOCFLAGS='-D warnings' cargo doc \
            --manifest-path rust/Cargo.toml \
            --workspace --all-features --locked --no-deps

      - name: Archive formatted patch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/development-blocker-validation"
          git diff --binary > "$RUNNER_TEMP/development-blocker-validation/formatted.patch"
          git diff --cached --binary > "$RUNNER_TEMP/development-blocker-validation/staged.patch"
          git status --short > "$RUNNER_TEMP/development-blocker-validation/status.txt"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: development-blockers-v4-validation
          path: ${{ runner.temp }}/development-blocker-validation
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
