apiVersion: apps/v1
kind: Deployment
metadata:
  name: hepta-autonomous-research-supervisor
spec:
  # One writer per SQLite volume is the conservative deployment default. The
  # application leases still fence accidental overlap during rolling recovery.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hepta-autonomous-research-supervisor
  template:
    metadata:
      labels:
        app: hepta-autonomous-research-supervisor
        hepta.paper/submission-dispatch-capability: "denied"
        hepta.paper/portal-egress-capability: "denied"
        # A cluster admission policy must reject this label unless it has
        # independently verified the signed qualification receipt named below.
        hepta.paper/nested-runtime-admission: required
      annotations:
        hepta.paper/nested-runtime-contract: hepta-nested-container-runtime-v1
        hepta.paper/nested-runtime-profile-id: REPLACE_WITH_EXTERNALLY_QUALIFIED_PROFILE_ID
        hepta.paper/nested-runtime-class-name: REPLACE_WITH_EXTERNALLY_QUALIFIED_NESTED_CONTAINER_RUNTIME_CLASS
        hepta.paper/nested-runtime-plan-hash: REPLACE_WITH_SHA256_OF_DEPLOYMENT_PLAN
        hepta.paper/nested-runtime-qualification-config-sha256: REPLACE_WITH_SHA256_OF_QUALIFICATION_CONFIG
        hepta.paper/nested-runtime-qualification-receipt-sha256: REPLACE_WITH_SHA256_OF_SIGNED_QUALIFICATION_RECEIPT
        hepta.paper/nested-runtime-conformance-receipt-sha256: REPLACE_WITH_SHA256_OF_CURRENT_POD_SIGNED_CONFORMANCE_RECEIPT
        hepta.paper/nested-runtime-authority-independence-receipt-sha256: REPLACE_WITH_SHA256_OF_CURRENT_POD_SIGNED_CONTROL_DOMAIN_ATTESTATION
        hepta.paper/nested-runtime-qualification-signer: REPLACE_WITH_INDEPENDENT_QUALIFIER_KEY_ID
        hepta.paper/nested-runtime-qualification-subject: REPLACE_WITH_INDEPENDENT_QUALIFIER_SUBJECT_ID
        hepta.paper/nested-runtime-qualification-public-key-spki-sha256: REPLACE_WITH_INDEPENDENT_QUALIFIER_ED25519_SPKI_SHA256
        hepta.paper/nested-runtime-conformance-signer: REPLACE_WITH_INDEPENDENT_CONFORMANCE_ATTESTOR_KEY_ID
        hepta.paper/nested-runtime-conformance-subject: REPLACE_WITH_INDEPENDENT_CONFORMANCE_ATTESTOR_SUBJECT_ID
        hepta.paper/nested-runtime-conformance-public-key-spki-sha256: REPLACE_WITH_INDEPENDENT_CONFORMANCE_ATTESTOR_ED25519_SPKI_SHA256
        hepta.paper/nested-runtime-conformance: bind-rw-uid-gid-network-none-memory-cpu-pids-parent-pod-v1
        # A validating admission policy must bind these values to the
        # site-qualified daemon/Pod cgroup ceiling in the signed profile.
        hepta.paper/nested-runtime-parent-pod-cpu-millis: "4000"
        hepta.paper/nested-runtime-parent-pod-memory-bytes: "8589934592"
        hepta.paper/nested-runtime-parent-pod-pids: "512"
    spec:
      serviceAccountName: hepta-autonomous-research-supervisor
      restartPolicy: Always
      terminationGracePeriodSeconds: 900
      automountServiceAccountToken: false
      # RuntimeClass is only a selector; its name is not evidence of nested
      # container isolation. Admission must bind this exact profile and node to
      # the independently signed receipts in the pod annotations.
      runtimeClassName: REPLACE_WITH_EXTERNALLY_QUALIFIED_NESTED_CONTAINER_RUNTIME_CLASS
      nodeSelector:
        hepta.paper/dedicated-autonomous-research-node: "true"
        hepta.paper/nested-runtime-profile-id: REPLACE_WITH_EXTERNALLY_QUALIFIED_PROFILE_ID
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # GID 20001 is dedicated only to the submission-handoff PVC. Provision
        # that PVC root as root:20001 mode 3770. Pre-provision
        # dispatcher-challenges as 10001:20001 mode 2750 and dispatcher-cycles
        # as 10002:20001 mode 2750. Do not use fsGroup: it could
        # rewrite the root-owned external authority PVCs mounted by this Pod.
        supplementalGroups: [20001]
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The external conformance service must first launch the fixed-digest
        # worker against this exact Pod/profile and materialize its separately
        # signed receipt on the read-only evidence volume. The verifier performs
        # no signing or repair. Missing/placeholder paths, hashes, authorities,
        # current-Pod bindings, or proof fields make this init fail non-zero.
        - name: nested-runtime-platform-qualification-gate
          image: REPLACE_WITH_PINNED_HEPTA_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command:
            - node
            - paper-core/bin/nested-runtime-platform-qualification.mjs
          env:
            - name: HEPTA_NESTED_RUNTIME_QUALIFICATION_CONFIG
              value: /hepta/nested-runtime-qualification/config.json
            - name: HEPTA_NESTED_RUNTIME_QUALIFICATION_CONFIG_SHA256
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-qualification-config-sha256']
            - name: HEPTA_NESTED_RUNTIME_QUALIFICATION_RECEIPT_SHA256
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-qualification-receipt-sha256']
            - name: HEPTA_NESTED_RUNTIME_CONFORMANCE_RECEIPT_SHA256
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-conformance-receipt-sha256']
            - name: HEPTA_NESTED_RUNTIME_AUTHORITY_INDEPENDENCE_RECEIPT_SHA256
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-authority-independence-receipt-sha256']
            - name: HEPTA_NESTED_RUNTIME_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HEPTA_NESTED_RUNTIME_PLAN_HASH
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-plan-hash']
            - name: HEPTA_NESTED_RUNTIME_PROFILE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-profile-id']
            - name: HEPTA_NESTED_RUNTIME_CLASS_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-class-name']
            - name: HEPTA_NESTED_RUNTIME_PARENT_POD_CPU_MILLIS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-parent-pod-cpu-millis']
            - name: HEPTA_NESTED_RUNTIME_PARENT_POD_MEMORY_BYTES
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-parent-pod-memory-bytes']
            - name: HEPTA_NESTED_RUNTIME_PARENT_POD_PIDS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-parent-pod-pids']
            - name: HEPTA_NESTED_RUNTIME_QUALIFICATION_KEY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-qualification-signer']
            - name: HEPTA_NESTED_RUNTIME_QUALIFICATION_SUBJECT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-qualification-subject']
            - name: HEPTA_NESTED_RUNTIME_QUALIFICATION_PUBLIC_KEY_SPKI_SHA256
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-qualification-public-key-spki-sha256']
            - name: HEPTA_NESTED_RUNTIME_CONFORMANCE_KEY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-conformance-signer']
            - name: HEPTA_NESTED_RUNTIME_CONFORMANCE_SUBJECT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-conformance-subject']
            - name: HEPTA_NESTED_RUNTIME_CONFORMANCE_PUBLIC_KEY_SPKI_SHA256
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hepta.paper/nested-runtime-conformance-public-key-spki-sha256']
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nested-runtime-qualification
              mountPath: /hepta/nested-runtime-qualification
              readOnly: true
      containers:
        - name: supervisor
          image: REPLACE_WITH_PINNED_HEPTA_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              test -w /hepta/runtime
              test -w /hepta/runtime/hepta-paper.sqlite
              test "$(stat -c %g /hepta/runtime/autonomous-research/submission-handoff)" = "20001"
              test "$(stat -c %u /hepta/runtime/autonomous-research/submission-handoff)" = "0"
              test "$(stat -c %a /hepta/runtime/autonomous-research/submission-handoff)" = "3770"
              test -w /hepta/runtime/autonomous-research/submission-handoff
              test "$(stat -c %u /hepta/runtime/autonomous-research/submission-handoff/dispatcher-challenges)" = "10001"
              test "$(stat -c %a /hepta/runtime/autonomous-research/submission-handoff/dispatcher-challenges)" = "2750"
              test -w /hepta/runtime/autonomous-research/submission-handoff/dispatcher-challenges
              test ! -w /hepta/runtime/autonomous-research/submission-handoff/dispatcher-cycles
              umask 0007
              exec node paper-core/bin/hepta-paper.mjs "$@"
            - hepta-autonomous-research-supervisor
            - operator
            - autonomous-supervisor
            - "--"
            - --require-fully-autonomous
            - --machine-intake-config
            - /hepta/intake/config.json
            - --topic-producer-profile
            - /hepta/intake/topic-producer-profile.json
            - --root
            - /hepta/assets
            - --runtime-root
            - /hepta/runtime
            - --poll-ms
            - "5000"
            - --resident-instance-lease-ms
            - "900000"
            - --resident-instance-heartbeat-ms
            - "30000"
            - --maximum-dispatches
            - "256"
            - --maximum-lifecycle-cost-usd
            - "150"
            - --maximum-lifetime-ms
            - "604800000"
            - --qualification-action-safety-margin-ms
            - "900000"
          env:
            - name: HEPTA_PAPER_ASSET_ROOT
              value: /hepta/assets
            - name: HEPTA_PAPER_RUNTIME_ROOT
              value: /hepta/runtime
            # The canonical No-Go template does not provision this socket. A
            # qualified overlay must provide the pod-local endpoint and share
            # both qualified-runtime-run and tmp with its daemon/conformance
            # containers; node sockets and remote endpoints remain forbidden.
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: TMPDIR
              value: /tmp
            - name: HEPTA_RESEARCH_AUTHOR_CODEX_HOME
              value: /hepta/credentials/research-author
            - name: HEPTA_FORMAL_REVIEW_CODEX_HOME
              value: /hepta/credentials/formal-reviewer
            - name: HEPTA_AUTONOMOUS_EXTERNAL_QUALIFICATION_CONFIG
              value: /hepta/qualification/process-config.json
            - name: HEPTA_AUTONOMOUS_RESEARCH_INTAKE_CONFIG
              value: /hepta/intake/config.json
            - name: HEPTA_AUTONOMOUS_RESEARCH_TOPIC_PRODUCER_PROFILE
              value: /hepta/intake/topic-producer-profile.json
            - name: HEPTA_AUTONOMOUS_RESEARCH_DATASET_ROOT
              value: /datasets
            - name: HEPTA_RESEARCH_EXECUTION_RELEASE_ATTESTOR_CONFIG
              value: /hepta/release-attestor/config.json
            - name: HEPTA_RESEARCH_EXECUTION_RELEASE_ATTESTOR_CONFIG_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-research-supervisor
                  key: release-attestor-configuration-identity-hash
            - name: HEPTA_ADVANCED_NUMERICAL_PLUGIN_QUALIFICATION_REGISTRY
              value: /hepta/capabilities-public/advanced-numerical-reference-qualifications.json
            - name: HEPTA_ADVANCED_NUMERICAL_PLUGIN_QUALIFICATION_REGISTRY_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-research-supervisor
                  key: advanced-numerical-qualification-registry-hash
            - name: HEPTA_RUNTIME_IMAGE_REPRODUCIBILITY_CONFIG
              value: /hepta/runtime-reproducibility/process-config.json
            - name: HEPTA_RUNTIME_IMAGE_REPRODUCIBILITY_CONFIG_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-research-supervisor
                  key: runtime-reproducibility-configuration-identity-hash
            - name: HEPTA_AUTONOMOUS_RESEARCH_ONLINE_MUTATION_AUTHORITY_PROCESS_CONFIG
              value: /hepta/online-mutation-authority/process-config.json
            - name: HEPTA_AUTONOMOUS_RESEARCH_ONLINE_MUTATION_AUTHORITY_CONFIG
              value: /hepta/online-mutation-authority/authority-config.json
            - name: HEPTA_AUTONOMOUS_SUBMISSION_HANDOFF_MUTATION_AUTHORITY_PROCESS_CONFIG
              value: /hepta/submission-handoff-authority/process-config.json
            - name: HEPTA_AUTONOMOUS_RESEARCH_STATE_BACKUP_AUTHORITY_CONFIG
              value: /hepta/state-backup-authority/process-config.json
            # The fully-autonomous claim is admitted only for this strong,
            # fail-closed content profile. Every referenced path is supplied
            # as a regular file on the immutable capabilities PVC.
            - name: HEPTA_AUTONOMOUS_RESEARCH_CONTENT_MODE
              value: agent-evidence-bound
            - name: HEPTA_DYNAMIC_FORMAL_CLAIMS_ENABLED
              value: "1"
            - name: HEPTA_RESEARCH_AUTHOR_IDENTITY_CONFIG
              value: /hepta/capabilities-public/research-author-identity.json
            - name: HEPTA_RESEARCH_AUTHOR_IDENTITY_CONFIG_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-research-supervisor
                  key: research-author-identity-configuration-hash
            - name: HEPTA_REVIEWER_PRINCIPAL_POOL_CONFIG
              value: /hepta/capabilities-public/reviewer-principals.json
            - name: HEPTA_PRIOR_ART_SERVICE_CONFIG
              value: /hepta/capabilities-public/prior-art-service.json
            - name: HEPTA_PRIOR_ART_SERVICE_CONFIG_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-research-supervisor
                  key: prior-art-service-configuration-hash
            - name: HEPTA_EXTERNAL_REPLAY_CONFIG
              value: /hepta/capabilities-public/external-replay-service.json
            - name: HEPTA_EXTERNAL_REPLAY_CONFIG_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-research-supervisor
                  key: external-replay-service-configuration-hash
            - name: HEPTA_AUTONOMOUS_VENUE_PROFILE_CONFIG
              value: /hepta/capabilities-public/venue-profiles.json
            - name: HEPTA_AUTONOMOUS_VENUE_PROFILE_CONFIG_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-research-supervisor
                  key: venue-profile-configuration-hash
            # The research principal receives only the public descriptor. It
            # has no portal endpoint, token-variable name, or dispatch config.
            - name: HEPTA_AUTONOMOUS_SUBMISSION_PORTAL_DESCRIPTOR_CONFIG
              value: /hepta/capabilities-public/submission-portal-descriptor.json
            - name: HEPTA_AUTONOMOUS_SUBMISSION_PORTAL_CONFIGURATION_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-research-supervisor
                  key: submission-portal-configuration-hash
            - name: HEPTA_AUTONOMOUS_SUBMISSION_PORTAL_DESCRIPTOR_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-research-supervisor
                  key: submission-portal-descriptor-hash
            - name: HEPTA_SUBMISSION_DISPATCHER_IDENTITY_CONFIG_PATH
              value: /hepta/capabilities-public/submission-dispatcher-identity.json
            - name: HEPTA_AUTONOMOUS_SUBMISSION_METADATA_CONFIG
              value: /hepta/capabilities-public/submission-metadata.json
            - name: HEPTA_AUTONOMOUS_SUBMISSION_METADATA_CONFIG_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-research-supervisor
                  key: submission-metadata-configuration-hash
            # These are explicit fail-closed operational budgets. Keep the
            # cost and lead values synchronized with the mounted verifier
            # configuration; they are intentionally not inferred at runtime.
            - name: HEPTA_RUNTIME_IMAGE_REPRODUCIBILITY_MAXIMUM_REFRESH_ATTEMPTS_PER_EPOCH
              value: "4"
            - name: HEPTA_RUNTIME_IMAGE_REPRODUCIBILITY_MAXIMUM_REFRESH_COST_USD_PER_EPOCH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-research-supervisor
                  key: runtime-reproducibility-maximum-refresh-cost-usd-per-epoch
            - name: HEPTA_RUNTIME_IMAGE_REPRODUCIBILITY_REFRESH_RENEWAL_LEAD_MS
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-research-supervisor
                  key: runtime-reproducibility-refresh-renewal-lead-ms
            - name: HEPTA_RUNTIME_IMAGE_REPRODUCIBILITY_REFRESH_ACTION_SAFETY_MARGIN_MS
              value: "900000"
          envFrom:
            # Models and other non-secret pinned provider settings only.
            - configMapRef:
                name: hepta-autonomous-research-supervisor
            # Research-only provider credentials. Admission must reject the
            # portal token key from this Secret; submission uses a different
            # principal and Secret below.
            - secretRef:
                name: hepta-autonomous-research-provider-tokens
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command:
                - node
                - paper-core/bin/autonomous-research-supervisor-health.mjs
                - --runtime-root
                - /hepta/runtime
                - --require-startup-reconciliation
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 180
          readinessProbe:
            exec:
              command:
                - node
                - paper-core/bin/autonomous-research-supervisor-health.mjs
                - --runtime-root
                - /hepta/runtime
                - --require-fully-autonomous
            periodSeconds: 30
            timeoutSeconds: 25
            failureThreshold: 2
          livenessProbe:
            exec:
              command:
                - node
                - paper-core/bin/autonomous-research-supervisor-health.mjs
                - --runtime-root
                - /hepta/runtime
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: runtime
              mountPath: /hepta/runtime
            # This independently provisioned PVC is the only storage shared
            # with the dispatcher principal. The native runtime PVC remains
            # mounted by the research principal alone.
            - name: submission-handoff
              mountPath: /hepta/runtime/autonomous-research/submission-handoff
            - name: assets
              mountPath: /hepta/assets
              readOnly: true
            # Every datasetMounts[].source in the mounted producer profile must
            # resolve below this separately provisioned, immutable data root.
            - name: datasets
              mountPath: /datasets
              readOnly: true
            # This PVC must expose four root-owned, nlink=1 regular files. Do
            # not replace it with a projected ConfigMap/Secret (`..data`
            # symlinks are rejected by the production authority loader).
            - name: intake-authority
              mountPath: /etc/hepta-paper/authority-rotation
              readOnly: true
            # Provision these private directories out of band (for example with
            # a CSI secret provider). Do not put credential bytes in this file.
            - name: credentials
              mountPath: /hepta/credentials
              readOnly: true
            - name: qualification
              mountPath: /hepta/qualification
              readOnly: true
            - name: release-attestor
              mountPath: /hepta/release-attestor
              readOnly: true
            - name: runtime-reproducibility
              mountPath: /hepta/runtime-reproducibility
              readOnly: true
            # These immutable volumes contain public trust documents, pinned
            # process configurations, and (when referenced by commandPath)
            # dedicated broker client executables. They must not contain the
            # independently administered brokers' private signing keys.
            - name: online-mutation-authority
              mountPath: /hepta/online-mutation-authority
              readOnly: true
            - name: submission-handoff-authority
              mountPath: /hepta/submission-handoff-authority
              readOnly: true
            - name: state-backup-authority
              mountPath: /hepta/state-backup-authority
              readOnly: true
            - name: intake
              mountPath: /hepta/intake
              readOnly: true
            # Must contain nlink=1 regular files, not projected ..data
            # symlinks. Use an immutable PVC or a CSI driver that materializes
            # regular files with owner-only permissions.
            - name: capabilities
              mountPath: /hepta/capabilities-public
              readOnly: true
            - name: qualified-runtime-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: hepta-runtime
        - name: submission-handoff
          persistentVolumeClaim:
            claimName: hepta-autonomous-submission-handoff
        - name: assets
          persistentVolumeClaim:
            claimName: hepta-assets
        - name: datasets
          persistentVolumeClaim:
            claimName: hepta-research-datasets
        - name: intake-authority
          persistentVolumeClaim:
            claimName: hepta-autonomous-research-intake-authority
        - name: credentials
          persistentVolumeClaim:
            claimName: hepta-provider-credentials
        - name: qualification
          persistentVolumeClaim:
            claimName: hepta-qualification-config
        - name: release-attestor
          persistentVolumeClaim:
            claimName: hepta-release-attestor-config
        - name: runtime-reproducibility
          persistentVolumeClaim:
            claimName: hepta-runtime-reproducibility-config
        - name: online-mutation-authority
          persistentVolumeClaim:
            claimName: hepta-autonomous-research-online-mutation-authority
        - name: submission-handoff-authority
          persistentVolumeClaim:
            claimName: hepta-autonomous-submission-handoff-mutation-authority
        - name: state-backup-authority
          persistentVolumeClaim:
            claimName: hepta-autonomous-research-state-backup-authority
        - name: intake
          persistentVolumeClaim:
            claimName: hepta-autonomous-research-intake-config
        - name: capabilities
          persistentVolumeClaim:
            claimName: hepta-autonomous-research-public-capability-config
        # A qualified site must provide immutable regular files config.json,
        # trust-store.json, qualification.json, a current-Pod conformance.json,
        # and an externally signed authority-independence.json. The application
        # never writes or signs them.
        - name: nested-runtime-qualification
          persistentVolumeClaim:
            claimName: hepta-nested-runtime-platform-qualification
        # Reserved for the site-qualified overlay's pod-local daemon socket. The
        # canonical manifest has no daemon and is blocked above. Never replace
        # this emptyDir with a node socket, hostPath, or remote Docker endpoint.
        - name: qualified-runtime-run
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        # A qualified daemon and conformance runner must mount this same volume
        # at /tmp so daemon-side bind resolution sees supervisor-created paths.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hepta-autonomous-research-supervisor
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hepta-autonomous-submission-dispatcher
  labels:
    hepta.paper/submission-dispatch-capability: "allowed"
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hepta-autonomous-submission-dispatcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hepta-autonomous-submission-dispatcher
  template:
    metadata:
      labels:
        app: hepta-autonomous-submission-dispatcher
        hepta.paper/submission-dispatch-capability: "allowed"
        hepta.paper/portal-egress-capability: "allowed"
    spec:
      serviceAccountName: hepta-autonomous-submission-dispatcher
      automountServiceAccountToken: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        # Same dedicated handoff GID as the supervisor; the principals retain
        # distinct UIDs and primary groups. Only the handoff PVC uses this GID.
        supplementalGroups: [20001]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dispatcher
          image: REPLACE_WITH_PINNED_HEPTA_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              test ! -e /hepta/runtime/hepta-paper.sqlite
              test "$(stat -c %g /hepta/runtime/autonomous-research/submission-handoff)" = "20001"
              test "$(stat -c %u /hepta/runtime/autonomous-research/submission-handoff)" = "0"
              test "$(stat -c %a /hepta/runtime/autonomous-research/submission-handoff)" = "3770"
              test -w /hepta/runtime/autonomous-research/submission-handoff
              test -w /hepta/runtime/autonomous-research/submission-handoff/submission-handoff.sqlite
              test ! -w /hepta/runtime/autonomous-research/submission-handoff/dispatcher-challenges
              test "$(stat -c %u /hepta/runtime/autonomous-research/submission-handoff/dispatcher-cycles)" = "10002"
              test "$(stat -c %a /hepta/runtime/autonomous-research/submission-handoff/dispatcher-cycles)" = "2750"
              test -w /hepta/runtime/autonomous-research/submission-handoff/dispatcher-cycles
              umask 0007
              exec node paper-core/bin/hepta-paper.mjs "$@"
            - hepta-autonomous-submission-dispatcher
            - operator
            - autonomous-submission-dispatcher
            - "--"
            - --resident
            - --root
            - /hepta/assets
            - --runtime-root
            - /hepta/runtime
            - --poll-ms
            - "30000"
            - --limit
            - "100"
          env:
            - name: HEPTA_PAPER_ASSET_ROOT
              value: /hepta/assets
            - name: HEPTA_PAPER_RUNTIME_ROOT
              value: /hepta/runtime
            - name: HEPTA_AUTONOMOUS_SUBMISSION_PORTAL_CONFIG
              value: /hepta/submission-portal/config.json
            - name: HEPTA_AUTONOMOUS_SUBMISSION_PORTAL_DESCRIPTOR_CONFIG
              value: /hepta/capabilities-public/submission-portal-descriptor.json
            - name: HEPTA_AUTONOMOUS_SUBMISSION_PORTAL_CONFIGURATION_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-submission-dispatcher
                  key: submission-portal-configuration-hash
            - name: HEPTA_AUTONOMOUS_SUBMISSION_PORTAL_DESCRIPTOR_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-submission-dispatcher
                  key: submission-portal-descriptor-hash
            - name: HEPTA_SUBMISSION_DISPATCHER_IDENTITY_CONFIG_PATH
              value: /hepta/capabilities-public/submission-dispatcher-identity.json
            # This external-signer process configuration is resident-only.
            # The research Deployment has neither this environment variable
            # nor the signer configuration PVC.
            - name: HEPTA_SUBMISSION_DISPATCHER_CYCLE_SIGNING_CONFIG
              value: /hepta/submission-dispatcher-signer/config.json
            - name: HEPTA_AUTONOMOUS_VENUE_PROFILE_CONFIG
              value: /hepta/capabilities-public/venue-profiles.json
            - name: HEPTA_AUTONOMOUS_VENUE_PROFILE_CONFIG_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-submission-dispatcher
                  key: venue-profile-configuration-hash
            - name: HEPTA_AUTONOMOUS_SUBMISSION_METADATA_CONFIG
              value: /hepta/capabilities-public/submission-metadata.json
            - name: HEPTA_AUTONOMOUS_SUBMISSION_METADATA_CONFIG_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-submission-dispatcher
                  key: submission-metadata-configuration-hash
            - name: HEPTA_RESEARCH_EXECUTION_RELEASE_ATTESTOR_CONFIG
              value: /hepta/release-attestor/config.json
            - name: HEPTA_RESEARCH_EXECUTION_RELEASE_ATTESTOR_CONFIG_HASH
              valueFrom:
                configMapKeyRef:
                  name: hepta-autonomous-submission-dispatcher
                  key: release-attestor-configuration-identity-hash
            - name: HEPTA_AUTONOMOUS_SUBMISSION_HANDOFF_MUTATION_AUTHORITY_PROCESS_CONFIG
              value: /hepta/submission-handoff-authority/process-config.json
          envFrom:
            - configMapRef:
                name: hepta-autonomous-submission-dispatcher
            - secretRef:
                name: hepta-autonomous-submission-portal-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Empty private base: this Pod receives no native runtime PVC.
            - name: runtime-base
              mountPath: /hepta/runtime
              readOnly: true
            # Only the externalized handoff database is writable.
            - name: submission-handoff
              mountPath: /hepta/runtime/autonomous-research/submission-handoff
            - name: assets
              mountPath: /hepta/assets
              readOnly: true
            - name: public-capabilities
              mountPath: /hepta/capabilities-public
              readOnly: true
            - name: submission-portal-config
              mountPath: /hepta/submission-portal
              readOnly: true
            - name: submission-dispatcher-signer
              mountPath: /hepta/submission-dispatcher-signer
              readOnly: true
            - name: release-attestor
              mountPath: /hepta/release-attestor
              readOnly: true
            - name: submission-handoff-authority
              mountPath: /hepta/submission-handoff-authority
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-base
          emptyDir:
            sizeLimit: 1Mi
        - name: submission-handoff
          persistentVolumeClaim:
            claimName: hepta-autonomous-submission-handoff
        - name: assets
          persistentVolumeClaim:
            claimName: hepta-assets
        - name: public-capabilities
          persistentVolumeClaim:
            claimName: hepta-autonomous-research-public-capability-config
        # A regular-file PVC is used because the configuration loader rejects
        # projected Secret/ConfigMap symlinks. Only this Pod mounts it.
        - name: submission-portal-config
          persistentVolumeClaim:
            claimName: hepta-autonomous-submission-portal-config
        - name: submission-dispatcher-signer
          persistentVolumeClaim:
            claimName: hepta-autonomous-submission-dispatcher-signer-config
        - name: release-attestor
          persistentVolumeClaim:
            claimName: hepta-release-attestor-config
        - name: submission-handoff-authority
          persistentVolumeClaim:
            claimName: hepta-autonomous-submission-handoff-mutation-authority
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hepta-autonomous-submission-dispatcher-egress
spec:
  podSelector:
    matchLabels:
      app: hepta-autonomous-submission-dispatcher
      hepta.paper/portal-egress-capability: "allowed"
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Canonical template remains fail-closed. A reviewed overlay must replace
    # this documentation-only address with the portal's pinned egress CIDR.
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - { protocol: TCP, port: 443 }
