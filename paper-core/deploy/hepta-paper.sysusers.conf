# Install as /usr/lib/sysusers.d/hepta-paper.conf and run systemd-sysusers.
# Numeric IDs are allocated locally; the Kubernetes template has a separate
# fixed numeric securityContext contract.
g hepta-runtime-handoff -
g hepta-paper -
g hepta-submission-dispatcher -
u hepta-paper -:hepta-paper "Hepta Paper autonomous research" /var/lib/hepta-paper /usr/sbin/nologin
u hepta-submission-dispatcher -:hepta-submission-dispatcher "Hepta Paper submission dispatcher" /nonexistent /usr/sbin/nologin
m hepta-paper hepta-runtime-handoff
m hepta-submission-dispatcher hepta-runtime-handoff
