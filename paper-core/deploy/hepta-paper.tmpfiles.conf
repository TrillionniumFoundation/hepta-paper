# Install as /usr/lib/tmpfiles.d/hepta-paper.conf after the sysusers fragment.
# Do not create the runtime root: strict offline provisioning installs it atomically.
d /run/hepta-paper-deployment 0711 root root -
f /run/hepta-paper-deployment/deployment.lock 0600 root root -
d /var/lib/hepta-paper 0710 hepta-paper hepta-runtime-handoff -
d /var/lib/hepta-paper/strict-full-auto-acceptance-control 0700 hepta-paper hepta-paper -
