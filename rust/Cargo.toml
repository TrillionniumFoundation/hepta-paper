[workspace]
resolver = "3"
members = [
  "crates/hepta-codex-protocol",
  "crates/hepta-codex-event-stream",
  "crates/hepta-codex-journal",
  "crates/hepta-codex-runtime",
  "crates/hepta-codex-broker-protocol",
  "crates/hepta-codex-broker-journal",
  "crates/hepta-codex-broker-local",
  "crates/hepta-codex-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
hex = "=0.4.3"
rusqlite = { version = "=0.40.1", features = ["bundled"] }
rustix = { git = "https://github.com/bytecodealliance/rustix", rev = "9640071aef0dfd65d21bf01c1dd1baa0a1b13310", features = ["net", "process"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_derive = "=1.0.219"
serde_json = "=1.0.140"
sha2 = "=0.10.8"
thiserror = "=2.0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
