[workspace]
resolver = "3"
exclude = ["vendor/rustpython-parser"]
members = [
  "crates/hepta-codex-broker",
  "crates/hepta-codex-protocol",
  "crates/hepta-codex-event-stream",
  "crates/hepta-codex-journal",
  "crates/hepta-codex-runtime",
  "crates/hepta-codex-testkit",
  "crates/hepta-compatibility",
  "crates/hepta-workspace",
  "crates/hepta-readonly-store",
  "crates/hepta-campaign-writer",
  "crates/hepta-cgroup-containment",
  "crates/hepta-legacy-compatibility",
  "crates/hepta-readonly-control",
  "crates/hepta-workspace-authority",
  "crates/hepta-local-vertical",
  "crates/hepta-scientific-evidence",
  "crates/hepta-external-authority",
  "crates/hepta-cutover",
  "crates/hepta-qualification-ingest",
  "crates/hepta-module-platform",
  "crates/hepta-control-plane",
  "crates/hepta-orchestration-kernel",
  "crates/hepta-paper-service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
base64ct = { version = "=1.8.3", features = ["alloc"] }
ed25519-dalek = "=3.0.0"
hex = "=0.4.3"
nix = { version = "=0.31.3", features = ["dir", "fs", "inotify", "poll", "process", "signal", "socket", "user"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "session", "backup", "limits", "serialize"] }
ryu-js = "=1.0.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_derive = "=1.0.228"
serde_json = { version = "=1.0.140", features = ["raw_value"] }
sha2 = "=0.10.8"
thiserror = "=2.0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Development and test owners still hash every actual executable/artifact byte.
# Optimize only the pinned SHA implementation rather than bypassing identity
# checks or dropping debug/overflow assertions. The test profile inherits dev;
# the production release profile keeps its existing settings.
[profile.dev.package."sha2:0.10.8"]
opt-level = 2
debug-assertions = true
overflow-checks = true

# The native worker reads its own executable under the fixed 256 MiB limit.
# Omit DWARF from ordinary dev/test artifacts; retain debug and overflow assertions.
[profile.dev]
debug = 0
debug-assertions = true
overflow-checks = true

[patch.crates-io]
rustpython-parser = { path = "vendor/rustpython-parser" }
