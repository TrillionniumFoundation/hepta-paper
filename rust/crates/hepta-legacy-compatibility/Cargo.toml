[package]
name = "hepta-legacy-compatibility"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hepta-codex-protocol = { path = "../hepta-codex-protocol", version = "=0.1.0" }
hepta-module-platform = { path = "../hepta-module-platform", version = "=0.1.0" }
hex.workspace = true
icu_collator = { version = "=2.1.1", default-features = false, features = ["serde"] }
icu_locale = { version = "=2.1.1", default-features = false }
icu_provider = { version = "=2.3.1", features = ["sync"] }
icu_provider_blob = { version = "=2.1.1", features = ["alloc"] }
ryu-js = "=1.0.2"
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true
